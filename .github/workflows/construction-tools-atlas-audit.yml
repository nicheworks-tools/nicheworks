name: Construction Tools Atlas audit

on:
  pull_request:
    paths:
      - 'tools/construction-tools-atlas/**'
      - '.github/workflows/construction-tools-atlas-audit.yml'
  push:
    paths:
      - 'tools/construction-tools-atlas/**'
      - '.github/workflows/construction-tools-atlas-audit.yml'

permissions:
  contents: read

jobs:
  duplicate-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit duplicate ids and exact terms
        run: node tools/construction-tools-atlas/scripts/audit-duplicates.mjs --summary-only

      - name: Check whether data dedupe would remove records
        run: node tools/construction-tools-atlas/scripts/dedupe-quality-data.mjs --dry-run --write-report

      - name: Check semantic search v2.3 regression
        run: node tools/construction-tools-atlas/scripts/check-semantic-search-v2.3.cjs

      - name: Check active runtime syntax
        run: node --check tools/construction-tools-atlas/app.runtime.js

      - name: Check detail bootstrap syntax
        run: node --check tools/construction-tools-atlas/detail-dictionary-fix.js

      - name: Check canonical image runtime syntax
        run: node --check tools/construction-tools-atlas/detail-image-hotfix.js

      - name: Check dictionary presentation syntax
        run: node --check tools/construction-tools-atlas/dictionary-presentation-v2.3.js

      - name: Check legacy deep-link runtime syntax
        run: node --check tools/construction-tools-atlas/deep-link-v2.3.js

      - name: Check canonical deep-link runtime syntax
        run: node --check tools/construction-tools-atlas/canonical-deep-link-v2.3.js

      - name: Check canonical redirect auditor syntax
        run: node --check tools/construction-tools-atlas/scripts/check-canonical-redirects-v2.3.cjs

      - name: Check canonical identity resolution syntax
        run: node --check tools/construction-tools-atlas/scripts/check-canonical-identity-resolutions-v2.3.cjs

      - name: Check reusable batch identity auditor syntax
        run: node --check tools/construction-tools-atlas/scripts/audit-quality-batch-identity-candidates-v2.3.cjs

      - name: Check q011 identity closure syntax
        run: node --check tools/construction-tools-atlas/scripts/audit-q011-identity-closure-v2.3.cjs

      - name: Check q012 identity closure syntax
        run: node --check tools/construction-tools-atlas/scripts/audit-q012-identity-closure-v2.3.cjs

      - name: Check q013 identity closure syntax
        run: node --check tools/construction-tools-atlas/scripts/audit-q013-identity-closure-v2.3.cjs

      - name: Check q014 identity closure syntax
        run: node --check tools/construction-tools-atlas/scripts/audit-q014-identity-closure-v2.3.cjs

      - name: Check q011 content completion syntax
        run: node --check tools/construction-tools-atlas/scripts/check-q011-content-completion-v2.3.cjs

      - name: Check q012 Wave3A content syntax
        run: node --check tools/construction-tools-atlas/scripts/check-q012-content-wave3a-v2.3.cjs

      - name: Check q012 Wave3B content syntax
        run: node --check tools/construction-tools-atlas/scripts/check-q012-content-wave3b-v2.3.cjs

      - name: Check q012 Wave3C content syntax
        run: node --check tools/construction-tools-atlas/scripts/check-q012-content-wave3c-v2.3.cjs

      - name: Check q012 content completion syntax
        run: node --check tools/construction-tools-atlas/scripts/check-q012-content-completion-v2.3.cjs

      - name: Check q013 content completion syntax
        run: node --check tools/construction-tools-atlas/scripts/check-q013-content-completion-v2.3.cjs

      - name: Check Wave 1 image builder syntax
        run: node --check tools/construction-tools-atlas/scripts/build-image-wave1-v2.3.mjs

      - name: Check Wave 2 image builder syntax
        run: node --check tools/construction-tools-atlas/scripts/build-image-wave2-v2.3.mjs

      - name: Check Wave 3 image builder syntax
        run: node --check tools/construction-tools-atlas/scripts/build-image-wave3-v2.3.mjs

      - name: Check Wave 4 image builder syntax
        run: node --check tools/construction-tools-atlas/scripts/build-image-wave4-v2.3.mjs

      - name: Check Wave 5 image builder syntax
        run: node --check tools/construction-tools-atlas/scripts/build-image-wave5-v2.3.mjs

      - name: Check Wave 1 source checker syntax
        run: node --check tools/construction-tools-atlas/scripts/check-image-wave1-sources-v2.3.cjs

      - name: Check Wave 2 source checker syntax
        run: node --check tools/construction-tools-atlas/scripts/check-image-wave2-sources-v2.3.cjs

      - name: Check Wave 3 source checker syntax
        run: node --check tools/construction-tools-atlas/scripts/check-image-wave3-sources-v2.3.cjs

      - name: Check Wave 4 source checker syntax
        run: node --check tools/construction-tools-atlas/scripts/check-image-wave4-sources-v2.3.cjs

      - name: Check Wave 5 source checker syntax
        run: node --check tools/construction-tools-atlas/scripts/check-image-wave5-sources-v2.3.cjs

      - name: Check Wave 3 promotion syntax
        run: node --check tools/construction-tools-atlas/scripts/promote-image-wave3a-v2.3.cjs

      - name: Check Wave 4 promotion syntax
        run: node --check tools/construction-tools-atlas/scripts/promote-image-wave4a-v2.3.cjs

      - name: Check Wave 5 promotion syntax
        run: node --check tools/construction-tools-atlas/scripts/promote-image-wave5-v2.3.cjs

      - name: Check registry source sync syntax
        run: node --check tools/construction-tools-atlas/scripts/sync-image-registry-sources-v2.3.cjs

      - name: Check image attribution checker syntax
        run: node --check tools/construction-tools-atlas/scripts/check-image-attribution-v2.3.cjs

      - name: Check image runtime checker syntax
        run: node --check tools/construction-tools-atlas/scripts/check-image-runtime-v2.3.cjs

      - name: Check image identity backlog generator syntax
        run: node --check tools/construction-tools-atlas/scripts/generate-image-identity-backlog-v2.3.cjs

      - name: Check image identity resolution checker syntax
        run: node --check tools/construction-tools-atlas/scripts/check-image-identity-resolutions-v2.3.cjs

      - name: Check image identity review reporter syntax
        run: node --check tools/construction-tools-atlas/scripts/report-image-identity-review-v2.3.cjs

      - name: Check full image inventory auditor syntax
        run: node --check tools/construction-tools-atlas/scripts/audit-image-inventory-v2.3.cjs

      - name: Check publication corpus auditor syntax
        run: node --check tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs

      - name: Check public image inventory auditor syntax
        run: node --check tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs

      - name: Check public content quality auditor syntax
        run: node --check tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs

      - name: Check revenue readiness reporter syntax
        run: node --check tools/construction-tools-atlas/scripts/report-revenue-readiness-v2.3.cjs

      - name: Check master-detail v2.3 contract
        run: node tools/construction-tools-atlas/scripts/check-master-detail-v2.3.cjs

      - name: Check bilingual v2.3 contract
        run: node tools/construction-tools-atlas/scripts/check-bilingual-v2.3.cjs

      - name: Check legacy deep-link v2.3 contract
        run: node tools/construction-tools-atlas/scripts/check-deep-link-v2.3.cjs

      - name: Validate canonical redirect and deep-link migration contract
        run: node tools/construction-tools-atlas/scripts/check-canonical-redirects-v2.3.cjs

      - name: Validate canonical identity resolution contract
        run: node tools/construction-tools-atlas/scripts/check-canonical-identity-resolutions-v2.3.cjs

      - name: Require zero unresolved q011 identity collisions
        run: node tools/construction-tools-atlas/scripts/audit-q011-identity-closure-v2.3.cjs

      - name: Require zero unresolved q012 identity collisions
        run: node tools/construction-tools-atlas/scripts/audit-q012-identity-closure-v2.3.cjs

      - name: Require zero unresolved q013 identity collisions
        run: node tools/construction-tools-atlas/scripts/audit-q013-identity-closure-v2.3.cjs

      - name: Require zero unresolved q014 identity collisions
        run: node tools/construction-tools-atlas/scripts/audit-q014-identity-closure-v2.3.cjs

      - name: Require complete q011 subject-specific core content
        run: node tools/construction-tools-atlas/scripts/check-q011-content-completion-v2.3.cjs

      - name: Require safe q012 Wave3A subject-specific core content
        run: node tools/construction-tools-atlas/scripts/check-q012-content-wave3a-v2.3.cjs

      - name: Require safe q012 Wave3B subject-specific core content
        run: node tools/construction-tools-atlas/scripts/check-q012-content-wave3b-v2.3.cjs

      - name: Require safe q012 Wave3C subject-specific core content
        run: node tools/construction-tools-atlas/scripts/check-q012-content-wave3c-v2.3.cjs

      - name: Require complete q012 subject-specific core content
        run: node tools/construction-tools-atlas/scripts/check-q012-content-completion-v2.3.cjs

      - name: Require complete q013 subject-specific core content
        run: node tools/construction-tools-atlas/scripts/check-q013-content-completion-v2.3.cjs

      - name: Audit image assets and canonical mappings
        run: node tools/construction-tools-atlas/scripts/audit-image-assets-v2.3.cjs

      - name: Regenerate image identity backlog
        run: |
          node tools/construction-tools-atlas/scripts/generate-image-identity-backlog-v2.3.cjs
          git diff --exit-code -- tools/construction-tools-atlas/data/image-identity-backlog-v2.3.json

      - name: Validate image identity resolution ledger
        run: node tools/construction-tools-atlas/scripts/check-image-identity-resolutions-v2.3.cjs

      - name: Report held image identity candidates
        run: node tools/construction-tools-atlas/scripts/report-image-identity-review-v2.3.cjs

      - name: Validate Wave 1 image source ledger
        run: node tools/construction-tools-atlas/scripts/check-image-wave1-sources-v2.3.cjs

      - name: Validate Wave 2 image source ledger
        run: node tools/construction-tools-atlas/scripts/check-image-wave2-sources-v2.3.cjs

      - name: Validate Wave 3 image source contract
        run: node tools/construction-tools-atlas/scripts/check-image-wave3-sources-v2.3.cjs

      - name: Validate Wave 4 image source contract
        run: node tools/construction-tools-atlas/scripts/check-image-wave4-sources-v2.3.cjs

      - name: Validate Wave 5 image source contract
        run: node tools/construction-tools-atlas/scripts/check-image-wave5-sources-v2.3.cjs

      - name: Validate canonical image registry and source-ledger parity
        run: node tools/construction-tools-atlas/scripts/check-image-registry-v2.3.cjs

      - name: Validate generated image attribution
        run: node tools/construction-tools-atlas/scripts/check-image-attribution-v2.3.cjs

      - name: Validate canonical image runtime priority and redirect inheritance
        run: node tools/construction-tools-atlas/scripts/check-image-runtime-v2.3.cjs

      - name: Validate frozen full canonical image inventory
        run: node tools/construction-tools-atlas/scripts/audit-image-inventory-v2.3.cjs --check

      - name: Validate frozen public publication corpus
        run: node tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs --check

      - name: Validate frozen public image inventory
        run: node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --check

      - name: Validate frozen public content quality inventory
        run: node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --check

      - name: Validate revenue execution readiness
        run: node tools/construction-tools-atlas/scripts/report-revenue-readiness-v2.3.cjs
