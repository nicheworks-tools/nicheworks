name: Temporary Phone QuickCheck wave5 finalizer

on:
  push:
    branches:
      - feat/phone-quickcheck-data-wave5-150-20260914
    paths:
      - '.github/workflows/tmp-finalize-phone-quickcheck-wave5.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-quickcheck-data-wave5-150-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Finalize 150-model dataset and contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const phonePath = 'tools/phone-quickcheck/data/phones.json';
          const wavePaths = [
            'tools/phone-quickcheck/data/phones.wave5.01.json',
            'tools/phone-quickcheck/data/phones.wave5.02.json',
            'tools/phone-quickcheck/data/phones.wave5.03.json',
            'tools/phone-quickcheck/data/phones.wave5.04.json',
            'tools/phone-quickcheck/data/phones.wave5.05.json'
          ];
          const validatorPath = 'scripts/check-phone-quickcheck-data.mjs';
          const appPath = 'tools/phone-quickcheck/app.js';
          const behaviorPath = 'tools/phone-quickcheck/tests/behavior.test.mjs';
          const specPath = 'tools/phone-quickcheck/SPEC.md';
          const docsPath = 'docs/tools/phone-quickcheck.md';

          const payload = JSON.parse(fs.readFileSync(phonePath, 'utf8'));
          const base = Array.isArray(payload.phones) ? payload.phones : [];
          if (base.length !== 100) throw new Error(`expected 100 base phones, got ${base.length}`);

          const waves = wavePaths.flatMap((p) => {
            const data = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!Array.isArray(data.records)) throw new Error(`${p}: records missing`);
            return data.records;
          });
          if (waves.length !== 50) throw new Error(`expected 50 wave5 phones, got ${waves.length}`);

          const merged = [...base, ...waves];
          const ids = new Set();
          const identities = new Set();
          for (const phone of merged) {
            if (!phone.id || !phone.manufacturer || !phone.model) throw new Error('identity fields missing');
            if (ids.has(phone.id)) throw new Error(`duplicate id: ${phone.id}`);
            ids.add(phone.id);
            const identity = `${String(phone.manufacturer).toLowerCase()}::${String(phone.model).toLowerCase()}`;
            if (identities.has(identity)) throw new Error(`duplicate identity: ${identity}`);
            identities.add(identity);
          }
          if (merged.length !== 150) throw new Error(`expected 150 merged phones, got ${merged.length}`);

          payload.version = 6;
          payload.updatedAt = '2026-09-14';
          payload.phones = merged;
          fs.writeFileSync(phonePath, JSON.stringify(payload, null, 2) + '\n');

          let validator = fs.readFileSync(validatorPath, 'utf8');
          validator = validator.replace(
            "if (phones.length < 100) fail(`expected at least 100 phones, got ${phones.length}`);",
            "if (phones.length < 150) fail(`expected at least 150 phones, got ${phones.length}`);"
          );
          if (!validator.includes('expected at least 150 phones')) throw new Error('validator count update missing');
          fs.writeFileSync(validatorPath, validator);

          let app = fs.readFileSync(appPath, 'utf8');
          const oldPdRule = "      keys.add(watts > 30 ? 'charger-pd-45w' : 'charger-pd-30w');";
          const newPdRule = "      if (watts <= 20) keys.add('charger-pd-20w');\n      else if (watts <= 30) keys.add('charger-pd-30w');\n      else keys.add('charger-pd-45w');";
          if (!app.includes(oldPdRule)) throw new Error('generic PD rule target missing');
          app = app.replace(oldPdRule, newPdRule);
          fs.writeFileSync(appPath, app);

          let behavior = fs.readFileSync(behaviorPath, 'utf8');
          const behaviorAnchor = "console.log('Phone QuickCheck behavior tests passed: search/i18n, recharge estimates, Apple unknown capacity, Lightning guidance, proprietary charging, and mobile sheet.');";
          if (!behavior.includes(behaviorAnchor)) throw new Error('behavior test anchor missing');
          const pdTest = `// 18W USB-PD guidance resolves to the 20W accessory class, not an overstated 30W class.\n{\n  const h = await createHarness(['oppo-reno5-a', 'xiaomi-redmi-12-5g']);\n  const html = h.elements.desktopDetail.innerHTML;\n  assert.match(html, /USB-PD対応 20W以上の充電器/);\n  assert.doesNotMatch(html, /USB-PD対応 30W以上の充電器/);\n}\n\n`;
          behavior = behavior.replace(behaviorAnchor, pdTest + behaviorAnchor);
          fs.writeFileSync(behaviorPath, behavior);

          let spec = fs.readFileSync(specPath, 'utf8');
          spec = spec.replace('- Current dataset: `100 verified models`', '- Current dataset: `150 verified models`');
          spec = spec.replace('The maintained public dataset contains 100 verified models across Apple, Google, Samsung, Sony, SHARP, OPPO, Xiaomi, and Motorola.', 'The maintained public dataset contains 150 verified models across Apple, Google, Samsung, Sony, SHARP, OPPO, Xiaomi, and Motorola.');
          spec = spec.replace('- [x] The maintained public dataset contains 100 maintained models.', '- [x] The maintained public dataset contains 150 maintained models.');
          if (!spec.includes('150 maintained models')) throw new Error('SPEC count update missing');
          if (!spec.includes('verified dataset expansion to 150 models')) {
            spec = spec.replace('- public promotion: PR #689', '- public promotion: PR #689\n- Amazon accessory handoff activation: PR #731\n- verified dataset expansion to 60 models: PR #736\n- verified dataset expansion to 100 models: PR #740\n- behavior regression coverage: PR #741\n- verified dataset expansion to 150 models: current wave5 PR');
          }
          fs.writeFileSync(specPath, spec);

          let docs = fs.readFileSync(docsPath, 'utf8');
          docs = docs.replace('The maintained public dataset contains 100 smartphone records across Apple, Google, Samsung, Sony, SHARP, OPPO, Xiaomi, and Motorola.', 'The maintained public dataset contains 150 smartphone records across Apple, Google, Samsung, Sony, SHARP, OPPO, Xiaomi, and Motorola.');
          docs = docs.replace('- 100機種の検証済みデータをブラウザ内で検索・絞り込み・並び替えする。', '- 150機種の検証済みデータをブラウザ内で検索・絞り込み・並び替えする。');
          docs = docs.replace('- [x] 100 maintained models load from the static phone dataset.', '- [x] 150 maintained models load from the static phone dataset.');
          if (!docs.includes('150 maintained models')) throw new Error('canonical docs count update missing');
          fs.writeFileSync(docsPath, docs);
          NODE

          node scripts/check-phone-quickcheck-data.mjs
          node scripts/check-phone-quickcheck-affiliate.mjs
          node tools/phone-quickcheck/tests/behavior.test.mjs
          node scripts/check-tool-runtime-contracts.mjs

          rm tools/phone-quickcheck/data/phones.wave5.01.json
          rm tools/phone-quickcheck/data/phones.wave5.02.json
          rm tools/phone-quickcheck/data/phones.wave5.03.json
          rm tools/phone-quickcheck/data/phones.wave5.04.json
          rm tools/phone-quickcheck/data/phones.wave5.05.json
          rm .github/workflows/tmp-finalize-phone-quickcheck-wave5.yml

          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add -A
          git commit -m "Expand Phone QuickCheck to 150 verified models"
          git push origin HEAD:feat/phone-quickcheck-data-wave5-150-20260914
