name: FastScan Chromium-canvas real-photo QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fastscan-chromium-canvas-real-photo.yml'
      - 'tools/inci-fastscan/qa/chromium-canvas-real-photo-pilot.mjs'
      - 'tools/inci-fastscan/js/image_preprocess.js'
      - 'tools/inci-fastscan/js/core_ocr_post.js'
      - 'tools/inci-fastscan/qa/production-label-scoring.mjs'
      - 'tools/inci-fastscan/js/core_parser.js'
      - 'tools/inci-fastscan/js/core_matcher.js'
      - 'tools/inci-fastscan/js/core_analyze.js'
      - 'tools/_shared/cosmetic-ingredient-parser.js'

permissions:
  contents: read

jobs:
  chromium-canvas-vs-original:
    name: 12 real English photos / Chromium canvas vs original
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FASTSCAN_PHOTO_CORPUS_COMMIT: 5ba39a7b06c59ff1edb30a396fdd640f82506742
      FASTSCAN_PHOTO_CORPUS_DIR: ${{ github.workspace }}/.qa-external-fastscan-photos
      FASTSCAN_PHOTO_REPORT: ${{ github.workspace }}/fastscan-chromium-canvas-real-photo-results.json

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned OCR and browser QA dependencies
        run: |
          npm init --yes >/dev/null
          npm install --no-save --no-package-lock --ignore-scripts tesseract.js@5.0.3 yaml@2.6.1 playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Verify deterministic production dictionary scorer
        run: node tools/inci-fastscan/qa/check-production-label-scoring.mjs

      - name: Fetch pinned real English ingredient-label photo corpus (ephemeral)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FASTSCAN_PHOTO_CORPUS_DIR"
          ids=(
            0083800047833 0085805190880 0768614212331 0842101102074
            11112140153911 3253581766538 3253581780039 3367729117264
            3499320013727 3499320014854 3574661563312 3574661588353
          )
          base="https://raw.githubusercontent.com/ki-iw/toxfox-ocr/${FASTSCAN_PHOTO_CORPUS_COMMIT}/data"
          for id in "${ids[@]}"; do
            curl --fail --silent --show-error --location --retry 3 \
              "${base}/images/${id}.jpg" --output "${FASTSCAN_PHOTO_CORPUS_DIR}/${id}.jpg"
            curl --fail --silent --show-error --location --retry 3 \
              "${base}/ground_truth/${id}.yaml" --output "${FASTSCAN_PHOTO_CORPUS_DIR}/${id}.yaml"
          done
          test "$(find "$FASTSCAN_PHOTO_CORPUS_DIR" -name '*.jpg' | wc -l)" -eq 12
          test "$(find "$FASTSCAN_PHOTO_CORPUS_DIR" -name '*.yaml' | wc -l)" -eq 12

      - name: Measure source vs actual Chromium-canvas processed photo OCR
        run: |
          node --check tools/inci-fastscan/qa/chromium-canvas-real-photo-pilot.mjs
          node tools/inci-fastscan/qa/chromium-canvas-real-photo-pilot.mjs
          test -s "$FASTSCAN_PHOTO_REPORT"

      - name: Upload numeric-only metrics (never photos or label text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastscan-chromium-canvas-real-photo-metrics
          path: ${{ github.workspace }}/fastscan-chromium-canvas-real-photo-results.json
          if-no-files-found: error
          retention-days: 14
