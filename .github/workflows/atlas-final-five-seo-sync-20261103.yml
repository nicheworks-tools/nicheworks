name: Atlas final-five SEO generator sync (one-off)
on:
  pull_request:
    paths:
      - .github/workflows/atlas-final-five-seo-sync-20261103.yml
  push:
    branches:
      - fix/atlas-five-canonical-identities-20261103
    paths:
      - .github/workflows/atlas-final-five-seo-sync-20261103.yml
permissions:
  contents: write
jobs:
  inspect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report actual generator output for exact three files
        shell: bash
        run: |
          set -euo pipefail
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs --check
          git diff --name-only
          node - <<'NODE'
          const fs = require('node:fs');
          for (const path of [
            'tools/construction-tools-atlas/entries/notched_trowel/index.html',
            'tools/construction-tools-atlas/entries/paint_tray/index.html',
            'tools/construction-tools-atlas/data/seo-detail-pages-v2.3.json'
          ]) console.log('CTA_SEO_GENERATED=' + JSON.stringify({path,content:fs.readFileSync(path,'utf8')}));
          NODE
  regenerate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate SEO snapshot from 865-entry runtime and validate
        shell: bash
        run: |
          set -euo pipefail
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs --check
          git diff --check
          git diff --stat
          git diff --name-only > /tmp/atlas-seo-changed.txt
          cat /tmp/atlas-seo-changed.txt
          while IFS= read -r changed; do
            case "$changed" in
              tools/construction-tools-atlas/data/seo-detail-pages-v2.3.json|tools/construction-tools-atlas/entries/notched_trowel/index.html|tools/construction-tools-atlas/entries/paint_tray/index.html) ;;
              *) echo "Unexpected generated path: $changed"; exit 1 ;;
            esac
          done < /tmp/atlas-seo-changed.txt
          test -s /tmp/atlas-seo-changed.txt
      - name: Commit only reviewed generated SEO artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            tools/construction-tools-atlas/data/seo-detail-pages-v2.3.json \
            tools/construction-tools-atlas/entries/notched_trowel/index.html \
            tools/construction-tools-atlas/entries/paint_tray/index.html
          git rm -- .github/workflows/atlas-final-five-seo-sync-20261103.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(atlas): regenerate final reviewed-alias SEO detail output'
          git push origin HEAD:refs/heads/fix/atlas-five-canonical-identities-20261103
