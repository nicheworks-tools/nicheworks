name: TrashNavi Wave 17 readiness temp

on:
  push:
    branches:
      - feat/trashnavi-saga-readiness-wave17-20260914

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-saga-readiness-wave17-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Wave 17 readiness delta
        run: |
          node <<'NODE'
          const fs = require('fs');
          const oldUrl = 'https://www.city.saga.lg.jp/main/245.html';
          const newUrl = 'https://www.city.saga.lg.jp/kurashi/seikatsukankyo/1/1/3/106.html';
          for (const file of [
            'tools/trashnavi/data/direct-waste-links.json',
            'tools/trashnavi/data/direct-waste-links-pref-capitals-extra.json'
          ]) {
            let s = fs.readFileSync(file, 'utf8');
            if (!s.includes(oldUrl)) throw new Error(`${file}: old Saga URL not found`);
            s = s.replaceAll(oldUrl, newUrl);
            fs.writeFileSync(file, s);
          }

          const app = 'tools/trashnavi/app.js';
          let js = fs.readFileSync(app, 'utf8');
          const oldTail = '"data/direct-waste-links-supply-wave16.json"]';
          const newTail = '"data/direct-waste-links-supply-wave16.json","data/direct-waste-links-supply-wave17.json"]';
          if (!js.includes(oldTail)) throw new Error('app.js Wave 16 tail not found');
          js = js.replace(oldTail, newTail);
          fs.writeFileSync(app, js);

          const wave17 = [
            {
              pref: '佐賀県',
              city: '佐賀市',
              name: '佐賀市 ごみカレンダー',
              type: '収集カレンダー',
              link_type: 'collection_calendar',
              url: 'https://www.city.saga.lg.jp/main/412.html',
              lgcode: '412015',
              fiscal_year: '2026',
              last_checked: '2026-09-14',
              status: 'active',
              language: 'ja'
            },
            {
              pref: '佐賀県',
              city: '佐賀市',
              name: '佐賀市 粗大ごみ定期収集（ステッカー方式）の利用方法',
              type: '粗大ごみ',
              link_type: 'bulky_waste',
              url: 'https://www.city.saga.lg.jp/kurashi/seikatsukankyo/1/1/5/3840.html',
              lgcode: '412015',
              last_checked: '2026-09-14',
              status: 'active',
              language: 'ja'
            }
          ];
          fs.writeFileSync('tools/trashnavi/data/direct-waste-links-supply-wave17.json', JSON.stringify(wave17, null, 2) + '\n');
          NODE
      - name: Required TrashNavi audits
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit readiness output and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/trashnavi/app.js tools/trashnavi/data/direct-waste-links.json tools/trashnavi/data/direct-waste-links-pref-capitals-extra.json tools/trashnavi/data/direct-waste-links-supply-wave17.json
          git commit -m 'Promote Saga to TrashNavi preferred candidate'
          git rm .github/workflows/trashnavi-wave17-readiness-temp.yml
          git commit -m 'Remove temporary TrashNavi Wave 17 readiness workflow'
          git push origin HEAD:feat/trashnavi-saga-readiness-wave17-20260914
