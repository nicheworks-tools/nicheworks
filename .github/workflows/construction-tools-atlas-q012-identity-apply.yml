name: Construction Tools Atlas q012 identity apply

on:
  push:
    branches:
      - audit/construction-atlas-q012-identity-closure-20260916
    paths:
      - '.github/workflows/construction-tools-atlas-q012-identity-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add runtime name-override support and q012 closure contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const loaderPath = 'tools/construction-tools-atlas/data/quality-loader.js';
          let loader = fs.readFileSync(loaderPath,'utf8');
          if (!loader.includes('function identityNameOverrides(raw)')) {
            loader = loader.replace(
              '  function identityTypeOverrides(raw) {\n    return Array.isArray(raw?.type_overrides) ? raw.type_overrides : [];\n  }',
              '  function identityNameOverrides(raw) {\n    return Array.isArray(raw?.name_overrides) ? raw.name_overrides : [];\n  }\n\n  function identityTypeOverrides(raw) {\n    return Array.isArray(raw?.type_overrides) ? raw.type_overrides : [];\n  }'
            );
          }
          if (!loader.includes('canonical_name_override_from')) {
            const marker = '  function applyIdentityResolutions(merged, raw, stats) {\n    const byId = new Map(merged.map((entry) => [safeText(entry?.id), entry]));\n';
            const block = `  function applyIdentityResolutions(merged, raw, stats) {\n    const byId = new Map(merged.map((entry) => [safeText(entry?.id), entry]));\n    for (const row of identityNameOverrides(raw)) {\n      const id = safeText(row?.id);\n      const fromJa = safeText(row?.from?.ja);\n      const fromEn = safeText(row?.from?.en);\n      const toJa = safeText(row?.to?.ja);\n      const toEn = safeText(row?.to?.en);\n      if (!id || (!toJa && !toEn)) continue;\n      const target = byId.get(id);\n      if (!target) {\n        stats.identityResolutionMissingTargets += 1;\n        if (stats.identityResolutionProblemSample.length < 20) stats.identityResolutionProblemSample.push({ id, reason: \"missing_name_override_target\" });\n        continue;\n      }\n      if (!target.term || typeof target.term !== \"object\") target.term = { ja: \"\", en: \"\" };\n      const currentJa = safeText(target.term.ja);\n      const currentEn = safeText(target.term.en);\n      if ((fromJa && currentJa !== fromJa && currentJa !== toJa) || (fromEn && currentEn !== fromEn && currentEn !== toEn)) {\n        stats.identityResolutionSourceMismatches += 1;\n        if (stats.identityResolutionProblemSample.length < 20) stats.identityResolutionProblemSample.push({ id, reason: \"unexpected_source_name\", currentJa, currentEn, fromJa, fromEn, toJa, toEn });\n      }\n      if (toJa) target.term.ja = toJa;\n      if (toEn) target.term.en = toEn;\n      target.fuzzy = uniqueText([\n        ...removeIdentityVocabulary(target.fuzzy, [fromJa, fromEn]),\n        target.term.ja,\n        target.term.en\n      ]);\n      target.meta = {\n        ...(target.meta || {}),\n        canonical_name_override_from: { ja: fromJa, en: fromEn },\n        canonical_name_override_to: { ja: toJa, en: toEn }\n      };\n      stats.identityNameOverridesApplied += 1;\n    }\n`;
            if (!loader.includes(marker)) throw new Error('loader applyIdentity marker not found');
            loader = loader.replace(marker, block);
          }
          if (!loader.includes('identityNameOverridesApplied: 0')) {
            loader = loader.replace('      identityTypeOverridesApplied: 0,','      identityNameOverridesApplied: 0,\n      identityTypeOverridesApplied: 0,');
          }
          loader = loader.replace('stats.identityTypeOverridesApplied > 0 || stats.identityAliasRemovalsApplied > 0', 'stats.identityNameOverridesApplied > 0 || stats.identityTypeOverridesApplied > 0 || stats.identityAliasRemovalsApplied > 0');
          fs.writeFileSync(loaderPath,loader);

          const identityCheck = 'tools/construction-tools-atlas/scripts/check-canonical-identity-resolutions-v2.3.cjs';
          let ic = fs.readFileSync(identityCheck,'utf8');
          if (!ic.includes('identityNameOverridesApplied')) {
            ic = ic.replace('  const expectedAliasRemovalCount = array(identity.alias_removals)', '  const expectedNameOverrideCount = array(identity.name_overrides).length;\n  const expectedAliasRemovalCount = array(identity.alias_removals)');
            ic = ic.replace('  if (diagnostics.identityTypeOverridesApplied !== array(identity.type_overrides).length) {', '  if (diagnostics.identityNameOverridesApplied !== expectedNameOverrideCount) {\n    throw new Error(`Name override count mismatch: ${diagnostics.identityNameOverridesApplied} != ${expectedNameOverrideCount}`);\n  }\n  if (diagnostics.identityTypeOverridesApplied !== array(identity.type_overrides).length) {');
            const beforeType = '  for (const row of array(identity.type_overrides)) {';
            const nameBlock = `  for (const row of array(identity.name_overrides)) {\n    const id = text(row.id);\n    const target = byId.get(id);\n    if (!target) throw new Error(\`${'${id}'}: name-override target is not public\`);\n    const wantJa = text(row?.to?.ja);\n    const wantEn = text(row?.to?.en);\n    if (wantJa && text(target?.term?.ja) !== wantJa) throw new Error(\`${'${id}'}: JA canonical name override not applied\`);\n    if (wantEn && text(target?.term?.en) !== wantEn) throw new Error(\`${'${id}'}: EN canonical name override not applied\`);\n    const oldJa = text(row?.from?.ja);\n    const oldEn = text(row?.from?.en);\n    const fuzzy = array(target?.fuzzy).map(norm);\n    if (oldJa && norm(oldJa) !== norm(wantJa) && fuzzy.includes(norm(oldJa))) throw new Error(\`${'${id}'}: retired JA canonical name remains in fuzzy vocabulary\`);\n    if (oldEn && norm(oldEn) !== norm(wantEn) && fuzzy.includes(norm(oldEn))) throw new Error(\`${'${id}'}: retired EN canonical name remains in fuzzy vocabulary\`);\n  }\n\n`;
            ic = ic.replace(beforeType,nameBlock+beforeType);
            ic = ic.replace('    type_overrides: array(identity.type_overrides).length,', '    name_overrides: expectedNameOverrideCount,\n    type_overrides: array(identity.type_overrides).length,');
          }
          fs.writeFileSync(identityCheck,ic);

          for (const rel of [
            'tools/construction-tools-atlas/scripts/check-q012-content-wave3a-v2.3.cjs',
            'tools/construction-tools-atlas/scripts/check-q012-content-wave3b-v2.3.cjs',
            'tools/construction-tools-atlas/scripts/check-q012-content-wave3c-v2.3.cjs'
          ]) {
            let s=fs.readFileSync(rel,'utf8');
            s=s.replace('activeQ012.length !== 84','activeQ012.length !== 69').replace('Expected 84 active q012 rows','Expected 69 active q012 rows');
            fs.writeFileSync(rel,s);
          }
          NODE
          cat > tools/construction-tools-atlas/scripts/audit-q012-identity-closure-v2.3.cjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');
          const ROOT = path.resolve(__dirname,'..');
          const DATA = path.join(ROOT,'data');
          const read = p => JSON.parse(fs.readFileSync(p,'utf8'));
          const text = v => typeof v === 'string' ? v.trim() : '';
          const arr = v => Array.isArray(v) ? v : [];
          const normJa = v => text(v).normalize('NFKC').replace(/[\s・･\-‐‑‒–—―_()（）]/g,'').toLowerCase();
          const normEn = v => text(v).normalize('NFKC').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const HELD = new Set([
            'q012_hex_key','q012_spanner','q012_feeler_gauge','q012_dial_gauge','q012_vernier_caliper',
            'q012_builder_square','q012_framing_square','q012_diamond_blade','q012_cold_chisel','q012_all_thread_rod',
            'q012_concrete_cover_meter','q012_rebar_locator','q012_crack_scale','q012_dust_collector','q012_shop_vacuum',
            'q012_air_compressor','q012_temporary_distribution_box','q012_guardrail','q012_toe_board'
          ]);
          const EXPECTED_REDIRECTED = new Set([
            'q012_hex_key','q012_feeler_gauge','q012_dial_gauge','q012_vernier_caliper','q012_builder_square',
            'q012_diamond_blade','q012_all_thread_rod','q012_concrete_cover_meter','q012_rebar_locator','q012_crack_scale',
            'q012_dust_collector','q012_shop_vacuum','q012_air_compressor','q012_temporary_distribution_box','q012_guardrail'
          ]);
          const EXPECTED_SURVIVORS = new Set(['q012_spanner','q012_framing_square','q012_cold_chisel','q012_toe_board']);
          function localFile(runtimePath){return path.resolve(ROOT,String(runtimePath||'').replace(/[?#].*$/,'').replace(/^\.\//,''));}
          async function loadRuntime(){
            const src=fs.readFileSync(path.join(DATA,'quality-loader.js'),'utf8'); const w={localStorage:{getItem(){return null;},setItem(){}}};
            w.fetch=async input=>{const f=localFile(typeof input==='string'?input:input?.url);if(!fs.existsSync(f))return{ok:false,async json(){return null;}};return{ok:true,async json(){return read(f);}}};
            const d={addEventListener(){},getElementById(){return null;},querySelector(){return null;},createElement(){return{setAttribute(){}}},head:{appendChild(){}}};
            vm.runInNewContext(src,{window:w,document:d,console:{info(){},warn(){},error:console.error},Set,Map},{filename:'quality-loader.js'});
            return {entries:await w.CTA_DATA_LOADER.loadEntries(),w};
          }
          function names(e){return{ja:text(e?.term?.ja),en:text(e?.term?.en),aja:arr(e?.aliases?.ja).map(text),aen:arr(e?.aliases?.en).map(text)}};
          (async()=>{
            const redirects=read(path.join(DATA,'canonical-redirects-v2.3.json')).redirects;
            const redirectMap=new Map(redirects.map(r=>[text(r.from),text(r.to)]));
            if(redirects.length!==40) throw new Error(`Expected 40 total redirects, got ${redirects.length}`);
            for(const id of EXPECTED_REDIRECTED) if(!redirectMap.has(id)) throw new Error(`${id}: expected q012 redirect missing`);
            for(const id of EXPECTED_SURVIVORS) if(redirectMap.has(id)) throw new Error(`${id}: reviewed distinct q012 canonical must survive`);
            const {entries,w}=await loadRuntime();
            if(entries.length!==896) throw new Error(`Expected 896 public canonicals after q012 closure, got ${entries.length}`);
            const byId=new Map(entries.map(e=>[text(e.id),e]));
            for(const id of EXPECTED_REDIRECTED) if(byId.has(id)) throw new Error(`${id}: redirected q012 entry still public`);
            for(const id of EXPECTED_SURVIVORS) if(!byId.has(id)) throw new Error(`${id}: distinct q012 survivor missing`);
            const identity=read(path.join(DATA,'canonical-identity-resolutions-v2.3.json'));
            const allowed=new Set(arr(identity.resolved_distinct_pairs).flatMap(r=>[`${text(r.a)}\t${text(r.b)}`,`${text(r.b)}\t${text(r.a)}`]));
            const unresolved=[];
            for(const id of EXPECTED_SURVIVORS){
              const e=byId.get(id), n=names(e), sj=normJa(n.ja), se=normEn(n.en);
              for(const other of entries){
                const oid=text(other.id); if(oid===id) continue; const o=names(other); const reasons=[];
                if(sj&&normJa(o.ja)===sj) reasons.push('exact_ja');
                if(se&&normEn(o.en)===se) reasons.push('exact_en');
                if(sj&&o.aja.some(v=>normJa(v)===sj)) reasons.push('target_alias_ja');
                if(se&&o.aen.some(v=>normEn(v)===se)) reasons.push('target_alias_en');
                if(reasons.length&&!allowed.has(`${id}\t${oid}`)) unresolved.push({id,other:oid,reasons});
              }
            }
            if(unresolved.length) throw new Error(`Unresolved q012 collisions: ${JSON.stringify(unresolved)}`);
            if((w.CTA_DATA_DIAGNOSTICS?.identityNameOverridesApplied||0)!==arr(identity.name_overrides).length) throw new Error('Name override runtime count mismatch');
            console.log(`CTA_Q012_IDENTITY_CLOSURE=${JSON.stringify({held:HELD.size,redirected:EXPECTED_REDIRECTED.size,survivors:EXPECTED_SURVIVORS.size,total_redirects:redirects.length,public_entries:entries.length,name_overrides:arr(identity.name_overrides).length,type_overrides:arr(identity.type_overrides).length,alias_removal_rows:arr(identity.alias_removals).length,unresolved_collisions:0})}`);
            console.log('Construction Tools Atlas q012 identity closure v2.3: PASS');
          })().catch(e=>{console.error('Construction Tools Atlas q012 identity closure v2.3: FAIL');console.error('- '+e.message);process.exit(1);});
          NODE
          node --check tools/construction-tools-atlas/data/quality-loader.js
          node --check tools/construction-tools-atlas/scripts/check-canonical-identity-resolutions-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/audit-q012-identity-closure-v2.3.cjs
      - name: Freeze identity-affected inventories
        run: |
          node tools/construction-tools-atlas/scripts/check-canonical-identity-resolutions-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-canonical-redirects-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-q012-identity-closure-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/check-q012-content-wave3a-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-q012-content-wave3b-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-q012-content-wave3c-v2.3.cjs
      - name: Commit non-workflow closure state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/construction-tools-atlas/data/quality-loader.js \
                  tools/construction-tools-atlas/data/publication-inventory-v2.3.json \
                  tools/construction-tools-atlas/data/public-image-inventory-v2.3.json \
                  tools/construction-tools-atlas/data/public-content-quality-v2.3.json \
                  tools/construction-tools-atlas/scripts/check-canonical-identity-resolutions-v2.3.cjs \
                  tools/construction-tools-atlas/scripts/check-q012-content-wave3a-v2.3.cjs \
                  tools/construction-tools-atlas/scripts/check-q012-content-wave3b-v2.3.cjs \
                  tools/construction-tools-atlas/scripts/check-q012-content-wave3c-v2.3.cjs \
                  tools/construction-tools-atlas/scripts/audit-q012-identity-closure-v2.3.cjs
          git commit -m 'feat(construction-atlas): apply q012 identity closure runtime'
          git push
