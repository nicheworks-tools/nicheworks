name: TrashNavi Wave28 main sync temp
on:
  push:
    branches:
      - feat/trashnavi-batch-wave28-publication-20260916
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and preserve Wave28 sitemap URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "sitemap.xml"
            git checkout --theirs sitemap.xml
            python3 <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          s=p.read_text()
          urls=[
            'https://nicheworks.app/tools/trashnavi/iwate/morioka/',
            'https://nicheworks.app/tools/trashnavi/akita/akita/',
            'https://nicheworks.app/tools/trashnavi/fukushima/fukushima/',
            'https://nicheworks.app/tools/trashnavi/ibaraki/mito/',
            'https://nicheworks.app/tools/trashnavi/kanagawa/kawasaki/',
            'https://nicheworks.app/tools/trashnavi/kanagawa/sagamihara/',
            'https://nicheworks.app/tools/trashnavi/osaka/sakai/',
            'https://nicheworks.app/tools/trashnavi/okayama/okayama/',
            'https://nicheworks.app/tools/trashnavi/fukuoka/fukuoka/',
            'https://nicheworks.app/tools/trashnavi/fukuoka/kitakyushu/',
          ]
          blocks=[]
          for url in urls:
            assert s.count(f'<loc>{url}</loc>') == 0, url
            blocks.append(f'  <url>\n    <loc>{url}</loc>\n    <lastmod>2026-09-16</lastmod>\n  </url>')
          assert s.count('</urlset>') == 1
          s=s.replace('</urlset>', '\n'.join(blocks)+'\n</urlset>')
          p.write_text(s)
          PY
            git add sitemap.xml
            git commit -m 'Merge latest main into TrashNavi Wave28 publication'
          fi
          python3 <<'PY'
          from pathlib import Path
          s=Path('sitemap.xml').read_text()
          urls=[
            'https://nicheworks.app/tools/trashnavi/iwate/morioka/',
            'https://nicheworks.app/tools/trashnavi/akita/akita/',
            'https://nicheworks.app/tools/trashnavi/fukushima/fukushima/',
            'https://nicheworks.app/tools/trashnavi/ibaraki/mito/',
            'https://nicheworks.app/tools/trashnavi/kanagawa/kawasaki/',
            'https://nicheworks.app/tools/trashnavi/kanagawa/sagamihara/',
            'https://nicheworks.app/tools/trashnavi/osaka/sakai/',
            'https://nicheworks.app/tools/trashnavi/okayama/okayama/',
            'https://nicheworks.app/tools/trashnavi/fukuoka/fukuoka/',
            'https://nicheworks.app/tools/trashnavi/fukuoka/kitakyushu/',
          ]
          for url in urls:
            assert s.count(f'<loc>{url}</loc>') == 1, url
          PY
          git diff --check HEAD^ HEAD || true
          git push origin HEAD:feat/trashnavi-batch-wave28-publication-20260916
