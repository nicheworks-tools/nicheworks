name: Pattern Dictionary production SEO audit

on:
  workflow_dispatch:
    inputs:
      liveSupplementCount:
        description: 'Number of V2 terms already deployed (5 before merge, 10 after deployment)'
        type: choice
        required: true
        default: '5'
        options:
          - '5'
          - '10'
  pull_request:
    paths:
      - 'tools/pattern-dictionary/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/pattern-dictionary-production-seo-audit.yml'

permissions:
  contents: read

jobs:
  production-seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify canonical search and SEO regressions
        run: |
          node tools/pattern-dictionary/tests/validate.mjs
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/tests/taxonomy-source-test.mjs
          node tools/pattern-dictionary/tests/v2-supplement-test.mjs
          node tools/pattern-dictionary/tests/v2-runtime-integration-test.mjs
          node tools/pattern-dictionary/tests/browse-mobile-test.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node tools/pattern-dictionary/tests/seo-detail-test.mjs

      - name: Audit current production detail URLs (210 on PR, 220 after deployment)
        env:
          PATTERN_DICTIONARY_LIVE_SUPPLEMENT_COUNT: ${{ inputs.liveSupplementCount || '5' }}
          PATTERN_DICTIONARY_PRODUCTION_SEO_REPORT: pattern-dictionary-production-seo-report.json
          PATTERN_DICTIONARY_PRODUCTION_SEO_CONCURRENCY: '8'
          PATTERN_DICTIONARY_PRODUCTION_SEO_TIMEOUT_MS: '20000'
          PATTERN_DICTIONARY_PRODUCTION_SEO_RETRIES: '2'
        run: node tools/pattern-dictionary/scripts/audit-production-seo.mjs

      - name: Upload production SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-dictionary-production-seo-report
          path: pattern-dictionary-production-seo-report.json
          if-no-files-found: error
          retention-days: 30
