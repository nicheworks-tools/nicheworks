name: TrashNavi Wave 16 publication temp

on:
  push:
    branches:
      - feat/trashnavi-matsue-publication-wave16-20260914

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Wave 16 publication delta
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('tools/trashnavi/municipality-page-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if not any(str(x.get('lgcode')) == '322016' for x in manifest):
              manifest.append({'lgcode':'322016','pref_slug':'shimane','city_slug':'matsue','publish':True})
          lines = ['[']
          for i, entry in enumerate(manifest):
              comma = ',' if i < len(manifest)-1 else ''
              lines.append('  ' + json.dumps(entry, ensure_ascii=False, separators=(',', ':')) + comma)
          lines.append(']')
          manifest_path.write_text('\n'.join(lines) + '\n')

          gen = Path('tools/trashnavi/scripts/generate-municipality-pages.mjs')
          s = gen.read_text()
          old = 'if(outputs.length!==22) throw new Error(`municipality page count must be 22; got ${outputs.length}`);'
          new = 'if(outputs.length!==23) throw new Error(`municipality page count must be 23; got ${outputs.length}`);'
          if old not in s: raise SystemExit('generator count anchor missing')
          gen.write_text(s.replace(old, new, 1))

          aff = Path('tools/trashnavi/scripts/check-affiliate-contract.mjs')
          s = aff.read_text()
          old = 'check(manifest.length === 22, `expected 22 published municipality pages, got ${manifest.length}`);'
          new = 'check(manifest.length === 23, `expected 23 published municipality pages, got ${manifest.length}`);'
          if old not in s: raise SystemExit('affiliate count anchor missing')
          aff.write_text(s.replace(old, new, 1))

          idx = Path('tools/trashnavi/index.html')
          s = idx.read_text()
          old = '<a href="/tools/trashnavi/shiga/otsu/">大津市</a></div>'
          new = '<a href="/tools/trashnavi/shiga/otsu/">大津市</a><a href="/tools/trashnavi/shimane/matsue/">松江市</a></div>'
          if old not in s: raise SystemExit('root municipality-link anchor missing')
          idx.write_text(s.replace(old, new, 1))

          ai_path = Path('tools/trashnavi/ai-reference.json')
          ai = json.loads(ai_path.read_text())
          ai['published_municipality_count'] = 23
          if not any(str(x.get('lgcode')) == '322016' for x in ai['municipalities']):
              ai['municipalities'].append({
                  'lgcode':'322016','pref_slug':'shimane','city_slug':'matsue',
                  'url':'https://nicheworks.app/tools/trashnavi/shimane/matsue/'
              })
          ai_path.write_text(json.dumps(ai, ensure_ascii=False, indent=2, separators=(',', ': ')) + '\n')

          spec = Path('tools/trashnavi/SPEC.md')
          s = spec.read_text()
          wave15 = '- 滋賀県 大津市 — `/tools/trashnavi/shiga/otsu/`\n\n'
          wave16 = ('Wave 16では、供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から松江市を選定した。'
                    '松江市公式のごみ分別導線を現行ページへ更新し、令和8年度家庭ごみ収集日程と粗大ごみ回収申込み案内を追加して、preferred candidateへ引き上げた。'
                    'data enrichment検証後、公開対象を **23自治体** とする。\n\n'
                    '- 島根県 松江市 — `/tools/trashnavi/shimane/matsue/`\n\n')
          if wave15 not in s: raise SystemExit('SPEC Wave15 anchor missing')
          s = s.replace(wave15, wave15 + wave16, 1)

          baseline16 = ('### Wave 16 verified coverage baseline\n\n'
                        '2026-09-14のWave 16 CI基準値は次のとおり。\n\n'
                        '- municipalities: 1,916\n'
                        '- records: 2,210 / 2,210 valid HTTP(S)\n'
                        '- municipalities with any waste-specific direct link: 78\n'
                        '- publish candidates (2+ types): 23\n'
                        '- preferred candidates (3+ types): 23\n'
                        '- collection calendar coverage: 23 municipalities\n'
                        '- bulky-waste coverage: 22 municipalities\n'
                        '- drop-off facility coverage: 1 municipality\n'
                        '- waste-app coverage: 1 municipality\n'
                        '- direct-link inventory: 19 datasets / 142 records / 123 unique URLs / 0 invalid URLs\n'
                        '- invalid records: 0\n'
                        '- unknown type labels: 0\n\n')
          anchor = '### Direct-link health monitoring — Phase 4'
          if anchor not in s: raise SystemExit('SPEC direct-link anchor missing')
          s = s.replace(anchor, baseline16 + anchor, 1)
          s = s.replace('- [x] 公開22自治体をmanifest allowlistで管理する。','- [x] 公開23自治体をmanifest allowlistで管理する。')
          s = s.replace('- [x] generator `--check` で22ページの生成driftを検出する。','- [x] generator `--check` で23ページの生成driftを検出する。')
          a15 = '- [x] Wave 15で大津市をpreferred candidateへ引き上げ、自治体pageを公開する。\n'
          a16 = '- [x] Wave 16で松江市をpreferred candidateへ引き上げ、自治体pageを公開する。\n'
          if a15 not in s: raise SystemExit('SPEC acceptance Wave15 anchor missing')
          s = s.replace(a15, a15 + a16, 1)
          e15 = '- `tools/trashnavi/data/direct-waste-links-supply-wave15.json` — 大津市のWave 15 collection-calendar / bulky-waste enrichment。\n'
          e16 = '- `tools/trashnavi/data/direct-waste-links-supply-wave16.json` — 松江市のWave 16 collection-calendar / bulky-waste enrichment。\n'
          if e15 not in s: raise SystemExit('SPEC data evidence Wave15 anchor missing')
          s = s.replace(e15, e15 + e16, 1)
          p15 = '- `tools/trashnavi/shiga/otsu/index.html` — Wave 15 municipality page。\n'
          p16 = '- `tools/trashnavi/shimane/matsue/index.html` — Wave 16 municipality page。\n'
          if p15 not in s: raise SystemExit('SPEC page evidence Wave15 anchor missing')
          s = s.replace(p15, p15 + p16, 1)
          ai_evidence = '- `tools/trashnavi/ai-reference.json` — 公開自治体pageのmachine-readable discovery index。\n'
          if ai_evidence not in s:
              evidence_anchor = '- `tools/trashnavi/municipality-page-manifest.json` — indexable municipality page allowlist。\n'
              if evidence_anchor not in s: raise SystemExit('SPEC manifest evidence anchor missing')
              s = s.replace(evidence_anchor, evidence_anchor + ai_evidence, 1)
          spec.write_text(s)
          PY
      - name: Generate municipality pages and dedicated sitemap
        run: node tools/trashnavi/scripts/generate-municipality-pages.mjs
      - name: Add Matsue to root sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml'); s=p.read_text(); u='https://nicheworks.app/tools/trashnavi/shimane/matsue/'
          if f'<loc>{u}</loc>' not in s:
              block=f'  <url>\n    <loc>{u}</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>\n'
              if '</urlset>' not in s: raise SystemExit('root sitemap close missing')
              p.write_text(s.replace('</urlset>', block+'</urlset>', 1))
          if p.read_text().count(f'<loc>{u}</loc>') != 1: raise SystemExit('Matsue sitemap entry count != 1')
          PY
      - name: Verify Matsue and machine-readable publication contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('tools/trashnavi/shimane/matsue/index.html').read_text()
          required=[
            ('3 official cards',s.count('class="official-link-card"')==3),
            ('canonical','https://nicheworks.app/tools/trashnavi/shimane/matsue/' in s),
            ('2026 calendar callout','2026年の収集カレンダー' in s),
            ('sorting current','https://www.city.matsue.lg.jp/kurashi_tetsuzuki/gomi_kankyo_pet/6/2/index.html' in s),
            ('no legacy sorting','gomi_recycle/index.html' not in s),
            ('calendar current','https://www.city.matsue.lg.jp/kurashi_tetsuzuki/gomi_kankyo_pet/6/R8gominittei/index.html' in s),
            ('bulky current','https://www.city.matsue.lg.jp/soshikikarasagasu/kankyoenergybu_recycletoshisuishinka/5/5-2/244.html' in s),
            ('PR block','ごみ出し・片付け用品 [PR]' in s),
          ]
          bad=[k for k,v in required if not v]
          if bad: raise SystemExit('Matsue page contract failed: '+', '.join(bad))
          ai=json.loads(Path('tools/trashnavi/ai-reference.json').read_text())
          if ai.get('published_municipality_count') != 23: raise SystemExit('AI reference count != 23')
          rows=[x for x in ai.get('municipalities',[]) if str(x.get('lgcode'))=='322016']
          if len(rows)!=1 or rows[0].get('url')!='https://nicheworks.app/tools/trashnavi/shimane/matsue/': raise SystemExit('AI reference Matsue entry invalid')
          if len(ai.get('municipalities',[])) != 23: raise SystemExit('AI reference municipality list != 23')
          print('Matsue publication contract verified: 3 cards, no legacy URL, AI index 23/23')
          PY
      - name: Required TrashNavi audits
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit publication output and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap-trashnavi.xml sitemap.xml tools/trashnavi/SPEC.md tools/trashnavi/index.html tools/trashnavi/municipality-page-manifest.json tools/trashnavi/ai-reference.json tools/trashnavi/scripts/check-affiliate-contract.mjs tools/trashnavi/scripts/generate-municipality-pages.mjs tools/trashnavi/shimane/matsue/index.html
          git commit -m 'Publish Matsue as 23rd TrashNavi municipality page'
          git rm .github/workflows/trashnavi-wave16-publication-temp.yml
          git commit -m 'Remove temporary TrashNavi Wave 16 publication workflow'
          git push origin HEAD:${{ github.ref_name }}
