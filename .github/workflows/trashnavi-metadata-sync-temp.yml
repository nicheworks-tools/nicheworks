name: TrashNavi metadata sync temp
on:
  push:
    branches:
      - fix/trashnavi-metadata-by-available-types-20260915
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trashnavi-metadata-by-available-types-20260915
          fetch-depth: 0
      - name: Merge latest main and remove temp workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/trashnavi-metadata-sync-temp.yml
          git add -A
          git commit -m 'Remove TrashNavi metadata sync workflow'
          git push origin HEAD:fix/trashnavi-metadata-by-available-types-20260915
