name: ManualFinder OnePlus global English twelve PDF candidate gate
on:
  pull_request:
    paths:
      - 'tools/manual-finder/**'
      - '.github/workflows/manualfinder-oneplus-global-pdf-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oneplus-official-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 12 manufacturer PDF identity fixtures
        run: node tools/manual-finder/tests/oneplus-global-english-pdf-probe.test.mjs
      - name: Download all 12 OnePlus official PDFs and validate exact model and doc type
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; fi
          node tools/manual-finder/scripts/oneplus-global-english-pdf-probe.mjs
