name: One-shot normalize Earth staging diff

on:
  push:
    branches:
      - chore/adsense-earth-staged-v2-20260914

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize diff
        run: node scripts/_tmp-normalize-earth-stage-diff.mjs
      - name: Validate contracts
        run: |
          node scripts/audit-publishing-mode.mjs
          node scripts/check-tool-spec-contract.mjs
          node scripts/check-tool-spec-coverage.mjs
          node scripts/check-tool-quality-contract.mjs
          node scripts/check-monetization-classification.mjs
          node scripts/check-common-support-contract.mjs
          node scripts/check-seo-public-url-contract.mjs
          node scripts/check-seo-indexable-url-identity.mjs
          node scripts/audit-seo.mjs --strict
      - name: Commit normalized validated state
        run: |
          rm -f scripts/_tmp-normalize-earth-stage-diff.mjs
          rm -f .github/workflows/_tmp-normalize-earth-stage-diff.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: minimize Earth staging registry and sitemap diff"
          git push origin HEAD:chore/adsense-earth-staged-v2-20260914
