name: Pattern Dictionary Wave 2 publication one-shot

on:
  push:
    branches:
      - feat/pattern-dictionary-wave2-publication-r2-20260916
    paths:
      - '.github/workflows/pattern-dictionary-wave2-publication-one-shot.yml'

permissions:
  contents: write

jobs:
  publish-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave2-publication-r2-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish Wave 2 into canonical runtime
        run: node tools/pattern-dictionary/scripts/publish-wave2.mjs
      - name: Validate publication contracts
        run: |
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/tests/validate.mjs
          node tools/pattern-dictionary/tests/source-verification-test.mjs
          node tools/pattern-dictionary/tests/production-content-test.mjs
          node tools/pattern-dictionary/tests/reference-image-test.mjs
          node tools/pattern-dictionary/tests/wave2-source-verification-test.mjs
          node tools/pattern-dictionary/tests/wave2-production-content-test.mjs
          node tools/pattern-dictionary/tests/wave2-reference-image-test.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node tools/pattern-dictionary/tests/compare-test.mjs
          node tools/pattern-dictionary/tests/seo-detail-test.mjs
          node tools/pattern-dictionary/tests/affiliate-test.mjs
          node tools/pattern-dictionary/tests/browse-mobile-test.mjs
          node tools/pattern-dictionary/tests/canonical-100-test.mjs
          node tools/pattern-dictionary/tests/publication-test.mjs
      - name: Commit publication output and remove one-shot workflow
        run: |
          rm .github/workflows/pattern-dictionary-wave2-publication-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'publish: promote Pattern Dictionary Wave 2 to canonical 40'
          git push origin HEAD:feat/pattern-dictionary-wave2-publication-r2-20260916
