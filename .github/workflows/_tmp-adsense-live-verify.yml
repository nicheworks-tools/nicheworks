name: One-shot live AdSense review verification

on:
  push:
    branches:
      - audit/adsense-live-verify-20260915
    paths:
      - '.github/workflows/_tmp-adsense-live-verify.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live review surface
        shell: bash
        run: |
          set -euo pipefail
          base='https://nicheworks.app'
          work="$(mktemp -d)"
          export work
          trap 'rm -rf "$work"' EXIT

          fetch() {
            local name="$1" url="$2"
            echo "=== $name $url"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -D "$work/$name.headers" -o "$work/$name.body" "$url"
            sed -n '1,30p' "$work/$name.headers"
          }

          fetch root "$base/"
          fetch earth_map "$base/tools/earth-map-suite/"
          fetch earth_alerts "$base/tools/earth-alerts/"
          fetch earth_timeseries "$base/tools/earth-timeseries/"
          fetch pro "$base/tools/command-safety-checker/pro.html"
          fetch dev_template "$base/tools/_template/"
          fetch minimal_template "$base/templates/nw-minimal-base/"
          fetch ads "$base/ads.txt"
          fetch robots "$base/robots.txt"
          fetch sitemap "$base/sitemap.xml"

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const work = process.env.work;
          const read = (name, kind='body') => fs.readFileSync(path.join(work, `${name}.${kind}`), 'utf8');
          const fail = (message) => { throw new Error(message); };
          const assert = (condition, message) => { if (!condition) fail(message); };
          const robotsContent = (html) => {
            const tag = html.match(/<meta\b[^>]*name=["']robots["'][^>]*>/i)?.[0] || '';
            return tag.match(/content=["']([^"']+)["']/i)?.[1]?.toLowerCase().replace(/\s+/g, '') || '';
          };
          const hasAdsense = (html) => /pagead2\.googlesyndication\.com|adsbygoogle/i.test(html);
          const hasAdPlaceholder = (html) => /広告枠（準備中）|>\s*広告枠\s*<|>\s*Ad slot\s*<|YOUR_TOKEN_HERE/i.test(html);
          const hasHeaderNoindex = (headers) => /^x-robots-tag:.*\bnoindex\b/im.test(headers);

          const root = read('root');
          const earthMap = read('earth_map');
          const earthMapHeaders = read('earth_map', 'headers');
          assert(!hasHeaderNoindex(earthMapHeaders), 'Earth Map Suite must not be HTTP-noindexed');
          assert(robotsContent(earthMap).includes('index') && robotsContent(earthMap).includes('follow') && !robotsContent(earthMap).includes('noindex'), 'Earth Map Suite must be HTML index,follow');
          assert(!hasAdPlaceholder(earthMap), 'Earth Map Suite still exposes ad/template placeholder UI');
          assert(!hasAdPlaceholder(root), 'Homepage still exposes ad/template placeholder UI');

          for (const name of ['earth_alerts', 'earth_timeseries']) {
            const body = read(name);
            const headers = read(name, 'headers');
            assert(hasHeaderNoindex(headers), `${name} must remain HTTP-noindex`);
            assert(robotsContent(body) === 'noindex,nofollow', `${name} must remain HTML noindex,nofollow`);
            assert(!hasAdsense(body), `${name} must not load AdSense`);
          }

          const pro = read('pro');
          assert(robotsContent(pro) === 'noindex,follow', 'Pro support page must be HTML noindex,follow');
          assert(!hasAdsense(pro), 'Pro support page must not load AdSense');

          for (const name of ['dev_template', 'minimal_template']) {
            const body = read(name);
            assert(robotsContent(body) === 'noindex,nofollow', `${name} must be HTML noindex,nofollow`);
            assert(!hasAdsense(body), `${name} must not load AdSense`);
          }

          const ads = read('ads');
          const robots = read('robots');
          const sitemap = read('sitemap');
          assert(ads.includes('google.com, pub-9879006623791275, DIRECT, f08c47fec0942fa0'), 'ads.txt publisher line missing');
          assert(robots.includes('Sitemap: https://nicheworks.app/sitemap.xml'), 'robots.txt sitemap declaration missing');
          for (const forbidden of [
            'https://nicheworks.app/tools/earth-alerts/',
            'https://nicheworks.app/tools/earth-timeseries/',
            'https://nicheworks.app/billing/success.html',
            'https://nicheworks.app/billing/cancel.html'
          ]) assert(!sitemap.includes(forbidden), `sitemap still contains ${forbidden}`);
          assert(!/<loc>https:\/\/nicheworks\.app\/tools\/[^<]*\/pro(?:\.html|\/)/i.test(sitemap), 'sitemap still contains an HTTP-noindex Pro URL');

          console.log('LIVE_ADSENSE_REVIEW_SURFACE_OK');
          NODE
