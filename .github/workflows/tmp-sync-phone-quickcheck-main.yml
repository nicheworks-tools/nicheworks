name: Temporary Phone QuickCheck main sync

on:
  push:
    branches:
      - feat/phone-quickcheck-public-launch-20260913
    paths:
      - .github/workflows/tmp-sync-phone-quickcheck-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-quickcheck-public-launch-20260913
          fetch-depth: 0
      - name: Merge latest main and resolve maintained files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            printf '%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(MONETIZATION_CLASSIFICATION_87.json|sitemap.xml)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            git checkout --ours MONETIZATION_CLASSIFICATION_87.json
            git checkout --theirs sitemap.xml
            node <<'NODE'
          const fs = require('fs');
          const path = 'sitemap.xml';
          let text = fs.readFileSync(path, 'utf8');
          const url = 'https://nicheworks.app/tools/phone-quickcheck/';
          if (!text.includes(`<loc>${url}</loc>`)) {
            const entry = `  <url>\n    <loc>${url}</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>\n`;
            text = text.replace('</urlset>', `${entry}</urlset>`);
            fs.writeFileSync(path, text);
          }
          NODE
            git add MONETIZATION_CLASSIFICATION_87.json sitemap.xml
            git commit --no-edit
          fi
          rm .github/workflows/tmp-sync-phone-quickcheck-main.yml
          git add -A
          git commit -m "Sync Phone QuickCheck launch with latest main"
          git push origin HEAD:feat/phone-quickcheck-public-launch-20260913
