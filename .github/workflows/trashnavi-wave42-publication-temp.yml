name: TrashNavi Wave42 publication temporary
on:
  push:
    branches:
      - feat/trashnavi-wave42-publication-20260917
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave42-publication-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and validate Wave42 publication
        run: node tools/trashnavi/scripts/wave42-publish-temp.mjs
