name: Minutes to Ops product-scoped staging check

on:
  pull_request:
    paths:
      - 'tools/minutes-to-ops/**'
      - 'docs/tools/minutes-to-ops.md'
      - 'docs/billing/pro-product-contracts-wave8.md'
      - 'docs/billing/nicheworks-pro-bundle-contract.md'
      - 'MONETIZATION_CLASSIFICATION_87.json'
      - 'scripts/check-minutes-to-ops-product-scoped-staging.mjs'
      - 'assets/nw-product-scoped-controller.mjs'
      - '.github/workflows/minutes-to-ops-product-scoped-staging-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check tools/minutes-to-ops/app.js
          node --check tools/minutes-to-ops/pro-bridge.js
          node --check tools/minutes-to-ops/product-scoped-controller.mjs
          node --check scripts/check-minutes-to-ops-product-scoped-staging.mjs
      - name: Minutes to Ops bundle boundary contracts
        run: node scripts/check-minutes-to-ops-product-scoped-staging.mjs
