name: Product-scoped controller core check

on:
  pull_request:
    paths:
      - 'assets/nw-product-scoped-controller.mjs'
      - 'tools/logistics-compliance-kit-jp/product-scoped-controller.mjs'
      - 'tools/command-safety-checker/product-scoped-controller.mjs'
      - 'scripts/check-product-scoped-controller-core.mjs'
      - '.github/workflows/product-scoped-controller-core-check.yml'
  push:
    branches:
      - main
    paths:
      - 'assets/nw-product-scoped-controller.mjs'
      - 'tools/logistics-compliance-kit-jp/product-scoped-controller.mjs'
      - 'tools/command-safety-checker/product-scoped-controller.mjs'
      - 'scripts/check-product-scoped-controller-core.mjs'
      - '.github/workflows/product-scoped-controller-core-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check assets/nw-product-scoped-controller.mjs
          node --check tools/logistics-compliance-kit-jp/product-scoped-controller.mjs
          node --check tools/command-safety-checker/product-scoped-controller.mjs
          node --check scripts/check-product-scoped-controller-core.mjs
      - name: Shared product-scoped controller contracts
        run: node scripts/check-product-scoped-controller-core.mjs
