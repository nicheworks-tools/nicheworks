name: ManualFinder Google Pixel manufacturer source probe
on:
  pull_request:
    paths:
      - 'tools/manual-finder/scripts/google-pixel-source-probe.mjs'
      - '.github/workflows/manualfinder-google-pixel-coverage-pass.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixel-index-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/manual-finder/scripts/google-pixel-source-probe.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manualfinder-pixel-source-probe
          path: manualfinder-google-pixel-probe/*.json
          if-no-files-found: warn
