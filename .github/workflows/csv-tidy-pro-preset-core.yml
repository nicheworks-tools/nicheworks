name: CSV Tidy Pro preset core

on:
  pull_request:
    paths:
      - 'tools/csv-tidy/pro/**'
      - 'tools/csv-tidy/tests/pro-preset-core.mjs'
      - '.github/workflows/csv-tidy-pro-preset-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preset-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate pure CSV Tidy Pro preset model
        run: node tools/csv-tidy/tests/pro-preset-core.mjs
      - name: Check worktree unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
