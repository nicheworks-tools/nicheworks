name: Reconcile core sync

on:
  push:
    branches:
      - feat/reconcile-v1-20260912
    paths:
      - .github/workflows/reconcile-core-sync.yml

permissions:
  contents: write

jobs:
  sync-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reconcile-v1-20260912
          fetch-depth: 0

      - name: Sync completed vendor state in core docs and UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'tools/reconcile/index.html': [
              (
                'CSVは動作中です。XLSXアダプターは実装済みで、検証済み固定版ライブラリ本体の同梱だけを残しています。',
                'CSV/XLSXともローカル処理です。XLSXは検証済みSheetJS CE 0.20.3 miniをローカル同梱し、ランタイムCDNを使用しません。'
              ),
              (
                'CSV is active. The XLSX adapter is implemented and only the verified pinned vendor payload remains to be added.',
                'CSV and XLSX are processed locally. XLSX uses a verified locally vendored SheetJS CE 0.20.3 mini build with no runtime CDN dependency.'
              ),
            ],
            'tools/reconcile/usage.html': [
              (
                'このページは開発ブランチ用です。CSV照合コアと高度照合エンジンは実装済みです。XLSXはアダプターまで実装済みですが、検証済みSheetJS CE 0.20.3 mini本体の同梱前なのでブラウザではまだ利用できません。Pro機能も課金接続前のためロックされています。',
                'このページは開発ブランチ用です。CSV照合コア、高度照合エンジン、XLSX読込/出力は実装済みです。XLSXは検証済みSheetJS CE 0.20.3 miniをローカル同梱し、ランタイムCDNを使用しません。Pro機能は課金接続前のためロックされています。'
              ),
              (
                '複数worksheetの選択、Excel日付/数値の読み込み、Summary / Matches / Candidates / A Only / B Only / Duplicates / Conflicts の7シートレポート生成まで実装済みです。SheetJS CE 0.20.3のmini buildを固定し、ランタイムCDNは使用しません。ライセンスとchecksum契約は同梱済みで、残りはSHA-256検証済みJS本体のvendor commitと実ブラウザread/write確認です。',
                '複数worksheetの選択、Excel日付/数値の読み込み、Summary / Matches / Candidates / A Only / B Only / Duplicates / Conflicts の7シートレポート生成まで実装済みです。SheetJS CE 0.20.3のmini buildをローカル固定し、ランタイムCDNは使用しません。vendor本体はsize / SHA-256 / Git blob SHA / runtime versionを照合済みで、実vendorを使ったXLSX write→read再読込テストも通過しています。公開前には実ブラウザUIで最終スモーク確認します。'
              ),
            ],
            'tools/reconcile/app.mjs': [
              (
                'XLSX処理ライブラリ本体はまだこの開発ブランチへ同梱されていません。CSVは利用できます。',
                'XLSX処理ライブラリを読み込めませんでした。ローカルvendorの読み込みに失敗したためXLSX処理を停止しました。'
              ),
              (
                'The XLSX vendor payload has not been committed to this development branch yet. CSV remains available.',
                'The XLSX library could not be loaded. XLSX processing stopped because the local vendor payload failed to load.'
              ),
            ],
            'tools/reconcile/SPEC.md': [
              (
                'CSV input is operational. XLSX parsing/export code is present, including worksheet selection and seven-sheet report generation, but the pinned SheetJS vendor file is not yet committed. Therefore XLSX remains unavailable in the browser until that vendor file is added.',
                'CSV and XLSX parsing/export code is present, including worksheet selection and seven-sheet report generation. The pinned SheetJS CE 0.20.3 mini vendor is committed locally and verified by exact size, SHA-256, Git blob SHA, runtime version, and a real-vendor XLSX write/read round-trip test.'
              ),
              (
                '- XLSX browser behavior is not declared complete until the pinned local vendor file is committed and browser-tested.',
                '- The pinned local XLSX vendor must pass byte-level verification and real-vendor write/read round-trip tests; final browser UI smoke validation remains a publication-readiness check.'
              ),
              (
                '- `tools/reconcile/tests/xlsx-adapter.test.mjs`\n',
                '- `tools/reconcile/tests/xlsx-adapter.test.mjs`\n- `tools/reconcile/tests/xlsx-real-vendor.test.mjs`\n- `tools/reconcile/vendor/xlsx.mini.min.js`\n'
              ),
            ],
            'tools/reconcile/vendor/README.md': [
              ('## Required verification before commit', '## Verification record'),
              (
                '1. Obtain the exact `xlsx.mini.min.js` bytes whose SHA-256 is `0cb353f830d7288385492c83d277b058ddeac664ca51cf1393aa1fd3e2b70939`.\n2. Verify file size is `279523` bytes.\n3. Verify SHA-256 before creating the repository blob.\n4. Preserve the upstream copyright/license header.\n5. Add the applicable Apache-2.0 license/attribution alongside the vendored file before publication.\n6. Run `tools/reconcile/tests/xlsx-adapter.test.mjs` and real browser XLSX read/write validation.\n',
                'The committed payload was fetched from the pinned SheetJS CE 0.20.3 distribution and verified before commit: size `279523` bytes, SHA-256 `0cb353f830d7288385492c83d277b058ddeac664ca51cf1393aa1fd3e2b70939`, Git blob SHA `5bf1c223ce4bd59685ba711b77dce6da7a9747b8`, and runtime version `0.20.3`. The upstream copyright/license header is preserved and Apache-2.0 attribution remains alongside the vendor file.\n\nAutomated tests cover the adapter contract plus a real-vendor XLSX write/read round trip and seven-sheet report re-read. Final browser UI smoke validation remains part of publication readiness.\n'
              ),
            ],
            '.agent/plans/20260912-reconcile-v1.md': [
              (
                '- [ ] Enrich CSV/XLSX audit exports with selected original A/B values and full reconciliation context.',
                '- [x] Enrich CSV/XLSX audit exports with selected original A/B values and full reconciliation context.'
              ),
              (
                '- [ ] Commit the checksum-verified `xlsx.mini.min.js` bytes; this is the remaining isolated Wave C dependency blocker.',
                '- [x] Commit the checksum-verified `xlsx.mini.min.js` bytes and verify size / SHA-256 / Git blob SHA / runtime version.'
              ),
              (
                '- [ ] Run final browser validation with the real XLSX vendor present.',
                '- [x] Run real-vendor XLSX write/read round-trip and seven-sheet report re-read tests.\n- [ ] Run final browser UI smoke validation before publication.'
              ),
              (
                '- Apache-2.0 license and a vendor provenance notice are already committed under `tools/reconcile/vendor/`; only the verified JS payload remains to be added.',
                '- Apache-2.0 license, vendor provenance notice, and the checksum-verified SheetJS CE 0.20.3 mini payload are committed under `tools/reconcile/vendor/`.'
              ),
              (
                '- The current execution environment cannot directly clone/download external GitHub/CDN bytes through its shell because outbound DNS is unavailable. Cross-repository Git object SHA reuse was also rejected by GitHub. An unverified or retyped vendor payload is deliberately not being committed.',
                '- The verified vendor payload was fetched on a GitHub-hosted runner from the pinned SheetJS CE 0.20.3 distribution, checked against size `279523`, SHA-256 `0cb353f830d7288385492c83d277b058ddeac664ca51cf1393aa1fd3e2b70939`, Git blob SHA `5bf1c223ce4bd59685ba711b77dce6da7a9747b8`, and runtime version `0.20.3`, then committed only after all Reconcile tests passed.'
              ),
              (
                '- XLSX adapter tests use an API-compatible fake and cover worksheet parsing and workbook/report construction without claiming real-vendor browser validation.',
                '- XLSX adapter tests cover the API contract, and `xlsx-real-vendor.test.mjs` validates the committed real vendor with XLSX write/read, worksheet selection, seven-sheet report generation, and workbook re-read. Final browser UI smoke validation remains separate publication-readiness work.'
              ),
            ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one occurrence, found {count}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify pinned vendor
        shell: bash
        run: |
          set -euo pipefail
          target='tools/reconcile/vendor/xlsx.mini.min.js'
          test "$(wc -c < "$target" | tr -d ' ')" = '279523'
          test "$(sha256sum "$target" | awk '{print $1}')" = '0cb353f830d7288385492c83d277b058ddeac664ca51cf1393aa1fd3e2b70939'
          test "$(git hash-object "$target")" = '5bf1c223ce4bd59685ba711b77dce6da7a9747b8'
          grep -F 'version="0.20.3"' "$target" >/dev/null

      - name: Assert no runtime SheetJS CDN dependency
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'cdn\.sheetjs\.com|https?://[^ ]*sheetjs' tools/reconcile/*.mjs tools/reconcile/*.html; then
            echo 'Runtime SheetJS network reference found' >&2
            exit 1
          fi

      - name: Run all Reconcile tests
        run: node --test tools/reconcile/tests/*.test.mjs

      - name: Commit synchronized core state and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reconcile-core-sync.yml
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add tools/reconcile .agent/plans/20260912-reconcile-v1.md .github/workflows/reconcile-core-sync.yml
          git diff --cached --check
          git commit -m 'docs(reconcile): sync verified XLSX core state'
          git push origin HEAD:feat/reconcile-v1-20260912
