name: Pattern Dictionary canonical 100 freeze

on:
  push:
    branches:
      - feat/pattern-dictionary-canonical-100-taxonomy-20260915
    paths:
      - '.github/workflows/pattern-dictionary-canonical-100-freeze.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-canonical-100-taxonomy-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile relationship-driven entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tools/pattern-dictionary/data/canonical-100-expansion.json')
          d=json.loads(p.read_text())
          replacements={
            'candy-stripe': {"ordinal":31,"wave":2,"id":"koushi","names":{"ja":"格子","en":"Koushi"},"family":"japanese","term_scope":"generic-pattern","scope_note":"A broad Japanese lattice/check family; production content must distinguish it from the alternating filled squares of Ichimatsu."},
            'brick-pattern': {"ordinal":48,"wave":3,"id":"hexagon","names":{"ja":"六角形柄","en":"Hexagon Pattern"},"family":"geometric","term_scope":"generic-pattern"},
            'maze': {"ordinal":50,"wave":3,"id":"hishi","names":{"ja":"菱文様","en":"Hishi"},"family":"japanese","term_scope":"named-motif","scope_note":"A Japanese diamond/rhombus motif family; production content must distinguish generic diamond geometry from Japanese hishi usage."},
            'rosette': {"ordinal":60,"wave":3,"id":"ivy","names":{"ja":"アイビー柄","en":"Ivy Pattern"},"family":"floral","term_scope":"generic-motif"}
          }
          found=set()
          out=[]
          for e in d['entries']:
            if e['id'] in replacements:
              found.add(e['id'])
              out.append(replacements[e['id']])
            else:
              out.append(e)
          if found != set(replacements):
            raise SystemExit(f'missing replacement targets: {set(replacements)-found}')
          d['entries']=out
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate canonical 100 taxonomy
        run: |
          node tools/pattern-dictionary/tests/canonical-100-test.mjs
          node tools/pattern-dictionary/tests/affiliate-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
      - name: Persist reconciled freeze and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pattern-dictionary/data/canonical-100-expansion.json
          git rm .github/workflows/pattern-dictionary-canonical-100-freeze.yml
          git commit -m 'data: resolve canonical 100 relationship targets'
          git push origin HEAD:feat/pattern-dictionary-canonical-100-taxonomy-20260915
