name: ManualFinder Dell JP bulk candidate gate
on:
  pull_request:
    paths:
      - 'tools/manual-finder/scripts/dell-jp-catalog-bulk-discovery.mjs'
      - 'tools/manual-finder/tests/dell-jp-catalog-bulk-discovery.test.mjs'
      - '.github/workflows/manualfinder-dell-jp-bulk-candidate.yml'
  workflow_dispatch:
jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/manual-finder/tests/dell-jp-catalog-bulk-discovery.test.mjs
