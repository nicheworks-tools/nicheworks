name: TrashNavi Nara publication one-shot

on:
  push:
    branches:
      - feat/trashnavi-nara-publication-20260913
    paths:
      - '.github/workflows/trashnavi-nara-publication-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-nara-publication-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Nara publication contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const manifestPath = 'tools/trashnavi/municipality-page-manifest.json';
          let manifest = fs.readFileSync(manifestPath, 'utf8');
          const matsuyama = '  {"lgcode":"382019","pref_slug":"ehime","city_slug":"matsuyama","publish":true}';
          const nara = '  {"lgcode":"292010","pref_slug":"nara","city_slug":"nara","publish":true}';
          if (!manifest.includes(nara)) {
            if (!manifest.includes(matsuyama)) throw new Error('Matsuyama manifest anchor missing');
            manifest = manifest.replace(matsuyama, `${matsuyama},\n${nara}`);
            fs.writeFileSync(manifestPath, manifest);
          }

          const genPath = 'tools/trashnavi/scripts/generate-municipality-pages.mjs';
          let gen = fs.readFileSync(genPath, 'utf8');
          gen = gen.replace('if(outputs.length!==14) throw new Error(`municipality page count must be 14; got ${outputs.length}`);', 'if(outputs.length!==15) throw new Error(`municipality page count must be 15; got ${outputs.length}`);');
          if (!gen.includes('outputs.length!==15')) throw new Error('Generator count patch failed');
          fs.writeFileSync(genPath, gen);

          const indexPath = 'tools/trashnavi/index.html';
          let index = fs.readFileSync(indexPath, 'utf8');
          const matsuyamaLink = '<a href="/tools/trashnavi/ehime/matsuyama/">松山市</a>';
          const naraLink = '<a href="/tools/trashnavi/nara/nara/">奈良市</a>';
          if (!index.includes(naraLink)) {
            if (!index.includes(matsuyamaLink)) throw new Error('Matsuyama root-link anchor missing');
            index = index.replace(matsuyamaLink, `${matsuyamaLink}${naraLink}`);
            fs.writeFileSync(indexPath, index);
          }

          const rootSitemapPath = 'sitemap.xml';
          let root = fs.readFileSync(rootSitemapPath, 'utf8');
          const naraUrl = 'https://nicheworks.app/tools/trashnavi/nara/nara/';
          if (!root.includes(`<loc>${naraUrl}</loc>`)) {
            const block = `  <url>\n    <loc>${naraUrl}</loc>\n    <lastmod>2026-09-13</lastmod>\n  </url>\n`;
            if (!root.includes('</urlset>')) throw new Error('Root sitemap closing tag missing');
            root = root.replace('</urlset>', `${block}</urlset>`);
            fs.writeFileSync(rootSitemapPath, root);
          }

          const specPath = 'tools/trashnavi/SPEC.md';
          let spec = fs.readFileSync(specPath, 'utf8');
          const oldWave8 = 'Wave 8では、Wave 7と同じ供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から奈良市を選定した。奈良市公式の2026年度ごみ収集カレンダーと大型ごみ案内を追加し、既存のごみ分別導線と合わせてpreferred candidateへ引き上げた。data enrichment検証は完了し、自治体pageのpublicationは別PRで行う。\n\n- 奈良県 奈良市 — publication pending';
          const newWave8 = 'Wave 8では、Wave 7と同じ供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から奈良市を選定した。奈良市公式の2026年度ごみ収集カレンダーと大型ごみ案内を追加し、既存のごみ分別導線と合わせてpreferred candidateへ引き上げた。data enrichment検証後、公開対象を **15自治体** とする。\n\n- 奈良県 奈良市 — `/tools/trashnavi/nara/nara/`';
          if (spec.includes(oldWave8)) spec = spec.replace(oldWave8, newWave8);
          else if (!spec.includes(newWave8)) throw new Error('Wave 8 SPEC anchor missing');
          spec = spec.replace('- [x] 公開14自治体をmanifest allowlistで管理する。', '- [x] 公開15自治体をmanifest allowlistで管理する。');
          spec = spec.replace('- [x] generator `--check` で14ページの生成driftを検出する。', '- [x] generator `--check` で15ページの生成driftを検出する。');
          spec = spec.replace('- [x] Wave 8で奈良市をpreferred candidateへ引き上げる。自治体page publicationは別PRで閉じる。', '- [x] Wave 8で奈良市をpreferred candidateへ引き上げ、自治体pageを公開する。');
          const matsuyamaEvidence = '- `tools/trashnavi/ehime/matsuyama/index.html` — Wave 7 municipality page。';
          const naraEvidence = '- `tools/trashnavi/nara/nara/index.html` — Wave 8 municipality page。';
          if (!spec.includes(naraEvidence)) {
            if (!spec.includes(matsuyamaEvidence)) throw new Error('Matsuyama evidence anchor missing');
            spec = spec.replace(matsuyamaEvidence, `${matsuyamaEvidence}\n${naraEvidence}`);
          }
          fs.writeFileSync(specPath, spec);
          NODE
      - name: Generate municipality pages
        run: node tools/trashnavi/scripts/generate-municipality-pages.mjs
      - name: Validate publication state
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          node <<'NODE'
          const fs = require('fs');
          const p = 'tools/trashnavi/nara/nara/index.html';
          const s = fs.readFileSync(p, 'utf8');
          const cards = (s.match(/class="official-link-card"/g) || []).length;
          if (cards !== 3) throw new Error(`Nara official-link cards must be 3; got ${cards}`);
          if (!s.includes('https://nicheworks.app/tools/trashnavi/nara/nara/')) throw new Error('Nara canonical missing');
          if (!s.includes('2026年の収集カレンダー')) throw new Error('Nara 2026 calendar callout missing');
          NODE
      - name: Commit generated publication
        shell: bash
        run: |
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add sitemap.xml sitemap-trashnavi.xml tools/trashnavi/SPEC.md tools/trashnavi/index.html tools/trashnavi/municipality-page-manifest.json tools/trashnavi/scripts/generate-municipality-pages.mjs tools/trashnavi/nara/nara/index.html
          git commit -m 'Publish Nara City TrashNavi municipality page'
          git push origin HEAD:feat/trashnavi-nara-publication-20260913
