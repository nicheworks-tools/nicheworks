name: Pattern Dictionary Wave 4 AdSense repair

on:
  push:
    branches:
      - feat/pattern-dictionary-wave4-production-staging-20260916
    paths:
      - .github/workflows/pattern-dictionary-wave4-adsense-fix.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave4-production-staging-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair malformed AdSense loader URLs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('tools/pattern-dictionary')
          bad='https://pagead2.googlesyndication.com/pagead/js?client='
          good='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='
          changed=[]
          for p in list(root.rglob('*.html'))+[root/'scripts'/'publish-wave4.mjs']:
              if not p.exists(): continue
              s=p.read_text()
              if bad in s:
                  p.write_text(s.replace(bad,good))
                  changed.append(str(p))
          print(f'repaired {len(changed)} files')
          for p in changed: print(p)
          if len(changed)!=42:
              raise SystemExit(f'expected 42 repairs (41 outputs + publisher), got {len(changed)}')
          PY
      - name: Run common breakage audit
        run: node scripts/audit-common-breakage.mjs
      - name: Run Pattern Dictionary publication suite
        run: |
          set -euo pipefail
          tests=(validate.mjs source-verification-test.mjs production-content-test.mjs reference-image-test.mjs search-test.mjs compare-test.mjs affiliate-test.mjs canonical-100-test.mjs browse-mobile-test.mjs seo-detail-test.mjs publication-test.mjs wave2-source-verification-test.mjs wave2-production-content-test.mjs wave2-reference-image-test.mjs wave3-source-verification-test.mjs wave4-source-verification-test.mjs)
          for test in "${tests[@]}"; do node "tools/pattern-dictionary/tests/$test"; done
          git diff --check
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name nicheworks-tools
          git config user.email nicheworks.tools@gmail.com
          git add tools/pattern-dictionary
          git commit -m "Pattern Dictionary: fix AdSense loader URLs in Wave 4 publication"
          git push origin HEAD:feat/pattern-dictionary-wave4-production-staging-20260916
