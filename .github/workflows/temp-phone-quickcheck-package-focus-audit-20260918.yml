name: Temp Phone QuickCheck package focus audit 20260918

on:
  pull_request:
    paths:
      - '.github/workflows/temp-phone-quickcheck-package-focus-audit-20260918.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print package unknowns and focus records
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('tools/phone-quickcheck/data/phones.json','utf8'));
          const adapter = data.phones.filter(p => p.included?.adapter === 'unknown');
          const cable = data.phones.filter(p => p.included?.cable === 'unknown');
          console.log('ADAPTER_COUNT=' + adapter.length);
          console.log('ADAPTER_IDS=' + JSON.stringify(adapter.map(p => p.id)));
          console.log('CABLE_COUNT=' + cable.length);
          console.log('CABLE_IDS=' + JSON.stringify(cable.map(p => p.id)));
          const ids = ['motorola-razr-50-ultra','motorola-edge-50-pro','motorola-razr-40','zte-nubia-flip-5g'];
          for (const id of ids) {
            const p = data.phones.find(x => x.id === id);
            console.log('FOCUS=' + JSON.stringify({id, found: !!p, market:p?.market ?? null, included:p?.included ?? null, specificationsUrl:p?.sources?.specificationsUrl ?? null, manualUrl:p?.sources?.manualUrl ?? null, releaseUrl:p?.sources?.releaseUrl ?? null}));
          }
          NODE
