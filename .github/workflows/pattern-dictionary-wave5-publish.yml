name: Pattern Dictionary Wave 5 publish
on:
  push:
    branches: [feat/pattern-dictionary-wave5-production-staging-20260916]
    paths: [.github/workflows/pattern-dictionary-wave5-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave5-production-staging-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Migrate final canonical-100 test contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('tools/pattern-dictionary')
          tests=root/'tests'
          qold="['ajrakh','bandhani','baroque-scroll','basketweave','batik','botanical-print','breton-stripe','chinoiserie','chintz','flame-stitch','herringbone','ikat','ivy','jacobean-floral','kalamkari','kanoko','kilim','koushi','madras-check','moire','moroccan-trellis','ogee','prince-of-wales-check','regimental-stripe','same-komon','shibori','swiss-dot','toile-de-jouy'].sort()"
          qnew="['ajrakh','bandhani','baroque-scroll','basketweave','batik','botanical-print','breton-stripe','chinoiserie','chintz','flame-stitch','herringbone','ikat','ivy','jacobean-floral','kalamkari','kanoko','kilim','koushi','madras-check','moire','moroccan-trellis','ogee','prince-of-wales-check','regimental-stripe','same-komon','shibori','swiss-dot','toile-de-jouy','suzani','kente','bogolan','adire','kuba-cloth','sashiko','kantha','otomi-embroidery','african-wax-print','block-print','tie-dye','marbling','terrazzo'].sort()"
          def edit(name,repls):
              p=tests/name; s=p.read_text()
              for a,b in repls:
                  if a not in s: print(f'WARN {name}: token not found: {a[:70]}')
                  s=s.replace(a,b)
              p.write_text(s)
          edit('production-content-test.mjs',[("canonical.length!==80","canonical.length!==100"),("expected runtime 80","expected runtime 100"),("prod.patterns.length!==80","prod.patterns.length!==100"),("expected 80 production records","expected 100 production records"),("prod.policy?.record_count!==80","prod.policy?.record_count!==100"),("record_count must be 80","record_count must be 100"),(qold,qnew),("80/80 production content","100/100 production content")])
          edit('source-verification-test.mjs',[("canonical.length!==80","canonical.length!==100"),("must be 80","must be 100"),("runtime canonical 80","runtime canonical 100"),("runtime canonical set must be 80","runtime canonical set must be 100"),(qold,qnew),("exactly 80 published patterns","exactly 100 published patterns"),("verified=${80-qualified.length}","verified=${100-qualified.length}")])
          edit('reference-image-test.mjs',[("patterns.length!==80","patterns.length!==100"),("contain 80 patterns","contain 100 patterns"),("images.length!==80||records.length!==80","images.length!==100||records.length!==100"),("expected 80 image/review records","expected 100 image/review records"),("runtime 80","runtime 100"),("80/80 published patterns","100/100 published patterns")])
          edit('seo-detail-test.mjs',[("ids.length!==80","ids.length!==100"),("expected 80 published patterns","expected 100 published patterns"),("160/160 JA+EN","200/200 JA+EN")])
          edit('browse-mobile-test.mjs',[("patterns.length!==80","patterns.length!==100"),("expected 80 patterns","expected 100 patterns"),("size!==80","size!==100"),("before the 80-image browse grid","before the 100-image browse grid"),("160 detail wrappers","200 detail wrappers")])
          edit('validate.mjs',[("p.length!==80","p.length!==100"),("expected 80 patterns","expected 100 patterns"),("size!==80","size!==100"),("detailCount!==160","detailCount!==200"),("expected 160 static detail pages","expected 200 static detail pages"),("80 published records, 160 static detail pages","100 published records, 200 static detail pages")])
          edit('publication-test.mjs',[("canonical.length!==80","canonical.length!==100"),("must be 80","must be 100"),("record_count!==80","record_count!==100"),("verified 80","verified 100"),("prod.patterns.length!==80","prod.patterns.length!==100"),("expected 80 production patterns","expected 100 production patterns"),("refs.images.length!==80","refs.images.length!==100"),("verified 80","verified 100"),(qold,qnew),("detailCount!==160","detailCount!==200"),("expected 160 detail pages","expected 200 detail pages"),("現在の80件","現在の100件"),("The current 80 entries","The current 100 entries"),("80件の検証済みデータ","100件の検証済みデータ"),("80-record verified dataset","100-record verified dataset"),("80/80 patterns","100/100 patterns"),("160/160 detail pages","200/200 detail pages"),("80-pattern publication state","100-pattern publication state")])
          p=tests/'compare-test.mjs'; s=p.read_text(); s=s.replace('patterns.length!==80','patterns.length!==100').replace('runtime must be 80','runtime must be 100').replace('data.guides.length!==58','data.guides.length!==72').replace('expected 58 published compare guides','expected 72 published compare guides').replace("'kalamkari--chinoiserie']","'kalamkari--chinoiserie','suzani--otomi-embroidery','kente--kuba-cloth','bogolan--adire','adire--tie-dye','sashiko--kantha','african-wax-print--batik','block-print--kalamkari','zebra-print--tiger-print','snake-print--giraffe-print','cow-print--dalmatian-spots','tie-dye--shibori','marbling--moire','terrazzo--dalmatian-spots','camouflage--cow-print']").replace('58 published compare guides cover original through Wave 4 confusion pairs','72 published compare guides cover original through Wave 5 confusion pairs'); p.write_text(s)
          p=tests/'affiliate-test.mjs'; s=p.read_text(); s=s.replace('patterns.length!==80','patterns.length!==100').replace('contain 80 patterns','contain 100 patterns').replace('published 80 patterns','published 100 patterns').replace('exactly the published 80 patterns','exactly the published 100 patterns')
          anchor="const wave4=new Set(['baroque-scroll','chinoiserie','flame-stitch','tree-of-life','moire','yagasuri','sayagata','uroko','tatewaku','kagome','kanoko','hanabishi','same-komon','nami-chidori','tomoe','shibori','batik','bandhani','ajrakh','kalamkari']);\nfor(const id of wave4)if(offers.filter(x=>x.pattern_id===id).length!==3)throw new Error(`${id}: Wave 4 must publish exactly three maintained commerce intents`);"
          addition=anchor+"\nconst wave5=new Set(['suzani','kente','bogolan','adire','kuba-cloth','sashiko','kantha','otomi-embroidery','african-wax-print','block-print','zebra-print','tiger-print','snake-print','cow-print','giraffe-print','dalmatian-spots','camouflage','tie-dye','marbling','terrazzo']);\nfor(const id of wave5)if(offers.filter(x=>x.pattern_id===id).length!==3)throw new Error(`${id}: Wave 5 must publish exactly three maintained commerce intents`);"
          if anchor not in s: raise SystemExit('affiliate Wave 4 anchor not found')
          s=s.replace(anchor,addition).replace("if(offers.length<225)throw new Error(`80-pattern publication should add 60 Wave 4 links to the canonical-60 set; got only ${offers.length}`);","if(offers.length!==305)throw new Error(`100-pattern publication should contain 305 maintained links after adding exactly 60 Wave 5 links; got ${offers.length}`);").replace('across 80 published patterns, including exactly 60 Wave 4 links','across 100 published patterns, including exactly 60 Wave 5 links'); p.write_text(s)
          (tests/'canonical-100-test.mjs').write_text("""import fs from 'node:fs';\nimport path from 'node:path';\nimport {fileURLToPath} from 'node:url';\nconst root=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');\nconst current=JSON.parse(fs.readFileSync(path.join(root,'data','patterns.json'),'utf8'));\nconst expansion=JSON.parse(fs.readFileSync(path.join(root,'data','canonical-100-expansion.json'),'utf8'));\nif(current.length!==100)throw new Error(`canonical published set must be exactly 100, got ${current.length}`);\nif(new Set(current.map(x=>x.id)).size!==100)throw new Error('published canonical IDs must be unique');\nif(expansion.schema!=='pattern-dictionary-canonical-100-v1')throw new Error('unexpected canonical-100 schema');\nif(expansion.base?.published_count!==100||expansion.policy?.expansion_count!==0||expansion.policy?.target_total!==100)throw new Error('canonical-100 completion counts are inconsistent');\nif(expansion.policy?.pattern_atlas!=='out-of-scope')throw new Error('Pattern Atlas must remain out of scope');\nif((expansion.entries||[]).length!==0)throw new Error('completed canonical 100 must not retain planned entries');\nconst ids=new Set(current.map(x=>x.id));\nfor(const id of ['suzani','kente','bogolan','adire','kuba-cloth','sashiko','kantha','otomi-embroidery','african-wax-print','block-print','zebra-print','tiger-print','snake-print','cow-print','giraffe-print','dalmatian-spots','camouflage','tie-dye','marbling','terrazzo'])if(!ids.has(id))throw new Error(`${id}: final Wave 5 entry missing from canonical 100`);\nfor(const p of current)for(const key of ['similar','often_confused_with'])for(const id of p.relationships?.[key]||[])if(!ids.has(id))throw new Error(`${p.id}: unresolved relationship target ${id}`);\nconsole.log('OK: frozen canonical 100 is complete: 100 published, 0 planned, and all relationship targets resolve.');\n""")
          (tests/'wave5-source-verification-test.mjs').write_text("""import fs from 'node:fs';\nimport path from 'node:path';\nimport {fileURLToPath} from 'node:url';\nconst root=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');\nconst published=JSON.parse(fs.readFileSync(path.join(root,'data','patterns.json'),'utf8'));\nconst ledger=JSON.parse(fs.readFileSync(path.join(root,'data','wave5-source-verification.json'),'utf8'));\nconst expected=['suzani','kente','bogolan','adire','kuba-cloth','sashiko','kantha','otomi-embroidery','african-wax-print','block-print','zebra-print','tiger-print','snake-print','cow-print','giraffe-print','dalmatian-spots','camouflage','tie-dye','marbling','terrazzo'];\nif(![80,100].includes(published.length))throw new Error(`Wave 5 provenance expects runtime 80 before publication or 100 after, got ${published.length}`);\nif(ledger.phase!=='wave5-source-verification'||ledger.wave!==5||JSON.stringify(ledger.ordinal_range)!==JSON.stringify([81,100]))throw new Error('unexpected Wave 5 source metadata');\nconst rows=(ledger.patterns||[]).slice().sort((a,b)=>a.ordinal-b.ordinal);if(rows.length!==20)throw new Error(`expected 20 Wave 5 rows, got ${rows.length}`);\nfor(let i=0;i<20;i++){const r=rows[i];if(r.ordinal!==81+i||r.pattern_id!==expected[i])throw new Error(`Wave 5 ordinal/id mismatch at ${81+i}`);if(!['verified','qualified'].includes(r.verification_state)||!r.term_scope?.trim()||!r.structure?.trim())throw new Error(`${r.pattern_id}: incomplete source contract`);if(!r.sources?.length)throw new Error(`${r.pattern_id}: source required`);for(const s of r.sources)if(!s.publisher||!/^https:\\/\\//.test(s.url||'')||!s.supports?.length)throw new Error(`${r.pattern_id}: malformed evidence`);if(r.verification_state==='qualified'&&!r.qualification?.trim())throw new Error(`${r.pattern_id}: qualified term needs qualification`);}\nconst qualified=rows.filter(x=>x.verification_state==='qualified').map(x=>x.pattern_id).sort();const expectedQualified=['suzani','kente','bogolan','adire','kuba-cloth','sashiko','kantha','otomi-embroidery','african-wax-print','block-print','tie-dye','marbling','terrazzo'].sort();if(JSON.stringify(qualified)!==JSON.stringify(expectedQualified))throw new Error(`Wave 5 qualified set changed: ${qualified.join(', ')}`);\nconst urls=new Set(rows.flatMap(x=>x.sources.map(s=>s.url)));if(urls.size<20)throw new Error(`Wave 5 evidence too concentrated: ${urls.size} distinct URLs`);\nif(published.length===100)for(const id of expected)if(!published.some(x=>x.id===id))throw new Error(`${id}: missing from final runtime`);\nconsole.log(`OK: Wave 5 source provenance covers 81-100 exactly; 7 verified / 13 qualified; ${urls.size} distinct evidence URLs; runtime state ${published.length}.`);\n""")
          p=root/'scripts'/'publish-wave5.mjs'; s=p.read_text().replace("affiliate.version=`${today}-wave4`;","affiliate.version=`${today}-wave5`; "); p.write_text(s)
          PY
      - name: Publish Wave 5 transform
        run: node tools/pattern-dictionary/scripts/publish-wave5.mjs
      - name: Run Pattern Dictionary canonical publication tests
        run: |
          set -e
          for f in \
            validate.mjs canonical-100-test.mjs publication-test.mjs production-content-test.mjs source-verification-test.mjs reference-image-test.mjs search-test.mjs compare-test.mjs affiliate-test.mjs seo-detail-test.mjs browse-mobile-test.mjs wave2-production-content-test.mjs wave2-source-verification-test.mjs wave3-source-verification-test.mjs wave4-source-verification-test.mjs wave5-source-verification-test.mjs; do
            echo "=== $f ==="
            node "tools/pattern-dictionary/tests/$f"
          done
      - name: Audit common HTML breakage
        run: node scripts/audit-common-breakage.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit canonical 100 publication
        run: |
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add tools/pattern-dictionary sitemap.xml
          git commit -m "Pattern Dictionary: publish Wave 5 canonical 100"
          git push origin HEAD:feat/pattern-dictionary-wave5-production-staging-20260916
