name: Construction Tools Atlas q013 identity discovery

on:
  push:
    branches:
      - audit/construction-atlas-q013-identity-closure-20260916
    paths:
      - '.github/workflows/construction-tools-atlas-q013-identity-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover q013 canonical collisions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');
          const ROOT='tools/construction-tools-atlas';
          const DATA=path.join(ROOT,'data');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const text=v=>typeof v==='string'?v.trim():'';
          const arr=v=>Array.isArray(v)?v:[];
          const normJa=v=>text(v).normalize('NFKC').replace(/[\s・･\-‐‑‒–—―_()（）/]/g,'').toLowerCase();
          const normEn=v=>text(v).normalize('NFKC').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const rows=read(path.join(DATA,'tools.quality-013.json')).rows;
          const redirects=read(path.join(DATA,'canonical-redirects-v2.3.json')).redirects||[];
          const redirected=new Set(redirects.map(r=>text(r.from)));
          function localFile(runtimePath){return path.resolve(ROOT,String(runtimePath||'').replace(/[?#].*$/,'').replace(/^\.\//,''));}
          async function runtime(){
            const src=fs.readFileSync(path.join(DATA,'quality-loader.js'),'utf8');
            const w={};
            w.fetch=async input=>{const f=localFile(typeof input==='string'?input:input?.url); if(!fs.existsSync(f))return{ok:false,async json(){return null;}}; return{ok:true,async json(){return read(f);}}};
            const d={addEventListener(){},getElementById(){return null;},querySelector(){return null;},createElement(){return{setAttribute(){}}},head:{appendChild(){}}};
            vm.runInNewContext(src,{window:w,document:d,console:{info(){},warn(){},error:console.error},Set,Map},{filename:'quality-loader.js'});
            return await w.CTA_DATA_LOADER.loadEntries();
          }
          function n(e){return{ja:text(e?.term?.ja||e?.ja||e?.name_ja),en:text(e?.term?.en||e?.en||e?.name_en),aja:arr(e?.aliases?.ja||e?.aliases_ja||e?.aj).map(text).filter(Boolean),aen:arr(e?.aliases?.en||e?.aliases_en||e?.ae).map(text).filter(Boolean),type:text(e?.type||e?.t),dja:text(e?.description?.ja||e?.summary?.ja||e?.dj),den:text(e?.description?.en||e?.summary?.en||e?.de)}};
          (async()=>{
            const rt=await runtime();
            const active=rows.filter(r=>!redirected.has(r.id));
            const collisionReports=[]; const clean=[];
            for(const s of active){
              const sj=normJa(s.ja), se=normEn(s.en); const candidates=[];
              for(const e of rt){
                const id=text(e.id); if(id===s.id) continue; const x=n(e); const reasons=[];
                if(sj&&normJa(x.ja)===sj) reasons.push('exact_ja');
                if(se&&normEn(x.en)===se) reasons.push('exact_en');
                if(sj&&x.aja.some(a=>normJa(a)===sj)) reasons.push('target_alias_ja');
                if(se&&x.aen.some(a=>normEn(a)===se)) reasons.push('target_alias_en');
                if(reasons.length)candidates.push({id,...x,reasons});
              }
              const report={source:{id:s.id,type:s.t,ja:s.ja,en:s.en,dja:s.dj,den:s.de,category:s.c,task:s.task},candidates};
              if(candidates.length)collisionReports.push(report); else clean.push(report.source);
            }
            console.log('CTA_Q013_DISCOVERY_SUMMARY='+JSON.stringify({source_rows:rows.length,active_rows:active.length,already_redirected:rows.length-active.length,collision_rows:collisionReports.length,collision_free_rows:clean.length,runtime_entries:rt.length}));
            console.log('CTA_Q013_COLLISION_IDS='+JSON.stringify(collisionReports.map(r=>r.source.id)));
            for(const r of collisionReports) console.log('CTA_Q013_COLLISION_CASE='+JSON.stringify(r));
            console.log('CTA_Q013_CLEAN_IDS='+JSON.stringify(clean.map(r=>r.id)));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
