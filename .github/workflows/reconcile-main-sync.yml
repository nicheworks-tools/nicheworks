name: Reconcile main sync

on:
  push:
    branches:
      - feat/reconcile-v1-20260912
    paths:
      - .github/workflows/reconcile-main-sync.yml

permissions:
  contents: write

jobs:
  sync-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reconcile-v1-20260912
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git fetch origin main
          echo "main=$(git rev-parse origin/main)"
          echo "feature_before=$(git rev-parse HEAD)"
          git merge --no-edit origin/main

      - name: Verify pinned SheetJS vendor
        shell: bash
        run: |
          set -euo pipefail
          target='tools/reconcile/vendor/xlsx.mini.min.js'
          test "$(wc -c < "$target" | tr -d ' ')" = '279523'
          test "$(sha256sum "$target" | awk '{print $1}')" = '0cb353f830d7288385492c83d277b058ddeac664ca51cf1393aa1fd3e2b70939'
          test "$(git hash-object "$target")" = '5bf1c223ce4bd59685ba711b77dce6da7a9747b8'
          grep -F 'version="0.20.3"' "$target" >/dev/null

      - name: Assert no runtime SheetJS CDN dependency
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'https?://(cdn\.)?sheetjs\.com|unpkg\.com/.?xlsx|cdn\.jsdelivr\.net/.?xlsx' tools/reconcile --exclude='README.md' --exclude='SPEC.md' --exclude='NOTICE.sheetjs.txt'; then
            echo 'Runtime SheetJS CDN reference found' >&2
            exit 1
          fi

      - name: Run all Reconcile tests
        run: node --test tools/reconcile/tests/*.test.mjs

      - name: Remove temporary workflow and audit final diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-main-sync.yml
          git commit -m 'ci(reconcile): remove temporary main sync workflow'
          git diff --check origin/main...HEAD
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev '^(\.agent/plans/20260912-reconcile-v1\.md|tools/reconcile/)' || true)"
          if [ -n "$bad" ]; then
            echo 'Isolation violation:' >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
          echo 'Final isolated diff:'
          git diff --name-only origin/main...HEAD

      - name: Push synchronized branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/reconcile-v1-20260912
