name: Temporary Old Kanji Wave 2 Zou Repair

on:
  push:
    branches:
      - fix/old-kanji-wave2-zou-dictionary-20260916
    paths:
      - .github/workflows/old-kanji-wave2-zou-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/old-kanji-wave2-zou-dictionary-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact repair
        run: node scripts/tmp-old-kanji-wave2-zou-apply.mjs
      - name: Regenerate dictionary audit
        run: node scripts/build-old-kanji-dictionary-audit.mjs
      - name: Check dictionary audit drift
        run: node scripts/build-old-kanji-dictionary-audit.mjs --check
      - name: Assert Wave 2 audit contract
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('tools/old-kanji-reference/dictionary-audit.json', 'utf8'));
          const record = audit.records.find((item) => item.source === '贈');
          if (!record) throw new Error('Missing 贈 audit record');
          if (record.target !== '贈') throw new Error(`Unexpected 贈 target: ${record.target}`);
          if (record.classification !== 'compatibility') throw new Error(`Unexpected 贈 classification: ${record.classification}`);
          if (record.issues.length !== 0) throw new Error(`贈 has audit issues: ${record.issues.join(',')}`);
          if (record.seoCandidate !== true) throw new Error('贈 did not satisfy existing SEO candidate gate');
          if (audit.summary.issueRecords !== 0) throw new Error(`issueRecords=${audit.summary.issueRecords}`);
          if (audit.summary.conflictingRawDuplicateKeys !== 0) throw new Error(`conflictingRawDuplicateKeys=${audit.summary.conflictingRawDuplicateKeys}`);
          if (audit.summary.reverseIssues > 35) throw new Error(`reverseIssues increased to ${audit.summary.reverseIssues}`);
          if (audit.summary.canonicalOldToNewRecords !== 357) throw new Error(`canonicalOldToNewRecords=${audit.summary.canonicalOldToNewRecords}`);
          if (audit.summary.rawOldToNewEntries !== 365) throw new Error(`rawOldToNewEntries=${audit.summary.rawOldToNewEntries}`);
          if (audit.summary.classes.compatibility !== 23) throw new Error(`compatibility=${audit.summary.classes.compatibility}`);
          console.log(JSON.stringify({summary:audit.summary, record}, null, 2));
          EOF
      - name: Remove temporary helper files and commit final repair
        run: |
          rm scripts/tmp-old-kanji-wave2-zou-apply.mjs
          rm .github/workflows/old-kanji-wave2-zou-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair demand-exposed 贈 compatibility mapping"
          git push origin HEAD:fix/old-kanji-wave2-zou-dictionary-20260916
