name: Old Kanji Wave 11 temporary apply

on:
  push:
    branches:
      - completion/old-kanji-wave11-reference-modernizer-qa-20260918
    paths:
      - 'scripts/tmp-old-kanji-wave11-apply.mjs'
      - '.github/workflows/tmp-old-kanji-wave11-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: completion/old-kanji-wave11-reference-modernizer-qa-20260918
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply Wave 11 patch
        run: node scripts/tmp-old-kanji-wave11-apply.mjs

      - name: Run Wave 11 behavior tests
        run: |
          node tools/old-kanji-reference/tests/behavior.test.mjs
          node tools/kanji-modernizer/tests/behavior.test.mjs
          node scripts/run-tool-behavior-tests.mjs

      - name: Run Old Kanji contracts
        run: |
          node scripts/check-old-kanji-reference-seo.mjs
          node scripts/check-old-kanji-internal-handoffs.mjs
          node scripts/check-old-kanji-cluster-contract.mjs
          node scripts/build-old-kanji-dictionary-audit.mjs --check

      - name: Commit applied changes and remove temporary files
        run: |
          rm scripts/tmp-old-kanji-wave11-apply.mjs
          rm .github/workflows/tmp-old-kanji-wave11-apply.yml
          git config user.name "nicheworks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/old-kanji-reference/app-meaning-v4.js tools/old-kanji-reference/index.html tools/old-kanji-reference/tests/behavior.test.mjs tools/kanji-modernizer/app.js tools/kanji-modernizer/tests/behavior.test.mjs
          git add -u scripts/tmp-old-kanji-wave11-apply.mjs .github/workflows/tmp-old-kanji-wave11-apply.yml
          git commit -m "Old Kanji Wave 11: add Reference and Modernizer functional QA"
          git push origin HEAD:completion/old-kanji-wave11-reference-modernizer-qa-20260918
