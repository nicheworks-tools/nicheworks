name: TEMP Construction Atlas SEO cohort materializer

on:
  push:
    branches:
      - 'feat/construction-atlas-seo-cohort-20260919'
    paths:
      - 'tools/construction-tools-atlas/**'
      - '.github/workflows/temp-construction-atlas-seo-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate explicit SEO cohort
        run: node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs --write

      - name: Verify generated cohort
        run: node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs --check

      - name: Check generated diff
        run: git diff --check

      - name: Commit generated outputs
        shell: bash
        run: |
          if git diff --quiet -- tools/construction-tools-atlas/glossary tools/construction-tools-atlas/sitemap.xml; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/construction-tools-atlas/glossary tools/construction-tools-atlas/sitemap.xml
          git commit -m "Construction Atlas: materialize SEO launch cohort"
          git push origin HEAD:${{ github.ref_name }}
