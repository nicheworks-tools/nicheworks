name: Fix Pages Deploy Guide support links once

on:
  push:
    branches:
      - audit/quality-baseline-88-reconcile-20260913
    paths:
      - '.github/workflows/fix-pages-deploy-support-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/quality-baseline-88-reconcile-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Make support destinations explicit in HTML
        run: |
          node -e "const fs=require('fs'); const p='tools/pages-deploy-guide/index.html'; let s=fs.readFileSync(p,'utf8'); const old='<div class=\"nw-donate-links\" id=\"donateLinks\"></div>'; const repl='<div class=\"nw-donate-links\" id=\"donateLinks\"><a class=\"btn\" href=\"https://ofuse.me/nicheworks\" target=\"_blank\" rel=\"noopener\">💌 OFUSE</a><a class=\"btn\" href=\"https://ko-fi.com/nicheworks\" target=\"_blank\" rel=\"noopener\">☕ Ko-fi</a></div>'; if(!s.includes(old)) throw new Error('donation link anchor not found'); s=s.replace(old,repl); fs.writeFileSync(p,s);"
      - name: Commit support-link correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pages-deploy-guide/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make Pages Deploy Guide support links explicit"
          git push origin HEAD:audit/quality-baseline-88-reconcile-20260913
