name: tmp TrashNavi Wave45 sync readiness
on:
  push:
    branches: [feat/trashnavi-wave45-readiness-20260918]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave45-readiness-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge latest main and revalidate readiness
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          rm .github/workflows/tmp-trashnavi-wave45-sync-readiness.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(trashnavi): sync Wave45 readiness with main"
          git push origin HEAD:feat/trashnavi-wave45-readiness-20260918
