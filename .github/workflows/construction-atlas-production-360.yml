name: Construction Atlas production Chromium QA

on:
  pull_request:
    paths:
      - 'tools/construction-tools-atlas/scripts/check-production-viewport-360.mjs'
      - 'tools/construction-tools-atlas/scripts/check-production-saw-publication.mjs'
      - '.github/workflows/construction-atlas-production-360.yml'
  push:
    branches: [main]
    paths:
      - 'tools/construction-tools-atlas/**'
      - '.github/workflows/construction-atlas-production-360.yml'
  workflow_dispatch:
  schedule:
    - cron: '19 14 * * *' # Daily 23:19 JST (best effort; GitHub may delay scheduled runs)

permissions:
  contents: read

jobs:
  actual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22 with built-in WebSocket
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify installed Chrome/Chromium
        run: command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Check live Chromium probe syntax
        run: node --check tools/construction-tools-atlas/scripts/check-production-viewport-360.mjs
      - name: Verify actual live nicheworks.app dictionary at 360px, 390px and desktop
        env:
          # PR tests run before the Pages deployment; nightly/dispatch must require current release.
          CTA_ALLOW_PREVIOUS_ASSET_VERSION: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        shell: bash
        run: |
          # Cloudflare may deploy after the main push. Retry strict current-version checks.
          attempts=1
          if [[ "${{ github.event_name }}" == "push" ]]; then attempts=8; fi
          for ((i=1; i<=attempts; i++)); do
            if node tools/construction-tools-atlas/scripts/check-production-viewport-360.mjs; then
              exit 0
            fi
            if ((i==attempts)); then exit 1; fi
            sleep 45
          done
      - name: Verify real production 45th detail page, Commons source hash and optimized images
        shell: bash
        run: |
          attempts=1
          if [[ "${{ github.event_name }}" == "push" ]]; then attempts=8; fi
          for ((i=1; i<=attempts; i++)); do
            if node tools/construction-tools-atlas/scripts/check-production-saw-publication.mjs; then exit 0; fi
            if ((i==attempts)); then exit 1; fi
            sleep 45
          done
      - name: Preserve public viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-atlas-production-viewport
          path: artifacts/construction-atlas-production-viewport/*.png
          retention-days: 7
          if-no-files-found: warn
