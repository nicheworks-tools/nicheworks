name: tmp TrashNavi Wave46 readiness
on:
  push:
    branches: [feat/trashnavi-wave46-readiness-20260918]
permissions:
  contents: write
jobs:
  readiness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave46-readiness-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Wave46 readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=json.loads(Path('tools/trashnavi/data/direct-waste-links-supply-wave46.json').read_text())
          expected={
            '082023':('日立市','hitachi'),'082031':('土浦市','tsuchiura'),
            '082058':('石岡市','ishioka'),'082082':('龍ケ崎市','ryugasaki'),
            '082104':('下妻市','shimotsuma'),'082163':('笠間市','kasama'),
            '082198':('牛久市','ushiku'),'082201':('つくば市','tsukuba'),
            '082210':('ひたちなか市','hitachinaka'),'082244':('守谷市','moriya')
          }
          assert len(rows)==30
          by={}
          for r in rows:
            assert r['pref']=='茨城県'
            assert r['lgcode'] in expected and r['city']==expected[r['lgcode']][0]
            assert r['last_checked']=='2026-09-18'
            assert r['status']=='active' and r['language']=='ja'
            assert r['link_type']!='municipal_home'
            assert r['url'].startswith('https://')
            by.setdefault(r['lgcode'],[]).append(r)
          assert set(by)==set(expected)
          for code,rs in by.items():
            assert len(rs)==3
            assert len({r['link_type'] for r in rs})==3
            assert len({r['url'] for r in rs})==3
          app=Path('tools/trashnavi/app.js').read_text()
          assert 'data/direct-waste-links-supply-wave46.json' in app
          manifest=json.loads(Path('tools/trashnavi/municipality-page-manifest.json').read_text())
          assert len(manifest)==234
          root=Path('sitemap.xml').read_text()
          dedicated=Path('sitemap-trashnavi.xml').read_text()
          index=Path('tools/trashnavi/index.html').read_text()
          for code,(city,slug) in expected.items():
            canonical=f'https://nicheworks.app/tools/trashnavi/ibaraki/{slug}/'
            href=f'/tools/trashnavi/ibaraki/{slug}/'
            assert canonical not in root
            assert canonical not in dedicated
            assert href not in index
          assert dedicated.count('<url>')==235
          print('Wave46 readiness static acceptance: 10 municipalities / 30 records / published surface remains 234')
          PY
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          rm .github/workflows/tmp-trashnavi-wave46-readiness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(trashnavi): validate Wave46 readiness"
          git push origin HEAD:feat/trashnavi-wave46-readiness-20260918
