name: Reclassify existing behavior tests once

on:
  push:
    branches:
      - audit/reclassify-behavior-tests-20260913
    paths:
      - 'scripts/reclassify-existing-behavior-tests-once.mjs'
      - '.github/workflows/reclassify-existing-behavior-tests-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/reclassify-behavior-tests-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reclassify existing behavior tests
        run: node scripts/reclassify-existing-behavior-tests-once.mjs
      - name: Validate quality contracts
        run: |
          node scripts/check-tool-spec-coverage.mjs
          node scripts/check-tool-quality-contract.mjs
      - name: Commit canonical audit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/tool-quality-matrix.json audits/tool-quality-matrix.md docs/tools/inci-fastscan.md docs/tools/earth-map-suite.md
          git diff --cached --quiet && exit 0
          git commit -m "Reclassify existing behavior tests"
          git push origin HEAD:audit/reclassify-behavior-tests-20260913
