name: Pattern Dictionary Wave 5 reference v2

on:
  push:
    branches:
      - feat/pattern-dictionary-wave5-production-staging-20260916
    paths:
      - .github/workflows/pattern-dictionary-wave5-reference-v2.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave5-production-staging-20260916
          fetch-depth: 0
      - name: Refine generator scale and fluid effects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/pattern-dictionary/scripts/generate-reference-images-wave5.py')
          s=p.read_text()
          old="""for pid,fn in FUN.items():
              write_png(OUT/f'{pid}.png',fn); print(pid)
          """
          new="""def tie_dye_v2(x,y):
              xx,yy=x%192,y%192; cx,cy=96,96; dx,dy=xx-cx,yy-cy; d=math.hypot(dx,dy); a=math.atan2(dy,dx)
              if d<9:return WHITE
              phase=(a+d/22+0.18*math.sin(d/9))%(2*math.pi)
              sector=int(phase/(2*math.pi/8))%8
              cols=[BLUE,WHITE,PURPLE,WHITE,PINK,WHITE,BLUE,WHITE]
              c=cols[sector]
              # pale resisted rings break the spiral organically
              if abs((d+5*math.sin(3*a))%38-19)<2.8:return WHITE
              return c

          def marbling_v2(x,y):
              xx,yy=x%192,y%192
              u=xx+25*math.sin(yy/31)+8*math.sin((xx+yy)/17)+5*math.sin(yy/7)
              v=yy+13*math.sin(xx/29)
              z=(u+0.18*v)%76
              if z<10:return NAVY
              if z<18:return CREAM
              if z<32:return BLUE
              if z<39:return WHITE
              if z<52:return DARK_RED
              if z<60:return GOLD
              return CREAM

          def write_png_scaled(path,fn,scale=1):
              tile_size=TILE*scale; rep=SIZE//tile_size
              tile=[[fn(x//scale,y//scale) for x in range(tile_size)] for y in range(tile_size)]
              raw=bytearray()
              for y in range(SIZE):
                  raw.append(0); row=tile[y%tile_size]; raw.extend(bytes(c for rgb in row for c in rgb)*rep)
              png=b'\\x89PNG\\r\\n\\x1a\\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',SIZE,SIZE,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
              path.write_bytes(png)

          FUN['tie-dye']=tie_dye_v2; FUN['marbling']=marbling_v2
          SCALE2={'suzani','sashiko','kantha','otomi-embroidery','block-print','snake-print','cow-print','giraffe-print','dalmatian-spots','camouflage','tie-dye','marbling','terrazzo'}
          for pid,fn in FUN.items():
              write_png_scaled(OUT/f'{pid}.png',fn,2 if pid in SCALE2 else 1); print(pid)
          """
          if old not in s: raise SystemExit('final generator loop not found')
          p.write_text(s.replace(old,new))
          q=Path('tools/pattern-dictionary/data/wave5-reference-images.json')
          j=q.read_text().replace('scripts/generate-reference-images-wave5.py','scripts/generate-reference-images-wave5.py (v2 scale/fluid refinement)')
          q.write_text(j)
          PY
      - name: Regenerate images
        run: python3 tools/pattern-dictionary/scripts/generate-reference-images-wave5.py
      - name: Validate staging
        run: node tools/pattern-dictionary/scripts/check-wave5-staging.mjs
      - name: Commit refinements
        run: |
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add tools/pattern-dictionary/scripts/generate-reference-images-wave5.py tools/pattern-dictionary/data/wave5-reference-images.json tools/pattern-dictionary/assets/reference/*.png
          git commit -m "Pattern Dictionary: refine Wave 5 reference images"
          git push origin HEAD:feat/pattern-dictionary-wave5-production-staging-20260916
