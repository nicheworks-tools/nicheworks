name: One-shot align Old Kanji public sales boundary

on:
  push:
    branches:
      - chore/adsense-old-kanji-sales-cleanup-20260915
    paths:
      - '.github/workflows/_tmp-old-kanji-contract-align.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/adsense-old-kanji-sales-cleanup-20260915
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Align JS, runtime checks, specs, and cluster contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function edit(file, fn) {
            const before = fs.readFileSync(file, 'utf8');
            const after = fn(before);
            if (after === before) throw new Error(`${file}: expected change was not applied`);
            fs.writeFileSync(file, after);
          }

          function replaceExact(text, oldValue, newValue, label) {
            const count = text.split(oldValue).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly 1 match, found ${count}`);
            return text.replace(oldValue, newValue);
          }

          function replaceLine(text, regex, replacement, label) {
            let count = 0;
            const next = text.replace(regex, () => { count += 1; return replacement; });
            if (count !== 1) throw new Error(`${label}: expected exactly 1 line, found ${count}`);
            return next;
          }

          edit('tools/name-old-kanji-checker/app.js', (text) => {
            const ids = ['okj-pro-feature-title','okj-pro-feature-text','okj-pro-cta','okj-pro-note'];
            let next = text;
            for (const id of ids) {
              const re = new RegExp(`^\\s*document\\.getElementById\\('${id}'\\)\\.textContent\\s*=.*\\n`, 'm');
              const matches = next.match(re);
              if (!matches) throw new Error(`name app: missing direct Pro DOM write for ${id}`);
              next = next.replace(re, '');
            }
            return next;
          });

          edit('scripts/check-tool-runtime-contracts-wave4.mjs', (text) => {
            let next = text;
            next = replaceExact(next,
              `// 53. Name Old Kanji Checker — same-site mappings, optional metadata fallback, billing unavailable.`,
              `// 53. Name Old Kanji Checker — same-site mappings, optional metadata fallback, no unfinished public sales UI.`,
              'wave4 name comment');
            next = replaceExact(next,
              `has('tools/name-old-kanji-checker/index.html', 'data-okj-pro-state="billing-unavailable"');`,
              `lacks('tools/name-old-kanji-checker/index.html', 'okj-pro-panel', 'unfinished public Pro panel');`,
              'wave4 name panel');
            next = replaceExact(next,
              `has('tools/name-old-kanji-checker/index.html', 'aria-disabled="true" disabled id="okj-pro-cta"');`,
              `lacks('tools/name-old-kanji-checker/index.html', '$4.99', 'unfinished fixed Pro price');`,
              'wave4 name price');

            next = replaceExact(next,
              `// 58. Old Document Kanji Highlighter — local mechanical mapping and locked billing-unavailable Pro surface.`,
              `// 58. Old Document Kanji Highlighter — local mechanical mapping with no unfinished public sales surface.`,
              'wave4 highlighter comment');
            next = replaceExact(next,
              `has('tools/old-document-kanji-highlighter/index.html', 'data-okj-pro-state="billing-unavailable"');`,
              `lacks('tools/old-document-kanji-highlighter/index.html', 'okj-pro-panel', 'unfinished public Pro panel');`,
              'wave4 highlighter panel');
            next = replaceExact(next,
              `has('tools/old-document-kanji-highlighter/index.html', 'aria-disabled="true" disabled');`,
              `lacks('tools/old-document-kanji-highlighter/index.html', '$4.99', 'unfinished fixed Pro price');`,
              'wave4 highlighter price');

            next = replaceExact(next,
              `// 59. Old Kanji OCR Scanner — Japanese Tesseract OCR, editable detection, external-runtime disclosure, locked Pro, contextual Amazon resources.`,
              `// 59. Old Kanji OCR Scanner — Japanese Tesseract OCR, editable detection, external-runtime disclosure, no unfinished sales UI, contextual Amazon resources.`,
              'wave4 ocr comment');
            next = replaceExact(next,
              `has('tools/old-kanji-ocr-scanner/index.html', 'data-okj-pro-state="billing-unavailable"');`,
              `lacks('tools/old-kanji-ocr-scanner/index.html', 'okj-pro-panel', 'unfinished public Pro panel');`,
              'wave4 ocr panel');

            next = replaceExact(next,
              `// 60. Old Kanji Reference — documented browser state, Free exports, disabled future Pro surface, repaired detail layout, contextual Amazon resources.`,
              `// 60. Old Kanji Reference — documented browser state, Free exports, no unfinished sales UI, repaired detail layout, contextual Amazon resources.`,
              'wave4 reference comment');
            next = replaceExact(next,
              `has('tools/old-kanji-reference/index.html', 'data-okj-pro-state="billing-unavailable"');`,
              `lacks('tools/old-kanji-reference/index.html', 'okj-pro-panel', 'unfinished public Pro panel');`,
              'wave4 reference panel');
            next = replaceExact(next,
              `has('tools/old-kanji-reference/index.html', 'data-okj-pro-cta disabled aria-disabled="true"');`,
              `lacks('tools/old-kanji-reference/index.html', '$4.99', 'unfinished fixed Pro price');`,
              'wave4 reference price');
            return next;
          });

          edit('scripts/check-tool-runtime-contracts-wave5.mjs', (text) => {
            return replaceExact(text,
              `has('tools/place-old-kanji-checker/SPEC.md', 'billing-unavailable/locked');`,
              `has('tools/place-old-kanji-checker/SPEC.md', 'No fixed Pro price or unfinished purchase controls are rendered');\nlacks('tools/place-old-kanji-checker/index.html', 'okj-pro-panel', 'unfinished public Pro panel');`,
              'wave5 place Pro boundary');
          });

          const specEdits = {
            'tools/name-old-kanji-checker/SPEC.md': [
              [/^- Show Old Kanji Toolkit Pro as billing-unavailable\/locked;.*$/m, '- Do not render an unfinished Pro sales panel, fixed Pro price, or disabled purchase CTA while no verified purchase path is connected.'],
              [/^Input and results are current-page state\. The tool loads reference data.*$/m, 'Input and results are current-page state. The tool loads reference data from same-site JSON assets and does not maintain a saved name history. No paid entitlement or purchase UI is part of the current public page state; future Pro scope remains outside the public free workflow until verified billing activation.'],
              [/^- Pro functions shown in the current page are locked because billing is not connected\.$/m, '- No fixed Pro price or unfinished purchase controls are rendered on the public page while billing is inactive.'],
              [/^- \[ \] Billing-unavailable Pro controls remain disabled until a real entitlement\/purchase path exists\.$/m, '- [ ] The public page does not expose unfinished billing/Pro sales controls until a verified entitlement/purchase path exists.']
            ],
            'tools/old-document-kanji-highlighter/SPEC.md': [
              [/^- Display Old Kanji Toolkit Pro as billing-unavailable;.*$/m, '- Do not render an unfinished Pro sales panel, fixed Pro price, or disabled purchase CTA while no verified purchase path is connected.'],
              [/^Pasted text and results are current-page state\. No document history.*$/m, 'Pasted text and results are current-page state. No document history is persisted by the free tool. No paid entitlement or purchase UI is part of the current public page state.'],
              [/^- Pro features shown in the page are not currently purchasable because the billing path is not connected\.$/m, '- No fixed Pro price or unfinished purchase controls are rendered on the public page while billing is inactive.'],
              [/^- \[ \] Billing-unavailable Pro controls remain locked and must not be described as currently purchasable functionality\.$/m, '- [ ] The public page does not expose unfinished billing/Pro sales controls until a verified entitlement/purchase path exists.']
            ],
            'tools/old-kanji-ocr-scanner/SPEC.md': [
              [/^- Old Kanji Toolkit Pro features such as batch OCR.*$/m, '- Future batch/history/crop/report scope is not advertised through an unfinished public sales panel while no verified purchase path is connected.'],
              [/^Selected image, OCR text, and detection results are page-memory state.*$/m, 'Selected image, OCR text, and detection results are page-memory state and are not stored as scan history. Object URLs are revoked when the selected image is cleared/replaced. Paid history/collection scope is outside the current public free workflow; no inactive sales panel is rendered. Amazon resource configuration is static and does not persist user state.'],
              [/^- \[ \] Planned Pro controls remain locked while billing is unavailable\.$/m, '- [ ] No fixed Pro price, disabled purchase CTA, or unfinished billing panel is rendered before a verified purchase path is active.']
            ],
            'tools/old-kanji-reference/SPEC.md': [
              [/^- The Old Kanji Toolkit Pro area is visibly marked billing-unavailable.*$/m, '- No unfinished public Pro sales panel is rendered. Current CSV/JSON/Markdown/print exports remain Free; future paid scope stays outside the public functional contract until verified billing activation.'],
              [/^- Old Kanji Toolkit billing is currently unavailable on this page;.*$/m, '- No fixed Pro price or unfinished purchase controls are rendered on the public page while billing is inactive.'],
              [/^- \[ \] The disabled Pro panel communicates billing unavailable.*$/m, '- [ ] The public page does not expose a fixed Pro price, disabled purchase CTA, or billing-unavailable sales panel before verified billing activation.']
            ],
            'tools/place-old-kanji-checker/SPEC.md': [
              [/^- Display Old Kanji Toolkit Pro batch\/report\/export\/saved-set\/audit capabilities.*$/m, '- Do not render an unfinished Pro sales panel, fixed Pro price, or disabled purchase CTA while no verified purchase path is connected.'],
              [/^Input and results are current-page state and are not persisted.*$/m, 'Input and results are current-page state and are not persisted as place-name history. No paid entitlement or purchase UI is part of the current public page state.'],
              [/^- Pro batch\/report\/export\/saved-set\/audit capabilities are not currently purchasable because billing is not connected\.$/m, '- No fixed Pro price or unfinished purchase controls are rendered on the public page while billing is inactive.'],
              [/^- \[ \] Billing-unavailable Pro controls remain locked until a real purchase\/entitlement path is connected\.$/m, '- [ ] The public page does not expose unfinished billing/Pro sales controls until a verified entitlement/purchase path exists.']
            ],
            'tools/unicode-kanji-checker/SPEC.md': [
              [/^- Old Kanji Toolkit Pro panelは現状`billing-unavailable`で、CTAはdisabled。利用可能な課金機能として扱わない。$/m, '- verified purchase pathがない間は、fixed Pro price・disabled purchase CTA・billing-unavailable sales panelをpublic pageへ表示しない。'],
              [/^- Pro panelはbilling unavailableのため、user entitlementによる保存stateをcurrent functional contractに含めない。$/m, '- paid entitlement UIはcurrent public functional contractに含めない。'],
              [/^- Old Kanji Toolkit Proは現時点でbilling未接続である。$/m, '- billing未接続の間はunfinished Pro sales UIをpublic pageへ表示しない。'],
              [/^- \[ \] billing-unavailableのPro CTAを有効な購入済み機能として扱わない。$/m, '- [ ] verified billing activation前にfixed Pro price、disabled purchase CTA、billing-unavailable sales panelを表示しない。'],
              [/^- `tools\/unicode-kanji-checker\/index\.html` — input\/copy\/result\/Pro-billing-unavailable UI、privacy notice。$/m, '- `tools/unicode-kanji-checker/index.html` — input/copy/result UI、privacy notice。']
            ],
            'tools/variant-kanji-compare/SPEC.md': [
              [/^- Old Kanji Toolkit Proは現状`billing-unavailable`でCTA disabled。$/m, '- verified purchase pathがない間は、fixed Pro price・disabled purchase CTA・billing-unavailable sales panelをpublic pageへ表示しない。'],
              [/^- current Pro panelはbilling unavailableで、active entitlement stateをfunctional contractに含めない。$/m, '- paid entitlement UIはcurrent public functional contractに含めない。'],
              [/^- Old Kanji Toolkit Proはbilling未接続である。$/m, '- billing未接続の間はunfinished Pro sales UIをpublic pageへ表示しない。'],
              [/^- \[ \] Pro panelをbilling unavailableとして扱い、disabled CTAを有効機能と誤認させない。$/m, '- [ ] verified billing activation前にfixed Pro price、disabled purchase CTA、billing-unavailable sales panelを表示しない。'],
              [/^- `tools\/variant-kanji-compare\/index\.html` — input\/preset\/comparison\/copy\/Pro-billing-unavailable UI。$/m, '- `tools/variant-kanji-compare/index.html` — input/preset/comparison/copy UI。']
            ]
          };

          for (const [file, replacements] of Object.entries(specEdits)) {
            edit(file, (text) => {
              let next = text;
              for (const [regex, replacement] of replacements) {
                next = replaceLine(next, regex, replacement, `${file} ${regex}`);
              }
              return next;
            });
          }

          edit('tools/OLD_KANJI_CLUSTER.md', (text) => replaceLine(
            text,
            /^While billing is unavailable, Pro UI must remain clearly disabled\/unavailable and must not imply a purchasable feature exists\.$/m,
            'Until a verified purchase/entitlement path is active, public tool pages must not render a fixed Pro price, disabled purchase CTA, or billing-unavailable sales panel. Future Pro scope stays documented in SPEC/planning material and is introduced publicly only when a real purchasable flow exists.',
            'Old Kanji cluster billing boundary'
          ));
          NODE

      - name: Validate complete Old Kanji contract
        run: |
          node scripts/check-tool-runtime-contracts-wave4.mjs
          node scripts/check-tool-runtime-contracts-wave5.mjs
          node scripts/check-tool-runtime-contracts-wave6.mjs
          node scripts/check-old-kanji-pro-boundary.mjs
          node scripts/check-old-kanji-cluster-contract.mjs
          node scripts/check-old-kanji-reference-seo.mjs
          node scripts/check-old-kanji-internal-handoffs.mjs
          node scripts/check-old-kanji-measurement.mjs
          node scripts/check-old-kanji-amazon.mjs
          node scripts/check-adsense-review-surface.mjs
          node scripts/check-tool-spec-contract.mjs
          node scripts/check-tool-spec-coverage.mjs
          node scripts/run-tool-behavior-tests.mjs
          node scripts/audit-seo.mjs --strict
          git diff --check

      - name: Commit validated alignment and remove one-shot workflow
        run: |
          rm .github/workflows/_tmp-old-kanji-contract-align.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/name-old-kanji-checker/app.js \
            tools/name-old-kanji-checker/SPEC.md \
            tools/old-document-kanji-highlighter/SPEC.md \
            tools/old-kanji-ocr-scanner/SPEC.md \
            tools/old-kanji-reference/SPEC.md \
            tools/place-old-kanji-checker/SPEC.md \
            tools/unicode-kanji-checker/SPEC.md \
            tools/variant-kanji-compare/SPEC.md \
            tools/OLD_KANJI_CLUSTER.md \
            scripts/check-tool-runtime-contracts-wave4.mjs \
            scripts/check-tool-runtime-contracts-wave5.mjs \
            scripts/check-old-kanji-pro-boundary.mjs \
            .github/workflows/_tmp-old-kanji-contract-align.yml
          git commit -m 'chore: align Old Kanji public sales boundary'
          git push origin HEAD:chore/adsense-old-kanji-sales-cleanup-20260915
