name: CTA structural production UI fix v2
on:
  push:
    branches: ['fix/construction-atlas-ui-structural-prod-20260916']
    paths: ['.github/workflows/cta-structural-prod-fix-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/construction-atlas-ui-structural-prod-20260916
      - name: Patch structural UI defects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.parse
          root=Path('tools/construction-tools-atlas')

          # Runtime: remove internal record/meta generation and raw detail taxonomy.
          p=root/'app.runtime.js'; s=p.read_text()
          s=s.replace('''  function tab(name) { $$(".tab", els.detailTabs || document).forEach((b) => b.classList.toggle("tab--active", b.dataset.tab === name)); if (els.tabMeaning) els.tabMeaning.hidden = name !== "meaning"; if (els.tabExamples) els.tabExamples.hidden = name !== "examples"; if (els.tabAliases) els.tabAliases.hidden = name !== "aliases"; if (els.tabMeta) els.tabMeta.hidden = name !== "meta"; }''','''  function tab(name) { $$(".tab", els.detailTabs || document).forEach((b) => b.classList.toggle("tab--active", b.dataset.tab === name)); if (els.tabMeaning) els.tabMeaning.hidden = name !== "meaning"; if (els.tabExamples) els.tabExamples.hidden = name !== "examples"; if (els.tabAliases) els.tabAliases.hidden = name !== "aliases"; if (els.tabMeta) { clear(els.tabMeta); els.tabMeta.hidden = true; } }''',1)
          s=s.replace('''    clear(els.detailChips);\n    [e.type,...e.categories,...e.tasks].forEach((x) => chip(els.detailChips, x));''','''    clear(els.detailChips);\n    if (els.detailChips) { els.detailChips.hidden = true; els.detailChips.style.display = "none"; }''',1)
          raw='''    ul(els.tabMeta, [`id: ${e.id}`,`type: ${e.type}`,`categories: ${e.categories.join(", ")}`,`tasks: ${e.tasks.join(", ")}`,`region: ${e.region.join(", ")}`,`quality_batch: ${e.meta?.quality_batch || ""}`], "");'''
          if raw not in s: raise SystemExit('app.runtime raw meta anchor missing')
          s=s.replace(raw,'''    clear(els.tabMeta);\n    if (els.tabMeta) els.tabMeta.hidden = true;''',1)
          p.write_text(s)

          # Presentation: selected ID comes from canonical row/URL, never visible Meta; do not build Meta record.
          p=root/'dictionary-presentation-v2.3.js'; s=p.read_text()
          old='''  function selectedId() {\n    const sheet = byDomId("detailSheet");\n    if (!sheet || sheet.hidden) return "";\n    const meta = byDomId("tabMeta");\n    const found = (meta?.textContent || "").match(/id:\\s*([^\\n]+)/);\n    return found ? found[1].trim() : "";\n  }'''
          new='''  function selectedId() {\n    const sheet = byDomId("detailSheet");\n    if (!sheet || sheet.hidden) return "";\n    const selected = document.querySelector("#resultList .row--selected[data-entry-id]");\n    if (selected?.dataset.entryId) return selected.dataset.entryId;\n    try { return new URL(window.location.href).searchParams.get("entry") || ""; }\n    catch (_) { return ""; }\n  }'''
          if old not in s: raise SystemExit('dictionary selectedId anchor missing')
          s=s.replace(old,new,1)
          start=s.find('''    const meta = byDomId("tabMeta");\n    clear(meta);\n    if (meta) {''')
          end=s.find('''    }\n  }\n\n  function hideLegacyTopMeta()''', start)
          if start < 0 or end < 0: raise SystemExit('dictionary meta render block missing')
          s=s[:start]+'''    const meta = byDomId("tabMeta");\n    clear(meta);\n    if (meta) meta.hidden = true;\n'''+s[end+6:]
          p.write_text(s)

          # Deep-link and image runtime no longer parse hidden Meta.
          p=root/'deep-link-v2.3.js'; s=p.read_text()
          old='''  function selectedId() {\n    const match = ($("#tabMeta")?.textContent || "").match(/id:\\s*([^\\n]+)/);\n    return match ? match[1].trim() : "";\n  }'''
          new='''  function selectedId() {\n    const selected = $("#resultList .row--selected[data-entry-id]");\n    if (selected?.dataset.entryId) return selected.dataset.entryId;\n    return currentId || requestedEntryId();\n  }'''
          if old not in s: raise SystemExit('deep-link selectedId anchor missing')
          p.write_text(s.replace(old,new,1))

          p=root/'detail-image-hotfix.js'; s=p.read_text()
          old='''    const meta = document.getElementById("tabMeta")?.textContent || "";\n    const found = meta.match(/id:\\s*([^\\n]+)/);\n    return found ? found[1].trim() : "";'''
          new='''    const selected = document.querySelector("#resultList .row--selected[data-entry-id]");\n    if (text(selected?.dataset.entryId)) return text(selected.dataset.entryId);\n    try { return text(new URL(window.location.href).searchParams.get("entry")); }\n    catch (_) { return ""; }'''
          if old not in s: raise SystemExit('image currentEntryId anchor missing')
          p.write_text(s.replace(old,new,1))

          # Desktop: keep existing width contract intact, then override vertical behavior separately.
          p=root/'ui-mock-v2-hardening.css'; s=p.read_text()
          old='''  .atlasWorkspace{display:grid!important;grid-template-columns:minmax(0,43fr) minmax(0,57fr)!important;width:100%!important;max-width:none!important;gap:16px!important}\n'''
          new='''  .atlasWorkspace{display:grid!important;grid-template-columns:minmax(0,43fr) minmax(0,57fr)!important;width:100%!important;max-width:none!important;gap:16px!important;align-items:stretch!important}\n'''
          if old not in s: raise SystemExit('workspace anchor missing')
          s=s.replace(old,new,1)
          old='''  .atlasWorkspace>.results,.atlasDetailHost{width:100%!important;max-width:none!important;min-width:0!important;box-sizing:border-box!important}\n'''
          new='''  .atlasWorkspace>.results,.atlasDetailHost{width:100%!important;max-width:none!important;min-width:0!important;box-sizing:border-box!important;align-self:stretch!important}\n  .atlasDetailHost{display:flex!important;flex-direction:column!important;height:auto!important;min-height:0!important}\n'''
          if old not in s: raise SystemExit('host anchor missing')
          s=s.replace(old,new,1)
          width_rule='''  .atlasDetailHost>#detailSheet,#detailSheet.detailPanel--desktop{width:100%!important;min-width:0!important;max-width:none!important;box-sizing:border-box!important}\n'''
          if width_rule not in s: raise SystemExit('detail width contract missing')
          structural='''  #detailSheet.detailPanel--desktop{position:relative!important;inset:auto!important;top:auto!important;max-height:none!important;flex:1 1 auto!important;overflow:auto!important}\n'''
          s=s.replace(width_rule,width_rule+structural,1)
          old='#detailTabs,#tabMeta,#tabMeta[hidden],#detailChips,#detailSheet .supportInline,#supportInlineBtn{display:none!important}'
          new='#detailTabs,#detailSheet #tabMeta,#detailSheet #tabMeta[hidden],#detailChips,#detailSheet .supportInline,#supportInlineBtn{display:none!important}'
          if old not in s: raise SystemExit('meta hide selector missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Maintained Amazon mappings: include visible purchase-intent entries; never use user free text.
          p=root/'data/affiliate-offers-v2.3.json'; offers=json.loads(p.read_text())
          atlas_text='\n'.join(x.read_text(errors='ignore') for x in root.rglob('*') if x.is_file() and x != p)
          additions={
            'q017_abrasive_block':('研磨ブロック','Amazonで研磨ブロックを探す','Find abrasive blocks on Amazon'),
            'q017_access_floor_panel':('OAフロア パネル','AmazonでOAフロアパネルを探す','Find access floor panels on Amazon'),
            'q017_adhesive_spreader':('接着剤 ヘラ','Amazonで接着剤用ヘラを探す','Find adhesive spreaders on Amazon')
          }
          existing={x['entry_id'] for x in offers.get('offers',[])}
          for eid,(query,ja,en) in additions.items():
            if eid in existing: continue
            if eid not in atlas_text: raise SystemExit(f'canonical entry missing: {eid}')
            url='https://www.amazon.co.jp/s?k='+urllib.parse.quote_plus(query)+'&tag='+offers['tracking_id']
            offers['offers'].append({'entry_id':eid,'status':'active','offer_id':'amazon_'+eid.replace('q017_','')+'_search','query':query,'amazon_url':url,'label_ja':ja,'label_en':en})
          offers['version']='2026-09-16-structural-ui-3'
          p.write_text(json.dumps(offers,ensure_ascii=False,indent=2)+'\n')

          # Cache bust directly changed runtimes and parity bundle.
          p=root/'detail-dictionary-fix.js'; s=p.read_text().replace('20260916-mock-v2-hotfix-2','20260916-structural-3'); p.write_text(s)
          p=root/'index.html'; s=p.read_text()
          s=s.replace('./app.runtime.js?v=20260513-runtime-1','./app.runtime.js?v=20260916-structural-3')
          s=s.replace('./detail-dictionary-fix.js?v=20260916-prod-hotfix-2','./detail-dictionary-fix.js?v=20260916-structural-3')
          s=s.replace('./detail-image-hotfix.js?v=20260914-image-wave1-1','./detail-image-hotfix.js?v=20260916-structural-3')
          p.write_text(s)

          # Regression contract for the three user-visible defects.
          p=root/'scripts/check-ui-mock-v2-parity.cjs'; s=p.read_text()
          s=s.replace("const bootstrap = read('detail-dictionary-fix.js');", "const bootstrap = read('detail-dictionary-fix.js');\nconst appRuntime = read('app.runtime.js');\nconst presentation = read('dictionary-presentation-v2.3.js');\nconst deepLink = read('deep-link-v2.3.js');\nconst imageRuntime = read('detail-image-hotfix.js');\nconst indexHtml = read('index.html');")
          anchor="ok(hardening.includes('grid-template-columns:minmax(0,43fr) minmax(0,57fr)'), 'desktop hardening must preserve a larger right detail pane');"
          if anchor not in s: raise SystemExit('checker width anchor missing')
          s=s.replace(anchor,anchor+"\nok(hardening.includes('align-items:stretch!important'), 'desktop master-detail panes must stretch to the same grid-row height');\nok(hardening.includes('.atlasDetailHost{display:flex!important;flex-direction:column!important'), 'detail host must fill the stretched desktop row');\nok(hardening.includes('#detailSheet.detailPanel--desktop{position:relative!important'), 'desktop detail must fill the host instead of retaining sticky viewport height');",1)
          old="ok(hardening.includes('#detailTabs,#tabMeta,#tabMeta[hidden]'), 'legacy Meta/internal-record panel must stay hidden');"
          if old in s: s=s.replace(old,"ok(hardening.includes('#detailSheet #tabMeta') && hardening.includes('#detailSheet #tabMeta[hidden]'), 'legacy Meta/internal-record panel must stay hidden with higher specificity than legacy tabpanel rules');",1)
          marker="ok(!runtime.includes('match(/id:'), 'selected entry resolution must not depend on visible raw Meta text');"
          if marker not in s: raise SystemExit('checker selected-id marker missing')
          s=s.replace(marker,marker+"\nok(!appRuntime.includes('`id: ${e.id}`') && !presentation.includes('`id: ${entry.id}`'), 'runtime and presentation must not render internal record metadata as bullet lists');\nok(!presentation.includes('.match(/id:') && !deepLink.includes('.match(/id:') && !imageRuntime.includes('meta.match(/id:'), 'canonical selection must not use Meta text as application state');",1)
          s=s.replace("ok(bootstrap.includes('20260916-mock-v2-hotfix-2'), 'UI parity cache bust must be current');","ok(bootstrap.includes('20260916-structural-3'), 'UI parity cache bust must be current');",1)
          s=s.replace("ok(Array.isArray(offers.offers) && offers.offers.length >= 15, 'maintained affiliate coverage must include common purchase-intent entries');","ok(Array.isArray(offers.offers) && offers.offers.length >= 24, 'maintained affiliate coverage must include common purchase-intent entries');",1)
          marker="ok(offers.offers.some((offer) => offer.entry_id === 'impact_driver'), 'Impact Driver must have an active maintained Amazon mapping');"
          if marker not in s: raise SystemExit('affiliate checker anchor missing')
          s=s.replace(marker,marker+"\nok(offers.offers.some((offer) => offer.entry_id === 'q017_access_floor_panel'), 'Access Floor Panel must have an active maintained Amazon mapping');\nok(indexHtml.includes('app.runtime.js?v=20260916-structural-3') && indexHtml.includes('detail-image-hotfix.js?v=20260916-structural-3'), 'changed runtimes must be cache-busted in production HTML');",1)
          p.write_text(s)
          PY
      - name: Validate structural fix
        run: |
          node --check tools/construction-tools-atlas/app.runtime.js
          node --check tools/construction-tools-atlas/dictionary-presentation-v2.3.js
          node --check tools/construction-tools-atlas/deep-link-v2.3.js
          node --check tools/construction-tools-atlas/detail-image-hotfix.js
          node tools/construction-tools-atlas/scripts/check-ui-mock-v2-parity.cjs
          ! grep -q 'id: `\|`id: \${e.id}' tools/construction-tools-atlas/app.runtime.js
          ! grep -q 'id: \${entry.id}' tools/construction-tools-atlas/dictionary-presentation-v2.3.js
          ! grep -q 'match(/id:' tools/construction-tools-atlas/dictionary-presentation-v2.3.js tools/construction-tools-atlas/deep-link-v2.3.js
          grep -q 'align-items:stretch!important' tools/construction-tools-atlas/ui-mock-v2-hardening.css
          grep -q 'q017_access_floor_panel' tools/construction-tools-atlas/data/affiliate-offers-v2.3.json
          grep -q 'app.runtime.js?v=20260916-structural-3' tools/construction-tools-atlas/index.html
      - name: Commit structural fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/construction-tools-atlas/app.runtime.js tools/construction-tools-atlas/dictionary-presentation-v2.3.js tools/construction-tools-atlas/deep-link-v2.3.js tools/construction-tools-atlas/detail-image-hotfix.js tools/construction-tools-atlas/ui-mock-v2-hardening.css tools/construction-tools-atlas/data/affiliate-offers-v2.3.json tools/construction-tools-atlas/detail-dictionary-fix.js tools/construction-tools-atlas/index.html tools/construction-tools-atlas/scripts/check-ui-mock-v2-parity.cjs
          git commit -m 'fix(construction-atlas): complete structural Mock v2 production parity'
          git push origin HEAD:fix/construction-atlas-ui-structural-prod-20260916
