name: Construction Tools Atlas Reviewed Wave6 Promotion
on:
  pull_request:
    paths:
      - '.github/workflows/construction-tools-atlas-image-wave6-promotion.yml'
      - 'tools/construction-tools-atlas/scripts/promote-image-wave6-reviewed-v2.3.cjs'

permissions:
  contents: write
  actions: read

jobs:
  prepare-reviewed-two-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize SHA-verified images from earlier successful staging artifact
        uses: actions/download-artifact@v4
        with:
          name: construction-atlas-wave6-pinned-source-staging
          run-id: 41173221395
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cta-wave6-sources
      - name: Promote only the two visually reviewed source images (idempotent on synchronize)
        run: |
          if [ -f tools/construction-tools-atlas/data/image-wave6-sources-v2.3.json ]; then
            echo "Two formally reviewed sources already committed; verify generated state."
          else
            for id in hammer_drill tape_measure; do
              mkdir -p "tools/construction-tools-atlas/images/$id"
              cp "${{ runner.temp }}/cta-wave6-sources/$id/source.jpg" "tools/construction-tools-atlas/images/$id/source.jpg"
              cp "${{ runner.temp }}/cta-wave6-sources/$id/primary.webp" "tools/construction-tools-atlas/images/$id/primary.webp"
              cp "${{ runner.temp }}/cta-wave6-sources/$id/thumb.webp" "tools/construction-tools-atlas/images/$id/thumb.webp"
            done
            node tools/construction-tools-atlas/scripts/promote-image-wave6-reviewed-v2.3.cjs
          fi
      - name: Regenerate frozen image and public SEO snapshots
        run: |
          node tools/construction-tools-atlas/scripts/audit-image-inventory-v2.3.cjs --write > /dev/null
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --write > /dev/null
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs
          node tools/construction-tools-atlas/scripts/build-affiliate-image-acquisition-queue-v2.3.cjs --write
      - name: Validate all Atlas publication and source integrity gates
        run: |
          node tools/construction-tools-atlas/scripts/check-image-registry-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-image-attribution-v2.3.cjs
          node tools/construction-tools-atlas/scripts/image-lifecycle-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-image-inventory-v2.3.cjs --check > /dev/null
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --check > /dev/null
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/build-affiliate-image-acquisition-queue-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/build-comparison-pages-v2.3.cjs --check
      - name: Commit reviewed sources and generated outputs to this PR branch
        run: |
          git config user.name "nicheworks-image-wave6[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/construction-tools-atlas sitemap.xml
          git diff --cached --quiet && { echo 'No change to publish'; exit 0; }
          git commit -m "Construction Atlas: promote two reviewed images and publish 35 canonical details"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
