name: TrashNavi Wave24 publication v3 temp
on:
  push:
    branches:
      - feat/trashnavi-batch-wave24-publication-20260915
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runner, publish, verify, and self-clean
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/trashnavi-wave24-publication-temp.py')
          s=p.read_text()
          old="status = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()"
          new="status = subprocess.check_output(['git', 'status', '--short', '--untracked-files=all'], text=True).splitlines()"
          assert s.count(old)==1
          s=s.replace(old,new)
          old_cleanup="run('git', 'rm', '.github/workflows/trashnavi-wave24-publication-v2-temp.yml', '.github/trashnavi-wave24-publication-temp.py')"
          new_cleanup="run('git', 'rm', '.github/workflows/trashnavi-wave24-publication-v2-temp.yml', '.github/workflows/trashnavi-wave24-publication-v3-temp.yml', '.github/trashnavi-wave24-publication-temp.py')"
          assert s.count(old_cleanup)==1
          p.write_text(s.replace(old_cleanup,new_cleanup))
          PY
          python3 .github/trashnavi-wave24-publication-temp.py
