name: TrashNavi Wave 20 publication temp
on:
  push:
    branches:
      - feat/trashnavi-tokushima-publication-wave20-20260914
permissions:
  contents: write
jobs:
  publication:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish Tokushima municipality page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('tools/trashnavi')

          manifest_path=root/'municipality-page-manifest.json'
          manifest=json.loads(manifest_path.read_text())
          if len([x for x in manifest if x.get('publish')]) != 26: raise SystemExit('manifest baseline must be 26')
          if any(str(x.get('lgcode'))=='362018' for x in manifest): raise SystemExit('Tokushima already in manifest')
          manifest.append({'lgcode':'362018','pref_slug':'tokushima','city_slug':'tokushima','publish':True})
          manifest_path.write_text('[\n'+',\n'.join('  '+json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in manifest)+'\n]\n')

          gen_path=root/'scripts/generate-municipality-pages.mjs'
          gen=gen_path.read_text()
          old="if(outputs.length!==26) throw new Error(`municipality page count must be 26; got ${outputs.length}`);"
          new="if(outputs.length!==27) throw new Error(`municipality page count must be 27; got ${outputs.length}`);"
          if old not in gen: raise SystemExit('generator 26-page guard not found')
          gen_path.write_text(gen.replace(old,new,1))

          aff_path=root/'scripts/check-affiliate-contract.mjs'
          aff=aff_path.read_text()
          old="check(manifest.length === 26, `expected 26 published municipality pages, got ${manifest.length}`);"
          new="check(manifest.length === 27, `expected 27 published municipality pages, got ${manifest.length}`);"
          if old not in aff: raise SystemExit('affiliate 26-page guard not found')
          aff_path.write_text(aff.replace(old,new,1))

          index_path=root/'index.html'
          index=index_path.read_text()
          needle='<a href="/tools/trashnavi/okinawa/naha/">那覇市</a></div>'
          repl='<a href="/tools/trashnavi/okinawa/naha/">那覇市</a><a href="/tools/trashnavi/tokushima/tokushima/">徳島市</a></div>'
          if needle not in index: raise SystemExit('Naha index tail not found')
          index_path.write_text(index.replace(needle,repl,1))

          ai_path=root/'ai-reference.json'
          ai=json.loads(ai_path.read_text())
          if ai.get('published_municipality_count')!=26 or len(ai.get('municipalities',[]))!=26: raise SystemExit('AI baseline not 26/26')
          if any(str(x.get('lgcode'))=='362018' for x in ai['municipalities']): raise SystemExit('Tokushima already in AI reference')
          ai['published_municipality_count']=27
          ai['municipalities'].append({'lgcode':'362018','pref_slug':'tokushima','city_slug':'tokushima','url':'https://nicheworks.app/tools/trashnavi/tokushima/tokushima/'})
          lines=['{']
          keys=['schema_version','snapshot_date','canonical_tool','purpose','scope','authority_policy','inference_policy','source_manifest']
          for k in keys: lines.append(f'  "{k}": {json.dumps(ai[k],ensure_ascii=False)},')
          lines.append('  "published_municipality_count": 27,')
          lines.append('  "municipalities": [')
          for i,x in enumerate(ai['municipalities']): lines.append('    '+json.dumps(x,ensure_ascii=False,separators=(',',':'))+(',' if i<len(ai['municipalities'])-1 else ''))
          lines += ['  ]','}']
          ai_path.write_text('\n'.join(lines)+'\n')

          sitemap_path=pathlib.Path('sitemap.xml')
          sitemap=sitemap_path.read_text()
          canonical='https://nicheworks.app/tools/trashnavi/tokushima/tokushima/'
          if canonical in sitemap: raise SystemExit('Tokushima already in root sitemap')
          block='  <url>\n    <loc>'+canonical+'</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>\n'
          if '</urlset>' not in sitemap: raise SystemExit('root sitemap closing tag missing')
          sitemap_path.write_text(sitemap.replace('</urlset>',block+'</urlset>',1))

          spec_path=root/'SPEC.md'
          spec=spec_path.read_text()
          anchor='- 沖縄県 那覇市 — `/tools/trashnavi/okinawa/naha/`\n\n生成器は'
          wave='- 沖縄県 那覇市 — `/tools/trashnavi/okinawa/naha/`\n\nWave 20では、供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から徳島市を選定した。徳島市公式のごみ分別導線を具体的な現行ページへ更新し、令和8年度家庭ごみ収集日程表と粗大ごみ案内を追加して、3種類のwaste-specific canonical typeを持つpreferred candidateへ引き上げた。data enrichment検証後、公開対象を **27自治体** とする。\n\n- 徳島県 徳島市 — `/tools/trashnavi/tokushima/tokushima/`\n\n生成器は'
          if anchor not in spec: raise SystemExit('Wave19 publication anchor missing')
          spec=spec.replace(anchor,wave,1)
          spec=spec.replace('- [x] 公開26自治体をmanifest allowlistで管理する。','- [x] 公開27自治体をmanifest allowlistで管理する。',1)
          spec=spec.replace('- [x] generator `--check` で26ページの生成driftを検出する。','- [x] generator `--check` で27ページの生成driftを検出する。',1)
          acc='- [x] Wave 19で那覇市をpreferred candidateへ引き上げ、自治体pageを公開する。'
          if acc not in spec: raise SystemExit('Wave19 acceptance anchor missing')
          spec=spec.replace(acc,acc+'\n- [x] Wave 20で徳島市をpreferred candidateへ引き上げ、自治体pageを公開する。',1)
          data='- `tools/trashnavi/data/direct-waste-links-supply-wave19.json` — 那覇市のWave 19 waste-search / collection-calendar / bulky-waste enrichment。'
          if data not in spec: raise SystemExit('Wave19 data evidence anchor missing')
          spec=spec.replace(data,data+'\n- `tools/trashnavi/data/direct-waste-links-supply-wave20.json` — 徳島市のWave 20 collection-calendar / bulky-waste enrichment。',1)
          page='- `tools/trashnavi/okinawa/naha/index.html` — Wave 19 municipality page。'
          if page not in spec: raise SystemExit('Wave19 page evidence anchor missing')
          spec=spec.replace(page,page+'\n- `tools/trashnavi/tokushima/tokushima/index.html` — Wave 20 municipality page。',1)
          marker='### Wave 19 verified coverage baseline'
          pos=spec.find(marker)
          if pos<0: raise SystemExit('Wave19 baseline heading missing')
          nextpos=spec.find('\n### ',pos+len(marker))
          if nextpos<0: raise SystemExit('heading after Wave19 baseline missing')
          baseline='''\n\n### Wave 20 verified coverage baseline\n\n2026-09-14のWave 20 CI基準値は次のとおり。\n\n- municipalities: 1,916\n- records: 2,219 / 2,219 valid HTTP(S)\n- municipalities with any waste-specific direct link: 78\n- publish candidates (2+ types): 27\n- preferred candidates (3+ types): 27\n- collection-calendar coverage: 27 municipalities\n- bulky-waste coverage: 26 municipalities\n- waste-search coverage: 1 municipality\n- drop-off facility coverage: 1 municipality\n- waste-app coverage: 1 municipality\n- direct-link inventory: 23 datasets / 151 records / 132 unique URLs / 0 invalid URLs\n- invalid records: 0\n- unknown type labels: 0\n'''
          spec=spec[:nextpos]+baseline+spec[nextpos:]
          spec_path.write_text(spec)
          PY

          node tools/trashnavi/scripts/generate-municipality-pages.mjs

          python3 - <<'PY'
          import json, pathlib
          page=pathlib.Path('tools/trashnavi/tokushima/tokushima/index.html').read_text()
          canonical='https://nicheworks.app/tools/trashnavi/tokushima/tokushima/'
          urls=[
            'https://www.city.tokushima.tokushima.jp/kurashi/recycle/gomi/kateigomi/dashi/wakedashi.html',
            'https://www.city.tokushima.tokushima.jp/kurashi/recycle/gomi/R08gomischedule.html',
            'https://www.city.tokushima.tokushima.jp/kurashi/recycle/gomi/sodaigomi.html'
          ]
          if page.count('class="official-link-card"') != 3: raise SystemExit('Tokushima page must have exactly 3 official cards')
          if f'<link rel="canonical" href="{canonical}">' not in page: raise SystemExit('Tokushima canonical missing')
          for u in urls:
              if u not in page: raise SystemExit(f'Tokushima official URL missing: {u}')
          if 'https://www.city.tokushima.tokushima.jp/kurashi/recycle/gomi/"' in page: raise SystemExit('legacy generic Tokushima URL leaked')
          if '2026年の収集カレンダー' not in page: raise SystemExit('Tokushima FY2026 calendar callout missing')
          if '[PR]' not in page or 'trashnaviAmazonAffiliate' not in page: raise SystemExit('Tokushima affiliate block missing')
          ai=json.loads(pathlib.Path('tools/trashnavi/ai-reference.json').read_text())
          if ai.get('published_municipality_count')!=27 or len(ai.get('municipalities',[]))!=27: raise SystemExit('AI reference must be 27/27')
          rows=[x for x in ai['municipalities'] if str(x.get('lgcode'))=='362018']
          if len(rows)!=1 or rows[0].get('url')!=canonical: raise SystemExit('AI Tokushima entry invalid')
          for sm in ['sitemap.xml','sitemap-trashnavi.xml']:
              text=pathlib.Path(sm).read_text()
              if text.count(canonical)!=1: raise SystemExit(f'{sm}: Tokushima canonical count must be 1')
          print('Tokushima publication contract: OK')
          PY

          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs

          rm .github/workflows/trashnavi-wave20-publication-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sitemap-trashnavi.xml sitemap.xml tools/trashnavi/SPEC.md tools/trashnavi/ai-reference.json tools/trashnavi/index.html tools/trashnavi/municipality-page-manifest.json tools/trashnavi/tokushima/tokushima/index.html tools/trashnavi/scripts/check-affiliate-contract.mjs tools/trashnavi/scripts/generate-municipality-pages.mjs .github/workflows/trashnavi-wave20-publication-temp.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git commit -m "Publish Tokushima as 27th TrashNavi municipality page"
          git push
