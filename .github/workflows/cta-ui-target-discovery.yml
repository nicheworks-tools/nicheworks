name: CTA UI target discovery
on:
  push:
    branches: ['fix/construction-atlas-ui-mock-v2-parity-20260916']
    paths: ['.github/workflows/cta-ui-target-discovery.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find common purchase-intent canonical IDs
        run: |
          python3 - <<'PY'
          import json, glob
          wanted=['インパクトドライバー','Impact Driver','ドリルドライバー','Drill Driver','振動ドリル','Hammer Drill','コアドリル','Core Drill','ランダムサンダー','Random Orbit Sander','スピードスクエア','Speed Square','ノミ','Chisel','手のこ','Hand Saw','脚立','Stepladder','レーザー距離計','Laser Distance Meter','オートレベル','Auto Level','安全靴','Safety Shoes','防じんマスク','Dust Mask','耐切創手袋','Cut Resistant Gloves']
          hits=[]
          for fn in glob.glob('tools/construction-tools-atlas/data/*.json'):
            try: obj=json.load(open(fn,encoding='utf-8'))
            except: continue
            items=obj if isinstance(obj,list) else obj.get('entries',[]) if isinstance(obj,dict) else []
            for x in items:
              if not isinstance(x,dict): continue
              s=json.dumps(x,ensure_ascii=False)
              if any(w in s for w in wanted):
                hits.append((x.get('id') or x.get('entry_id'), x.get('term'), fn))
          for h in hits: print('CTA_PURCHASE_TARGET',h)
          PY
