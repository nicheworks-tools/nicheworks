name: Pattern Dictionary v1 product QA v2

on:
  push:
    branches:
      - audit/pattern-dictionary-v1-product-quality-20260917
    paths:
      - .github/workflows/pattern-dictionary-v1-product-qa-v2.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pattern-dictionary-v1-product-quality-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static product gates
        run: |
          set -euo pipefail
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/tests/publication-test.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node tools/pattern-dictionary/tests/compare-test.mjs
          node tools/pattern-dictionary/tests/affiliate-test.mjs
          node tools/pattern-dictionary/tests/browse-mobile-test.mjs
          git diff --check
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/pd-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/tools/pattern-dictionary/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pd-http.log
          exit 1
      - name: Run end-to-end product QA
        run: |
          cat > .pd-v1-product-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const axePath = require.resolve('axe-core/axe.min.js');
          const base = 'http://127.0.0.1:8000/tools/pattern-dictionary/';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            await context.route('**/*',route=>{const u=new URL(route.request().url());if(u.hostname==='127.0.0.1')return route.continue();return route.abort();});
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            const goto=async url=>{errors.length=0;await page.goto(url,{waitUntil:'domcontentloaded'});};
            const waitCards=()=>page.waitForFunction(()=>document.querySelectorAll('#pattern-grid .pd-card').length===100);
            const noOverflow=async label=>{const v=await page.evaluate(()=>({s:document.documentElement.scrollWidth,c:document.documentElement.clientWidth}));assert.ok(v.s<=v.c+1,`${label}: ${v.s}/${v.c}`)};

            // Home, partial-name autocomplete, and explicit search accessible names.
            await goto(base); await waitCards();
            assert.equal(await page.locator('#q').getAttribute('aria-label'),'模様を検索');
            await page.locator('#q').fill('千鳥');
            await page.waitForFunction(()=>{const x=document.querySelector('#autocomplete');return x&&!x.hidden&&x.textContent.includes('千鳥格子')});
            assert.deepEqual(errors,[]);
            await goto(base+'en/'); await waitCards();
            assert.equal(await page.locator('#q').getAttribute('aria-label'),'Search patterns');
            await page.locator('#q').fill('hound');
            await page.waitForFunction(()=>{const x=document.querySelector('#autocomplete');return x&&!x.hidden&&/Houndstooth/i.test(x.textContent)});
            assert.deepEqual(errors,[]);

            // Search and zero-result state.
            await goto(base+'search.html?q='+encodeURIComponent('白黒のギザギザしたチェック'));
            assert.equal(await page.locator('#q').getAttribute('aria-label'),'模様を検索');
            await page.waitForFunction(()=>document.querySelector('#results')?.textContent.includes('千鳥格子'));
            await page.locator('#q').fill('zzzz-no-known-pattern-987654321');
            await page.locator('#search-form').evaluate(f=>f.requestSubmit());
            await page.waitForFunction(()=>/特定できません/.test(document.querySelector('#results')?.textContent||''));
            await goto(base+'en/search.html?q=houndstooth');
            assert.equal(await page.locator('#q').getAttribute('aria-label'),'Search patterns');
            await page.waitForFunction(()=>/Houndstooth/i.test(document.querySelector('#results')?.textContent||''));

            // Detail, image alt, language preservation, affiliate link integrity.
            await goto(base+'patterns/houndstooth/'); await page.waitForSelector('.pd-detail-image');
            const d=await page.locator('.pd-detail-image').evaluate(i=>({alt:i.alt,nw:i.naturalWidth,nh:i.naturalHeight,complete:i.complete}));
            assert.match(d.alt,/千鳥格子/); assert.ok(d.complete&&d.nw===1536&&d.nh===1536);
            const href=await page.locator('.pd-lang').getAttribute('href'); assert.ok(href.endsWith('/en/patterns/houndstooth/'));
            await page.waitForFunction(()=>document.querySelectorAll('a[href*="amazon.co.jp"]').length>=2);
            const amazon=await page.locator('a[href*="amazon.co.jp"]').evaluateAll(xs=>xs.map(a=>({href:a.href,rel:a.rel,text:a.textContent.trim()})));
            assert.ok(amazon.length>=2&&amazon.length<=4);
            for(const a of amazon){assert.match(a.href,/tag=nicheworks09-22/);assert.match(a.rel,/sponsored/);assert.ok(a.text.length>0)}
            assert.deepEqual(errors,[]);

            // Compare, meaningful image alt, and stale-copy guard.
            await goto(base+'compare.html?a=chevron&b=herringbone'); await page.waitForSelector('.pd-compare-guide');
            const alts=await page.locator('.pd-compare-panel img').evaluateAll(xs=>xs.map(i=>i.alt));
            assert.ok(alts.every(Boolean));
            const ctext=await page.locator('#compare').innerText(); assert.match(ctext,/シェブロン/); assert.match(ctext,/ヘリンボーン/); assert.ok(!/20柄/.test(ctext));

            // Supported widths and mobile 2-column browse.
            for(const width of [1440,768,390,320]){
              await page.setViewportSize({width,height:900}); await goto(base); await waitCards(); await noOverflow(`home-${width}`);
              if(width<=390){const b=await page.locator('#pattern-grid .pd-card').evaluateAll(xs=>xs.slice(0,3).map(x=>{const r=x.getBoundingClientRect();return{x:r.x,y:r.y}}));assert.ok(Math.abs(b[0].y-b[1].y)<2);assert.ok(b[2].y>b[0].y+5)}
              await goto(base+'compare.html?a=chevron&b=herringbone'); await page.waitForSelector('.pd-compare-guide'); await noOverflow(`compare-${width}`);
            }

            // Keyboard order.
            await page.setViewportSize({width:390,height:844}); await goto(base); await page.locator('#q').focus(); await page.keyboard.press('Tab');
            assert.equal(await page.evaluate(()=>document.activeElement?.tagName),'BUTTON');

            // WCAG A/AA serious/critical scan of representative surfaces.
            const urls=[base,base+'en/',base+'search.html?q='+encodeURIComponent('白黒のギザギザしたチェック'),base+'patterns/houndstooth/',base+'compare.html?a=chevron&b=herringbone'];
            const violations=[];
            for(const url of urls){
              await goto(url);
              if(url===base||url===base+'en/')await waitCards();
              if(url.includes('search.html'))await page.waitForFunction(()=>document.querySelector('#results')?.textContent.trim().length>0);
              if(url.includes('/patterns/'))await page.waitForSelector('.pd-detail-image');
              if(url.includes('compare.html'))await page.waitForSelector('.pd-compare-guide');
              await page.addScriptTag({path:axePath});
              const r=await page.evaluate(async()=>axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa']}}));
              for(const v of r.violations)violations.push({url,id:v.id,impact:v.impact,help:v.help,nodes:v.nodes.length});
            }
            console.log('AXE_VIOLATIONS',JSON.stringify(violations,null,2));
            const blocking=violations.filter(v=>v.impact==='serious'||v.impact==='critical');
            assert.deepEqual(blocking,[]);
            console.log('OK: canonical v1 end-to-end product QA passed.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node .pd-v1-product-qa.cjs
