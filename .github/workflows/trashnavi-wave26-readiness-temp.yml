          new='"data/direct-waste-links-supply-wave25.json","data/direct-waste-links-supply-wave26.json"]'
          assert old in s and new not in s
          p.write_text(s.replace(old,new,1))
          PY
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const dir='tools/trashnavi/data';
          const files=fs.readdirSync(dir).filter(x=>/^direct-waste-links.*\.json$/.test(x));
          const rows=files.flatMap(f=>JSON.parse(fs.readFileSync(path.join(dir,f),'utf8')).map(x=>({...x,_file:f})));
          const targets=['221007','221309','281000','341002','431001'];
          const mapType=x=>x.link_type || ({'ごみ分別ページ':'waste_sorting','収集カレンダー':'collection_calendar','粗大ごみ':'bulky_waste','粗大ごみ申込み':'bulky_application','検索ページ':'waste_search','持込施設':'dropoff_facility','ごみ分別アプリ':'waste_app'}[x.type]);
          for (const lg of targets) {
            const r=rows.filter(x=>x.lgcode===lg);
            const types=[...new Set(r.map(mapType).filter(x=>x&&x!=='municipal_home'))];
            if(types.length<3) throw new Error(`${lg}: only ${types.join(',')}`);
            const urls=r.map(x=>x.url).filter(Boolean);
            if(new Set(urls).size!==urls.length) throw new Error(`${lg}: duplicate URL across direct datasets`);
            console.log(lg, types.sort().join(','));
          }
          NODE
          git diff --check
          git add tools/trashnavi/app.js tools/trashnavi/data/direct-waste-links-supply-wave26.json
          git commit -m "Add TrashNavi Wave26 readiness data"
          git rm .github/workflows/trashnavi-wave26-readiness-temp.yml
          git commit -m "Remove TrashNavi Wave26 temp workflow"
          git push origin HEAD:feat/trashnavi-batch-wave26-readiness-20260915
