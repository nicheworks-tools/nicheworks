name: Pattern Dictionary Wave 5 visual review v2
on:
  push:
    branches: [feat/pattern-dictionary-wave5-production-staging-20260916]
    paths: [.github/workflows/pattern-dictionary-wave5-visual-review-v2.yml]
permissions:
  contents: read
jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave5-production-staging-20260916
      - run: python3 -m pip install --quiet pillow
      - name: Build v2 contact sheet
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          ids=['suzani','kente','bogolan','adire','kuba-cloth','sashiko','kantha','otomi-embroidery','african-wax-print','block-print','zebra-print','tiger-print','snake-print','cow-print','giraffe-print','dalmatian-spots','camouflage','tie-dye','marbling','terrazzo']
          root=Path('tools/pattern-dictionary/assets/reference'); cw,ch,t=320,350,288
          out=Image.new('RGB',(cw*4,ch*5),'white'); d=ImageDraw.Draw(out)
          for i,pid in enumerate(ids):
            im=Image.open(root/f'{pid}.png').convert('RGB'); im.thumbnail((t,t)); x=(i%4)*cw+16; y=(i//4)*ch+16
            out.paste(im,(x,y)); d.text((x,y+t+8),f'{81+i:03d} {pid}',fill='black')
          out.save('wave5-contact-sheet-v2.jpg',quality=93)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pattern-dictionary-wave5-visual-review-v2
          path: wave5-contact-sheet-v2.jpg
