name: Mini Game score validation
on:
  pull_request:
    paths:
      - 'tools/mini-game-utility/**'
      - 'tests/mini-game-score-validation.test.cjs'
      - '.github/workflows/mini-game-score-validation.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production score handling
        run: node tests/mini-game-score-validation.test.cjs
