name: Temporary Phone QuickCheck foldable wave 8

on:
  push:
    branches:
      - feat/phone-quickcheck-foldables-wave8-20260914
    paths:
      - .github/workflows/tmp-phone-quickcheck-foldables-wave8.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-quickcheck-foldables-wave8-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Adjust validator count guard
        run: sed -i "s|'scripts/check-phone-quickcheck-data.mjs', 1|'scripts/check-phone-quickcheck-data.mjs', 2|" scripts/tmp-phone-quickcheck-foldables-wave8.mjs
      - run: node scripts/tmp-phone-quickcheck-foldables-wave8.mjs
      - run: node scripts/check-phone-quickcheck-data.mjs
      - run: node scripts/check-phone-quickcheck-source-semantics.mjs
      - run: node scripts/check-phone-quickcheck-affiliate.mjs
      - run: node tools/phone-quickcheck/tests/behavior.test.mjs
      - name: Commit validated canonical files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/phone-quickcheck/data/phones.json \
            tools/phone-quickcheck/index.html \
            tools/phone-quickcheck/usage.html \
            tools/phone-quickcheck/SPEC.md \
            docs/tools/phone-quickcheck.md \
            scripts/check-phone-quickcheck-data.mjs \
            tools/phone-quickcheck/tests/behavior.test.mjs
          git diff --cached --check
          git commit -m "Phone QuickCheck: add foldable wave 8"
          git push origin HEAD:feat/phone-quickcheck-foldables-wave8-20260914
