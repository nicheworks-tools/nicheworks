name: CTA q014 identity apply

on:
  push:
    branches:
      - audit/construction-atlas-q014-identity-closure-20260916
    paths:
      - '.github/workflows/cta-q014-identity-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/construction-atlas-q014-identity-closure-20260916
          fetch-depth: 0
      - name: Apply q014 identity decisions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('tools/construction-tools-atlas/data')
          rp=root/'canonical-redirects-v2.3.json'
          ip=root/'canonical-identity-resolutions-v2.3.json'
          r=json.loads(rp.read_text())
          r['version']='2026-09-16-q014-identity-closure-1'
          additions=[
            ('q014_roof_tile','roof_tile','same roof-tile canonical concept'),
            ('q014_roof_batten','roof_batten','same roof/tile batten canonical concept'),
            ('q014_valley_flashing','valley_flashing','same roof-valley flashing canonical concept'),
            ('q014_drip_edge','drip_edge','same drip-edge flashing canonical concept'),
            ('q014_exterior_siding','siding','same generic exterior-siding canonical concept'),
            ('q014_weather_barrier','housewrap','same weather-resistive housewrap membrane concept'),
            ('q014_soffit_board','soffit','same soffit-board/eaves-soffit canonical concept'),
            ('q014_window_sash','window_sash','same operable window-sash canonical concept'),
            ('q014_threshold','threshold','same doorway-threshold canonical concept'),
            ('q014_window_flashing_tape','flashing_tape','same opening/window flashing-tape concept'),
            ('q014_masking_for_sealant','masking_tape','same masking-tape material; q014 only narrows the use case')
          ]
          by={x['from']:x for x in r['redirects']}
          for f,t,reason in additions:
            if f in by:
              by[f].update(to=t,reason=reason)
            else:
              r['redirects'].append({'from':f,'to':t,'reason':reason})
          rp.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')

          d=json.loads(ip.read_text())
          d['version']='2026-09-16-q014-identity-closure-1'
          d['policy']['purpose']='Record reviewed canonical naming, taxonomy, alias, and distinct-concept decisions discovered during q011/q012/q013/q014 identity closure.'
          def upsert(arr,key,row):
            for i,x in enumerate(arr):
              if x.get(key)==row.get(key): arr[i]=row; return
            arr.append(row)
          for row in [
            {'id':'guardrail','from':{'ja':'手すり','en':'Guardrail'},'to':{'ja':'墜落防止手すり','en':'Guardrail'},'reason':'Reserve generic 手すり/Handrail for the grasp/support rail; this canonical is the fall-protection barrier system.'},
            {'id':'q014_fascia_board','from':{'ja':'破風板','en':'Fascia Board'},'to':{'ja':'破風板','en':'Bargeboard'},'reason':'破風板 is the gable-edge bargeboard; fascia/nose board is a separate eaves-edge canonical.'}
          ]: upsert(d['name_overrides'],'id',row)
          for row in [
            {'id':'roof_batten','from':'material','to':'component','reason':'Roof batten is an installed support member/component.'},
            {'id':'drip_edge','from':'material','to':'component','reason':'Drip edge is installed edge flashing/trim, not a bulk material.'},
            {'id':'caulking_sealant','from':'tool','to':'material','reason':'Sealant is a joint-sealing material, not a tool.'},
            {'id':'screw_set','from':'tool','to':'fastener','reason':'The canonical represents screws/fasteners rather than a tool.'},
            {'id':'flashing_tape','from':'materials','to':'material','reason':'Normalize flashing tape to the singular material taxonomy.'},
            {'id':'masking_tape','from':'tool','to':'material','reason':'Masking tape is a consumable material rather than a tool.'},
            {'id':'q014_urethane_waterproofing','from':'material','to':'process','reason':'The entry describes a liquid-applied waterproofing method/system.'},
            {'id':'q014_frp_waterproofing','from':'material','to':'process','reason':'The entry describes an FRP waterproofing method/system.'},
            {'id':'q014_sheet_membrane','from':'material','to':'process','reason':'シート防水/Sheet Membrane Waterproofing is a waterproofing method, not the membrane material itself.'},
            {'id':'q014_torch_on_membrane','from':'material','to':'process','reason':'Torch-on membrane entry describes the torch-applied waterproofing method.'},
            {'id':'q014_vented_rainscreen','from':'system','to':'component','reason':'The entry describes the ventilation/rainscreen batten member itself.'}
          ]: upsert(d['type_overrides'],'id',row)
          alias_rows=[
            {'id':'metal_roof_panel','ja':['ガルバリウム鋼板屋根'],'en':[],'reason':'Galvalume steel roofing is a specific metal-roof subtype retained as q014_galvalume_roof.'},
            {'id':'drain','ja':['ルーフドレン'],'en':['Roof drain'],'reason':'Roof drain is a roof-specific drain canonical retained separately from the generic drain family.'},
            {'id':'siding','ja':['窯業系サイディング','金属サイディング'],'en':[],'reason':'Fiber-cement and metal siding are specific siding subtypes retained as separate q014 canonicals.'},
            {'id':'furring_strip','ja':['通気胴縁'],'en':[],'reason':'Vented rainscreen batten is a specific exterior-cavity member retained separately from generic furring strip.'},
            {'id':'sill','ja':[],'en':['Sill pan'],'reason':'Sill pan is a specific drainage flashing component, not a synonym for the broader sill canonical.'}
          ]
          for row in alias_rows: upsert(d['alias_removals'],'id',row)
          pairs=[
            ('q014_galvalume_roof','metal_roof_panel','keep_distinct_parent_subtype','Galvalume steel roofing is a specific metal-roof subtype; the existing metal-roof canonical remains the broader family.'),
            ('q014_roof_drain','drain','keep_distinct_scope','Roof drain is the roof/balcony drainage fitting; drain is the broader drain family.'),
            ('q014_fiber_cement_siding','siding','keep_distinct_parent_subtype','Fiber-cement siding is a specific siding material subtype.'),
            ('q014_metal_siding','siding','keep_distinct_parent_subtype','Metal siding is a specific siding material subtype.'),
            ('q014_vented_rainscreen','furring_strip','keep_distinct_scope','The q014 member specifically forms an exterior ventilation/rainscreen cavity; generic furring strip is broader.'),
            ('q014_fascia_board','fascia_board','keep_distinct','q014 破風板 is Bargeboard at the gable edge; fascia_board is 鼻隠し/Fascia at the eaves edge.'),
            ('q014_sill_pan','sill','keep_distinct_parent_subtype','Sill pan is drainage flashing beneath an opening; sill is the broader lower-window member.'),
            ('q014_handrail','guardrail','keep_distinct','Handrail is grasp/support rail for walking; guardrail is a fall-protection barrier.'),
            ('q014_eave_flashing','flashing','keep_distinct_parent_subtype','Eave flashing is a location-specific flashing detail; flashing is the broad component family.'),
            ('q014_roof_sealant','caulking_sealant','keep_distinct_parent_subtype','Roof sealant is an exterior roofing-use subtype of generic sealant.'),
            ('q014_roof_screw','screw_set','keep_distinct_parent_subtype','Roofing screw is a sealing-washer roofing fastener subtype; screw_set is generic screws.'),
            ('q014_bitumen_primer','primer_003','keep_distinct_parent_subtype','Bitumen primer is a waterproofing-specific primer subtype.'),
            ('q014_bitumen_primer','primer','keep_distinct_parent_subtype','Bitumen primer is a waterproofing-specific primer subtype.'),
            ('q014_sheet_membrane','waterproof_membrane','keep_distinct_process_material','q014 is the sheet-waterproofing method; waterproof_membrane is the membrane material.'),
            ('q014_drain_strainer','q015_strainer','keep_distinct_scope','Roof drain strainer screens debris at a roof drain; q015 strainer is an inline piping fitting.'),
            ('q014_overflow_drain','drain','keep_distinct_parent_subtype','Overflow drain is a secondary emergency drainage fitting.'),
            ('q014_siding_starter','siding','keep_distinct_part_parent','Starter strip is a supporting installation component, not siding material itself.'),
            ('q014_siding_clip','siding','keep_distinct_part_parent','Siding clip is fastening hardware, not siding material.'),
            ('q014_siding_joint','siding','keep_distinct_part_parent','Siding joint is the weather-sealed interface between panels.'),
            ('q014_housewrap_tape','housewrap','keep_distinct_part_parent','Housewrap tape seals the membrane; it is not the membrane itself.'),
            ('q014_soffit_vent','soffit','keep_distinct_part_parent','Soffit vent is a ventilation component installed in/through the soffit.'),
            ('q014_aluminum_sash','window_sash','keep_distinct_parent_subtype','Aluminum sash is a material-specific window-sash subtype.'),
            ('q014_resin_sash','window_sash','keep_distinct_parent_subtype','Vinyl/resin sash is a material-specific window-frame subtype.'),
            ('q014_door_hinge','q014_gate_hinge','keep_distinct_scope','Door hinge and gate hinge serve different assemblies despite sharing hinge mechanics.'),
            ('q014_sealer_coat','q016_concrete_sealer','keep_distinct_scope','Sealer coat here is an adhesion/absorption-control undercoat; concrete sealer is a protective surface treatment.'),
            ('q014_sealer_coat','q016_grout_sealer','keep_distinct_scope','Sealer coat here is an undercoat; grout sealer is a protective treatment for grout.'),
            ('q014_scaffold_sheet','scaffold','keep_distinct_part_parent','Scaffold mesh sheet is containment sheeting attached to a scaffold, not the scaffold structure.'),
            ('q014_handrail','handrail_bracket','keep_distinct_part_parent','Handrail is the grasp rail; handrail bracket is its support hardware.'),
            ('q014_guard_post','guardrail','keep_distinct_part_parent','Guardrail post supports the barrier system; it is not the complete guardrail.'),
            ('q014_exterior_fence','temporary_fence','keep_distinct_scope','Exterior fence is permanent/general site boundary work; temporary fence is construction-site temporary enclosure.'),
            ('q014_gate','q015_gate_valve','keep_distinct_polysemy','Site gate and gate valve are unrelated meanings of gate.'),
            ('q014_concrete_paver','concrete','keep_distinct_parent_subtype','Concrete paver slab is a precast paving product; concrete is the broad material.'),
            ('q014_curb_block','q014_granite_curb','keep_distinct_parent_subtype','Granite curb is a material-specific curb subtype.'),
            ('q014_vibratory_roller','paint_roller','keep_distinct_polysemy','Compaction roller and paint roller are unrelated equipment/tool meanings.'),
            ('q014_hand_roller','paint_roller','keep_distinct_polysemy','Walk-behind compaction roller and paint roller are unrelated meanings.'),
            ('q014_asphalt_rake','q013_soil_rake','keep_distinct_scope','Asphalt rake is specialized for hot-mix paving; soil rake is for soil/gravel grading.'),
            ('q014_trench_drain','drain','keep_distinct_parent_subtype','Trench drain is a linear surface-water drainage system; drain is broader.'),
            ('q014_drain_channel','channel','keep_distinct_polysemy','Drainage channel conveys water; structural/metal channel is a framing section.'),
            ('q014_sediment_trap','trap','keep_distinct_polysemy','Sediment trap captures solids; plumbing trap maintains a water seal against sewer gas.'),
            ('q014_drain_cover','drain','keep_distinct_part_parent','Drain cover protects the opening; drain is the drainage fitting/system.'),
            ('q014_expansion_joint_filler','expansion_joint','keep_distinct_part_parent','Joint filler is compressible fill material installed inside an expansion joint.'),
            ('q014_joint_sealant_exterior','caulking_sealant','keep_distinct_parent_subtype','Exterior joint sealant is an exterior-joint application subtype of generic sealant.'),
            ('q014_polyurethane_sealant','caulking_sealant','keep_distinct_parent_subtype','Polyurethane sealant is a chemistry-specific sealant subtype.'),
            ('q014_modified_silicone_sealant','silicone_sealant','keep_distinct','Modified-silicone/MS sealant and silicone sealant are different sealant chemistries.'),
            ('q014_sealant_spatula','caulking_sealant','keep_distinct_tool_material','Sealant spatula is the tooling instrument; sealant is the material being tooled.')
          ]
          existing={(min(x.get('a',''),x.get('b','')),max(x.get('a',''),x.get('b',''))):i for i,x in enumerate(d['resolved_distinct_pairs'])}
          for a,b,res,reason in pairs:
            row={'a':a,'b':b,'resolution':res,'reason':reason}
            k=(min(a,b),max(a,b))
            if k in existing: d['resolved_distinct_pairs'][existing[k]]=row
            else: d['resolved_distinct_pairs'].append(row)
          ip.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate candidate audit after decisions
        run: node tools/construction-tools-atlas/scripts/audit-quality-batch-identity-candidates-v2.3.cjs --batch=014
      - name: Commit q014 identity decisions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/construction-tools-atlas/data/canonical-redirects-v2.3.json tools/construction-tools-atlas/data/canonical-identity-resolutions-v2.3.json
          git commit -m 'feat(construction-atlas): resolve q014 canonical identity' || exit 0
          git pull --rebase origin audit/construction-atlas-q014-identity-closure-20260916
          git push origin HEAD:audit/construction-atlas-q014-identity-closure-20260916
