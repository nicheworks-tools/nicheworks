name: ManualFinder Acer JP 16 real PDF manual publication
on:
  pull_request:
    paths:
      - 'tools/manual-finder/**'
      - '.github/workflows/manualfinder-acer-jp-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acer-pdf-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Acer verified PDF evidence and 16-model publication
        run: |
          node tools/manual-finder/tests/acer-jp-pdf16-publication.test.mjs
          node tools/manual-finder/tests/acer-jp-manual-pdf-probe.test.mjs
          node tools/manual-finder/tests/coverage-pass-pipeline.test.mjs
          node tools/manual-finder/tests/hp-jp-17-publication.test.mjs
          node tools/manual-finder/tests/lenovo-jp-13-publication.test.mjs
          node tools/manual-finder/tests/dell-jp-20-publication.test.mjs
          node tools/manual-finder/tests/canon-pixus-wave3l-publication.test.mjs
          node tools/manual-finder/tests/affiliate-coverage.test.mjs
          node tools/manual-finder/tests/affiliate-doc-sync.test.mjs
