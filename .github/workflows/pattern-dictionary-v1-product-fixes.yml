name: Pattern Dictionary v1 product QA fixer

on:
  push:
    branches:
      - audit/pattern-dictionary-v1-product-quality-20260917
    paths:
      - .github/workflows/pattern-dictionary-v1-product-fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pattern-dictionary-v1-product-quality-20260917
      - name: Apply product-quality fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root=Path('tools/pattern-dictionary')
          app=root/'app.js'
          text=app.read_text()

          old="async function initHome(lang){const ps=await patterns(),grid=$('#pattern-grid'),count=$('#pattern-count');const render=list=>{grid.innerHTML=list.map(p=>card(p,lang)).join('');count.textContent=lang==='ja'?`${list.length}件`:`${list.length} patterns`};render(ps);$$('[data-family]').forEach(b=>b.onclick=()=>{$$('[data-family]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');render(b.dataset.family?ps.filter(p=>p.families.includes(b.dataset.family)):ps)});const input=$('#q'),box=$('#autocomplete');let timer;input.oninput=()=>{clearTimeout(timer);timer=setTimeout(async()=>{const q=input.value.trim();if(!q){box.hidden=true;return}const r=(await rank(q,lang)).results.filter(x=>x.score>=MATCH_THRESHOLD).slice(0,4);if(!r.length){box.hidden=true;return}box.innerHTML=r.map(({pattern:p})=>`<a class=\"pd-suggestion\" href=\"${detailUrl(p,lang)}\"><img src=\"${patternSvg(p)}\" alt=\"\"><div><strong>${esc(p.names[lang])}</strong><span>${esc(p.names[lang==='ja'?'en':'ja'])}</span></div></a>`).join('');box.hidden=false},140)};document.addEventListener('click',e=>{if(!box.contains(e.target)&&e.target!==input)box.hidden=true})}"
          new="function autocompleteNameMatch(q,p,lang){const nq=norm(q);if(!nq)return false;const other=lang==='ja'?'en':'ja';return [p.names?.[lang],p.names?.[other],...(p.aliases?.[lang]||[]),...(p.aliases?.[other]||[])].map(norm).filter(Boolean).some(v=>v.startsWith(nq))}\nasync function initHome(lang){const ps=await patterns(),grid=$('#pattern-grid'),count=$('#pattern-count');const render=list=>{grid.innerHTML=list.map(p=>card(p,lang)).join('');count.textContent=lang==='ja'?`${list.length}件`:`${list.length} patterns`};render(ps);$$('[data-family]').forEach(b=>b.onclick=()=>{$$('[data-family]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');render(b.dataset.family?ps.filter(p=>p.families.includes(b.dataset.family)):ps)});const input=$('#q'),box=$('#autocomplete');let timer;input.oninput=()=>{clearTimeout(timer);timer=setTimeout(async()=>{const q=input.value.trim();if(!q){box.hidden=true;return}const prefix=ps.filter(p=>autocompleteNameMatch(q,p,lang)).map(pattern=>({pattern,score:MATCH_THRESHOLD,reasons:[]}));const ranked=(await rank(q,lang)).results.filter(x=>x.score>=MATCH_THRESHOLD);const seen=new Set(),r=[...prefix,...ranked].filter(x=>seen.has(x.pattern.id)?false:(seen.add(x.pattern.id),true)).slice(0,4);if(!r.length){box.hidden=true;return}box.innerHTML=r.map(({pattern:p})=>`<a class=\"pd-suggestion\" href=\"${detailUrl(p,lang)}\"><img src=\"${patternSvg(p)}\" alt=\"\"><div><strong>${esc(p.names[lang])}</strong><span>${esc(p.names[lang==='ja'?'en':'ja'])}</span></div></a>`).join('');box.hidden=false},140)};document.addEventListener('click',e=>{if(!box.contains(e.target)&&e.target!==input)box.hidden=true})}"
          if old not in text: raise SystemExit('initHome target not found')
          text=text.replace(old,new,1)

          replacements={
            '<section class="pd-top-result"><img src="${patternSvg(p)}" alt="">':'<section class="pd-top-result"><img src="${patternSvg(p)}" alt="${esc(p.names[lang])}">',
            '<img class="pd-detail-image" src="${patternSvg(p)}" alt="">':'<img class="pd-detail-image" src="${patternSvg(p)}" alt="${esc(p.names[lang])}">',
            '<article class="pd-compare-panel"><img src="${patternSvg(a)}" alt="">':'<article class="pd-compare-panel"><img src="${patternSvg(a)}" alt="${esc(a.names[lang])}">',
            '<article class="pd-compare-panel"><img src="${patternSvg(b)}" alt="">':'<article class="pd-compare-panel"><img src="${patternSvg(b)}" alt="${esc(b.names[lang])}">',
            '比較用の一般概念です。20柄の辞典項目には追加していません。':'比較用の一般概念です。100柄の辞典項目には追加していません。',
            'it is not an additional entry in the fixed 20-pattern dictionary.':'it is not an additional entry in the fixed 100-pattern dictionary.'
          }
          for before,after in replacements.items():
            if before not in text: raise SystemExit(f'app target not found: {before}')
            text=text.replace(before,after)
          app.write_text(text)

          html_replacements={
            root/'index.html':('name="q" autocomplete="off" placeholder=', 'name="q" autocomplete="off" aria-label="模様を検索" placeholder='),
            root/'search.html':('name="q" placeholder=', 'name="q" aria-label="模様を検索" placeholder='),
            root/'en'/'index.html':('name="q" autocomplete="off" placeholder=', 'name="q" autocomplete="off" aria-label="Search patterns" placeholder='),
            root/'en'/'search.html':('name="q" placeholder=', 'name="q" aria-label="Search patterns" placeholder=')
          }
          for file,(before,after) in html_replacements.items():
            html=file.read_text()
            if before not in html: raise SystemExit(f'HTML target not found: {file}')
            file.write_text(html.replace(before,after,1))
          PY
      - name: Validate focused fixes
        run: |
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/tests/search-test.mjs
          node tools/pattern-dictionary/tests/browse-mobile-test.mjs
          git diff --check
          grep -q 'aria-label="模様を検索"' tools/pattern-dictionary/index.html
          grep -q 'aria-label="Search patterns"' tools/pattern-dictionary/en/index.html
          ! grep -q '20柄の辞典項目' tools/pattern-dictionary/app.js
          ! grep -q 'fixed 20-pattern dictionary' tools/pattern-dictionary/app.js
      - name: Commit fixes
        run: |
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add tools/pattern-dictionary/app.js tools/pattern-dictionary/index.html tools/pattern-dictionary/search.html tools/pattern-dictionary/en/index.html tools/pattern-dictionary/en/search.html
          git commit -m "Pattern Dictionary: fix autocomplete and accessibility QA findings"
          git push origin HEAD:audit/pattern-dictionary-v1-product-quality-20260917
