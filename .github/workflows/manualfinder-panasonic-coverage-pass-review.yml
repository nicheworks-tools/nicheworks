name: ManualFinder Panasonic coverage-pass review

on:
  pull_request:
    paths:
      - 'tools/manual-finder/coverage-passes/panasonic/**'
      - 'tools/manual-finder/scripts/panasonic-lumix-review.mjs'
      - '.github/workflows/manualfinder-panasonic-coverage-pass-review.yml'

permissions:
  contents: read

jobs:
  panasonic-lumix-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Panasonic LUMIX official review candidates
        run: |
          mkdir -p manualfinder-coverage-pass-artifacts
          node tools/manual-finder/scripts/panasonic-lumix-review.mjs \
            --pass tools/manual-finder/coverage-passes/panasonic/jp-lumix-camera-bodies-sitemap.json \
            --output manualfinder-coverage-pass-artifacts/panasonic-lumix-review.json
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: manualfinder-panasonic-lumix-review
          path: manualfinder-coverage-pass-artifacts/panasonic-lumix-review.json
          if-no-files-found: error
