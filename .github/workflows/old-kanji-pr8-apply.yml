name: Old Kanji PR8 verified repair runner

on:
  push:
    branches:
      - fix/old-kanji-pr8-verified-dictionary-repair

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/old-kanji-pr8-verified-dictionary-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply verified repairs and regenerate audit
        run: node scripts/tmp-old-kanji-pr8-apply.mjs
      - name: Commit generated repair
        run: |
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Old Kanji PR8: repair verified dictionary inconsistencies"
          git push origin HEAD:fix/old-kanji-pr8-verified-dictionary-repair
