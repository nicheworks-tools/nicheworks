name: Old Kanji Wave 6 guarded patch

on:
  push:
    branches:
      - seo/old-kanji-wave6-old-kanji-intent-20260917
    paths:
      - .github/workflows/old-kanji-wave6-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/old-kanji-wave6-old-kanji-intent-20260917
          fetch-depth: 0
      - name: Apply guarded Wave 6 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('tools/old-kanji-reference/index.html')
          sitemap_path = Path('sitemap.xml')
          index = index_path.read_text()
          sitemap = sitemap_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          index = replace_once(index,
              '<title>旧字体検索・旧字体一覧｜旧字と新字体を無料で調べる | NicheWorks</title>',
              '<title>旧字体・旧漢字検索／一覧｜旧字と新字体を無料で調べる | NicheWorks</title>',
              'title')
          index = replace_once(index,
              '<meta name="description" content="旧字体・旧字を1文字から検索し、新字体との対応を一覧で確認できる無料ツールです。読み・意味・Unicodeを収録した文字もあります。文章全体の変換ではなく、旧字を調べるための検索・一覧です。">',
              '<meta name="description" content="旧字体・旧漢字・旧字を1文字から検索し、新字体との対応を一覧で確認できる無料ツールです。読み・意味・Unicodeを収録した文字もあります。文章全体の変換ではなく、旧字を調べるための検索・一覧です。">',
              'meta description')
          index = replace_once(index,
              '<meta property="og:title" content="旧字体検索・旧字体一覧｜旧字と新字体を無料で調べる | NicheWorks">',
              '<meta property="og:title" content="旧字体・旧漢字検索／一覧｜旧字と新字体を無料で調べる | NicheWorks">',
              'og title')
          index = replace_once(index,
              '<meta property="og:description" content="旧字体・旧字を1文字から検索し、新字体との対応を一覧で確認できる無料ツールです。読み・意味・Unicodeを収録した文字もあります。">',
              '<meta property="og:description" content="旧字体・旧漢字・旧字を1文字から検索し、新字体との対応を一覧で確認できる無料ツールです。読み・意味・Unicodeを収録した文字もあります。">',
              'og description')
          index = replace_once(index,
              '<meta name="twitter:title" content="旧字体検索・旧字体一覧｜旧字と新字体を無料で調べる | NicheWorks">',
              '<meta name="twitter:title" content="旧字体・旧漢字検索／一覧｜旧字と新字体を無料で調べる | NicheWorks">',
              'twitter title')
          index = replace_once(index,
              '<meta name="twitter:description" content="旧字体・旧字を1文字から検索し、新字体との対応を一覧で確認できる無料ツールです。読み・意味・Unicodeを収録した文字もあります。">',
              '<meta name="twitter:description" content="旧字体・旧漢字・旧字を1文字から検索し、新字体との対応を一覧で確認できる無料ツールです。読み・意味・Unicodeを収録した文字もあります。">',
              'twitter description')
          index = replace_once(index,
              '{"@context":"https://schema.org","@type":"WebApplication","name":"旧字体検索・旧字体一覧（Old Kanji Reference）","url":"https://nicheworks.app/tools/old-kanji-reference/","applicationCategory":"UtilityApplication","description":"旧字体・旧字を1文字から検索し、新字体との対応を一覧で確認できる無料の旧漢字リファレンスです。主要文字は読み・意味・用途・Unicode・コピーにも対応します。","operatingSystem":"All","inLanguage":["ja","en"]}',
              '{"@context":"https://schema.org","@type":"WebApplication","name":"旧字体・旧漢字検索／一覧（Old Kanji Reference）","url":"https://nicheworks.app/tools/old-kanji-reference/","applicationCategory":"UtilityApplication","description":"旧字体・旧漢字・旧字を1文字から検索し、新字体との対応を一覧で確認できる無料リファレンスです。主要文字は読み・意味・用途・Unicode・コピーにも対応します。","operatingSystem":"All","inLanguage":["ja","en"]}',
              'WebApplication JSON-LD')
          index = replace_once(index,
              '<h1 class="nw-title"><span data-i18n="ja">旧字体検索・旧字体一覧</span><span data-i18n="en">Old Kanji Search & Reference</span></h1>',
              '<h1 class="nw-title"><span data-i18n="ja">旧字体・旧漢字検索／一覧</span><span data-i18n="en">Old Kanji Search & Reference</span></h1>',
              'h1')
          index = replace_once(index,
              '<p class="nw-subtitle"><span data-i18n="ja">旧字体・旧字を1文字から検索し、新字体との対応を無料で確認できます。旧字・新字・読み・意味・Unicodeで絞り込めます。文章全体を変換したい場合は旧字体変換ツール、画像から調べたい場合は旧字体OCRを使ってください。</span><span data-i18n="en">Old Kanji Search & Reference</span></p>',
              '<p class="nw-subtitle"><span data-i18n="ja">旧字体・旧漢字・旧字を1文字から検索し、新字体との対応を無料で確認できます。旧字・新字・読み・意味・Unicodeで絞り込めます。文章全体を変換したい場合は旧字体変換ツール、画像から調べたい場合は旧字体OCRを使ってください。</span><span data-i18n="en">Old Kanji Search & Reference</span></p>',
              'subtitle exact fallback') if False else index

          old_sub = '旧字体・旧字を1文字から検索し、新字体との対応を無料で確認できます。旧字・新字・読み・意味・Unicodeで絞り込めます。文章全体を変換したい場合は旧字体変換ツール、画像から調べたい場合は旧字体OCRを使ってください。'
          new_sub = '旧字体・旧漢字・旧字を1文字から検索し、新字体との対応を無料で確認できます。旧字・新字・読み・意味・Unicodeで絞り込めます。文章全体を変換したい場合は旧字体変換ツール、画像から調べたい場合は旧字体OCRを使ってください。'
          index = replace_once(index, old_sub, new_sub, 'subtitle')
          index = replace_once(index,
              '<h2 class="section-title"><span data-i18n="ja">旧字体を探す</span><span data-i18n="en">Search Old Kanji</span></h2>',
              '<h2 class="section-title"><span data-i18n="ja">旧字体・旧漢字を探す</span><span data-i18n="en">Search Old Kanji</span></h2>',
              'search heading')
          index = replace_once(index,
              '<h2 class="section-title"><span data-i18n="ja">旧字体一覧</span><span data-i18n="en">All Entries</span></h2>',
              '<h2 class="section-title"><span data-i18n="ja">旧字体・旧漢字一覧</span><span data-i18n="en">All Entries</span></h2>',
              'list heading')

          pattern = re.compile(r'(<loc>https://nicheworks\.app/tools/old-kanji-reference/</loc>\s*\n\s*<lastmod>)(\d{4}-\d{2}-\d{2})(</lastmod>)')
          matches = list(pattern.finditer(sitemap))
          if len(matches) != 1:
              raise SystemExit(f'sitemap root entry: expected 1, found {len(matches)}')
          sitemap = pattern.sub(r'\g<1>2026-09-17\g<3>', sitemap, count=1)

          if index.count('旧字体・旧漢字検索／一覧') < 4:
              raise SystemExit('new old-kanji intent wording not propagated')
          if index.count('https://nicheworks.app/tools/old-kanji-reference/') < 3:
              raise SystemExit('canonical/structured URL unexpectedly missing')
          if sitemap.count('<loc>https://nicheworks.app/tools/old-kanji-reference/</loc>') != 1:
              raise SystemExit('root sitemap URL count changed')

          index_path.write_text(index)
          sitemap_path.write_text(sitemap)
          PY
      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/old-kanji-wave6-patch.yml
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add tools/old-kanji-reference/index.html sitemap.xml .github/workflows/old-kanji-wave6-patch.yml
          git diff --cached --check
          git commit -m "Old Kanji Wave 6: align 旧漢字 search and list intent"
          git push origin HEAD:seo/old-kanji-wave6-old-kanji-intent-20260917
