name: API Key Redactor product-scoped staging check

on:
  pull_request:
    paths:
      - 'assets/nw-product-scoped-controller.mjs'
      - 'tools/api-key-token-redactor/product-scoped-controller.mjs'
      - 'tools/api-key-token-redactor/SPEC.md'
      - 'tools/api-key-token-redactor/index.html'
      - 'tools/api-key-token-redactor/app.js'
      - 'tools/api-key-token-redactor/pro-bridge.js'
      - 'scripts/check-api-key-redactor-product-scoped-staging.mjs'
      - 'docs/billing/pro-product-contracts-wave2.md'
      - '.agent/plans/2026-09-12-api-key-redactor-product-scoped-staging.md'
      - '.github/workflows/api-key-redactor-product-scoped-staging-check.yml'
  push:
    branches:
      - main
    paths:
      - 'assets/nw-product-scoped-controller.mjs'
      - 'tools/api-key-token-redactor/product-scoped-controller.mjs'
      - 'tools/api-key-token-redactor/SPEC.md'
      - 'tools/api-key-token-redactor/index.html'
      - 'tools/api-key-token-redactor/app.js'
      - 'tools/api-key-token-redactor/pro-bridge.js'
      - 'scripts/check-api-key-redactor-product-scoped-staging.mjs'
      - 'docs/billing/pro-product-contracts-wave2.md'
      - '.agent/plans/2026-09-12-api-key-redactor-product-scoped-staging.md'
      - '.github/workflows/api-key-redactor-product-scoped-staging-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check assets/nw-product-scoped-controller.mjs
          node --check tools/api-key-token-redactor/product-scoped-controller.mjs
          node --check scripts/check-api-key-redactor-product-scoped-staging.mjs
      - name: API Key Redactor product-scoped staging contracts
        run: node scripts/check-api-key-redactor-product-scoped-staging.mjs
