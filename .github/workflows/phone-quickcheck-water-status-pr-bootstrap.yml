name: Phone QuickCheck water-status PR bootstrap

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/phone-quickcheck-water-status-20260915'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-quickcheck-water-status-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply canonical water-state patch
        run: node scripts/temp-phone-quickcheck-water-status-patch.mjs
      - name: Validate Phone QuickCheck contracts
        run: |
          node scripts/check-phone-quickcheck-data.mjs
          node scripts/check-phone-quickcheck-source-semantics.mjs
          node scripts/check-phone-quickcheck-affiliate.mjs
          node tools/phone-quickcheck/tests/behavior.test.mjs
          git diff --check
      - name: Commit canonical patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/phone-quickcheck/data/phones.json \
            tools/phone-quickcheck/app.js \
            tools/phone-quickcheck/tests/behavior.test.mjs \
            tools/phone-quickcheck/SPEC.md \
            docs/tools/phone-quickcheck.md \
            scripts/check-phone-quickcheck-data.mjs \
            scripts/check-phone-quickcheck-source-semantics.mjs
          git diff --cached --stat
          git commit -m "Phone QuickCheck: distinguish verified non-resistant state"
          git push origin HEAD:fix/phone-quickcheck-water-status-20260915
