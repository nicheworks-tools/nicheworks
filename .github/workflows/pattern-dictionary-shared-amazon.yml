name: Pattern Dictionary shared Amazon migration

on:
  push:
    branches:
      - fix/pattern-dictionary-use-shared-amazon-20260915
    paths:
      - '.github/workflows/pattern-dictionary-shared-amazon.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pattern-dictionary-use-shared-amazon-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Replace private affiliate activation with shared NicheWorks contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, urllib.parse

          root=Path('tools/pattern-dictionary')
          tag='nicheworks09-22'
          queries={
            'houndstooth':'千鳥格子',
            'gingham':'ギンガムチェック',
            'tartan':'タータンチェック',
            'glen-check':'グレンチェック',
            'argyle':'アーガイル柄',
            'chevron':'シェブロン柄',
            'polka-dot':'水玉柄',
            'moroccan-trellis':'モロッカントレリス 柄',
            'seigaiha':'青海波 柄',
            'asanoha':'麻の葉 柄',
            'shippo':'七宝 柄',
            'ichimatsu':'市松模様',
            'kikko':'亀甲 柄',
            'karakusa':'唐草模様',
            'damask':'ダマスク柄',
            'arabesque':'アラベスク柄',
            'paisley':'ペイズリー柄',
            'leopard-print':'ヒョウ柄',
            'ikat':'イカット柄',
            'kilim':'キリム柄'
          }
          labels={
            'houndstooth':('千鳥格子の商品をAmazonで探す','Find houndstooth products on Amazon'),
            'gingham':('ギンガムチェックの商品をAmazonで探す','Find gingham products on Amazon'),
            'tartan':('タータンの商品をAmazonで探す','Find tartan products on Amazon'),
            'glen-check':('グレンチェックの商品をAmazonで探す','Find glen-check products on Amazon'),
            'argyle':('アーガイル柄の商品をAmazonで探す','Find argyle products on Amazon'),
            'chevron':('シェブロン柄の商品をAmazonで探す','Find chevron products on Amazon'),
            'polka-dot':('水玉柄の商品をAmazonで探す','Find polka-dot products on Amazon'),
            'moroccan-trellis':('モロッカントレリス柄の商品をAmazonで探す','Find Moroccan-trellis products on Amazon'),
            'seigaiha':('青海波柄の商品をAmazonで探す','Find seigaiha products on Amazon'),
            'asanoha':('麻の葉柄の商品をAmazonで探す','Find asanoha products on Amazon'),
            'shippo':('七宝柄の商品をAmazonで探す','Find shippo-pattern products on Amazon'),
            'ichimatsu':('市松模様の商品をAmazonで探す','Find ichimatsu products on Amazon'),
            'kikko':('亀甲柄の商品をAmazonで探す','Find kikko-pattern products on Amazon'),
            'karakusa':('唐草模様の商品をAmazonで探す','Find karakusa products on Amazon'),
            'damask':('ダマスク柄の商品をAmazonで探す','Find damask products on Amazon'),
            'arabesque':('アラベスク柄の商品をAmazonで探す','Find arabesque products on Amazon'),
            'paisley':('ペイズリー柄の商品をAmazonで探す','Find paisley products on Amazon'),
            'leopard-print':('ヒョウ柄の商品をAmazonで探す','Find leopard-print products on Amazon'),
            'ikat':('イカット柄の商品をAmazonで探す','Find ikat products on Amazon'),
            'kilim':('キリム柄の商品をAmazonで探す','Find kilim products on Amazon')
          }
          offers=[]
          for pattern_id,query in queries.items():
            url='https://www.amazon.co.jp/s?k='+urllib.parse.quote_plus(query,safe='')+'&tag='+tag
            ja,en=labels[pattern_id]
            offers.append({
              'pattern_id':pattern_id,
              'status':'active',
              'offer_id':'amazon_'+pattern_id.replace('-','_')+'_search',
              'query':query,
              'amazon_url':url,
              'label_ja':ja,
              'label_en':en
            })
          cfg={
            'schema':'pattern-dictionary-affiliate-v2',
            'version':'2026-09-15-1',
            'provider':'amazon.co.jp',
            'enabled':True,
            'tracking_id':tag,
            'shared_helper':'/assets/amazon-affiliate.js',
            'link_strategy':'maintained-canonical-tagged-search',
            'policy':{
              'query_source':'maintained_canonical_mapping_only',
              'free_text_forwarding':False,
              'product_claims':False,
              'price_inventory_rating_content':False
            },
            'offers':offers
          }
          (root/'data/affiliate-config.json').write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')

          app=root/'app.js'
          s=app.read_text()
          old=re.compile(r"function affiliateActive\(cfg\)\{.*?\}\nfunction detailUrl",re.S)
          replacement="""let amazonHelperPromise;\nfunction ensureAmazonHelper(){if(window.NWAmazonAffiliate)return Promise.resolve(window.NWAmazonAffiliate);return amazonHelperPromise||(amazonHelperPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='/assets/amazon-affiliate.js';script.async=true;script.onload=()=>window.NWAmazonAffiliate?resolve(window.NWAmazonAffiliate):reject(new Error('Amazon affiliate helper unavailable'));script.onerror=()=>reject(new Error('Amazon affiliate helper failed to load'));document.head.appendChild(script)}))}\nfunction activeAffiliateOffers(cfg){return (cfg?.offers||[]).filter(o=>o.status==='active'&&o.pattern_id&&o.amazon_url)}\nfunction detailUrl"""
          s,n=old.subn(replacement,s,count=1)
          if n!=1: raise SystemExit(f'affiliate helper replacement count={n}')

          detail=re.compile(r"async function initDetail\(lang\)\{.*?\}\nasync function initCompare\(lang\)\{",re.S)
          new_detail="""async function initDetail(lang){const [ps,cfg]=await Promise.all([patterns(),affiliateConfig()]),map=Object.fromEntries(ps.map(p=>[p.id,p])),id=document.body.dataset.patternId||new URLSearchParams(location.search).get('id'),p=map[id]||ps[0],rel=[...(p.relationships?.often_confused_with||[]),...(p.relationships?.similar||[])].filter((x,i,a)=>a.indexOf(x)===i).map(x=>map[x]).filter(Boolean),features=p.distinguishing_features?.[lang]||[],uses=p.common_uses?.[lang]||[],offer=activeAffiliateOffers(cfg).find(x=>x.pattern_id===p.id),commerce=offer?`<div class=\"pd-commerce\"><h2>${lang==='ja'?'この柄の商品をAmazonで探す':'Find products in this pattern on Amazon'}</h2><div id=\"pd-amazon-link\" hidden></div><div id=\"pd-amazon-disclosure\" class=\"pd-affiliate-disclosure\" hidden></div></div>`:'';document.title=`${p.names[lang]} | Pattern Dictionary | NicheWorks`;$('#detail').innerHTML=`<section class=\"pd-detail-head\"><div><img class=\"pd-detail-image\" src=\"${patternSvg(p)}\" alt=\"\">${imageStatus(p,lang)}</div><div><p class=\"pd-kicker\">${p.verification_state==='qualified'?'RESEARCHED · QUALIFIED':'RESEARCHED'}</p><h1 class=\"pd-title\">${esc(p.names[lang])}</h1><p class=\"pd-enname\">${esc(p.names[lang==='ja'?'en':'ja'])}</p><div class=\"pd-tags\">${[...p.families,...p.motifs.slice(0,3)].map(x=>`<span class=\"pd-tag\">${esc(x)}</span>`).join('')}</div><p class=\"pd-copy\">${esc(p.definition?.[lang]||p.description?.[lang]||'')}</p><table class=\"pd-table\"><tr><th>${lang==='ja'?'別名':'Aliases'}</th><td>${esc((p.aliases?.[lang]||[]).join(', ')||'—')}</td></tr><tr><th>${lang==='ja'?'用語の範囲':'Term scope'}</th><td>${esc(p.term_scope||'—')}</td></tr><tr><th>${lang==='ja'?'代表色':'Primary colors'}</th><td>${esc(p.colors.primary.join(' + '))}</td></tr><tr><th>${lang==='ja'?'色の扱い':'Color role'}</th><td>${esc(p.colors.color_role)}</td></tr><tr><th>${lang==='ja'?'主な用途':'Common uses'}</th><td>${esc(uses.join(', ')||'—')}</td></tr></table>${rel[0]?`<a class=\"pd-button secondary\" href=\"${compareUrl(p.id,rel[0].id,lang)}\">${lang==='ja'?'似た柄と比較':'Compare with a similar pattern'}</a>`:''}</div></section><section class=\"pd-section\"><div class=\"pd-section-head\"><h2>${lang==='ja'?'見分け方':'How to identify it'}</h2></div><ul class=\"pd-copy\">${features.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${p.qualification?.[lang]?`<div class=\"pd-warning\"><strong>${lang==='ja'?'用語上の注意':'Scope note'}</strong><br>${esc(p.qualification[lang])}</div>`:''}</section><section class=\"pd-section\"><div class=\"pd-section-head\"><h2>${lang==='ja'?'似ている・間違えやすい模様':'Similar or commonly confused patterns'}</h2></div><div class=\"pd-related\">${rel.map(x=>card(x,lang)).join('')}</div></section><section class=\"pd-section\">${commerce}</section>`;const langLink=$('#lang-link');if(langLink)langLink.href=ROOT+(lang==='ja'?'en/':'')+'patterns/'+encodeURIComponent(p.id)+'/';if(offer&&cfg.enabled===true){try{const helper=await ensureAmazonHelper(),targets=Object.fromEntries(activeAffiliateOffers(cfg).map(x=>[x.pattern_id,x.amazon_url]));helper.configure({enabled:true,tool:'pattern-dictionary',targets});helper.mount({container:$('#pd-amazon-link'),target:p.id,label:lang==='ja'?offer.label_ja:offer.label_en,placement:'pattern-detail'});helper.renderDisclosure($('#pd-amazon-disclosure'),{includeEnglish:lang==='en'})}catch(err){console.warn('Pattern Dictionary Amazon helper unavailable',err)}}}\nasync function initCompare(lang){"""
          s,n=detail.subn(new_detail,s,count=1)
          if n!=1: raise SystemExit(f'initDetail replacement count={n}')
          s=s.replace(";mountAffiliateDisclosure(lang);",";")
          app.write_text(s)

          test=root/'tests/affiliate-test.mjs'
          test.write_text("""import fs from 'node:fs';\nimport path from 'node:path';\nimport {fileURLToPath} from 'node:url';\n\nconst here=path.dirname(fileURLToPath(import.meta.url));\nconst root=path.resolve(here,'..');\nconst cfg=JSON.parse(fs.readFileSync(path.join(root,'data','affiliate-config.json'),'utf8'));\nconst patterns=JSON.parse(fs.readFileSync(path.join(root,'data','patterns.json'),'utf8'));\nconst app=fs.readFileSync(path.join(root,'app.js'),'utf8');\nconst helper=fs.readFileSync(path.resolve(root,'../../assets/amazon-affiliate.js'),'utf8');\nconst ids=patterns.map(x=>x.id).sort();\nconst offers=cfg.offers||[];\nconst offerIds=offers.map(x=>x.pattern_id).sort();\n\nif(cfg.schema!=='pattern-dictionary-affiliate-v2')throw new Error('affiliate schema must be v2');\nif(cfg.provider!=='amazon.co.jp')throw new Error('provider must be amazon.co.jp');\nif(cfg.enabled!==true)throw new Error('canonical 20 Amazon affiliate surface must be active');\nif(cfg.tracking_id!=='nicheworks09-22')throw new Error('Pattern Dictionary must reuse the maintained NicheWorks tracking ID');\nif(cfg.shared_helper!=='/assets/amazon-affiliate.js')throw new Error('Pattern Dictionary must reuse the shared Amazon helper');\nif(cfg.policy?.query_source!=='maintained_canonical_mapping_only'||cfg.policy?.free_text_forwarding!==false)throw new Error('Amazon destinations must be canonical mappings and never user free text');\nif(JSON.stringify(ids)!==JSON.stringify(offerIds))throw new Error('affiliate offers must cover exactly canonical 20 patterns');\nif(new Set(offers.map(x=>x.amazon_url)).size!==20)throw new Error('all 20 patterns must have distinct maintained Amazon destinations');\nfor(const offer of offers){\n  if(offer.status!=='active')throw new Error(`${offer.pattern_id}: offer must be active`);\n  if(!offer.query||!offer.label_ja||!offer.label_en)throw new Error(`${offer.pattern_id}: query and bilingual labels required`);\n  const u=new URL(offer.amazon_url);\n  if(u.protocol!=='https:'||u.hostname!=='www.amazon.co.jp'||u.pathname!=='/s')throw new Error(`${offer.pattern_id}: invalid Amazon.co.jp search URL`);\n  if(u.searchParams.get('tag')!=='nicheworks09-22')throw new Error(`${offer.pattern_id}: wrong tracking tag`);\n  if(!u.searchParams.get('k'))throw new Error(`${offer.pattern_id}: missing fixed search query`);\n}\nif(!app.includes('/assets/amazon-affiliate.js'))throw new Error('runtime must load shared Amazon helper');\nif(!app.includes("tool:'pattern-dictionary'"))throw new Error('runtime must configure shared helper for Pattern Dictionary');\nif(!app.includes("placement:'pattern-detail'"))throw new Error('runtime must use coarse fixed placement analytics');\nif(app.includes('amazonSearchUrl('))throw new Error('runtime must not construct private affiliate URLs');\nif(!helper.includes('affiliate_click'))throw new Error('shared helper must retain coarse affiliate click analytics');\nif(!helper.includes('sponsored noopener'))throw new Error('shared helper must retain sponsored link semantics');\nconsole.log('OK: Pattern Dictionary reuses the live NicheWorks Amazon contract with 20/20 distinct canonical tagged-search destinations.');\n""")

          for dead in [root/'scripts/activate-amazon-affiliate.mjs',root/'tests/affiliate-activation-test.mjs']:
            if dead.exists(): dead.unlink()

          readme=root/'README.md'
          r=readme.read_text()
          r=r.replace('and an Amazon Associates activation contract.','and the shared live NicheWorks Amazon Associates contract.')
          r=re.sub(r'- Amazon search-link metadata exists for all 20 patterns\..*?\n- User search text', '- Amazon is active for all 20 patterns using the maintained NicheWorks tag `nicheworks09-22` and shared `/assets/amazon-affiliate.js` helper. Each canonical pattern has its own fixed Amazon.co.jp tagged-search destination; user free text is never forwarded to Amazon.\n- User search text', r, flags=re.S)
          r=r.replace('node tools/pattern-dictionary/tests/affiliate-activation-test.mjs\n','')
          r=re.sub(r'## Canonical-20 commerce completion gate[\s\S]*$', '''## Canonical-20 Amazon commerce contract\n\nAmazon commerce is active for all 20 canonical patterns. Pattern Dictionary reuses the site-wide `/assets/amazon-affiliate.js` helper and maintained tracking ID `nicheworks09-22`. The shared ID is common across NicheWorks, while the destination is pattern-specific: each canonical pattern maps to one fixed Amazon.co.jp search URL. Search-box text, autocomplete text, interpreted descriptions, and other user state must never be forwarded into Amazon queries.\n\nThe fixed mapping is fail-closed and auditable: exactly 20 active pattern IDs, exactly 20 distinct tagged-search destinations, one fixed query per pattern, bilingual CTA labels, shared disclosure rendering, and coarse click analytics only.\n''', r)
          readme.write_text(r)
          PY

      - name: Validate live shared Amazon contract
        run: |
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/tests/affiliate-test.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node tools/pattern-dictionary/tests/browse-mobile-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
          node tools/pattern-dictionary/tests/publication-test.mjs
          node tools/pattern-dictionary/tests/seo-detail-test.mjs

      - name: Persist migration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pattern-dictionary
          git rm .github/workflows/pattern-dictionary-shared-amazon.yml
          git commit -m 'fix: use shared live Amazon contract for Pattern Dictionary'
          git push origin HEAD:fix/pattern-dictionary-use-shared-amazon-20260915
