name: tmp TrashNavi Wave48 publication
on:
  push:
    branches: [feat/trashnavi-wave48-publication-20260918]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave48-publication-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and validate Wave48 publication
        run: |
          node .github/tmp-trashnavi-wave48-publication.mjs
          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          entries=[
            ('082121','hitachiota',False),
            ('082252','hitachiomiya',False),
            ('084433','ami',True),
            ('083097','oarai',True),
            ('083020','ibaraki-town',True),
            ('085642','tone',True),
            ('085219','yachiyo',True),
            ('083411','tokai',True),
            ('082317','sakuragawa',False),
            ('085421','goka',True)
          ]
          manifest=json.loads(Path('tools/trashnavi/municipality-page-manifest.json').read_text())
          assert len(manifest)==264
          ai=json.loads(Path('tools/trashnavi/ai-reference.json').read_text())
          assert ai['snapshot_date']=='2026-09-18'
          assert ai['published_municipality_count']==264 and len(ai['municipalities'])==264
          root=Path('sitemap.xml').read_text()
          dedicated=Path('sitemap-trashnavi.xml').read_text()
          index=Path('tools/trashnavi/index.html').read_text()
          assert dedicated.count('<url>')==265
          for code,slug,has_callout in entries:
            canonical=f'https://nicheworks.app/tools/trashnavi/ibaraki/{slug}/'
            href=f'/tools/trashnavi/ibaraki/{slug}/'
            assert root.count(f'<loc>{canonical}</loc>')==1
            assert dedicated.count(f'<loc>{canonical}</loc>')==1
            assert index.count(f'href="{href}"')==1
            page=Path(f'tools/trashnavi/ibaraki/{slug}/index.html').read_text()
            assert f'<link rel="canonical" href="{canonical}">' in page
            assert page.count('class="official-link-card"')==3
            assert 'ごみ出し・片付け用品 [PR]' in page
            assert ('class="current-calendar-callout"' in page)==has_callout
          print('Wave48 publication acceptance: 264 pages / 10 new canonical URLs / 7 explicit 2026 callouts / 265 dedicated sitemap URLs')
          PY
      - name: Commit generated publication
        run: |
          rm .github/tmp-trashnavi-wave48-publication.mjs .github/workflows/tmp-trashnavi-wave48-publication.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(trashnavi): publish Wave48 municipalities"
          git push origin HEAD:feat/trashnavi-wave48-publication-20260918
