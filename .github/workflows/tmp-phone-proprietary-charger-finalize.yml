name: Temporary Phone QuickCheck proprietary charger finalizer

on:
  push:
    branches:
      - feat/phone-quickcheck-proprietary-charger-affiliate-20260914
    paths:
      - '.github/workflows/tmp-phone-proprietary-charger-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-quickcheck-proprietary-charger-affiliate-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch runtime and behavior coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const appPath = 'tools/phone-quickcheck/app.js';
          const testPath = 'tools/phone-quickcheck/tests/behavior.test.mjs';

          let app = fs.readFileSync(appPath, 'utf8');
          const marker = "    if (manufacturer === 'apple' && watts) {";
          const insertion = "    if (protocols.includes('supervooc')) keys.add('charger-oppo-supervooc');\n    if (protocols.includes('hypercharge') || protocols.includes('turbocharge')) keys.add('charger-xiaomi-hypercharge');\n    if (protocols.includes('turbopower')) keys.add('charger-motorola-turbopower');\n\n";
          if (!app.includes("charger-oppo-supervooc")) {
            if (!app.includes(marker)) throw new Error('app insertion marker missing');
            app = app.replace(marker, insertion + marker);
          }
          fs.writeFileSync(appPath, app);

          let test = fs.readFileSync(testPath, 'utf8');
          const proprietaryMarker = "  assert.match(html, /HyperCharge/);\n";
          if (!test.includes('Xiaomi HyperCharge \/ TurboCharge対応充電器')) {
            if (!test.includes(proprietaryMarker)) throw new Error('Xiaomi test marker missing');
            test = test.replace(proprietaryMarker, proprietaryMarker + "  assert.match(html, /Xiaomi HyperCharge \\/ TurboCharge対応充電器/);\n");
          }

          const mobileMarker = "// On mobile, selecting another row opens the bottom sheet with that phone's real detail content; close restores it.\n";
          const extra = `// Proprietary charger families resolve to their own accessory classes.\n{\n  const oppo = await createHarness(['oppo-a77']);\n  assert.match(oppo.elements.desktopDetail.innerHTML, /OPPO SUPERVOOC対応充電器/);\n  assert.doesNotMatch(oppo.elements.desktopDetail.innerHTML, /USB-PD対応 30W以上の充電器/);\n\n  const motorola = await createHarness(['motorola-edge-50-pro']);\n  assert.match(motorola.elements.desktopDetail.innerHTML, /Motorola TurboPower対応充電器/);\n}\n\n`;
          if (!test.includes('OPPO SUPERVOOC対応充電器')) {
            if (!test.includes(mobileMarker)) throw new Error('mobile test marker missing');
            test = test.replace(mobileMarker, extra + mobileMarker);
          }
          fs.writeFileSync(testPath, test);
          NODE

          node scripts/check-phone-quickcheck-data.mjs
          node scripts/check-phone-quickcheck-source-semantics.mjs
          node scripts/check-phone-quickcheck-affiliate.mjs
          node tools/phone-quickcheck/tests/behavior.test.mjs

          rm .github/workflows/tmp-phone-proprietary-charger-finalize.yml
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add -A
          git commit -m "Resolve proprietary fast-charger accessory classes"
          git push origin HEAD:feat/phone-quickcheck-proprietary-charger-affiliate-20260914
