name: Temp Phone QuickCheck current package audit 20260918 c

on:
  pull_request:
    paths:
      - '.github/workflows/temp-phone-quickcheck-package-current-audit-20260918-c.yml'
      - 'tools/phone-quickcheck/data/phones.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print current package unknowns
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('tools/phone-quickcheck/data/phones.json','utf8'));
          const adapter = data.phones.filter(p => p.included?.adapter === 'unknown');
          const cable = data.phones.filter(p => p.included?.cable === 'unknown');
          console.log('ADAPTER_COUNT=' + adapter.length);
          console.log('ADAPTER_IDS=' + JSON.stringify(adapter.map(p => p.id)));
          console.log('CABLE_COUNT=' + cable.length);
          console.log('CABLE_IDS=' + JSON.stringify(cable.map(p => p.id)));
          const unknown = data.phones.filter(p => p.included?.adapter === 'unknown' || p.included?.cable === 'unknown');
          const focus = unknown.filter(p => ['Sharp','SHARP','Motorola','ZTE','Sony','Samsung','OPPO','Xiaomi'].includes(p.manufacturer));
          console.log('FOCUS=' + JSON.stringify(focus.map(p => ({
            id:p.id, manufacturer:p.manufacturer, model:p.model, market:p.market??null,
            included:p.included,
            specificationsUrl:p.sources?.specificationsUrl??null,
            manualUrl:p.sources?.manualUrl??null,
            releaseUrl:p.sources?.releaseUrl??null,
            verifiedAt:p.sources?.verifiedAt??null
          })), null, 2));
          NODE
