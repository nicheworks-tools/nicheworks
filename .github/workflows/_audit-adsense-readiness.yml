name: AdSense readiness audit

on:
  push:
    branches:
      - audit/adsense-readiness-20260915
    paths:
      - '.github/workflows/_audit-adsense-readiness.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan public HTML surface
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const roots = ['index.html','about.html','privacy.html','contact.html','404.html','en','categories','tools','pro','billing','templates'];
          const findings = [];
          const pages = [];

          function walk(p) {
            if (!fs.existsSync(p)) return [];
            const st = fs.statSync(p);
            if (st.isFile()) return p.endsWith('.html') ? [p] : [];
            const out = [];
            for (const ent of fs.readdirSync(p, {withFileTypes:true})) {
              if (ent.name === '.git' || ent.name === 'node_modules' || ent.name === '_archive') continue;
              const child = path.join(p, ent.name);
              if (ent.isDirectory()) out.push(...walk(child));
              else if (ent.isFile() && child.endsWith('.html')) out.push(child);
            }
            return out;
          }

          function attrs(tag) {
            const out = {};
            for (const m of tag.matchAll(/([:\w-]+)\s*=\s*["']([^"']*)["']/g)) out[m[1].toLowerCase()] = m[2];
            return out;
          }

          function robots(html) {
            for (const m of html.matchAll(/<meta\b[^>]*>/gi)) {
              const a = attrs(m[0]);
              if ((a.name || '').toLowerCase() === 'robots') return (a.content || '').toLowerCase().split(/[,\s]+/).filter(Boolean);
            }
            return [];
          }

          function visibleText(html) {
            return html
              .replace(/<script\b[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[\s\S]*?<\/style>/gi, ' ')
              .replace(/<svg\b[\s\S]*?<\/svg>/gi, ' ')
              .replace(/<!--([\s\S]*?)-->/g, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;|&#160;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&lt;/gi, '<')
              .replace(/&gt;/gi, '>')
              .replace(/\s+/g, ' ')
              .trim();
          }

          const files = [...new Set(roots.flatMap(walk))].sort();
          const p0Patterns = [
            ['coming_soon', /\bcoming\s+soon\b/i],
            ['jp_preparing', /準備中/],
            ['not_available', /まだ利用できません|not available yet|not currently available/i],
            ['not_implemented', /未実装|not implemented/i],
            ['billing_disconnected', /課金導線[^。\n]{0,80}(?:接続されていません|未接続)|billing[^.\n]{0,80}not connected/i],
            ['unresolved_token', /\{(?:MAIN_KEYWORD|TOOL_NAME(?:_JA|_EN)?|TOOL_SHORT_NAME|SHORT_DESC|SLUG|LEAD_JA|LEAD_EN)\}/],
            ['dummy_pub_id', /ca-pub-XXXX|ca-pub-0000/i],
            ['analytics_token', /YOUR_TOKEN_HERE/]
          ];
          const p1Patterns = [
            ['visible_ad_placeholder', />\s*(?:広告枠(?:（準備中）)?|Ad slot|Advertisement placeholder)\s*</i],
            ['dummy_tool_link', /\/tools\/tool-[abc]\//i]
          ];

          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const rb = robots(html);
            const noindex = rb.includes('noindex');
            const hasAds = /pagead2\.googlesyndication\.com|adsbygoogle/i.test(html);
            const text = visibleText(html);
            const row = {file, noindex, has_adsense: hasAds, visible_text_chars: text.length};
            pages.push(row);

            if (noindex && hasAds) findings.push({severity:'P0', type:'noindex_adsense', file, detail:'noindex page still loads AdSense'});
            if (!noindex) {
              for (const [type, re] of p0Patterns) if (re.test(html)) findings.push({severity:'P0', type, file, detail:`matched ${re}`});
              for (const [type, re] of p1Patterns) if (re.test(html)) findings.push({severity:'P1', type, file, detail:`matched ${re}`});
              if (text.length < 220) findings.push({severity:'P1', type:'low_visible_text', file, detail:`visible text ${text.length} chars`});
            }
          }

          const sitemap = fs.readFileSync('sitemap.xml','utf8');
          const locs = [...sitemap.matchAll(/<loc>\s*(https:\/\/nicheworks\.app\/[^<]*)\s*<\/loc>/g)].map(m=>m[1]);
          for (const url of locs) {
            let rel = url.replace('https://nicheworks.app/','');
            let file = rel === '' ? 'index.html' : rel.endsWith('/') ? `${rel}index.html` : rel;
            if (!file.endsWith('.html')) continue;
            if (!fs.existsSync(file)) continue;
            const html = fs.readFileSync(file,'utf8');
            if (robots(html).includes('noindex')) findings.push({severity:'P0', type:'sitemap_noindex', file, detail:url});
          }

          const registry = JSON.parse(fs.readFileSync('tools/tools-index.json','utf8'));
          const registered = new Set((registry.items || []).map(x=>x.slug));
          for (const slug of registered) {
            const file = `tools/${slug}/index.html`;
            if (!fs.existsSync(file)) {
              findings.push({severity:'P0', type:'registered_missing', file, detail:slug});
              continue;
            }
            const html = fs.readFileSync(file,'utf8');
            if (robots(html).includes('noindex')) findings.push({severity:'P0', type:'registered_noindex', file, detail:slug});
          }

          const counts = findings.reduce((a,f)=>{ a[f.severity]=(a[f.severity]||0)+1; a[f.type]=(a[f.type]||0)+1; return a; },{});
          const report = {
            generated_at: new Date().toISOString(),
            registered_tools: registered.size,
            html_pages_scanned: pages.length,
            indexable_pages: pages.filter(p=>!p.noindex).length,
            noindex_pages: pages.filter(p=>p.noindex).length,
            counts,
            findings,
            pages
          };
          fs.writeFileSync('adsense-readiness-report.json', JSON.stringify(report,null,2)+'\n');

          const lines = [
            '# AdSense Readiness Audit',
            '',
            `- Registered tools: ${report.registered_tools}`,
            `- HTML pages scanned: ${report.html_pages_scanned}`,
            `- Indexable pages: ${report.indexable_pages}`,
            `- Noindex pages: ${report.noindex_pages}`,
            `- P0 findings: ${counts.P0 || 0}`,
            `- P1 findings: ${counts.P1 || 0}`,
            '',
            '## Findings',
            ''
          ];
          for (const f of findings) lines.push(`- **${f.severity} ${f.type}** — \`${f.file}\` — ${f.detail}`);
          if (!findings.length) lines.push('- None');
          fs.writeFileSync('adsense-readiness-report.md', lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: adsense-readiness-report
          path: |
            adsense-readiness-report.json
            adsense-readiness-report.md
          if-no-files-found: error
