name: Temporary TrashNavi Amazon affiliate rollout

on:
  push:
    branches:
      - 'feat/trashnavi-amazon-affiliate-20260914'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-amazon-affiliate-20260914

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply affiliate layer
        run: python3 tools/trashnavi/scripts/tmp-apply-affiliate.py

      - name: Generate and validate all municipality pages
        run: |
          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs

      - name: Finalize branch
        run: |
          rm .github/workflows/tmp-trashnavi-amazon-affiliate.yml
          rm tools/trashnavi/scripts/tmp-apply-affiliate.py
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add -A .github/workflows tools/trashnavi sitemap-trashnavi.xml
          git status --short
          git diff --cached --check
          git commit -m "Add TrashNavi Amazon affiliate layer"
          git push origin "HEAD:${GITHUB_REF_NAME}"
