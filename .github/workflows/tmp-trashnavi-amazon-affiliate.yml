name: Temporary TrashNavi Amazon affiliate rollout

on:
  push:
    branches:
      - 'feat/trashnavi-amazon-affiliate-20260914'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-amazon-affiliate-20260914

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Implement affiliate layer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          tool = root / 'tools' / 'trashnavi'

          config = r'''(() => {
            "use strict";

            const TRACKING_ID = "nicheworks09-22";
            const offers = Object.freeze([
              Object.freeze({
                key: "sorting_bin",
                href: "https://www.amazon.co.jp/s?k=%E5%88%86%E5%88%A5+%E3%82%B4%E3%83%9F%E7%AE%B1&tag=nicheworks09-22",
                labelJa: "分別用ごみ箱をAmazonで探す [PR]",
                labelEn: "Find sorting bins on Amazon [PR]"
              }),
              Object.freeze({
                key: "compression_bag",
                href: "https://www.amazon.co.jp/s?k=%E5%9C%A7%E7%B8%AE%E8%A2%8B&tag=nicheworks09-22",
                labelJa: "圧縮袋をAmazonで探す [PR]",
                labelEn: "Find compression bags on Amazon [PR]"
              }),
              Object.freeze({
                key: "trash_bag_storage",
                href: "https://www.amazon.co.jp/s?k=%E3%82%B4%E3%83%9F%E8%A2%8B+%E5%8F%8E%E7%B4%8D&tag=nicheworks09-22",
                labelJa: "ごみ袋収納をAmazonで探す [PR]",
                labelEn: "Find trash-bag storage on Amazon [PR]"
              }),
              Object.freeze({
                key: "packing_supplies",
                href: "https://www.amazon.co.jp/s?k=%E5%BC%95%E3%81%A3%E8%B6%8A%E3%81%97+%E6%A2%B1%E5%8C%85%E7%94%A8%E5%93%81&tag=nicheworks09-22",
                labelJa: "梱包・片付け用品をAmazonで探す [PR]",
                labelEn: "Find packing supplies on Amazon [PR]"
              })
            ]);

            const targets = Object.freeze(Object.fromEntries(offers.map((offer) => [offer.key, offer.href])));

            window.NWTrashNaviAffiliate = Object.freeze({
              enabled: true,
              tool: "trashnavi",
              provider: "amazon",
              trackingMode: "tagged_search",
              trackingId: TRACKING_ID,
              verifiedAt: "2026-09-14",
              verificationMethod: "shared_link_checker_validated_tagged_search_format",
              targets,
              offers
            });
          })();
          '''
          (tool / 'affiliate-config.js').write_text(config, encoding='utf-8')

          runtime = r'''(() => {
            "use strict";

            const helper = window.NWAmazonAffiliate;
            const config = window.NWTrashNaviAffiliate;
            if (!helper || !config) return;

            helper.configure({
              enabled: config.enabled === true,
              tool: config.tool,
              targets: config.targets
            });

            function currentLang() {
              return document.documentElement.lang === "en" ? "en" : "ja";
            }

            function render() {
              const section = document.getElementById("trashnaviAmazonAffiliate");
              const grid = document.getElementById("trashnaviAmazonAffiliateLinks");
              const disclosure = document.getElementById("trashnaviAmazonDisclosure");
              if (!section || !grid || !disclosure) return;

              const lang = currentLang();
              grid.replaceChildren();
              let mounted = 0;

              for (const offer of config.offers) {
                const slot = document.createElement("div");
                slot.className = "trashnavi-affiliate-slot";
                grid.appendChild(slot);
                const ok = helper.mount({
                  container: slot,
                  target: offer.key,
                  label: lang === "en" ? offer.labelEn : offer.labelJa,
                  placement: "municipality_supporting_supplies",
                  className: "trashnavi-affiliate-link"
                });
                if (ok) mounted += 1;
              }

              helper.renderDisclosure(disclosure, { includeEnglish: true });
              disclosure.querySelectorAll("[lang]").forEach((node) => {
                node.hidden = node.lang !== lang;
              });
              section.hidden = mounted === 0;
            }

            function init() {
              render();
              document.querySelectorAll(".nw-lang-switch button").forEach((button) => {
                button.addEventListener("click", () => setTimeout(render, 0));
              });
            }

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", init, { once: true });
            } else {
              init();
            }
          })();
          '''
          (tool / 'affiliate-runtime.js').write_text(runtime, encoding='utf-8')

          checker = r'''#!/usr/bin/env node
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const scriptDir = path.dirname(fileURLToPath(import.meta.url));
          const toolDir = path.resolve(scriptDir, '..');
          const repoRoot = path.resolve(toolDir, '../..');
          const read = (relative) => fs.readFileSync(path.join(repoRoot, relative), 'utf8');
          const check = (condition, message) => { if (!condition) throw new Error(message); };

          const config = read('tools/trashnavi/affiliate-config.js');
          const runtime = read('tools/trashnavi/affiliate-runtime.js');
          const generator = read('tools/trashnavi/scripts/generate-municipality-pages.mjs');
          const helper = read('assets/amazon-affiliate.js');
          const manifest = JSON.parse(read('tools/trashnavi/municipality-page-manifest.json')).filter((entry) => entry.publish);

          check(config.includes('const TRACKING_ID = "nicheworks09-22"'), 'TrashNavi Associates tracking ID missing');
          check(config.includes('trackingMode: "tagged_search"'), 'TrashNavi must use tagged Amazon search mode');
          check(config.includes('verificationMethod: "shared_link_checker_validated_tagged_search_format"'), 'validated tagged-search inheritance missing');
          for (const key of ['sorting_bin', 'compression_bag', 'trash_bag_storage', 'packing_supplies']) {
            check(config.includes(`key: "${key}"`), `affiliate category missing: ${key}`);
          }
          check((config.match(/https:\/\/www\.amazon\.co\.jp\/s\?k=/g) || []).length === 4, 'TrashNavi must expose exactly four fixed Amazon Japan searches');
          check((config.match(/tag=nicheworks09-22/g) || []).length === 4, 'every TrashNavi Amazon search must carry the verified tag');
          for (const forbidden of ['window.location', 'location.search', 'URLSearchParams', 'document.querySelector("input', 'document.querySelector(\'input']) {
            check(!config.includes(forbidden), `affiliate config must not derive Amazon queries from runtime/user state: ${forbidden}`);
          }

          check(runtime.includes('window.NWAmazonAffiliate'), 'shared Amazon helper must be reused');
          check(runtime.includes('helper.configure('), 'shared helper configuration missing');
          check(runtime.includes('helper.mount('), 'shared helper link mounting missing');
          check(runtime.includes('helper.renderDisclosure('), 'Amazon Associates disclosure rendering missing');
          check(runtime.includes('placement: "municipality_supporting_supplies"'), 'coarse affiliate placement missing');
          check(helper.includes('rel = "sponsored noopener"'), 'shared helper must retain sponsored link semantics');
          check(helper.includes('Amazonのアソシエイトとして、NicheWorksは適格販売により収入を得ています。'), 'shared Associates disclosure missing');

          const affiliatePos = generator.indexOf('id=\\"trashnaviAmazonAffiliate\\"');
          const officialPos = generator.indexOf('class=\\"municipality-links-section\\"');
          check(officialPos >= 0 && affiliatePos > officialPos, 'affiliate block must remain downstream of official municipal links');
          for (const asset of ['/assets/amazon-affiliate.js', '/tools/trashnavi/affiliate-config.js', '/tools/trashnavi/affiliate-runtime.js']) {
            check(generator.includes(asset), `generated page asset missing: ${asset}`);
          }
          check(generator.includes('自治体の収集ルールとは別に'), 'municipal-rule separation copy missing');
          check(manifest.length === 19, `expected 19 published municipality pages, got ${manifest.length}`);

          for (const entry of manifest) {
            const relative = path.join('tools', 'trashnavi', entry.pref_slug, entry.city_slug, 'index.html');
            const page = read(relative);
            check(page.includes('id="trashnaviAmazonAffiliate"'), `${relative}: affiliate block missing`);
            check(page.includes('/assets/amazon-affiliate.js'), `${relative}: shared Amazon helper missing`);
            check(page.includes('/tools/trashnavi/affiliate-config.js'), `${relative}: affiliate config missing`);
            check(page.includes('/tools/trashnavi/affiliate-runtime.js'), `${relative}: affiliate runtime missing`);
          }

          console.log(JSON.stringify({
            published_municipality_pages: manifest.length,
            amazon_fixed_categories: 4,
            associate_tag: 'nicheworks09-22',
            user_or_municipality_state_in_amazon_query: false,
            contract: 'trashnavi-amazon-tagged-search-v1'
          }, null, 2));
          '''
          (tool / 'scripts' / 'check-affiliate-contract.mjs').write_text(checker, encoding='utf-8')

          generator_path = tool / 'scripts' / 'generate-municipality-pages.mjs'
          generator = generator_path.read_text(encoding='utf-8')
          if 'id=\\"trashnaviAmazonAffiliate\\"' not in generator:
              marker = r'<section class=\"faq-section\">'
              affiliate = r'''<section class=\"trashnavi-affiliate-section\" id=\"trashnaviAmazonAffiliate\" aria-label=\"Amazon affiliate links\" hidden><h2 data-i18n=\"ja\">ごみ出し・片付け用品 [PR]</h2><h2 data-i18n=\"en\">Waste-sorting and cleanup supplies [PR]</h2><p data-i18n=\"ja\">自治体の収集ルールとは別に、家庭での分別や片付けに使う一般用品です。商品が自治体ルールに適合することを保証するものではありません。</p><p data-i18n=\"en\">These are general household products, separate from municipal collection rules. NicheWorks does not guarantee that a product satisfies local disposal requirements.</p><div class=\"trashnavi-affiliate-grid\" id=\"trashnaviAmazonAffiliateLinks\"></div><div class=\"trashnavi-amazon-disclosure\" id=\"trashnaviAmazonDisclosure\"></div></section>'''
              if marker not in generator:
                  raise SystemExit('affiliate insertion marker missing from generator')
              generator = generator.replace(marker, affiliate + '\n' + marker, 1)
          if '/tools/trashnavi/affiliate-runtime.js' not in generator:
              marker = r'<script>(function(){const b='
              scripts = r'''<script src=\"/assets/amazon-affiliate.js\"></script>
          <script src=\"/tools/trashnavi/affiliate-config.js\"></script>
          <script src=\"/tools/trashnavi/affiliate-runtime.js\"></script>
          '''
              if marker not in generator:
                  raise SystemExit('script insertion marker missing from generator')
              generator = generator.replace(marker, scripts + marker, 1)
          generator_path.write_text(generator, encoding='utf-8')

          style_path = tool / 'style.css'
          style = style_path.read_text(encoding='utf-8')
          if '/* TrashNavi Amazon affiliate */' not in style:
              style += r'''
          /* TrashNavi Amazon affiliate */
          .trashnavi-affiliate-section{margin-top:16px;padding:16px;border:1px solid #e5e7eb;border-radius:14px;background:#fafafa}
          .trashnavi-affiliate-section h2{margin:0 0 8px;font-size:1.08rem;color:#111827}
          .trashnavi-affiliate-section>p{margin:0 0 12px;color:#4b5563;font-size:.86rem}
          .trashnavi-affiliate-grid{display:grid;grid-template-columns:1fr;gap:8px}
          .trashnavi-affiliate-slot{min-width:0}
          .trashnavi-affiliate-link{display:block;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#1d4ed8;text-decoration:none;font-size:.84rem;font-weight:600}
          .trashnavi-affiliate-link:hover{background:#f3f4f6;text-decoration:none}
          .trashnavi-amazon-disclosure{margin-top:10px;color:#6b7280;font-size:.72rem}
          .trashnavi-amazon-disclosure p{margin:0}
          @media(min-width:720px){.trashnavi-affiliate-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          '''
          style_path.write_text(style, encoding='utf-8')

          workflow_path = root / '.github' / 'workflows' / 'check-trashnavi-coverage.yml'
          workflow = workflow_path.read_text(encoding='utf-8')
          if 'Check Amazon affiliate contract' not in workflow:
              marker = '      - name: Check runtime contract\n        run: node tools/trashnavi/scripts/check-runtime-contract.mjs\n'
              insert = '      - name: Check Amazon affiliate contract\n        run: node tools/trashnavi/scripts/check-affiliate-contract.mjs\n\n' + marker
              if marker not in workflow:
                  raise SystemExit('TrashNavi coverage workflow marker missing')
              workflow = workflow.replace(marker, insert, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          spec_path = tool / 'SPEC.md'
          spec = spec_path.read_text(encoding='utf-8')
          if '## Amazon affiliate monetization (2026-09-14)' not in spec:
              spec += r'''

          ## Amazon affiliate monetization (2026-09-14)

          - Published municipality pages include one separate `[PR]` commerce block after the official municipal-information area.
          - Amazon Associates tracking uses the maintained NicheWorks tag `nicheworks09-22` and the existing `/assets/amazon-affiliate.js` helper.
          - The block is limited to four fixed, tool-owned Amazon Japan searches: sorting bins, compression bags, trash-bag storage, and packing supplies.
          - Municipality name, prefecture, `lgcode`, address, waste item, search input, link choice, and other user/runtime state must never enter the Amazon query or affiliate analytics.
          - The official municipal links remain primary and visually separate. The commerce block explicitly states that the products are general household supplies and are not evidence of compliance with municipal disposal rules.
          - Affiliate click analytics remain coarse: tool, provider, fixed target key, and placement only. Amazon price, inventory, rating, review count, seller claims, and product images are not copied into TrashNavi.
          - If the shared helper or affiliate config is unavailable/invalid, the commerce section fails closed and remains hidden.
          '''
          spec_path.write_text(spec, encoding='utf-8')
          PY

      - name: Generate and validate all municipality pages
        run: |
          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs

      - name: Finalize branch
        run: |
          rm .github/workflows/tmp-trashnavi-amazon-affiliate.yml
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add .github/workflows/check-trashnavi-coverage.yml tools/trashnavi sitemap-trashnavi.xml
          git status --short
          git diff --cached --check
          git commit -m "Add TrashNavi Amazon affiliate layer"
          git push origin "HEAD:${GITHUB_REF_NAME}"
