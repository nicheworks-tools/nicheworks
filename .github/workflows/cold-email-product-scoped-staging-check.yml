name: Cold Email product-scoped staging check

on:
  pull_request:
    paths:
      - 'assets/nw-product-scoped-controller.mjs'
      - 'assets/nw-pro.js'
      - 'tools/cold-email-requirement-checker/product-scoped-controller.mjs'
      - 'tools/cold-email-requirement-checker/SPEC.md'
      - 'tools/cold-email-requirement-checker/app.js'
      - 'tools/cold-email-requirement-checker/pro-addon.js'
      - 'scripts/check-cold-email-product-scoped-staging.mjs'
      - 'docs/billing/pro-product-contracts-wave2.md'
      - '.agent/plans/2026-09-12-cold-email-product-scoped-staging.md'
      - '.github/workflows/cold-email-product-scoped-staging-check.yml'
  push:
    branches:
      - main
    paths:
      - 'assets/nw-product-scoped-controller.mjs'
      - 'assets/nw-pro.js'
      - 'tools/cold-email-requirement-checker/product-scoped-controller.mjs'
      - 'tools/cold-email-requirement-checker/SPEC.md'
      - 'tools/cold-email-requirement-checker/app.js'
      - 'tools/cold-email-requirement-checker/pro-addon.js'
      - 'scripts/check-cold-email-product-scoped-staging.mjs'
      - 'docs/billing/pro-product-contracts-wave2.md'
      - '.agent/plans/2026-09-12-cold-email-product-scoped-staging.md'
      - '.github/workflows/cold-email-product-scoped-staging-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check assets/nw-product-scoped-controller.mjs
          node --check assets/nw-pro.js
          node --check tools/cold-email-requirement-checker/product-scoped-controller.mjs
          node --check tools/cold-email-requirement-checker/pro-addon.js
          node --check scripts/check-cold-email-product-scoped-staging.mjs
      - name: Cold Email product-scoped staging contracts
        run: node scripts/check-cold-email-product-scoped-staging.mjs
