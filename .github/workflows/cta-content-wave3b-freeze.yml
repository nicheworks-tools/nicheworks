name: CTA content Wave3B freeze

on:
  push:
    branches:
      - feat/construction-atlas-content-wave3b-q012-safe-20260916
    paths:
      - '.github/workflows/cta-content-wave3b-freeze.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/construction-atlas-content-wave3b-q012-safe-20260916
      - name: Set Wave3B snapshot version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs')
          s = p.read_text()
          old = "version: '2026-09-16-content-wave3a-q012-safe-1',"
          new = "version: '2026-09-16-content-wave3b-q012-safe-1',"
          if new not in s:
              if s.count(old) != 1:
                  raise SystemExit(f'content version anchor mismatch: {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Validate Wave3A and Wave3B contracts
        run: |
          node --check tools/construction-tools-atlas/scripts/check-q012-content-wave3a-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/check-q012-content-wave3b-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-q012-content-wave3a-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-q012-content-wave3b-v2.3.cjs
      - name: Regenerate and verify public content snapshot
        run: |
          node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --check
      - name: Commit frozen Wave3B content state
        run: |
          if git diff --quiet; then
            echo 'Wave3B content snapshot already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs \
            tools/construction-tools-atlas/data/public-content-quality-v2.3.json
          git commit -m 'chore(construction-atlas): freeze q012 content wave 3b'
          git push origin HEAD:feat/construction-atlas-content-wave3b-q012-safe-20260916
