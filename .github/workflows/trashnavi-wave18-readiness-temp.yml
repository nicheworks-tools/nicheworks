name: TrashNavi Wave 18 readiness temp

on:
  push:
    branches:
      - feat/trashnavi-tottori-readiness-wave18-20260914

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-tottori-readiness-wave18-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Wave 18 readiness delta
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          current_url = 'https://www.city.tottori.lg.jp/page/4083.html'
          current_name = '鳥取市 ごみの分別と出し方'
          code = '312011'

          for rel in [
              'tools/trashnavi/data/direct-waste-links.json',
              'tools/trashnavi/data/direct-waste-links-pref-capitals-extra.json',
          ]:
              p = Path(rel)
              rows = json.loads(p.read_text())
              hits = 0
              for row in rows:
                  if str(row.get('lgcode', '')).strip() == code:
                      row['name'] = current_name
                      row['url'] = current_url
                      hits += 1
              if hits != 1:
                  raise SystemExit(f'{rel}: expected exactly one {code} row, got {hits}')
              p.write_text('[\n' + ',\n'.join('  ' + json.dumps(r, ensure_ascii=False, separators=(',', ':')) for r in rows) + '\n]\n')

          wave = [
            {
              'pref':'鳥取県','city':'鳥取市','name':'鳥取市 収集曜日一覧（鳥取地域） 令和8年度版',
              'type':'収集カレンダー','link_type':'collection_calendar',
              'url':'https://www.city.tottori.lg.jp/page/31552.html','lgcode':code,
              'fiscal_year':'2026','last_checked':'2026-09-14','status':'active','language':'ja'
            },
            {
              'pref':'鳥取県','city':'鳥取市','name':'鳥取市 大型ごみの出し方について',
              'type':'粗大ごみ','link_type':'bulky_waste',
              'url':'https://www.city.tottori.lg.jp/page/4042.html','lgcode':code,
              'last_checked':'2026-09-14','status':'active','language':'ja'
            }
          ]
          Path('tools/trashnavi/data/direct-waste-links-supply-wave18.json').write_text(json.dumps(wave, ensure_ascii=False, indent=2) + '\n')

          p = Path('tools/trashnavi/app.js')
          text = p.read_text()
          old = '"data/direct-waste-links-supply-wave17.json"]'
          new = '"data/direct-waste-links-supply-wave17.json","data/direct-waste-links-supply-wave18.json"]'
          if old not in text:
              raise SystemExit('app.js Wave 17 tail not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Required TrashNavi audits
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Verify Tottori readiness contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const glob=fs.readdirSync('tools/trashnavi/data').filter(n=>n.startsWith('direct-waste-links')&&n.endsWith('.json'));
          const rows=glob.flatMap(n=>JSON.parse(fs.readFileSync('tools/trashnavi/data/'+n,'utf8'))).filter(r=>String(r.lgcode||'')==='312011');
          const waste=rows.filter(r=>String(r.link_type||'')!=='municipal_home' && (r.link_type || r.type==='ごみ分別ページ'));
          const types=new Set(waste.map(r=>r.link_type || 'waste_sorting'));
          const sortUrls=new Set(rows.filter(r=>(r.link_type||'waste_sorting')==='waste_sorting' || r.type==='ごみ分別ページ').map(r=>r.url));
          if(!types.has('collection_calendar')||!types.has('bulky_waste')||sortUrls.size!==1||![...sortUrls][0].includes('/page/4083.html')) throw new Error(JSON.stringify({types:[...types],sortUrls:[...sortUrls]}));
          console.log(JSON.stringify({tottori_rows:rows.length,distinct_types:[...types].sort(),sorting_urls:[...sortUrls]},null,2));
          NODE
      - name: Commit readiness output and remove temporary workflow
        run: |
          rm .github/workflows/trashnavi-wave18-readiness-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Promote Tottori to TrashNavi preferred candidate'
          git push origin HEAD:feat/trashnavi-tottori-readiness-wave18-20260914
