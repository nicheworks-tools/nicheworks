name: Pattern Dictionary one-shot source ledger check

on:
  push:
    branches:
      - feat/pattern-dictionary-production-20-20260914
    paths:
      - .github/workflows/pattern-dictionary-source-ledger-check.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source ledger and existing Pattern Dictionary contracts
        run: |
          set -euo pipefail
          node tools/pattern-dictionary/tests/source-verification-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node --check tools/pattern-dictionary/app.js
