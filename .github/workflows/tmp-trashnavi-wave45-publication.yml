name: tmp TrashNavi Wave45 publication
on:
  push:
    branches: [feat/trashnavi-wave45-publication-20260918]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave45-publication-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and validate Wave45 publication
        run: |
          node .github/tmp-trashnavi-wave45-publication.mjs
          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          entries=[
            ('122025','choshi',True),('122050','tateyama',True),('122157','asahi',True),
            ('122181','katsuura',False),('122238','kamogawa',True),('122343','minamiboso',True),
            ('122360','katori',True),('122386','isumi',True),('122394','oamishirasato',True),('122351','sosa',True)
          ]
          manifest=json.loads(Path('tools/trashnavi/municipality-page-manifest.json').read_text())
          assert len(manifest)==234
          ai=json.loads(Path('tools/trashnavi/ai-reference.json').read_text())
          assert ai['snapshot_date']=='2026-09-18'
          assert ai['published_municipality_count']==234 and len(ai['municipalities'])==234
          root=Path('sitemap.xml').read_text()
          dedicated=Path('sitemap-trashnavi.xml').read_text()
          index=Path('tools/trashnavi/index.html').read_text()
          assert dedicated.count('<url>')==235
          for code,slug,has_callout in entries:
            canonical=f'https://nicheworks.app/tools/trashnavi/chiba/{slug}/'
            href=f'/tools/trashnavi/chiba/{slug}/'
            assert root.count(f'<loc>{canonical}</loc>')==1
            assert dedicated.count(f'<loc>{canonical}</loc>')==1
            assert index.count(f'href="{href}"')==1
            page=Path(f'tools/trashnavi/chiba/{slug}/index.html').read_text()
            assert f'<link rel="canonical" href="{canonical}">' in page
            assert page.count('class="official-link-card"')==3
            assert 'ごみ出し・片付け用品 [PR]' in page
            assert ('class="current-calendar-callout"' in page)==has_callout
          print('Wave45 publication acceptance: 234 pages / 10 new canonical URLs / 9 explicit 2026 callouts / 235 dedicated sitemap URLs')
          PY
      - name: Commit generated publication
        run: |
          rm .github/tmp-trashnavi-wave45-publication.mjs .github/workflows/tmp-trashnavi-wave45-publication.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(trashnavi): publish Wave45 municipalities"
          git push origin HEAD:feat/trashnavi-wave45-publication-20260918
