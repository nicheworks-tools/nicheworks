name: TrashNavi Wave28 AI normalize temp
on:
  push:
    branches:
      - feat/trashnavi-batch-wave28-publication-20260916
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pretty AI reference and append Wave28
        shell: bash
        run: |
          python3 <<'PY'
          import json, pathlib, subprocess
          base=subprocess.check_output(['git','show','d4ab8a967e7fa079a811fc0a7d98f4db29bcf082:tools/trashnavi/ai-reference.json'],text=True)
          data=json.loads(base)
          assert data['published_municipality_count']==54 and len(data['municipalities'])==54
          targets=[('032018','iwate','morioka'),('052019','akita','akita'),('072010','fukushima','fukushima'),('082015','ibaraki','mito'),('141305','kanagawa','kawasaki'),('141500','kanagawa','sagamihara'),('271403','osaka','sakai'),('331007','okayama','okayama'),('401307','fukuoka','fukuoka'),('401005','fukuoka','kitakyushu')]
          for lg,pref,city in targets:
            data['municipalities'].append({'lgcode':lg,'pref_slug':pref,'city_slug':city,'url':f'https://nicheworks.app/tools/trashnavi/{pref}/{city}/'})
          data['published_municipality_count']=64
          data['snapshot_date']='2026-09-16'
          pathlib.Path('tools/trashnavi/ai-reference.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          assert len(json.loads(pathlib.Path('tools/trashnavi/ai-reference.json').read_text())['municipalities'])==64
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/trashnavi/ai-reference.json
          git commit -m 'Preserve TrashNavi AI reference formatting'
          git push origin HEAD:feat/trashnavi-batch-wave28-publication-20260916
