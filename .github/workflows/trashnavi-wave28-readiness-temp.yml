name: TrashNavi Wave28 readiness temp
on:
  push:
    branches:
      - feat/trashnavi-batch-wave28-readiness-20260916
permissions:
  contents: write
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire Wave28, verify readiness, and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('tools/trashnavi/app.js')
          s=p.read_text()
          old='"data/direct-waste-links-supply-wave27.json"]'
          new='"data/direct-waste-links-supply-wave27.json","data/direct-waste-links-supply-wave28.json"]'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY

          node <<'NODE'
          const fs=require('fs'), path=require('path');
          const targets=['032018','052019','072010','082015','141305','141500','271403','331007','401307','401005'];
          const files=fs.readdirSync('tools/trashnavi/data').filter(n=>/^direct-waste-links.*\.json$/.test(n));
          const mapType=r=>r.link_type||({
            'ごみ分別ページ':'waste_sorting','収集カレンダー':'collection_calendar','粗大ごみ':'bulky_waste',
            '粗大ごみ申込み':'bulky_application','検索ページ':'waste_search','持込施設':'dropoff_facility','ごみ分別アプリ':'waste_app'
          }[r.type]);
          const rows=files.flatMap(f=>JSON.parse(fs.readFileSync(path.join('tools/trashnavi/data',f),'utf8')));
          for(const lg of targets){
            const rs=rows.filter(r=>r.lgcode===lg);
            const types=[...new Set(rs.map(mapType).filter(Boolean).filter(t=>t!=='municipal_home'))];
            const urls=[...new Set(rs.filter(r=>mapType(r)&&mapType(r)!=='municipal_home').map(r=>r.url))];
            if(types.length!==3) throw new Error(`${lg}: expected exactly 3 waste types, got ${types.join(',')}`);
            if(urls.length<3) throw new Error(`${lg}: expected at least 3 distinct official URLs`);
            console.log(lg, types.join(','));
          }
          NODE

          node tools/trashnavi/scripts/audit-coverage.mjs --strict | tee /tmp/coverage.txt
          grep -F 'Records: 2294/2294 valid HTTP(S)' /tmp/coverage.txt
          grep -F '2+ distinct waste types (publish candidates): 64' /tmp/coverage.txt
          grep -F '3+ distinct waste types (preferred candidates): 64' /tmp/coverage.txt

          node scripts/check-trashnavi-direct-links.mjs --inventory | tee /tmp/inventory.txt
          grep -F 'TrashNavi direct-link inventory: 31 datasets, 226 records, 207 unique URLs, 0 invalid URLs' /tmp/inventory.txt

          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs | tee /tmp/affiliate.txt
          grep -F '"published_municipality_pages": 54' /tmp/affiliate.txt
          grep -F '"associate_tag": "nicheworks09-22"' /tmp/affiliate.txt
          grep -F '"user_or_municipality_state_in_amazon_query": false' /tmp/affiliate.txt
          node tools/trashnavi/scripts/check-runtime-contract.mjs | tee /tmp/runtime.txt
          grep -F '"published_municipalities": 54' /tmp/runtime.txt
          git diff --check

          python3 <<'PY'
          import subprocess
          allowed={
            'tools/trashnavi/app.js',
            'sitemap-trashnavi.xml',
          }
          status=subprocess.check_output(['git','status','--short','--untracked-files=all'],text=True).splitlines()
          changed={line[3:] for line in status}
          temp={
            '.github/workflows/trashnavi-wave28-candidate-inventory-temp.yml',
            '.github/workflows/trashnavi-wave28-readiness-temp.yml',
          }
          extra=changed-(allowed|temp)
          assert not extra, sorted(extra)
          print('readiness runtime changes:',sorted(changed))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/trashnavi/app.js
          if ! git diff --quiet -- sitemap-trashnavi.xml; then git add sitemap-trashnavi.xml; fi
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Wire and verify TrashNavi Wave28 readiness'
            git push origin HEAD:feat/trashnavi-batch-wave28-readiness-20260916
          fi
          git rm .github/workflows/trashnavi-wave28-candidate-inventory-temp.yml .github/workflows/trashnavi-wave28-readiness-temp.yml
          git commit -m 'Remove TrashNavi Wave28 readiness workflows'
          git push origin HEAD:feat/trashnavi-batch-wave28-readiness-20260916
