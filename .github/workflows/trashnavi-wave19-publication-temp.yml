name: TrashNavi Wave 19 publication temp
on:
  push:
    branches:
      - feat/trashnavi-naha-publication-wave19-20260914
permissions:
  contents: write
jobs:
  publication:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish Naha municipality page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('tools/trashnavi')
          manifest_path = root / 'municipality-page-manifest.json'
          manifest = json.loads(manifest_path.read_text())
          if any(str(x.get('lgcode')) == '472018' for x in manifest):
              raise SystemExit('Naha already exists in municipality manifest')
          manifest.append({'lgcode':'472018','pref_slug':'okinawa','city_slug':'naha','publish':True})
          manifest_path.write_text('[\n' + ',\n'.join('  '+json.dumps(x, ensure_ascii=False, separators=(',', ':')) for x in manifest) + '\n]\n')

          gen_path = root / 'scripts/generate-municipality-pages.mjs'
          gen = gen_path.read_text()
          old = "if(outputs.length!==25) throw new Error(`municipality page count must be 25; got ${outputs.length}`);"
          new = "if(outputs.length!==26) throw new Error(`municipality page count must be 26; got ${outputs.length}`);"
          if old not in gen: raise SystemExit('generator 25-page guard not found')
          gen_path.write_text(gen.replace(old,new,1))

          aff_path = root / 'scripts/check-affiliate-contract.mjs'
          aff = aff_path.read_text()
          old = "check(manifest.length === 25, `expected 25 published municipality pages, got ${manifest.length}`);"
          new = "check(manifest.length === 26, `expected 26 published municipality pages, got ${manifest.length}`);"
          if old not in aff: raise SystemExit('affiliate 25-page guard not found')
          aff_path.write_text(aff.replace(old,new,1))

          index_path = root / 'index.html'
          index = index_path.read_text()
          needle = '<a href="/tools/trashnavi/tottori/tottori/">鳥取市</a></div>'
          repl = '<a href="/tools/trashnavi/tottori/tottori/">鳥取市</a><a href="/tools/trashnavi/okinawa/naha/">那覇市</a></div>'
          if needle not in index: raise SystemExit('TrashNavi root municipality tail not found')
          index_path.write_text(index.replace(needle,repl,1))

          ai_path = root / 'ai-reference.json'
          ai = json.loads(ai_path.read_text())
          if ai.get('published_municipality_count') != 25 or len(ai.get('municipalities',[])) != 25:
              raise SystemExit('AI reference baseline is not 25/25')
          if any(str(x.get('lgcode')) == '472018' for x in ai['municipalities']):
              raise SystemExit('Naha already exists in AI reference')
          ai['published_municipality_count'] = 26
          ai['municipalities'].append({'lgcode':'472018','pref_slug':'okinawa','city_slug':'naha','url':'https://nicheworks.app/tools/trashnavi/okinawa/naha/'})
          lines = [
            '{',
            f'  "schema_version": {json.dumps(ai["schema_version"], ensure_ascii=False)},',
            f'  "snapshot_date": {json.dumps(ai["snapshot_date"], ensure_ascii=False)},',
            f'  "canonical_tool": {json.dumps(ai["canonical_tool"], ensure_ascii=False)},',
            f'  "purpose": {json.dumps(ai["purpose"], ensure_ascii=False)},',
            f'  "scope": {json.dumps(ai["scope"], ensure_ascii=False)},',
            f'  "authority_policy": {json.dumps(ai["authority_policy"], ensure_ascii=False)},',
            f'  "inference_policy": {json.dumps(ai["inference_policy"], ensure_ascii=False)},',
            f'  "source_manifest": {json.dumps(ai["source_manifest"], ensure_ascii=False)},',
            f'  "published_municipality_count": {ai["published_municipality_count"]},',
            '  "municipalities": ['
          ]
          for i, x in enumerate(ai['municipalities']):
              row = json.dumps(x, ensure_ascii=False, separators=(',', ':'))
              lines.append('    ' + row + (',' if i < len(ai['municipalities'])-1 else ''))
          lines += ['  ]','}']
          ai_path.write_text('\n'.join(lines)+'\n')

          root_sitemap_path = pathlib.Path('sitemap.xml')
          root_sitemap = root_sitemap_path.read_text()
          canonical = 'https://nicheworks.app/tools/trashnavi/okinawa/naha/'
          if canonical in root_sitemap:
              raise SystemExit('Naha already exists in root sitemap')
          tblock = '  <url>\n    <loc>https://nicheworks.app/tools/trashnavi/tottori/tottori/</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>\n'
          if tblock not in root_sitemap:
              raise SystemExit('Tottori root sitemap anchor not found')
          nblock = '  <url>\n    <loc>https://nicheworks.app/tools/trashnavi/okinawa/naha/</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>\n'
          root_sitemap_path.write_text(root_sitemap.replace(tblock, tblock + nblock, 1))

          spec_path = root / 'SPEC.md'
          spec = spec_path.read_text()
          after = '- 鳥取県 鳥取市 — `/tools/trashnavi/tottori/tottori/`\n'
          wave19 = '''\nWave 19では、供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から那覇市を選定した。那覇市公式の家庭ごみ分別導線を現行ページへ更新し、ごみ・資源分別検索、ごみ収集日検索、そ大ごみ案内を追加して、4種類のwaste-specific canonical typeを持つpreferred candidateへ引き上げた。data enrichment検証後、公開対象を **26自治体** とする。\n\n- 沖縄県 那覇市 — `/tools/trashnavi/okinawa/naha/`\n'''
          if after not in spec: raise SystemExit('Wave18 municipality entry not found in SPEC')
          spec = spec.replace(after, after + wave19, 1)
          spec = spec.replace('- [x] 公開25自治体をmanifest allowlistで管理する。','- [x] 公開26自治体をmanifest allowlistで管理する。',1)
          spec = spec.replace('- [x] generator `--check` で25ページの生成driftを検出する。','- [x] generator `--check` で26ページの生成driftを検出する。',1)
          acc = '- [x] Wave 18で鳥取市をpreferred candidateへ引き上げ、自治体pageを公開する。'
          if acc not in spec: raise SystemExit('Wave18 acceptance line not found')
          spec = spec.replace(acc, acc + '\n- [x] Wave 19で那覇市をpreferred candidateへ引き上げ、自治体pageを公開する。',1)
          data_line = '- `tools/trashnavi/data/direct-waste-links-supply-wave18.json` — 鳥取市のWave 18 collection-calendar / bulky-waste enrichment。'
          if data_line not in spec: raise SystemExit('Wave18 dataset evidence not found')
          spec = spec.replace(data_line, data_line + '\n- `tools/trashnavi/data/direct-waste-links-supply-wave19.json` — 那覇市のWave 19 waste-search / collection-calendar / bulky-waste enrichment。',1)
          page_line = '- `tools/trashnavi/tottori/tottori/index.html` — Wave 18 municipality page。'
          if page_line not in spec: raise SystemExit('Wave18 page evidence not found')
          spec = spec.replace(page_line, page_line + '\n- `tools/trashnavi/okinawa/naha/index.html` — Wave 19 municipality page。',1)
          marker = '### Wave 18 verified coverage baseline'
          pos = spec.find(marker)
          if pos < 0: raise SystemExit('Wave18 baseline heading not found')
          nextpos = spec.find('\n### ', pos + len(marker))
          if nextpos < 0: raise SystemExit('Heading after Wave18 baseline not found')
          baseline = '''\n\n### Wave 19 verified coverage baseline\n\n2026-09-14のWave 19 CI基準値は次のとおり。\n\n- municipalities: 1,916\n- records: 2,217 / 2,217 valid HTTP(S)\n- municipalities with any waste-specific direct link: 78\n- publish candidates (2+ types): 26\n- preferred candidates (3+ types): 26\n- collection-calendar coverage: 26 municipalities\n- bulky-waste coverage: 25 municipalities\n- waste-search coverage: 1 municipality\n- drop-off facility coverage: 1 municipality\n- waste-app coverage: 1 municipality\n- direct-link inventory: 22 datasets / 149 records / 130 unique URLs / 0 invalid URLs\n- invalid records: 0\n- unknown type labels: 0\n'''
          spec = spec[:nextpos] + baseline + spec[nextpos:]
          spec_path.write_text(spec)
          PY

          node tools/trashnavi/scripts/generate-municipality-pages.mjs

          python3 - <<'PY'
          import json, pathlib
          page = pathlib.Path('tools/trashnavi/okinawa/naha/index.html').read_text()
          canonical = 'https://nicheworks.app/tools/trashnavi/okinawa/naha/'
          urls = [
            'https://www.city.naha.okinawa.jp/kurasitetuduki/gomi-recycling/1001934/1001935.html',
            'https://www.city.naha.okinawa.jp/kurasitetuduki/gomi-recycling/1001934/1008613.html',
            'https://www.city.naha.okinawa.jp/kurasitetuduki/gomi-recycling/1001934/1008614.html',
            'https://www.city.naha.okinawa.jp/kurasitetuduki/gomi-recycling/1001934/1007525/1001941.html'
          ]
          if page.count('class="official-link-card"') != 4:
              raise SystemExit('Naha generated page must contain exactly 4 official-link cards')
          if f'<link rel="canonical" href="{canonical}">' not in page:
              raise SystemExit('Naha canonical missing')
          for u in urls:
              if u not in page: raise SystemExit(f'Naha official URL missing: {u}')
          if 'https://www.city.naha.okinawa.jp/kurasitetuduki/gomi/' in page:
              raise SystemExit('Legacy Naha sorting URL leaked into generated page')
          if '2026年の収集カレンダー' in page:
              raise SystemExit('Naha must not claim a FY2026 calendar callout for collection-day search')
          if 'ごみ収集日検索' not in page or 'ごみ分別検索' not in page:
              raise SystemExit('Naha search cards missing')
          if '[PR]' not in page or 'trashnaviAmazonAffiliate' not in page:
              raise SystemExit('Naha affiliate block missing')
          ai = json.loads(pathlib.Path('tools/trashnavi/ai-reference.json').read_text())
          if ai.get('published_municipality_count') != 26 or len(ai.get('municipalities',[])) != 26:
              raise SystemExit('AI reference must be 26/26')
          rows = [x for x in ai['municipalities'] if str(x.get('lgcode')) == '472018']
          if len(rows) != 1 or rows[0].get('url') != canonical:
              raise SystemExit('AI Naha entry invalid')
          for sm in ['sitemap.xml','sitemap-trashnavi.xml']:
              text = pathlib.Path(sm).read_text()
              if text.count(canonical) != 1:
                  raise SystemExit(f'{sm}: Naha canonical count must be 1')
          print('Naha publication contract: OK')
          PY

          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs

          rm .github/workflows/trashnavi-wave19-publication-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sitemap-trashnavi.xml sitemap.xml tools/trashnavi/SPEC.md tools/trashnavi/ai-reference.json tools/trashnavi/index.html tools/trashnavi/municipality-page-manifest.json tools/trashnavi/okinawa/naha/index.html tools/trashnavi/scripts/check-affiliate-contract.mjs tools/trashnavi/scripts/generate-municipality-pages.mjs .github/workflows/trashnavi-wave19-publication-temp.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git commit -m "Publish Naha as 26th TrashNavi municipality page"
          git push
