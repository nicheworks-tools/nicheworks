name: tmp TrashNavi Wave43 publication
on:
  push:
    branches: [feat/trashnavi-wave43-publication]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave43-publication
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and validate Wave43 publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          entries=[
            ('112381','hasuda','蓮田市'),('112461','shiraoka','白岡市'),('113433','ogawa','小川町'),
            ('113492','tokigawa','ときがわ町'),('113611','yokoze','横瀬町'),('113638','nagatoro','長瀞町'),
            ('113654','ogano','小鹿野町'),('113697','higashichichibu','東秩父村'),('114081','yorii','寄居町'),('114642','sugito','杉戸町')]

          mp=Path('tools/trashnavi/municipality-page-manifest.json')
          manifest=json.loads(mp.read_text())
          assert len(manifest)==204
          assert not any(code in {x['lgcode'] for x in manifest} for code,_,_ in entries)
          text=mp.read_text().rstrip(); body=text[:-1].rstrip()
          body += ',\n' + ',\n'.join(f'  {{"lgcode":"{code}","pref_slug":"saitama","city_slug":"{slug}","publish":true}}' for code,slug,_ in entries) + '\n]\n'
          mp.write_text(body)
          assert len(json.loads(mp.read_text()))==214

          gen=Path('tools/trashnavi/scripts/generate-municipality-pages.mjs')
          s=gen.read_text(); old='if(outputs.length!==204) throw new Error(`municipality page count must be 204; got ${outputs.length}`);'; new='if(outputs.length!==214) throw new Error(`municipality page count must be 214; got ${outputs.length}`);'
          assert old in s; gen.write_text(s.replace(old,new,1))
          aff=Path('tools/trashnavi/scripts/check-affiliate-contract.mjs')
          s=aff.read_text(); old='check(manifest.length === 204, `expected 204 published municipality pages, got ${manifest.length}`);'; new='check(manifest.length === 214, `expected 214 published municipality pages, got ${manifest.length}`);'
          assert old in s; aff.write_text(s.replace(old,new,1))

          spec=Path('tools/trashnavi/SPEC.md'); s=spec.read_text().rstrip()
          assert '## Wave 43 ten-municipality publication' not in s
          spec.write_text(s+'\n\n## Wave 43 ten-municipality publication\n\nWave 43は既存の10自治体batch scaling ruleとpreferred readiness thresholdを維持し、204自治体から214自治体へ拡張する。対象は蓮田市・白岡市・小川町・ときがわ町・横瀬町・長瀞町・小鹿野町・東秩父村・寄居町・杉戸町。各自治体は `municipal_home` を除く3種類の異なるwaste-specific official link typeと3つの自治体公式URLを持ち、同一ページ二重計上や外部衛生組合・委託先URLによる閾値補完は行わない。Readiness baselineは2,730/2,730 valid HTTP(S)、214 preferred candidates、46 datasets / 662 records / 643 unique URLs / invalid 0。Publicationでは214ページ、AI reference 214/214、root/dedicated sitemap、root internal links、Amazon 4 fixed categories (`nicheworks09-22`) を検証する。2026 calendar calloutは `fiscal_year: 2026` が明示された小川町・ときがわ町・横瀬町・長瀞町・小鹿野町・寄居町・杉戸町のみ表示し、蓮田市・白岡市・東秩父村には表示しない。\n')

          root=Path('sitemap.xml'); rt=root.read_text(); assert rt.rstrip().endswith('</urlset>')
          blocks=[]
          for _,slug,_ in entries:
            canonical=f'https://nicheworks.app/tools/trashnavi/saitama/{slug}/'
            assert canonical not in rt
            blocks.append(f'  <url>\n    <loc>{canonical}</loc>\n    <lastmod>2026-09-17</lastmod>\n  </url>')
          rt=rt.rstrip(); root.write_text(rt[:-len('</urlset>')]+'\n'.join(blocks)+'\n</urlset>\n')

          index=Path('tools/trashnavi/index.html'); html=index.read_text()
          marker='<div class="municipality-related-links">'; start=html.index(marker); end=html.index('</div>',start)
          for _,slug,name in entries:
            href=f'/tools/trashnavi/saitama/{slug}/'
            assert href not in html
            html=html[:end]+f'<a href="{href}">{name}</a>'+html[end:]
            end += len(f'<a href="{href}">{name}</a>')
          index.write_text(html)
          PY

          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs

          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=json.loads(Path('tools/trashnavi/data/direct-waste-links-supply-wave43.json').read_text())
          entries=[('112381','hasuda'),('112461','shiraoka'),('113433','ogawa'),('113492','tokigawa'),('113611','yokoze'),('113638','nagatoro'),('113654','ogano'),('113697','higashichichibu'),('114081','yorii'),('114642','sugito')]
          by={}
          for r in rows: by.setdefault(r['lgcode'],[]).append(r)
          dedicated=Path('sitemap-trashnavi.xml').read_text(); root=Path('sitemap.xml').read_text(); index=Path('tools/trashnavi/index.html').read_text()
          for code,slug in entries:
            rs=by[code]; assert len(rs)==3
            canonical=f'https://nicheworks.app/tools/trashnavi/saitama/{slug}/'; href=f'/tools/trashnavi/saitama/{slug}/'
            html=Path(f'tools/trashnavi/saitama/{slug}/index.html').read_text()
            assert f'<link rel="canonical" href="{canonical}">' in html
            assert html.count('class="official-link-card"')==3
            assert '[PR]' in html
            callout=any(r.get('link_type')=='collection_calendar' and str(r.get('fiscal_year',''))=='2026' for r in rs)
            assert ('class="current-calendar-callout"' in html)==callout
            assert dedicated.count(f'<loc>{canonical}</loc>')==1
            assert root.count(f'<loc>{canonical}</loc>')==1
            assert index.count(f'href="{href}"')==1
          ai=json.loads(Path('tools/trashnavi/ai-reference.json').read_text())
          assert ai['published_municipality_count']==214 and len(ai['municipalities'])==214
          manifest=json.loads(Path('tools/trashnavi/municipality-page-manifest.json').read_text())
          assert len(manifest)==214 and all(x.get('publish') for x in manifest)
          print('Wave43 publication acceptance: 10/10 pages; AI 214/214; sitemaps/internal links OK')
          PY

          rm .github/workflows/tmp-trashnavi-wave43-publication.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(trashnavi): publish Wave43 municipalities"
          git push origin HEAD:feat/trashnavi-wave43-publication
