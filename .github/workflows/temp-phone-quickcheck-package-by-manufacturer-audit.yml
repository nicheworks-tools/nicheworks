name: Temp Phone QuickCheck package manufacturer audit

on:
  pull_request:
    paths:
      - '.github/workflows/temp-phone-quickcheck-package-by-manufacturer-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print package unknowns by manufacturer
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('tools/phone-quickcheck/data/phones.json','utf8'));
          const adapter = data.phones.filter(p => p.included?.adapter === 'unknown');
          const cable = data.phones.filter(p => p.included?.cable === 'unknown');
          console.log('ADAPTER_COUNT=' + adapter.length);
          console.log('CABLE_COUNT=' + cable.length);
          const rows = data.phones.filter(p => p.included?.adapter === 'unknown' || p.included?.cable === 'unknown')
            .map(p => ({id:p.id, manufacturer:p.manufacturer, model:p.model, market:p.market??null, included:p.included, specificationsUrl:p.sources?.specificationsUrl??null, manualUrl:p.sources?.manualUrl??null, releaseUrl:p.sources?.releaseUrl??null}));
          const groups = {};
          for (const row of rows) (groups[row.manufacturer] ??= []).push(row);
          console.log('GROUPS=' + JSON.stringify(groups, null, 2));
          NODE
