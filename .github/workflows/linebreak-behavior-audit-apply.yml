name: Apply LineBreak behavior audit sync

on:
  push:
    branches:
      - test/behavior-wave1-linebreak-20260913
    paths:
      - '.github/workflows/linebreak-behavior-audit-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout behavior branch
        uses: actions/checkout@v4
        with:
          ref: test/behavior-wave1-linebreak-20260913
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run behavior tests before audit promotion
        run: node scripts/run-tool-behavior-tests.mjs

      - name: Sync quality evidence
        run: node scripts/apply-linebreak-behavior-audit.mjs

      - name: Validate canonical quality contracts
        run: |
          node scripts/check-tool-spec-contract.mjs
          node scripts/check-tool-spec-coverage.mjs
          node scripts/check-tool-quality-contract.mjs
          node scripts/check-common-support-contract.mjs
          git diff --check

      - name: Commit synchronized evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/tool-quality-matrix.json audits/tool-quality-matrix.md \
            docs/tools/linebreak-doctor.md tools/linebreak-doctor/SPEC.md
          git commit -m "Record LineBreak Doctor behavior coverage"
          git push origin HEAD:test/behavior-wave1-linebreak-20260913
