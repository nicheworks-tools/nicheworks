name: One-shot staged Earth no-ads cleanup

on:
  push:
    branches:
      - chore/adsense-staged-earth-noads-20260915
    paths:
      - '.github/workflows/_tmp-earth-staged-noads.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/adsense-staged-earth-noads-20260915
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Strip AdSense and visible ad placeholders from staged Earth pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = ['tools/earth-alerts/index.html','tools/earth-timeseries/index.html'];
          for (const file of files) {
            let html = fs.readFileSync(file,'utf8');
            html = html.replace(/\n?\s*<script\s+async\s+src=["']https:\/\/pagead2\.googlesyndication\.com\/pagead\/js\/adsbygoogle\.js\?client=ca-pub-9879006623791275["']\s+crossorigin=["']anonymous["']><\/script>\s*/i,'\n');
            html = html.replace(/\n?\s*<div class=["']ad-slot ad-top["']>[^<]*<\/div>\s*/i,'\n');
            html = html.replace(/\n?\s*<div class=["']ad-slot ad-bottom["']>[^<]*<\/div>\s*/i,'\n');
            fs.writeFileSync(file, html.replace(/\n{3,}/g,'\n\n'));
          }
          NODE

      - name: Validate contracts
        run: |
          node scripts/check-adsense-review-surface.mjs
          node scripts/check-seo-public-url-contract.mjs
          node scripts/audit-publishing-mode.mjs
          node scripts/audit-seo.mjs --strict
          git diff --check

      - name: Commit validated cleanup and remove one-shot workflow
        run: |
          rm .github/workflows/_tmp-earth-staged-noads.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/earth-alerts/index.html tools/earth-timeseries/index.html scripts/check-adsense-review-surface.mjs .github/workflows/_tmp-earth-staged-noads.yml
          git commit -m 'chore: remove ads from staged Earth pages'
          git push origin HEAD:chore/adsense-staged-earth-noads-20260915
