name: Temporary Phone QuickCheck Galaxy Fold wave 6 canonical validation

on:
  push:
    branches:
      - feat/phone-quickcheck-galaxy-fold-wave6-20260914
    paths:
      - '.github/workflows/tmp-phone-quickcheck-galaxy-fold-wave6.yml'

permissions:
  contents: read

jobs:
  validate-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-quickcheck-galaxy-fold-wave6-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-phone-quickcheck-data.mjs
      - run: node scripts/check-phone-quickcheck-source-semantics.mjs
      - run: node scripts/check-phone-quickcheck-affiliate.mjs
      - run: node tools/phone-quickcheck/tests/behavior.test.mjs
