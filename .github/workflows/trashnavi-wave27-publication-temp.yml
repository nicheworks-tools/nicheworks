name: TrashNavi Wave27 publication temp
on:
  push:
    branches:
      - feat/trashnavi-batch-wave27-publication-20260916
permissions:
  contents: write
jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish Wave27 and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          targets=[
            {"lgcode":"022012","pref_slug":"aomori","city_slug":"aomori","city":"青森市"},
            {"lgcode":"062014","pref_slug":"yamagata","city_slug":"yamagata","city":"山形市"},
            {"lgcode":"102016","pref_slug":"gunma","city_slug":"maebashi","city":"前橋市"},
            {"lgcode":"111007","pref_slug":"saitama","city_slug":"saitama","city":"さいたま市"},
            {"lgcode":"172014","pref_slug":"ishikawa","city_slug":"kanazawa","city":"金沢市"},
          ]

          mp=Path('tools/trashnavi/municipality-page-manifest.json')
          manifest=json.loads(mp.read_text())
          existing={x['lgcode'] for x in manifest}
          assert len(manifest)==49
          for t in targets:
            assert t['lgcode'] not in existing
            manifest.append({"lgcode":t['lgcode'],"pref_slug":t['pref_slug'],"city_slug":t['city_slug'],"publish":True})
          mp.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')).replace('},{','},\n  {').replace('[{','[\n  {').replace('}]','}\n]')+'\n')

          aip=Path('tools/trashnavi/ai-reference.json')
          ai=json.loads(aip.read_text())
          assert ai['published_municipality_count']==49
          ai['snapshot_date']='2026-09-16'
          for t in targets:
            ai['municipalities'].append({"lgcode":t['lgcode'],"pref_slug":t['pref_slug'],"city_slug":t['city_slug'],"url":f"https://nicheworks.app/tools/trashnavi/{t['pref_slug']}/{t['city_slug']}/"})
          ai['published_municipality_count']=54
          aip.write_text(json.dumps(ai,ensure_ascii=False,indent=2)+'\n')

          gp=Path('tools/trashnavi/scripts/generate-municipality-pages.mjs')
          g=gp.read_text()
          old="if(outputs.length!==49) throw new Error(`municipality page count must be 49; got ${outputs.length}`);"
          new="if(outputs.length!==54) throw new Error(`municipality page count must be 54; got ${outputs.length}`);"
          assert g.count(old)==1
          gp.write_text(g.replace(old,new,1))

          cp=Path('tools/trashnavi/scripts/check-affiliate-contract.mjs')
          c=cp.read_text()
          old="check(manifest.length === 49, `expected 49 published municipality pages, got ${manifest.length}`);"
          new="check(manifest.length === 54, `expected 54 published municipality pages, got ${manifest.length}`);"
          assert c.count(old)==1
          cp.write_text(c.replace(old,new,1))

          ip=Path('tools/trashnavi/index.html')
          html=ip.read_text()
          start=html.index('<div class="municipality-related-links">')
          end=html.index('</div>',start)
          block=html[start:end]
          additions=''.join(f'<a href="/tools/trashnavi/{t["pref_slug"]}/{t["city_slug"]}/">{t["city"]}</a>' for t in targets)
          for t in targets:
            assert f'/tools/trashnavi/{t["pref_slug"]}/{t["city_slug"]}/' not in block
          html=html[:end]+additions+html[end:]
          html=html.replace('データ更新日：2026-09-15','データ更新日：2026-09-16',1).replace('Data updated: 2026-09-15','Data updated: 2026-09-16',1)
          ip.write_text(html)

          sp=Path('tools/trashnavi/SPEC.md')
          spec=sp.read_text().rstrip()+"\n\n"
          marker='## Wave27 publication (2026-09-16)'
          assert marker not in spec
          spec += marker+"\n\nPublished five additional municipality pages in one batch: Aomori City, Yamagata City, Maebashi City, Saitama City, and Kanazawa City. The fixed publication threshold remains at three or more distinct waste-specific official link types. All five pages use verified municipal sorting, collection-calendar, and bulky-waste routes. FY2026 calendar callouts are shown only where the source explicitly carries 2026 fiscal-year metadata (Aomori, Maebashi, Kanazawa). Existing Amazon affiliate isolation and fixed-category query contracts remain unchanged.\n"
          sp.write_text(spec)

          root=Path('sitemap.xml')
          sm=root.read_text()
          for t in targets:
            url=f'https://nicheworks.app/tools/trashnavi/{t["pref_slug"]}/{t["city_slug"]}/'
            assert sm.count(url)==0
            entry=f'  <url>\n    <loc>{url}</loc>\n    <lastmod>2026-09-16</lastmod>\n  </url>\n'
            sm=sm.replace('</urlset>',entry+'</urlset>',1)
          root.write_text(sm)
          PY

          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          node tools/trashnavi/scripts/audit-coverage.mjs --strict | tee /tmp/coverage.txt
          grep -F 'Records: 2274/2274 valid HTTP(S)' /tmp/coverage.txt
          grep -F '3+ distinct waste types (preferred candidates): 54' /tmp/coverage.txt
          node scripts/check-trashnavi-direct-links.mjs --inventory | tee /tmp/inventory.txt
          grep -F '30 datasets, 206 records, 187 unique URLs, 0 invalid URLs' /tmp/inventory.txt
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs | tee /tmp/affiliate.txt
          grep -F '"published_municipality_pages": 54' /tmp/affiliate.txt
          node tools/trashnavi/scripts/check-runtime-contract.mjs | tee /tmp/runtime.txt
          grep -F '"published_municipalities": 54' /tmp/runtime.txt
          grep -F '"root_internal_links_verified": 54' /tmp/runtime.txt

          python3 - <<'PY'
          from pathlib import Path
          import json,re
          targets=[
            ('aomori','aomori','青森市',True),
            ('yamagata','yamagata','山形市',False),
            ('gunma','maebashi','前橋市',True),
            ('saitama','saitama','さいたま市',False),
            ('ishikawa','kanazawa','金沢市',True),
          ]
          ai=json.loads(Path('tools/trashnavi/ai-reference.json').read_text())
          assert ai['published_municipality_count']==54 and len(ai['municipalities'])==54
          root=Path('sitemap.xml').read_text()
          tn=Path('sitemap-trashnavi.xml').read_text()
          for pref,city,ja,callout in targets:
            rel=Path(f'tools/trashnavi/{pref}/{city}/index.html')
            page=rel.read_text()
            url=f'https://nicheworks.app/tools/trashnavi/{pref}/{city}/'
            assert page.count('class="official-link-card"')==3, rel
            assert 'ごみ分別・収集カレンダー・粗大ごみ公式情報' in page.split('</head>',1)[0], rel
            assert ('class="current-calendar-callout"' in page)==callout, rel
            assert 'id="trashnaviAmazonAffiliate"' in page and '[PR]' in page, rel
            assert 'ad-slot' not in page, rel
            assert root.count(url)==1 and tn.count(url)==1, rel
            assert sum(1 for x in ai['municipalities'] if x['url']==url)==1, rel
          assert ai['snapshot_date']=='2026-09-16'
          print('Wave27 publication contract: OK')
          PY

          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed={
            'tools/trashnavi/municipality-page-manifest.json',
            'tools/trashnavi/scripts/generate-municipality-pages.mjs',
            'tools/trashnavi/scripts/check-affiliate-contract.mjs',
            'tools/trashnavi/index.html',
            'tools/trashnavi/ai-reference.json',
            'tools/trashnavi/SPEC.md',
            'sitemap-trashnavi.xml','sitemap.xml',
            'tools/trashnavi/aomori/aomori/index.html',
            'tools/trashnavi/yamagata/yamagata/index.html',
            'tools/trashnavi/gunma/maebashi/index.html',
            'tools/trashnavi/saitama/saitama/index.html',
            'tools/trashnavi/ishikawa/kanazawa/index.html',
            '.github/workflows/trashnavi-wave27-publication-temp.yml'
          }
          lines=subprocess.check_output(['git','status','--short','--untracked-files=all'],text=True).splitlines()
          paths={line[3:] for line in lines}
          extra=paths-allowed
          assert not extra, f'unexpected publication diff: {sorted(extra)}'
          final=paths-{'.github/workflows/trashnavi-wave27-publication-temp.yml'}
          assert len(final)==13, sorted(final)
          print('Wave27 final publication files:',len(final))
          PY
          git add tools/trashnavi/municipality-page-manifest.json tools/trashnavi/scripts/generate-municipality-pages.mjs tools/trashnavi/scripts/check-affiliate-contract.mjs tools/trashnavi/index.html tools/trashnavi/ai-reference.json tools/trashnavi/SPEC.md sitemap-trashnavi.xml sitemap.xml tools/trashnavi/aomori/aomori/index.html tools/trashnavi/yamagata/yamagata/index.html tools/trashnavi/gunma/maebashi/index.html tools/trashnavi/saitama/saitama/index.html tools/trashnavi/ishikawa/kanazawa/index.html
          git commit -m "Publish TrashNavi Wave27 municipality batch"
          git rm .github/workflows/trashnavi-wave27-publication-temp.yml
          git commit -m "Remove TrashNavi Wave27 publication workflow"
          git push origin HEAD:feat/trashnavi-batch-wave27-publication-20260916
