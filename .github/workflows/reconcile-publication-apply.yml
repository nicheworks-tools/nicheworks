name: Reconcile publication apply

on:
  push:
    branches:
      - feat/reconcile-publication-20260912
    paths:
      - '.github/workflows/reconcile-publication-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reconcile-publication-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Register Reconcile publication
        run: |
          node <<'NODE'
          const fs = require('fs');

          const indexPath = 'tools/tools-index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          const item = {
            slug: 'reconcile',
            title_en: 'NicheWorks Reconcile',
            title_ja: 'CSV・Excel取引照合ツール',
            desc_en: 'Reconcile two CSV/XLSX transaction datasets locally and isolate records that require human review.',
            desc_ja: '2つのCSV・Excel取引データをブラウザ内で照合し、候補・重複・不一致など人が確認すべき取引だけを絞り込みます。',
            tags: ['csv', 'xlsx', 'reconcile', 'accounting']
          };
          const existing = index.items.findIndex((entry) => entry.slug === item.slug);
          if (existing >= 0) index.items[existing] = item;
          else index.items.push(item);
          index.items.sort((a, b) => a.slug.localeCompare(b.slug));
          index.total = index.items.length;
          index.generatedAt = '2026-09-12T00:00:00.000Z';
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

          const manifestPath = 'tools/tool-spec-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const specItem = { slug: 'reconcile', state: 'complete', spec: 'tools/reconcile/SPEC.md' };
          const specExisting = manifest.items.findIndex((entry) => entry.slug === specItem.slug);
          if (specExisting >= 0) manifest.items[specExisting] = specItem;
          else manifest.items.push(specItem);
          manifest.items.sort((a, b) => a.slug.localeCompare(b.slug));
          manifest.required_complete = manifest.items.length;
          manifest.complete = manifest.items.filter((entry) => entry.state === 'complete').length;
          manifest.pending = manifest.items.length - manifest.complete;
          const manifestLines = [
            '{',
            `  "schema_version": ${manifest.schema_version},`,
            `  "registry": ${JSON.stringify(manifest.registry)},`,
            `  "required_complete": ${manifest.required_complete},`,
            `  "complete": ${manifest.complete},`,
            `  "pending": ${manifest.pending},`,
            '  "items": [',
            ...manifest.items.map((entry, i) => `    ${JSON.stringify(entry)}${i === manifest.items.length - 1 ? '' : ','}`),
            '  ]',
            '}',
            ''
          ];
          fs.writeFileSync(manifestPath, manifestLines.join('\n'));

          const sitemapPath = 'sitemap.xml';
          let sitemap = fs.readFileSync(sitemapPath, 'utf8');
          const loc = 'https://nicheworks.app/tools/reconcile/';
          if (!sitemap.includes(`<loc>${loc}</loc>`)) {
            const block = `  <url>\n    <loc>${loc}</loc>\n    <lastmod>2026-09-12</lastmod>\n  </url>\n`;
            sitemap = sitemap.replace('</urlset>', `${block}</urlset>`);
            fs.writeFileSync(sitemapPath, sitemap);
          }

          if (index.items.filter((entry) => entry.slug === 'reconcile').length !== 1) throw new Error('reconcile registry cardinality');
          if (manifest.items.filter((entry) => entry.slug === 'reconcile').length !== 1) throw new Error('reconcile manifest cardinality');
          if (index.total !== 88 || manifest.required_complete !== 88 || manifest.complete !== 88 || manifest.pending !== 0) {
            throw new Error(`unexpected publication counts: ${index.total}/${manifest.required_complete}/${manifest.complete}/${manifest.pending}`);
          }
          NODE
      - name: Validate Reconcile implementation
        run: |
          node --check tools/reconcile/app.mjs
          node --test tools/reconcile/tests/*.test.mjs
          grep -q 'https://nicheworks.app/tools/reconcile/' sitemap.xml
          grep -q '"slug": "reconcile"' tools/tools-index.json
          grep -q '"slug":"reconcile"' tools/tool-spec-manifest.json
      - name: Commit publication registry changes and remove helper
        run: |
          rm .github/workflows/reconcile-publication-apply.yml
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add tools/tools-index.json tools/tool-spec-manifest.json sitemap.xml .github/workflows/reconcile-publication-apply.yml
          git commit -m 'feat(reconcile): register public tool'
          git push origin HEAD:feat/reconcile-publication-20260912
