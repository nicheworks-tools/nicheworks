name: ADS_DONATION commercial SSOT check

on:
  pull_request:
    paths:
      - 'MONETIZATION_CLASSIFICATION.json'
      - 'tools/motion-atlas/**'
      - 'tools/vibe-lexicon/**'
      - 'docs/tools/motion-atlas.md'
      - 'docs/tools/vibe-lexicon.md'
      - 'scripts/check-ads-donation-commercial-ssot.mjs'
      - '.github/workflows/check-ads-donation-commercial-ssot.yml'
  push:
    branches:
      - main
    paths:
      - 'MONETIZATION_CLASSIFICATION.json'
      - 'tools/motion-atlas/**'
      - 'tools/vibe-lexicon/**'
      - 'docs/tools/motion-atlas.md'
      - 'docs/tools/vibe-lexicon.md'
      - 'scripts/check-ads-donation-commercial-ssot.mjs'
      - '.github/workflows/check-ads-donation-commercial-ssot.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce ADS_DONATION commercial boundary
        run: node scripts/check-ads-donation-commercial-ssot.mjs
