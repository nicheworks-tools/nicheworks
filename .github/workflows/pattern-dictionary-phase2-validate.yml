name: Pattern Dictionary Phase 2 validation
on:
  push:
    branches:
      - feat/pattern-dictionary-production-20-20260914
    paths:
      - .github/workflows/pattern-dictionary-phase2-validate.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node tools/pattern-dictionary/tests/source-verification-test.mjs
      - run: node tools/pattern-dictionary/tests/production-content-test.mjs
      - run: node tools/pattern-dictionary/tests/validate.mjs
      - run: node tools/pattern-dictionary/tests/search-test.mjs
      - run: node --check tools/pattern-dictionary/app.js
