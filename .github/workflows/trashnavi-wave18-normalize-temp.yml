name: TrashNavi Wave 18 normalize temp

on:
  push:
    branches:
      - feat/trashnavi-tottori-readiness-wave18-20260914

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-tottori-readiness-wave18-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore canonical compact formatting
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tools/trashnavi/data/direct-waste-links.json')
          rows=json.loads(p.read_text())
          p.write_text('[\n' + ',\n'.join(json.dumps(r, ensure_ascii=False, separators=(',', ':')) for r in rows) + '\n]\n')
          PY
      - name: Required TrashNavi audits
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit normalization and remove temporary workflow
        run: |
          rm .github/workflows/trashnavi-wave18-normalize-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Normalize Wave 18 readiness diff'
          git push origin HEAD:feat/trashnavi-tottori-readiness-wave18-20260914
