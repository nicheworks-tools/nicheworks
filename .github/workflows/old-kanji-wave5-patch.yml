name: Old Kanji Wave 5 guarded patch retry

on:
  push:
    branches:
      - seo/old-kanji-wave5-conversion-20260917
    paths:
      - .github/workflows/old-kanji-wave5-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/old-kanji-wave5-conversion-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded patch
        run: node scripts/tmp-old-kanji-wave5-patch.mjs
      - name: Remove temporary patch files
        run: |
          rm scripts/tmp-old-kanji-wave5-patch.mjs
          rm .github/workflows/old-kanji-wave5-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/kanji-modernizer/index.html tools/old-kanji-reference/index.html sitemap.xml scripts/tmp-old-kanji-wave5-patch.mjs .github/workflows/old-kanji-wave5-patch.yml
          git commit -m "Optimize Old Kanji conversion intent"
          git push origin HEAD:seo/old-kanji-wave5-conversion-20260917
