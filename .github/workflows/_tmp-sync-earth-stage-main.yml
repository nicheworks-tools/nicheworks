name: One-shot sync Earth staging branch with main

on:
  push:
    branches:
      - chore/adsense-earth-staged-v2-20260914

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Merge latest main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
      - name: Revalidate contracts after main sync
        run: |
          node scripts/audit-publishing-mode.mjs
          node scripts/check-tool-spec-contract.mjs
          node scripts/check-tool-spec-coverage.mjs
          node scripts/check-tool-quality-contract.mjs
          node scripts/check-monetization-classification.mjs
          node scripts/check-common-support-contract.mjs
          node scripts/check-seo-public-url-contract.mjs
          node scripts/check-seo-indexable-url-identity.mjs
          node scripts/audit-seo.mjs --strict
      - name: Remove one-shot workflow and push
        run: |
          rm -f .github/workflows/_tmp-sync-earth-stage-main.yml
          git add -A
          git commit -m "chore: remove temporary main sync workflow"
          git push origin HEAD:chore/adsense-earth-staged-v2-20260914
