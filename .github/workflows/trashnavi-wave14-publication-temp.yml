name: TrashNavi Wave 14 publication temp

on:
  push:
    branches:
      - feat/trashnavi-yamaguchi-publication-20260914

permissions:
  contents: write

jobs:
  publish-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Wave 14 publication delta
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('tools/trashnavi/municipality-page-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if not any(str(x.get('lgcode')) == '352039' for x in manifest):
              manifest.append({"lgcode":"352039","pref_slug":"yamaguchi","city_slug":"yamaguchi","publish":True})
          if len(manifest) != 21:
              raise SystemExit(f'expected 21 manifest entries after Wave 14, got {len(manifest)}')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')).replace('},{','},\n  {').replace('[{','[\n  {').replace('}]','}\n]') + '\n')

          gen_path = Path('tools/trashnavi/scripts/generate-municipality-pages.mjs')
          s = gen_path.read_text()
          old = 'if(outputs.length!==20) throw new Error(`municipality page count must be 20; got ${outputs.length}`);'
          new = 'if(outputs.length!==21) throw new Error(`municipality page count must be 21; got ${outputs.length}`);'
          if new not in s:
              if old not in s: raise SystemExit('generator 20-page guard not found')
              s = s.replace(old, new, 1)
              gen_path.write_text(s)

          aff_path = Path('tools/trashnavi/scripts/check-affiliate-contract.mjs')
          s = aff_path.read_text()
          old = 'check(manifest.length === 20, `expected 20 published municipality pages, got ${manifest.length}`);'
          new = 'check(manifest.length === 21, `expected 21 published municipality pages, got ${manifest.length}`);'
          if new not in s:
              if old not in s: raise SystemExit('affiliate 20-page guard not found')
              s = s.replace(old, new, 1)
              aff_path.write_text(s)

          index_path = Path('tools/trashnavi/index.html')
          s = index_path.read_text()
          anchor = '<a href="/tools/trashnavi/mie/tsu/">津市</a>'
          add = anchor + '<a href="/tools/trashnavi/yamaguchi/yamaguchi/">山口市</a>'
          if '/tools/trashnavi/yamaguchi/yamaguchi/' not in s:
              if anchor not in s: raise SystemExit('TrashNavi root Tsu anchor not found')
              s = s.replace(anchor, add, 1)
              index_path.write_text(s)

          root_sitemap = Path('sitemap.xml')
          s = root_sitemap.read_text()
          y_url = 'https://nicheworks.app/tools/trashnavi/yamaguchi/yamaguchi/'
          if y_url not in s:
              tsu = '  <url>\n    <loc>https://nicheworks.app/tools/trashnavi/mie/tsu/</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>'
              block = tsu + '\n  <url>\n    <loc>' + y_url + '</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>'
              if tsu not in s: raise SystemExit('root sitemap Tsu block not found')
              s = s.replace(tsu, block, 1)
              root_sitemap.write_text(s)

          spec_path = Path('tools/trashnavi/SPEC.md')
          s = spec_path.read_text()
          if 'Wave 14では' not in s:
              anchor = '- 三重県 津市 — `/tools/trashnavi/mie/tsu/`\n\n'
              text = ('Wave 14では、供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から山口市を選定した。山口市公式の令和8年度版ごみ収集カレンダー（ごみ分別の手引き）と粗大ごみ案内を追加し、既存のごみ分別導線と合わせてpreferred candidateへ引き上げた。data enrichment検証後、公開対象を **21自治体** とする。\n\n'
                      '- 山口県 山口市 — `/tools/trashnavi/yamaguchi/yamaguchi/`\n\n')
              if anchor not in s: raise SystemExit('SPEC Wave 13 municipality anchor not found')
              s = s.replace(anchor, anchor + text, 1)

          if '### Wave 14 verified coverage baseline' not in s:
              marker = '### Direct-link health monitoring — Phase 4'
              baseline = ('### Wave 14 verified coverage baseline\n\n'
                          '2026-09-14のWave 14 CI基準値は次のとおり。\n\n'
                          '- municipalities: 1,916\n'
                          '- records: 2,206 / 2,206 valid HTTP(S)\n'
                          '- municipalities with any waste-specific direct link: 78\n'
                          '- publish candidates (2+ types): 21\n'
                          '- preferred candidates (3+ types): 21\n'
                          '- collection calendar coverage: 21 municipalities\n'
                          '- bulky-waste coverage: 20 municipalities\n'
                          '- drop-off facility coverage: 1 municipality\n'
                          '- waste-app coverage: 1 municipality\n'
                          '- direct-link inventory: 17 datasets / 138 records / 119 unique URLs / 0 invalid URLs\n'
                          '- invalid records: 0\n'
                          '- unknown type labels: 0\n\n')
              if marker not in s: raise SystemExit('SPEC direct-link marker not found')
              s = s.replace(marker, baseline + marker, 1)

          s = s.replace('- [x] 公開20自治体をmanifest allowlistで管理する。', '- [x] 公開21自治体をmanifest allowlistで管理する。', 1)
          s = s.replace('- [x] generator `--check` で20ページの生成driftを検出する。', '- [x] generator `--check` で21ページの生成driftを検出する。', 1)
          if 'Wave 14で山口市をpreferred candidateへ引き上げ' not in s:
              anchor = '- [x] Wave 13で津市をpreferred candidateへ引き上げ、自治体pageを公開する。\n'
              if anchor not in s: raise SystemExit('SPEC Wave 13 checklist anchor not found')
              s = s.replace(anchor, anchor + '- [x] Wave 14で山口市をpreferred candidateへ引き上げ、自治体pageを公開する。\n', 1)
          if 'direct-waste-links-supply-wave14.json` — 山口市' not in s:
              anchor = '- `tools/trashnavi/data/direct-waste-links-supply-wave13.json` — 津市のWave 13 collection-calendar / bulky-waste enrichment。\n'
              if anchor not in s: raise SystemExit('SPEC Wave 13 dataset evidence anchor not found')
              s = s.replace(anchor, anchor + '- `tools/trashnavi/data/direct-waste-links-supply-wave14.json` — 山口市のWave 14 collection-calendar / bulky-waste enrichment。\n', 1)
          if 'tools/trashnavi/yamaguchi/yamaguchi/index.html` — Wave 14' not in s:
              anchor = '- `tools/trashnavi/mie/tsu/index.html` — Wave 13 municipality page。\n'
              if anchor not in s: raise SystemExit('SPEC Wave 13 page evidence anchor not found')
              s = s.replace(anchor, anchor + '- `tools/trashnavi/yamaguchi/yamaguchi/index.html` — Wave 14 municipality page。\n', 1)
          spec_path.write_text(s)
          PY
      - name: Generate municipality pages and dedicated sitemap
        run: node tools/trashnavi/scripts/generate-municipality-pages.mjs
      - name: Verify Yamaguchi publication contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/trashnavi/yamaguchi/yamaguchi/index.html')
          s = p.read_text()
          assert s.count('class="official-link-card"') == 3, s.count('class="official-link-card"')
          assert 'https://www.city.yamaguchi.lg.jp/site/gomisigen/188479.html' in s
          assert 'https://www.city.yamaguchi.lg.jp/site/gomisigen/79604.html' in s
          assert '2026 collection calendar' in s
          assert 'trashnavi-affiliate-section' in s
          assert 'nicheworks09-22' not in s
          assert '/assets/amazon-affiliate.js' in s
          assert '/tools/trashnavi/affiliate-config.js' in s
          print('Yamaguchi generated page contract: OK (exactly 3 official cards)')
          PY
      - name: Run TrashNavi audits
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit publication delta and remove temp workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-trashnavi.xml tools/trashnavi/SPEC.md tools/trashnavi/index.html tools/trashnavi/municipality-page-manifest.json tools/trashnavi/scripts/check-affiliate-contract.mjs tools/trashnavi/scripts/generate-municipality-pages.mjs tools/trashnavi/yamaguchi/yamaguchi/index.html
          git rm .github/workflows/trashnavi-wave14-publication-temp.yml
          git commit -m "Publish Yamaguchi as 21st TrashNavi municipality page"
          git push
