name: Temporary Laundry Code static index finalizer

on:
  push:
    branches:
      - seo/laundry-code-static-index-20260917
    paths:
      - 'scripts/tmp-laundry-code-static-index.mjs'
      - '.github/workflows/tmp-laundry-code-static-index.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/laundry-code-static-index-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/tmp-laundry-code-static-index.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD -- scripts/tmp-laundry-code-static-index.mjs .github/workflows/tmp-laundry-code-static-index.yml
          git add tools/laundry-code-decode/index.html tools/laundry-code-decode/SPEC.md
          git diff --cached --quiet && exit 0
          git commit -m "Expose Laundry Code meanings in static HTML"
          git push origin HEAD:seo/laundry-code-static-index-20260917
