name: One-shot sync AdSense pre-review branch

on:
  push:
    branches:
      - chore/adsense-pre-review-cleanup-20260915
    paths:
      - '.github/workflows/_tmp-sync-adsense-pre-review.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/adsense-pre-review-cleanup-20260915
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Merge current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Revalidate contracts
        run: |
          node scripts/check-adsense-review-surface.mjs
          node scripts/check-seo-public-url-contract.mjs
          node scripts/check-seo-indexable-url-identity.mjs
          node scripts/audit-publishing-mode.mjs
          node scripts/audit-seo.mjs --strict
          git diff --check

      - name: Remove one-shot workflow and push
        run: |
          rm .github/workflows/_tmp-sync-adsense-pre-review.yml
          git add .github/workflows/_tmp-sync-adsense-pre-review.yml
          git commit -m 'chore: remove temporary AdSense sync workflow'
          git push origin HEAD:chore/adsense-pre-review-cleanup-20260915
