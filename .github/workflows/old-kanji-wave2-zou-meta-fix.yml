name: Temporary Old Kanji Wave 2 Zou Metadata Fix

on:
  push:
    branches:
      - fix/old-kanji-wave2-zou-dictionary-20260916
    paths:
      - .github/workflows/old-kanji-wave2-zou-meta-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/old-kanji-wave2-zou-dictionary-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply verified metadata fix
        run: node scripts/tmp-old-kanji-wave2-zou-meta-fix.mjs
      - name: Validate old kanji metadata
        run: node tools/old-kanji-reference/validate-meta.js
      - name: Regenerate dictionary audit
        run: node scripts/build-old-kanji-dictionary-audit.mjs
      - name: Check dictionary audit
        run: node scripts/build-old-kanji-dictionary-audit.mjs --check
      - name: Assert repaired record remains safe
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('tools/old-kanji-reference/dictionary-audit.json', 'utf8'));
          const r = audit.records.find(x => x.source === '贈');
          if (!r || r.target !== '贈' || r.classification !== 'compatibility' || r.issues.length || !r.seoCandidate) {
            throw new Error(`Unexpected 贈 audit record: ${JSON.stringify(r)}`);
          }
          if (audit.summary.issueRecords !== 0 || audit.summary.conflictingRawDuplicateKeys !== 0 || audit.summary.reverseIssues > 35) {
            throw new Error(`Audit summary regression: ${JSON.stringify(audit.summary)}`);
          }
          console.log(JSON.stringify({summary:audit.summary, record:r}, null, 2));
          EOF
      - name: Remove temporary files and commit
        run: |
          rm scripts/tmp-old-kanji-wave2-zou-meta-fix.mjs
          rm .github/workflows/old-kanji-wave2-zou-meta-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete verified 贈 compatibility metadata"
          git push origin HEAD:fix/old-kanji-wave2-zou-dictionary-20260916
