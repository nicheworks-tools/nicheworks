name: ManualFinder analytics contract

on:
  pull_request:
    paths:
      - 'tools/manual-finder/analytics.js'
      - 'tools/manual-finder/index.html'
      - 'tools/manual-finder/en/index.html'
      - 'tools/manual-finder/tests/analytics-contract.test.mjs'
      - 'assets/amazon-affiliate.js'
      - '.github/workflows/manualfinder-analytics-check.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/manual-finder/analytics.js'
      - 'tools/manual-finder/index.html'
      - 'tools/manual-finder/en/index.html'
      - 'tools/manual-finder/tests/analytics-contract.test.mjs'
      - 'assets/amazon-affiliate.js'
      - '.github/workflows/manualfinder-analytics-check.yml'

permissions:
  contents: read

jobs:
  analytics-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check tools/manual-finder/analytics.js
      - name: Contract regression
        run: node tools/manual-finder/tests/analytics-contract.test.mjs
