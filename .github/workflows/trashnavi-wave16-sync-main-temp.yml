name: TrashNavi Wave 16 sync main temp

on:
  push:
    branches:
      - feat/trashnavi-matsue-publication-wave16-20260914

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Merge latest main and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/trashnavi-wave16-sync-main-temp.yml
          git commit -m 'Remove temporary Wave 16 main sync workflow'
          git push origin HEAD:${{ github.ref_name }}
