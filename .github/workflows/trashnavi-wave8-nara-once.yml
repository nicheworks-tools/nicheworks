name: TrashNavi Wave 8 Nara SPEC sync

on:
  push:
    branches:
      - feat/trashnavi-wave8-nara-20260913
    paths:
      - '.github/workflows/trashnavi-wave8-nara-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave8-nara-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Wave 8 SPEC
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'tools/trashnavi/SPEC.md';
          let s = fs.readFileSync(p, 'utf8');

          const wave7Bullet = '- 愛媛県 松山市 — `/tools/trashnavi/ehime/matsuyama/`';
          const wave8Block = 'Wave 8では、Wave 7と同じ供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から奈良市を選定した。奈良市公式の2026年度ごみ収集カレンダーと大型ごみ案内を追加し、既存のごみ分別導線と合わせてpreferred candidateへ引き上げた。data enrichment検証は完了し、自治体pageのpublicationは別PRで行う。\n\n- 奈良県 奈良市 — publication pending';
          if (!s.includes(wave8Block)) {
            if (!s.includes(wave7Bullet)) throw new Error('Wave 7 publication anchor missing');
            s = s.replace(wave7Bullet, `${wave7Bullet}\n\n${wave8Block}`);
          }

          const oldBaseline = `### Wave 7 verified coverage baseline

2026-09-13のWave 7 CI基準値は次のとおり。

- municipalities: 1,916
- records: 2,192 / 2,192 valid HTTP(S)
- municipalities with any waste-specific direct link: 78
- publish candidates (2+ types): 14
- preferred candidates (3+ types): 14
- collection calendar coverage: 14 municipalities
- bulky-waste coverage: 13 municipalities
- drop-off facility coverage: 1 municipality
- waste-app coverage: 1 municipality
- invalid records: 0
- unknown type labels: 0`;
          const newBaseline = `### Wave 8 verified coverage baseline

2026-09-13のWave 8 CI基準値は次のとおり。

- municipalities: 1,916
- records: 2,194 / 2,194 valid HTTP(S)
- municipalities with any waste-specific direct link: 78
- publish candidates (2+ types): 15
- preferred candidates (3+ types): 15
- collection calendar coverage: 15 municipalities
- bulky-waste coverage: 14 municipalities
- drop-off facility coverage: 1 municipality
- waste-app coverage: 1 municipality
- invalid records: 0
- unknown type labels: 0`;
          if (!s.includes(newBaseline)) {
            if (!s.includes(oldBaseline)) throw new Error('Wave 7 baseline anchor missing');
            s = s.replace(oldBaseline, newBaseline);
          }

          const wave7Acceptance = '- [x] Wave 7で松山市をpreferred candidateへ引き上げ、自治体pageを公開する。';
          const wave8Acceptance = '- [x] Wave 8で奈良市をpreferred candidateへ引き上げる。自治体page publicationは別PRで閉じる。';
          if (!s.includes(wave8Acceptance)) {
            if (!s.includes(wave7Acceptance)) throw new Error('Wave 7 acceptance anchor missing');
            s = s.replace(wave7Acceptance, `${wave7Acceptance}\n${wave8Acceptance}`);
          }

          const wave7Evidence = '- `tools/trashnavi/data/direct-waste-links-supply-wave7.json` — 松山市のWave 7 collection-calendar / bulky-waste enrichment。';
          const wave8Evidence = '- `tools/trashnavi/data/direct-waste-links-supply-wave8.json` — 奈良市のWave 8 collection-calendar / bulky-waste enrichment。';
          if (!s.includes(wave8Evidence)) {
            if (!s.includes(wave7Evidence)) throw new Error('Wave 7 evidence anchor missing');
            s = s.replace(wave7Evidence, `${wave7Evidence}\n${wave8Evidence}`);
          }

          fs.writeFileSync(p, s);
          NODE
      - name: Validate Wave 8 state
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit SPEC sync
        shell: bash
        run: |
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add tools/trashnavi/SPEC.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Document TrashNavi Wave 8 Nara readiness'
          git push origin HEAD:feat/trashnavi-wave8-nara-20260913
