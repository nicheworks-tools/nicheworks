name: Construction Tools Atlas Reviewed Wave8 Promotion
on:
  pull_request:
    paths:
      - '.github/workflows/construction-tools-atlas-image-wave8-promotion.yml'
      - 'tools/construction-tools-atlas/scripts/promote-image-wave8-reviewed-v2.3.cjs'
permissions:
  contents: write
  actions: read
jobs:
  prepare-reviewed-two-images:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retrieve original SHA1-pinned Wave8 source artifacts
        uses: actions/download-artifact@v4
        with:
          name: construction-atlas-wave8-pinned-source-staging
          run-id: 41204653654
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cta-wave8-sources
      - name: Promote only two subject-verified images (saw rejected)
        run: |
          if [ -f tools/construction-tools-atlas/data/image-wave8-sources-v2.3.json ]; then
            echo "Wave8 already promoted; verify committed asset hashes and static outputs."
          else
            for id in torque_wrench wire_stripper; do
              mkdir -p "tools/construction-tools-atlas/images/$id"
              cp "${{ runner.temp }}/cta-wave8-sources/$id/source.jpg" "tools/construction-tools-atlas/images/$id/source.jpg"
              cp "${{ runner.temp }}/cta-wave8-sources/$id/primary.webp" "tools/construction-tools-atlas/images/$id/primary.webp"
              cp "${{ runner.temp }}/cta-wave8-sources/$id/thumb.webp" "tools/construction-tools-atlas/images/$id/thumb.webp"
            done
            node tools/construction-tools-atlas/scripts/promote-image-wave8-reviewed-v2.3.cjs
          fi
      - name: Regenerate image inventory and published SEO detail cohort
        run: |
          node tools/construction-tools-atlas/scripts/audit-image-inventory-v2.3.cjs --write > /dev/null
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --write > /dev/null
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs
          node tools/construction-tools-atlas/scripts/build-affiliate-image-acquisition-queue-v2.3.cjs --write
      - name: Assert image/attribution/lifecycle/SEO coherence
        run: |
          node tools/construction-tools-atlas/scripts/check-image-registry-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-image-attribution-v2.3.cjs
          node tools/construction-tools-atlas/scripts/image-lifecycle-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-image-inventory-v2.3.cjs --check > /dev/null
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --check > /dev/null
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/build-affiliate-image-acquisition-queue-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/build-comparison-pages-v2.3.cjs --check
      - name: Commit retained reviewed images and generated pages on PR branch
        run: |
          git config user.name "nicheworks-image-wave8[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/construction-tools-atlas sitemap.xml
          git diff --cached --quiet && { echo "No changes to publish"; exit 0; }
          git commit -m "Construction Atlas: promote 2 images and publish 40 static SEO details"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
