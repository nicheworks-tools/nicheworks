name: tmp TrashNavi Wave48 readiness
on:
  push:
    branches: [feat/trashnavi-wave48-readiness-20260918]
permissions:
  contents: write
jobs:
  readiness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave48-readiness-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Wave48 readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=json.loads(Path('tools/trashnavi/data/direct-waste-links-supply-wave48.json').read_text())
          expected={
            '082121':('常陸太田市','hitachiota'),
            '082252':('常陸大宮市','hitachiomiya'),
            '084433':('阿見町','ami'),
            '083097':('大洗町','oarai'),
            '083020':('茨城町','ibaraki-town'),
            '085642':('利根町','tone'),
            '085219':('八千代町','yachiyo'),
            '083411':('東海村','tokai'),
            '082317':('桜川市','sakuragawa'),
            '085421':('五霞町','goka')
          }
          assert len(rows)==30
          by={}
          for r in rows:
            assert r['pref']=='茨城県'
            assert r['lgcode'] in expected and r['city']==expected[r['lgcode']][0]
            assert r['last_checked']=='2026-09-18'
            assert r['status']=='active' and r['language']=='ja'
            assert r['link_type']!='municipal_home'
            assert r['url'].startswith('https://')
            by.setdefault(r['lgcode'],[]).append(r)
          assert set(by)==set(expected)
          for code,rs in by.items():
            assert len(rs)==3
            assert len({r['link_type'] for r in rs})==3
            assert len({r['url'] for r in rs})==3
          app=Path('tools/trashnavi/app.js').read_text()
          assert 'data/direct-waste-links-supply-wave48.json' in app
          manifest=json.loads(Path('tools/trashnavi/municipality-page-manifest.json').read_text())
          assert len(manifest)==254
          root=Path('sitemap.xml').read_text()
          dedicated=Path('sitemap-trashnavi.xml').read_text()
          index=Path('tools/trashnavi/index.html').read_text()
          for code,(city,slug) in expected.items():
            canonical=f'https://nicheworks.app/tools/trashnavi/ibaraki/{slug}/'
            href=f'/tools/trashnavi/ibaraki/{slug}/'
            assert canonical not in root
            assert canonical not in dedicated
            assert href not in index
          assert dedicated.count('<url>')==255
          print('Wave48 readiness static acceptance: 10 municipalities / 30 records / published surface remains 254')
          PY
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          rm .github/workflows/tmp-trashnavi-wave48-readiness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(trashnavi): validate Wave48 readiness"
          git push origin HEAD:feat/trashnavi-wave48-readiness-20260918
