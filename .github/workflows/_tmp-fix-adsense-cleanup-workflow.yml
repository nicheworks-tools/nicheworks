name: Fix AdSense cleanup workflow comment matcher

on:
  push:
    branches:
      - chore/adsense-public-placeholder-cleanup-20260915
    paths:
      - '.github/workflows/_tmp-fix-adsense-cleanup-workflow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/adsense-public-placeholder-cleanup-20260915
          fetch-depth: 0
      - name: Patch matcher
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/_tmp-adsense-public-placeholder-cleanup.yml')
          text = p.read_text()
          old = "            html = html.replace(/<!--[\\s\\S]*?YOUR_TOKEN_HERE[\\s\\S]*?-->/gi, '');"
          new = "            html = html.replace(/<!--[\\s\\S]*?-->/g, (comment) => /YOUR_TOKEN_HERE/i.test(comment) ? '' : comment);"
          if old not in text:
              raise SystemExit('target matcher not found')
          p.write_text(text.replace(old, new))
      - name: Commit patch and remove fixer
        run: |
          rm .github/workflows/_tmp-fix-adsense-cleanup-workflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/_tmp-adsense-public-placeholder-cleanup.yml .github/workflows/_tmp-fix-adsense-cleanup-workflow.yml
          git commit -m 'ci: scope analytics placeholder removal to one comment'
          git push origin HEAD:chore/adsense-public-placeholder-cleanup-20260915
