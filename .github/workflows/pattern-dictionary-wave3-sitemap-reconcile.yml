name: Pattern Dictionary Wave 3 sitemap reconcile

on:
  push:
    branches:
      - feat/pattern-dictionary-wave3-production-staging-20260916
    paths:
      - .github/workflows/pattern-dictionary-wave3-sitemap-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave3-production-staging-20260916
      - name: Append missing Wave 3 sitemap URLs only
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='sitemap.xml';
          const stage=JSON.parse(fs.readFileSync('tools/pattern-dictionary/data/wave3-source-verification.json','utf8'));
          const ids=stage.patterns.slice().sort((a,b)=>a.ordinal-b.ordinal).map(x=>x.pattern_id);
          if(ids.length!==20) throw new Error(`expected 20 Wave 3 ids, got ${ids.length}`);
          let xml=fs.readFileSync(path,'utf8');
          const entries=[];
          for(const id of ids){
            for(const prefix of ['', 'en/']){
              const url=`https://nicheworks.app/tools/pattern-dictionary/${prefix}patterns/${id}/`;
              if(!xml.includes(`<loc>${url}</loc>`)) entries.push(`  <url>\n    <loc>${url}</loc>\n    <lastmod>2026-09-16</lastmod>\n  </url>`);
            }
          }
          if(entries.length) xml=xml.replace('</urlset>',entries.join('\n')+'\n</urlset>');
          fs.writeFileSync(path,xml);
          for(const id of ids){
            for(const prefix of ['', 'en/']){
              const url=`https://nicheworks.app/tools/pattern-dictionary/${prefix}patterns/${id}/`;
              const n=(xml.match(new RegExp(url.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;
              if(n!==1) throw new Error(`${url}: expected exactly one sitemap entry, got ${n}`);
            }
          }
          console.log(`Wave 3 sitemap reconciliation complete; appended ${entries.length} missing URLs.`);
          NODE
      - name: Run Pattern Dictionary sitemap/SEO validation
        run: |
          node tools/pattern-dictionary/tests/seo-detail-test.mjs
          node tools/pattern-dictionary/tests/publication-test.mjs
      - name: Commit reconciled sitemap
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo 'No sitemap changes needed.'
            exit 0
          fi
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add sitemap.xml
          git commit -m 'seo: reconcile Wave 3 sitemap with latest main'
          git push origin HEAD:feat/pattern-dictionary-wave3-production-staging-20260916
