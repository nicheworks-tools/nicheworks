name: Pattern Dictionary Amazon production QA

on:
  push:
    branches:
      - qa/pattern-dictionary-amazon-production-20260915
    paths:
      - '.github/workflows/pattern-dictionary-amazon-production-qa.yml'

permissions:
  contents: write

jobs:
  production-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/pattern-dictionary-amazon-production-20260915

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium QA dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify all 20 production Amazon links
        run: |
          node --input-type=commonjs <<'NODE'
          const { chromium } = require('playwright');

          const base = 'https://nicheworks.app/tools/pattern-dictionary/';
          const tag = 'nicheworks09-22';
          const expected = {
            'houndstooth':'千鳥格子',
            'gingham':'ギンガムチェック',
            'tartan':'タータンチェック',
            'glen-check':'グレンチェック',
            'argyle':'アーガイル柄',
            'chevron':'シェブロン柄',
            'polka-dot':'水玉柄',
            'moroccan-trellis':'モロッカントレリス 柄',
            'seigaiha':'青海波 柄',
            'asanoha':'麻の葉 柄',
            'shippo':'七宝 柄',
            'ichimatsu':'市松模様',
            'kikko':'亀甲 柄',
            'karakusa':'唐草模様',
            'damask':'ダマスク柄',
            'arabesque':'アラベスク柄',
            'paisley':'ペイズリー柄',
            'leopard-print':'ヒョウ柄',
            'ikat':'イカット柄',
            'kilim':'キリム柄'
          };

          (async()=>{
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const hrefs = new Map();
            try {
              for (const [id, query] of Object.entries(expected)) {
                const url = `${base}patterns/${id}/`;
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                if (!response || !response.ok()) throw new Error(`${id}: production page HTTP ${response?.status()}`);
                const link = page.locator('#pd-amazon-link a');
                await link.waitFor({ state: 'visible', timeout: 20000 });
                const href = await link.getAttribute('href');
                const rel = await link.getAttribute('rel');
                const text = (await link.textContent() || '').trim();
                const disclosure = (await page.locator('#pd-amazon-disclosure').textContent() || '').trim();
                if (!href) throw new Error(`${id}: Amazon href missing`);
                const u = new URL(href);
                if (u.protocol !== 'https:' || u.hostname !== 'www.amazon.co.jp' || u.pathname !== '/s') throw new Error(`${id}: wrong Amazon destination ${href}`);
                if (u.searchParams.get('tag') !== tag) throw new Error(`${id}: wrong tag ${u.searchParams.get('tag')}`);
                if (u.searchParams.get('k') !== query) throw new Error(`${id}: query mismatch ${u.searchParams.get('k')} != ${query}`);
                if (!rel?.split(/\s+/).includes('sponsored') || !rel?.split(/\s+/).includes('noopener')) throw new Error(`${id}: missing sponsored/noopener rel`);
                if (!text.includes('Amazon')) throw new Error(`${id}: CTA does not name Amazon`);
                if (!disclosure.includes('Amazonのアソシエイトとして')) throw new Error(`${id}: disclosure missing`);
                hrefs.set(id, href);
                console.log(`PASS ${id}: ${query}`);
              }

              if (hrefs.size !== 20) throw new Error(`expected 20 links, got ${hrefs.size}`);
              if (new Set(hrefs.values()).size !== 20) throw new Error('Amazon destinations are not 20 distinct URLs');

              await page.goto(`${base}en/patterns/paisley/`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              const enLink = page.locator('#pd-amazon-link a');
              await enLink.waitFor({ state: 'visible', timeout: 20000 });
              const enHref = new URL(await enLink.getAttribute('href'));
              const enText = (await enLink.textContent() || '').trim();
              const enDisclosure = (await page.locator('#pd-amazon-disclosure').textContent() || '').trim();
              if (enHref.searchParams.get('tag') !== tag || enHref.searchParams.get('k') !== expected.paisley) throw new Error('English Paisley does not reuse canonical fixed destination');
              if (!enText.includes('Find paisley products on Amazon')) throw new Error(`English CTA label unexpected: ${enText}`);
              if (!enDisclosure.includes('As an Amazon Associate')) throw new Error('English disclosure missing');
              console.log('PASS English Paisley affiliate surface');

              await page.setViewportSize({ width: 390, height: 844 });
              await page.goto(`${base}patterns/houndstooth/`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.locator('#pd-amazon-link a').waitFor({ state: 'visible', timeout: 20000 });
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);
              if (overflow) throw new Error('mobile detail has horizontal overflow');
              console.log('PASS mobile Houndstooth affiliate surface');

              await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 30000 });
              const placeholder = await page.locator('#q').getAttribute('placeholder');
              if (placeholder !== '千鳥格子 / 白黒のギザギザしたチェック') throw new Error(`search placeholder regressed: ${placeholder}`);
              console.log('PASS search placeholder remains name + descriptive example');
              console.log('OK: production Pattern Dictionary Amazon QA passed 20/20 distinct canonical links with shared tag nicheworks09-22.');
            } finally {
              await browser.close();
            }
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Remove one-shot QA workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pattern-dictionary-amazon-production-qa.yml
          git commit -m 'ci: remove Pattern Dictionary production Amazon QA one-shot'
          git push origin HEAD:qa/pattern-dictionary-amazon-production-20260915
