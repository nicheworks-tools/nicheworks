name: Pattern Dictionary Wave 4 Chromium QA

on:
  push:
    branches:
      - feat/pattern-dictionary-wave4-production-staging-20260916
    paths:
      - .github/workflows/pattern-dictionary-wave4-browser-qa.yml

permissions:
  contents: read

jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave4-production-staging-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/pdqa
          cd /tmp/pdqa
          npm init -y >/dev/null 2>&1
          npm install --silent @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pattern-dictionary-http.log 2>&1 &
          echo $! >/tmp/pattern-dictionary-http.pid
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/tools/pattern-dictionary/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pattern-dictionary-http.log
          exit 1
      - name: Write Chromium QA
        run: |
          cat >/tmp/pdqa/pd.spec.js <<'JS'
          const {test,expect}=require('@playwright/test');
          const BASE='http://127.0.0.1:4173';
          test.beforeEach(async({page})=>{
            await page.route('**/*',async route=>{
              const u=new URL(route.request().url());
              if(u.hostname==='127.0.0.1')await route.continue(); else await route.abort();
            });
          });
          test('desktop home, filter, search, detail, compare and language contracts',async({page})=>{
            await page.setViewportSize({width:1440,height:1000});
            await page.goto(BASE+'/tools/pattern-dictionary/',{waitUntil:'domcontentloaded'});
            await expect(page.locator('#pattern-grid .pd-card')).toHaveCount(80);
            await expect(page.locator('footer')).toContainText('現在の80件');
            await page.locator('.pd-filter[data-family="global-textile"]').click();
            const visible=page.locator('#pattern-grid .pd-card:visible');
            expect(await visible.count()).toBeGreaterThanOrEqual(5);
            const hrefs=await visible.locator('a').evaluateAll(as=>as.map(a=>a.getAttribute('href')));
            for(const id of ['shibori','batik','bandhani','ajrakh','kalamkari'])expect(hrefs.some(h=>h&&h.includes('/patterns/'+id+'/'))).toBeTruthy();

            await page.goto(BASE+'/tools/pattern-dictionary/search.html?q='+encodeURIComponent('籠目'),{waitUntil:'domcontentloaded'});
            const kagomeFirst=page.locator('#results a[href*="/patterns/"]').first();
            await expect(kagomeFirst).toHaveAttribute('href',/\/patterns\/kagome\//);
            await expect(page.locator('footer')).toContainText('80件の検証済みデータ');

            await page.goto(BASE+'/tools/pattern-dictionary/search.html?q='+encodeURIComponent('水玉ではなく絞りの輪点'),{waitUntil:'domcontentloaded'});
            const kanokoFirst=page.locator('#results a[href*="/patterns/"]').first();
            await expect(kanokoFirst).toHaveAttribute('href',/\/patterns\/kanoko\//);

            await page.goto(BASE+'/tools/pattern-dictionary/patterns/kagome/',{waitUntil:'domcontentloaded'});
            await expect(page.locator('#detail')).toContainText('籠目');
            const image=page.locator('#detail img').first();
            await expect(image).toBeVisible();
            await expect.poll(()=>image.evaluate(img=>img.naturalWidth)).toBeGreaterThan(0);
            await expect(page.locator('#lang-link')).toHaveAttribute('href','/tools/pattern-dictionary/en/patterns/kagome/');
            await expect(page.locator('.pd-amazon-links a')).toHaveCount(3);

            await page.locator('#lang-link').click();
            await expect(page).toHaveURL(/\/en\/patterns\/kagome\/$/);
            await expect(page.locator('#detail')).toContainText('Kagome');
            await expect(page.locator('#lang-link')).toHaveAttribute('href','/tools/pattern-dictionary/patterns/kagome/');

            await page.goto(BASE+'/tools/pattern-dictionary/compare.html?a=kanoko&b=polka-dot',{waitUntil:'domcontentloaded'});
            await expect(page.locator('#compare')).toContainText('鹿の子');
            await expect(page.locator('#compare')).toContainText('水玉');
            await expect(page.locator('#compare')).toContainText('白抜き輪ならKanoko');
          });

          test('mobile has no root horizontal overflow and Wave 4 UI remains usable',async({page})=>{
            await page.setViewportSize({width:390,height:844});
            await page.goto(BASE+'/tools/pattern-dictionary/',{waitUntil:'domcontentloaded'});
            await expect(page.locator('#pattern-grid .pd-card')).toHaveCount(80);
            const rootOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            expect(rootOverflow).toBeLessThanOrEqual(1);
            const row=page.locator('.pd-filter-row');
            const dims=await row.evaluate(el=>({scroll:el.scrollWidth,client:el.clientWidth,overflow:getComputedStyle(el).overflowX}));
            expect(dims.scroll).toBeGreaterThan(dims.client);
            expect(['auto','scroll']).toContain(dims.overflow);
            await page.locator('.pd-filter[data-family="global-textile"]').click();
            expect(await page.locator('#pattern-grid .pd-card:visible').count()).toBeGreaterThanOrEqual(5);

            await page.goto(BASE+'/tools/pattern-dictionary/compare.html?a=kanoko&b=polka-dot',{waitUntil:'domcontentloaded'});
            await expect(page.locator('#compare')).toContainText('鹿の子');
            const compareOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            expect(compareOverflow).toBeLessThanOrEqual(1);
          });
          JS
      - name: Run Chromium desktop and mobile QA
        run: |
          cd /tmp/pdqa
          npx playwright test pd.spec.js --reporter=line --workers=1
