name: Apply LineBreak behavior matrix

on:
  push:
    branches:
      - test/behavior-wave1-linebreak-v3-20260913
    paths:
      - '.github/workflows/linebreak-behavior-matrix-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current behavior branch
        uses: actions/checkout@v4
        with:
          ref: test/behavior-wave1-linebreak-v3-20260913
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove behavior test before promotion
        run: node scripts/run-tool-behavior-tests.mjs

      - name: Synchronize matrix evidence
        run: node scripts/apply-linebreak-behavior-matrix.mjs

      - name: Validate quality contracts
        run: |
          node scripts/check-tool-spec-contract.mjs
          node scripts/check-tool-spec-coverage.mjs
          node scripts/check-tool-quality-contract.mjs
          node scripts/check-common-support-contract.mjs
          git diff --check

      - name: Commit matrix synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/tool-quality-matrix.json audits/tool-quality-matrix.md
          git commit -m "Record LineBreak Doctor behavior test in quality matrix"
          git push origin HEAD:test/behavior-wave1-linebreak-v3-20260913
