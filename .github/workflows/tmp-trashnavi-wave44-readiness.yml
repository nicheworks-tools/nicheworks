name: tmp TrashNavi Wave44 readiness
on:
  push:
    branches: [feat/trashnavi-wave44-readiness-20260918]
permissions:
  contents: write
jobs:
  readiness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave44-readiness-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Register and validate Wave44 readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('tools/trashnavi/data/direct-waste-links-supply-wave44.json')
          rows=json.loads(p.read_text())
          expected={
            '122254':'君津市','122262':'富津市','122297':'袖ケ浦市','122106':'茂原市','122131':'東金市',
            '122301':'八街市','122319':'印西市','122327':'白井市','122289':'四街道市','122335':'富里市'}
          assert len(rows)==30
          by={}
          for r in rows:
            assert r['pref']=='千葉県'
            assert r['lgcode'] in expected and r['city']==expected[r['lgcode']]
            assert r['last_checked']=='2026-09-18' and r['status']=='active' and r['language']=='ja'
            assert r['link_type']!='municipal_home'
            assert r['url'].startswith('https://')
            by.setdefault(r['lgcode'],[]).append(r)
          assert set(by)==set(expected)
          for code,rs in by.items():
            assert len(rs)==3
            assert len({r['link_type'] for r in rs})==3
            assert len({r['url'] for r in rs})==3
          app=Path('tools/trashnavi/app.js')
          s=app.read_text()
          old='"data/direct-waste-links-supply-wave43.json"]'
          new='"data/direct-waste-links-supply-wave43.json","data/direct-waste-links-supply-wave44.json"]'
          assert old in s and 'direct-waste-links-supply-wave44.json' not in s
          app.write_text(s.replace(old,new,1))
          sm=Path('sitemap-trashnavi.xml')
          text=sm.read_text()
          text=re.sub(r'<lastmod>\d{4}-\d{2}-\d{2}</lastmod>','<lastmod>2026-09-18</lastmod>',text)
          sm.write_text(text)
          PY

          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs

          python3 - <<'PY'
          from pathlib import Path
          import json
          slugs=['kimitsu','futtsu','sodegaura','mobara','togane','yachimata','inzai','shiroi','yotsukaido','tomisato']
          manifest=json.loads(Path('tools/trashnavi/municipality-page-manifest.json').read_text())
          assert len(manifest)==214
          root=Path('sitemap.xml').read_text(); dedicated=Path('sitemap-trashnavi.xml').read_text()
          index=Path('tools/trashnavi/index.html').read_text()
          for slug in slugs:
            canonical=f'https://nicheworks.app/tools/trashnavi/chiba/{slug}/'
            href=f'/tools/trashnavi/chiba/{slug}/'
            assert canonical not in root
            assert canonical not in dedicated
            assert href not in index
          assert dedicated.count('<lastmod>2026-09-18</lastmod>')==215
          print('Wave44 readiness acceptance: 10 municipalities / 30 records / unpublished URLs absent / dedicated sitemap 215 lastmod synced (tool root + 214 published municipality pages)')
          PY

          rm .github/workflows/tmp-trashnavi-wave44-readiness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(trashnavi): prepare Wave44 municipalities"
          git push origin HEAD:feat/trashnavi-wave44-readiness-20260918
