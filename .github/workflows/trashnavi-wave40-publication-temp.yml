name: TrashNavi Wave40 publication temporary
on:
  push:
    branches:
      - feat/trashnavi-wave40-publication-20260917
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave40-publication-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and validate Wave40 publication
        run: node tools/trashnavi/scripts/wave40-publish-temp.mjs
