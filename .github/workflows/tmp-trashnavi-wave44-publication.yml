name: tmp TrashNavi Wave44 publication
on:
  push:
    branches: [feat/trashnavi-wave44-publication-20260918]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave44-publication-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and validate Wave44 publication
        run: node tools/trashnavi/scripts/tmp-wave44-publication.mjs
      - name: Commit generated publication
        run: |
          rm .github/workflows/tmp-trashnavi-wave44-publication.yml
          rm tools/trashnavi/scripts/tmp-wave44-publication.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(trashnavi): publish Wave44 municipalities"
          git push origin HEAD:feat/trashnavi-wave44-publication-20260918
