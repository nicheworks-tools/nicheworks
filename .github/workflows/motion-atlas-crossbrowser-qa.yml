name: Motion Atlas cross-browser and generated React QA
on:
  pull_request:
    paths:
      - 'tools/motion-atlas/tests/studio-crossbrowser-runtime.test.mjs'
      - '.github/workflows/motion-atlas-crossbrowser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossbrowser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Playwright, React and JSX compiler (CI only)
        run: npm install --prefix .qa-deps --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1 react@19.2.0 react-dom@19.2.0 esbuild@0.25.12
      - name: Free and Studio regression tests
        run: |
          node tools/motion-atlas/tests/behavior.test.mjs
          node tools/motion-atlas/tests/studio-billing-lifecycle.test.mjs
      - name: Chromium, Firefox, WebKit and generated React/CSS rendering
        env:
          HOME: /root
        run: node tools/motion-atlas/tests/studio-crossbrowser-runtime.test.mjs
