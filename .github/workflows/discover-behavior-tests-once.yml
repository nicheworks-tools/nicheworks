name: Discover behavior-test candidates once

on:
  push:
    branches:
      - audit/behavior-test-discovery-20260913
    paths:
      - 'scripts/discover-behavior-test-candidates-once.mjs'
      - '.github/workflows/discover-behavior-tests-once.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/behavior-test-discovery-20260913
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/discover-behavior-test-candidates-once.mjs
