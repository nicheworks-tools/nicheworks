name: Temporary Phone QuickCheck tools meta sync

on:
  push:
    branches:
      - feat/phone-quickcheck-public-launch-20260913
    paths:
      - .github/workflows/tmp-phone-quickcheck-tools-meta-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/phone-quickcheck-public-launch-20260913
          fetch-depth: 1

      - name: Register Phone QuickCheck SEO metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'tools/tools-meta.json';
          const meta = JSON.parse(fs.readFileSync(path, 'utf8'));
          meta.updatedAt = '2026-09-13';
          meta.items['phone-quickcheck'] = {
            title_ja: 'スマホ QuickCheck',
            title_en: 'Phone QuickCheck',
            desc_ja: 'スマホのサイズ・重さ・充電端子・充電器条件・モバイルバッテリー充電回数の目安と公式情報を素早く確認します。',
            desc_en: 'Quickly check phone size, weight, charging port, charger requirements, power-bank estimates, and official information.',
            tags: ['phone', 'smartphone', 'charging', 'size', 'battery']
          };
          fs.writeFileSync(path, JSON.stringify(meta, null, 2) + '\n');
          NODE

      - name: Validate strict SEO
        run: node scripts/audit-seo.mjs --strict

      - name: Commit metadata and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phone-quickcheck-tools-meta-sync.yml
          git add tools/tools-meta.json
          git commit -m "Register Phone QuickCheck SEO metadata"
          git push origin HEAD:feat/phone-quickcheck-public-launch-20260913
