name: Reconcile spec contract fix

on:
  push:
    branches:
      - feat/reconcile-publication-20260912
    paths:
      - .github/workflows/reconcile-spec-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Reconcile SPEC contract formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/reconcile/SPEC.md')
          s = p.read_text()
          old = '## Language mode\n\nBilingual single-page. Japanese and English UI copy share the same public URL and are switched client-side using the common `nw_lang` preference.'
          new = '## Language mode\n\n`bilingual single-page`\n\nJapanese and English UI copy share the same public URL and are switched client-side using the common `nw_lang` preference.'
          if old not in s:
              raise SystemExit('expected Language mode text not found')
          s = s.replace(old, new, 1)
          before, marker, after = s.partition('## Acceptance criteria\n')
          if not marker:
              raise SystemExit('Acceptance criteria section missing')
          section, next_marker, rest = after.partition('\n## Implementation evidence')
          lines = section.splitlines()
          checked = []
          for line in lines:
              if line.startswith('- ') and not line.startswith('- ['):
                  line = '- [x] ' + line[2:]
              checked.append(line)
          s = before + marker + '\n'.join(checked) + next_marker + rest
          p.write_text(s)
          PY
          node scripts/check-tool-spec-contract.mjs
          rm .github/workflows/reconcile-spec-contract-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/reconcile/SPEC.md .github/workflows/reconcile-spec-contract-fix.yml
          git diff --cached --check
          git commit -m "fix(reconcile): satisfy tool spec contract"
          git push origin HEAD:feat/reconcile-publication-20260912
