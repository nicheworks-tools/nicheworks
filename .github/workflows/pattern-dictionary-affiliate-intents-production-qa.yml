name: Pattern Dictionary 65-link production QA

on:
  push:
    branches:
      - qa/pattern-dictionary-affiliate-intents-production-20260915
    paths:
      - '.github/workflows/pattern-dictionary-affiliate-intents-production-qa.yml'

permissions:
  contents: write

jobs:
  production-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/pattern-dictionary-affiliate-intents-production-20260915

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium QA dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify production 20-pattern 65-link surface
        run: |
          node --input-type=commonjs <<'NODE'
          const { chromium } = require('playwright');
          const base = 'https://nicheworks.app/tools/pattern-dictionary/';
          const expectedTag = 'nicheworks09-22';
          const expectedCounts = {
            'houndstooth':4,'gingham':4,'tartan':4,'glen-check':3,'argyle':3,
            'chevron':3,'polka-dot':3,'moroccan-trellis':3,'seigaiha':3,'asanoha':3,
            'shippo':3,'ichimatsu':3,'kikko':3,'karakusa':3,'damask':3,
            'arabesque':3,'paisley':4,'leopard-print':4,'ikat':3,'kilim':3
          };

          (async()=>{
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
            try {
              let cfg;
              for (let attempt=0; attempt<18; attempt++) {
                const res = await page.request.get(`${base}data/affiliate-config.json?qa=${Date.now()}`, { timeout: 15000 });
                if (res.ok()) {
                  const candidate = await res.json();
                  if (candidate.schema === 'pattern-dictionary-affiliate-v3' && (candidate.offers||[]).length === 65) {
                    cfg = candidate;
                    break;
                  }
                }
                await new Promise(r=>setTimeout(r,5000));
              }
              if (!cfg) throw new Error('production did not expose affiliate v3 / 65 offers');
              if (cfg.enabled !== true || cfg.tracking_id !== expectedTag) throw new Error('production affiliate config is not active with maintained tag');
              if (cfg.policy?.free_text_forwarding !== false) throw new Error('free-text forwarding policy regressed');

              const offers = cfg.offers || [];
              const allExpectedHrefs = new Set(offers.map(o=>o.amazon_url));
              if (allExpectedHrefs.size !== 65) throw new Error(`expected 65 unique configured URLs, got ${allExpectedHrefs.size}`);
              const observedHrefs = new Set();

              for (const [id,count] of Object.entries(expectedCounts)) {
                const group = offers.filter(o=>o.pattern_id===id).sort((a,b)=>a.priority-b.priority);
                if (group.length !== count) throw new Error(`${id}: config count ${group.length} != ${count}`);
                const response = await page.goto(`${base}patterns/${id}/?qa=${Date.now()}`, { waitUntil:'domcontentloaded', timeout:30000 });
                if (!response || !response.ok()) throw new Error(`${id}: HTTP ${response?.status()}`);
                const links = page.locator('#pd-amazon-links a.pd-amazon-offer-link');
                await links.first().waitFor({state:'visible',timeout:20000});
                const visibleCount = await links.count();
                if (visibleCount !== count) throw new Error(`${id}: rendered ${visibleCount} Amazon links, expected ${count}`);
                const hrefs = await links.evaluateAll(nodes=>nodes.map(n=>n.href));
                const labels = await links.evaluateAll(nodes=>nodes.map(n=>(n.textContent||'').trim()));
                for (let i=0;i<group.length;i++) {
                  const offer=group[i], href=hrefs[i], label=labels[i];
                  const u=new URL(href);
                  if (href !== offer.amazon_url) throw new Error(`${id}/${offer.offer_id}: rendered href differs from config`);
                  if (u.hostname!=='www.amazon.co.jp'||u.pathname!=='/s'||u.searchParams.get('tag')!==expectedTag||u.searchParams.get('k')!==offer.query) throw new Error(`${id}/${offer.offer_id}: invalid Amazon destination`);
                  if (label!==offer.label_ja) throw new Error(`${id}/${offer.offer_id}: JA label mismatch`);
                  const rel=await links.nth(i).getAttribute('rel');
                  if (!rel?.split(/\s+/).includes('sponsored')||!rel?.split(/\s+/).includes('noopener')) throw new Error(`${id}/${offer.offer_id}: rel semantics missing`);
                  observedHrefs.add(href);
                }
                const disclosures=page.locator('#pd-amazon-disclosure');
                if (await disclosures.count()!==1) throw new Error(`${id}: expected one disclosure container`);
                const disclosure=(await disclosures.textContent()||'').trim();
                if (!disclosure.includes('Amazonのアソシエイトとして')) throw new Error(`${id}: JA Associates disclosure missing`);
                console.log(`PASS ${id}: ${count} links`);
              }

              if (observedHrefs.size!==65) throw new Error(`observed ${observedHrefs.size} distinct production links, expected 65`);
              for (const href of allExpectedHrefs) if (!observedHrefs.has(href)) throw new Error(`configured URL was not observed in production: ${href}`);

              await page.goto(`${base}en/patterns/paisley/?qa=${Date.now()}`, {waitUntil:'domcontentloaded',timeout:30000});
              const enLinks=page.locator('#pd-amazon-links a.pd-amazon-offer-link');
              await enLinks.first().waitFor({state:'visible',timeout:20000});
              if (await enLinks.count()!==4) throw new Error('English Paisley should render 4 links');
              const paisley=offers.filter(o=>o.pattern_id==='paisley').sort((a,b)=>a.priority-b.priority);
              const enLabels=await enLinks.evaluateAll(nodes=>nodes.map(n=>(n.textContent||'').trim()));
              for(let i=0;i<4;i++) if(enLabels[i]!==paisley[i].label_en) throw new Error(`English Paisley label ${i+1} mismatch`);
              const enDisclosure=(await page.locator('#pd-amazon-disclosure').textContent()||'').trim();
              if(!enDisclosure.includes('As an Amazon Associate')) throw new Error('English Associates disclosure missing');
              console.log('PASS English Paisley: 4 maintained intent links');

              await page.setViewportSize({width:390,height:844});
              await page.goto(`${base}patterns/houndstooth/?qa=${Date.now()}`, {waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#pd-amazon-links a.pd-amazon-offer-link').first().waitFor({state:'visible',timeout:20000});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
              if(overflow) throw new Error('390px Houndstooth detail has horizontal overflow');
              console.log('PASS mobile Houndstooth 4-link surface');

              await page.goto(`${base}?qa=${Date.now()}`, {waitUntil:'domcontentloaded',timeout:30000});
              const placeholder=await page.locator('#q').getAttribute('placeholder');
              if(placeholder!=='千鳥格子 / 白黒のギザギザしたチェック') throw new Error(`search placeholder regressed: ${placeholder}`);
              console.log('PASS search placeholder');
              console.log('OK: production Pattern Dictionary exposes 65/65 fixed Amazon commerce-intent links across 20 patterns.');
            } finally {
              await browser.close();
            }
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Remove one-shot QA workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pattern-dictionary-affiliate-intents-production-qa.yml
          git commit -m 'ci: remove Pattern Dictionary 65-link production QA one-shot'
          git push origin HEAD:qa/pattern-dictionary-affiliate-intents-production-20260915
