name: Temporary Dry Meter SEO cluster finalizer

on:
  push:
    branches:
      - seo/dry-meter-static-cluster-20260917
    paths:
      - 'scripts/tmp-dry-meter-static-cluster.mjs'
      - '.github/workflows/tmp-dry-meter-static-cluster.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/dry-meter-static-cluster-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/tmp-dry-meter-static-cluster.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD -- scripts/tmp-dry-meter-static-cluster.mjs .github/workflows/tmp-dry-meter-static-cluster.yml
          git add tools/dry-meter/index.html tools/laundry-code-decode/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Expand Dry Meter static search context"
          git push origin HEAD:seo/dry-meter-static-cluster-20260917
