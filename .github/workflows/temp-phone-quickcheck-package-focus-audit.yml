name: Temp Phone QuickCheck package focus audit

on:
  pull_request:
    paths:
      - '.github/workflows/temp-phone-quickcheck-package-focus-audit.yml'
      - 'tools/phone-quickcheck/data/phones.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print package unknowns and focus records
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('tools/phone-quickcheck/data/phones.json','utf8'));
          const adapter = data.phones.filter(p => p.included?.adapter === 'unknown');
          const cable = data.phones.filter(p => p.included?.cable === 'unknown');
          console.log('ADAPTER_COUNT=' + adapter.length);
          console.log('ADAPTER_IDS=' + JSON.stringify(adapter.map(p => p.id)));
          console.log('CABLE_COUNT=' + cable.length);
          console.log('CABLE_IDS=' + JSON.stringify(cable.map(p => p.id)));
          const focus = data.phones.filter(p =>
            ['Motorola','ZTE','Sharp'].includes(p.manufacturer) &&
            (p.included?.adapter === 'unknown' || p.included?.cable === 'unknown')
          ).map(p => ({
            id: p.id,
            manufacturer: p.manufacturer,
            model: p.model,
            market: p.market ?? null,
            included: p.included,
            specificationsUrl: p.sources?.specificationsUrl ?? null,
            manualUrl: p.sources?.manualUrl ?? null,
            releaseUrl: p.sources?.releaseUrl ?? null
          }));
          console.log('FOCUS=' + JSON.stringify(focus, null, 2));
          NODE
