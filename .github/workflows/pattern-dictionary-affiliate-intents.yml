name: Pattern Dictionary affiliate intent expansion

on:
  push:
    branches:
      - feat/pattern-dictionary-affiliate-intents-20260915
    paths:
      - '.github/workflows/pattern-dictionary-affiliate-intents.yml'
      - '.github/tmp_pattern_dictionary_affiliate_intents.py'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-affiliate-intents-20260915

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate maintained commerce intents
        run: python .github/tmp_pattern_dictionary_affiliate_intents.py

      - name: Validate affiliate intent expansion
        run: |
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/tests/affiliate-test.mjs
          node tools/pattern-dictionary/tests/browse-mobile-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
          git diff --check

      - name: Persist changes and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pattern-dictionary/data/affiliate-config.json tools/pattern-dictionary/app.js tools/pattern-dictionary/style.css tools/pattern-dictionary/tests/affiliate-test.mjs tools/pattern-dictionary/README.md
          git rm .github/workflows/pattern-dictionary-affiliate-intents.yml .github/tmp_pattern_dictionary_affiliate_intents.py
          git commit -m 'feat: add Pattern Dictionary Amazon commerce intents'
          git push origin HEAD:feat/pattern-dictionary-affiliate-intents-20260915
