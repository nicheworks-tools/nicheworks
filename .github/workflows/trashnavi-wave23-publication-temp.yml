name: TrashNavi Wave23 publication temp
on:
  push:
    branches:
      - feat/trashnavi-batch-wave23-publication-20260915
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish five Wave23 municipalities
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')

          targets=[
            ('092011','tochigi','utsunomiya','宇都宮市'),
            ('162019','toyama','toyama','富山市'),
            ('182010','fukui','fukui','福井市'),
            ('202011','nagano','nagano','長野市'),
            ('212016','gifu','gifu','岐阜市'),
          ]

          # Manifest: preserve compact one-row-per-entry style.
          p=root/'tools/trashnavi/municipality-page-manifest.json'
          s=p.read_text()
          assert s.count('"publish":true')==29, 'manifest baseline must be 29'
          insert=[]
          for lg,pref,city,name in targets:
            assert f'"lgcode":"{lg}"' not in s
            insert.append(f'  {{"lgcode":"{lg}","pref_slug":"{pref}","city_slug":"{city}","publish":true}}')
          s=s.rstrip()
          assert s.endswith('\n]') or s.endswith(']')
          s=s[:-1].rstrip()
          if not s.endswith(','): s += ','
          s += '\n' + ',\n'.join(insert) + '\n]\n'
          p.write_text(s)

          # Generator publication guard 29 -> 34.
          p=root/'tools/trashnavi/scripts/generate-municipality-pages.mjs'
          s=p.read_text()
          old='if(outputs.length!==29) throw new Error(`municipality page count must be 29; got ${outputs.length}`);'
          new='if(outputs.length!==34) throw new Error(`municipality page count must be 34; got ${outputs.length}`);'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))

          # Affiliate contract publication guard 29 -> 34.
          p=root/'tools/trashnavi/scripts/check-affiliate-contract.mjs'
          s=p.read_text()
          old='check(manifest.length === 29, `expected 29 published municipality pages, got ${manifest.length}`);'
          new='check(manifest.length === 34, `expected 34 published municipality pages, got ${manifest.length}`);'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))

          # TrashNavi landing page: append municipality links and refresh visible data date.
          p=root/'tools/trashnavi/index.html'
          s=p.read_text()
          anchor='<a href="/tools/trashnavi/kochi/kochi/">高知市</a>'
          assert s.count(anchor)==1
          additions=''.join(f'<a href="/tools/trashnavi/{pref}/{city}/">{name}</a>' for lg,pref,city,name in targets)
          s=s.replace(anchor,anchor+additions)
          s=s.replace('データ更新日：2026-09-14','データ更新日：2026-09-15')
          s=s.replace('Data updated: 2026-09-14','Data updated: 2026-09-15')
          p.write_text(s)

          # AI discovery layer 29 -> 34.
          p=root/'tools/trashnavi/ai-reference.json'
          data=json.loads(p.read_text())
          assert data['published_municipality_count']==29
          assert len(data['municipalities'])==29
          existing={x['lgcode'] for x in data['municipalities']}
          for lg,pref,city,name in targets:
            assert lg not in existing
            data['municipalities'].append({'lgcode':lg,'pref_slug':pref,'city_slug':city,'url':f'https://nicheworks.app/tools/trashnavi/{pref}/{city}/'})
          data['published_municipality_count']=34
          data['snapshot_date']='2026-09-15'
          # retain current compact municipality rows.
          head={k:v for k,v in data.items() if k!='municipalities'}
          lines=['{']
          keys=list(head.keys())
          for i,k in enumerate(keys):
            v=json.dumps(head[k],ensure_ascii=False)
            lines.append(f'  {json.dumps(k,ensure_ascii=False)}: {v},')
          lines.append('  "municipalities": [')
          for i,row in enumerate(data['municipalities']):
            comma=',' if i<len(data['municipalities'])-1 else ''
            lines.append('    '+json.dumps(row,ensure_ascii=False,separators=(',',':'))+comma)
          lines += ['  ]','}']
          p.write_text('\n'.join(lines)+'\n')

          # Root sitemap must be maintained explicitly; generator does not write it.
          p=root/'sitemap.xml'
          s=p.read_text()
          blocks=[]
          for lg,pref,city,name in targets:
            url=f'https://nicheworks.app/tools/trashnavi/{pref}/{city}/'
            assert s.count(f'<loc>{url}</loc>')==0
            blocks.append(f'  <url>\n    <loc>{url}</loc>\n    <lastmod>2026-09-15</lastmod>\n  </url>')
          assert s.count('</urlset>')==1
          s=s.replace('</urlset>','\n'.join(blocks)+'\n</urlset>')
          p.write_text(s)

          # SPEC: Wave23 batch publication/acceptance record.
          p=root/'tools/trashnavi/SPEC.md'
          s=p.read_text()
          assert '## Wave 23 batch publication' not in s
          block='''\n\n## Wave 23 batch publication\n\nWave 23から、1自治体ずつではなく複数自治体を同一Waveで検証・公開するbatch expansionへ移行する。公開閾値は従来どおり `municipal_home` を除く **3種類以上の異なるwaste-specific official link type** とし、速度向上のために閾値やauthority要件を緩和しない。\n\nWave 23では次の5自治体を同時にpreferred candidateへ引き上げ、公開対象を **29自治体から34自治体** へ拡張する。\n\n- 栃木県 宇都宮市 — `/tools/trashnavi/tochigi/utsunomiya/` — waste sorting / collection calendar / bulky waste\n- 富山県 富山市 — `/tools/trashnavi/toyama/toyama/` — waste sorting / collection calendar / drop-off facility\n- 福井県 福井市 — `/tools/trashnavi/fukui/fukui/` — waste sorting / collection calendar / bulky waste\n- 長野県 長野市 — `/tools/trashnavi/nagano/nagano/` — waste sorting / collection calendar / drop-off facility\n- 岐阜県 岐阜市 — `/tools/trashnavi/gifu/gifu/` — waste sorting / collection calendar / bulky waste\n\nWave 23 readiness検証時点のbaselineは、1,916 municipalities、2,234 valid HTTP(S) records、34 preferred candidates、26 direct-link datasets / 166 records / 147 unique URLs / 0 invalid URLs とする。\n\nWave 23 publication acceptanceでは、5ページすべてについて3 official cards、canonical URL、現在のofficial source URL、Amazon affiliate block `[PR]`、共有Amazon helper/config/runtime、AI reference 34/34、両sitemapへのcanonical 1件ずつを検証する。`fiscal_year: 2026` を持つ岐阜市・長野市だけ2026 calendar calloutを表示し、それ以外3自治体には年次calloutを生成しない。Amazon契約は既存の `nicheworks09-22` / 4 fixed searches / municipality・runtime state非送信を変更せず継承する。\n'''
          p.write_text(s.rstrip()+block+'\n')
          PY

          # Generate all published pages and sitemap-trashnavi.xml.
          node tools/trashnavi/scripts/generate-municipality-pages.mjs

          # Wave23 generated-page contract: five pages, exactly 3 official cards each,
          # affiliate block on every page, correct calendar-callout behavior, and no stale canonical links.
          node <<'NODE'
          const fs=require('fs');
          const targets=[
            {path:'tools/trashnavi/tochigi/utsunomiya/index.html',url:'https://nicheworks.app/tools/trashnavi/tochigi/utsunomiya/',calendar:false,links:['https://www.city.utsunomiya.lg.jp/kurashi/gomi/kateigomi/dashikata/index.html','https://www.city.utsunomiya.lg.jp/kurashi/gomi/kateigomi/dashikata/1004984.html','https://www.city.utsunomiya.lg.jp/kurashi/gomi/kateigomi/dashikata/1017157/1004986.html']},
            {path:'tools/trashnavi/toyama/toyama/index.html',url:'https://nicheworks.app/tools/trashnavi/toyama/toyama/',calendar:false,links:['https://www.city.toyama.lg.jp/kurashi/gomi/1010228/1010229/index.html','https://www.city.toyama.lg.jp/kurashi/gomi/1010228/1010232/index.html','https://www.city.toyama.lg.jp/kurashi/gomi/1010228/1005384.html']},
            {path:'tools/trashnavi/fukui/fukui/index.html',url:'https://nicheworks.app/tools/trashnavi/fukui/fukui/',calendar:false,links:['https://www.city.fukui.lg.jp/kurasi/kankyo/kgomi/','https://www.city.fukui.lg.jp/gomi/','https://www.city.fukui.lg.jp/kurasi/kankyo/kgomi/sodai_kobetu.html']},
            {path:'tools/trashnavi/nagano/nagano/index.html',url:'https://nicheworks.app/tools/trashnavi/nagano/nagano/',calendar:true,links:['https://www.city.nagano.nagano.jp/n121500/contents/p000504.html','https://www.city.nagano.nagano.jp/n121500/contents/p006210.html','https://www.city.nagano.nagano.jp/n121515/contents/p000605.html'],stale:'https://www.city.nagano.nagano.jp/menu/2/4/1/2/index.html'},
            {path:'tools/trashnavi/gifu/gifu/index.html',url:'https://nicheworks.app/tools/trashnavi/gifu/gifu/',calendar:true,links:['https://www.city.gifu.lg.jp/kurashi/gomi/1012143/1038453/index.html','https://www.city.gifu.lg.jp/kurashi/gomi/1012143/1038453/1038463.html','https://www.city.gifu.lg.jp/kurashi/gomi/1020035/1020039.html'],stale:'https://www.city.gifu.lg.jp/tetsuzuki/gomi/index.html'}
          ];
          for(const t of targets){
            const p=fs.readFileSync(t.path,'utf8');
            if((p.match(/class="official-link-card"/g)||[]).length!==3) throw new Error(t.path+': official card count');
            if((p.match(new RegExp(t.url.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length<3) throw new Error(t.path+': canonical/OG/schema missing');
            for(const u of t.links) if(!p.includes(u)) throw new Error(t.path+': source missing '+u);
            if(t.stale&&p.includes(t.stale)) throw new Error(t.path+': stale URL remains');
            for(const needle of ['id="trashnaviAmazonAffiliate"','ごみ出し・片付け用品 [PR]','/assets/amazon-affiliate.js','/tools/trashnavi/affiliate-config.js','/tools/trashnavi/affiliate-runtime.js']) if(!p.includes(needle)) throw new Error(t.path+': affiliate contract missing '+needle);
            const has=p.includes('class="current-calendar-callout"');
            if(has!==t.calendar) throw new Error(t.path+': calendar callout mismatch');
          }
          const ai=JSON.parse(fs.readFileSync('tools/trashnavi/ai-reference.json','utf8'));
          if(ai.published_municipality_count!==34||ai.municipalities.length!==34) throw new Error('AI reference must be 34/34');
          for(const t of targets){
            for(const sm of ['sitemap.xml','sitemap-trashnavi.xml']){
              const s=fs.readFileSync(sm,'utf8');
              const needle=`<loc>${t.url}</loc>`;
              if(s.split(needle).length-1!==1) throw new Error(`${sm}: ${t.url} count`);
            }
          }
          NODE

          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs

          # Final diff must be the publication contract only.
          git diff --check
          echo 'Wave23 publication diff:'
          git status --short

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/trashnavi/municipality-page-manifest.json \
                  tools/trashnavi/scripts/generate-municipality-pages.mjs \
                  tools/trashnavi/scripts/check-affiliate-contract.mjs \
                  tools/trashnavi/index.html \
                  tools/trashnavi/ai-reference.json \
                  tools/trashnavi/SPEC.md \
                  tools/trashnavi/tochigi/utsunomiya/index.html \
                  tools/trashnavi/toyama/toyama/index.html \
                  tools/trashnavi/fukui/fukui/index.html \
                  tools/trashnavi/nagano/nagano/index.html \
                  tools/trashnavi/gifu/gifu/index.html \
                  sitemap-trashnavi.xml sitemap.xml
          git diff --cached --check
          git commit -m 'Publish five TrashNavi Wave23 municipality pages'
          git push origin HEAD:feat/trashnavi-batch-wave23-publication-20260915

          rm .github/workflows/trashnavi-wave23-publication-temp.yml
          git add .github/workflows/trashnavi-wave23-publication-temp.yml
          git commit -m 'Remove TrashNavi Wave23 publication workflow'
          git push origin HEAD:feat/trashnavi-batch-wave23-publication-20260915
