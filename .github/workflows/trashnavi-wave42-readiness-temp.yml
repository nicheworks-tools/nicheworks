name: TrashNavi Wave42 readiness finalize

on:
  push:
    branches:
      - feat/trashnavi-wave42-readiness-20260917
    paths:
      - '.github/workflows/trashnavi-wave42-readiness-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Wave42 readiness branch
        uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave42-readiness-20260917
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Register and validate Wave42
        run: |
          node <<'NODE'
          const fs = require('fs');
          const appPath = 'tools/trashnavi/app.js';
          let app = fs.readFileSync(appPath, 'utf8');
          const previous = '"data/direct-waste-links-supply-wave41.json"]';
          const target = '"data/direct-waste-links-supply-wave41.json","data/direct-waste-links-supply-wave42.json"]';
          if (!app.includes(target)) {
            if (!app.includes(previous)) throw new Error('Wave41 dataset terminator not found in app.js');
            app = app.replace(previous, target);
            fs.writeFileSync(appPath, app);
          }

          const rows = JSON.parse(fs.readFileSync('tools/trashnavi/data/direct-waste-links-supply-wave42.json', 'utf8'));
          if (rows.length !== 30) throw new Error(`expected 30 Wave42 records, got ${rows.length}`);
          const groups = new Map();
          for (const row of rows) {
            if (row.pref !== '埼玉県') throw new Error(`unexpected prefecture: ${row.pref}`);
            if (row.last_checked !== '2026-09-17') throw new Error(`unexpected last_checked: ${row.city}`);
            if (row.status !== 'active' || row.language !== 'ja') throw new Error(`unexpected state: ${row.city}`);
            if (!/^https:\/\//.test(row.url)) throw new Error(`invalid URL: ${row.url}`);
            const arr = groups.get(row.lgcode) || [];
            arr.push(row);
            groups.set(row.lgcode, arr);
          }
          if (groups.size !== 10) throw new Error(`expected 10 municipalities, got ${groups.size}`);
          for (const [lgcode, items] of groups) {
            if (items.length !== 3) throw new Error(`${lgcode}: expected 3 records, got ${items.length}`);
            if (new Set(items.map(x => x.link_type)).size !== 3) throw new Error(`${lgcode}: link_type duplication`);
            if (new Set(items.map(x => x.url)).size !== 3) throw new Error(`${lgcode}: URL duplication`);
          }
          console.log(`Wave42 source contract: ${groups.size} municipalities / ${rows.length} records / 3 distinct types each`);
          NODE

          node tools/trashnavi/scripts/audit-coverage.mjs | tee /tmp/w42-coverage.txt
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory | tee /tmp/w42-inventory.txt
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs

          echo '## Wave42 readiness' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/w42-coverage.txt >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/w42-inventory.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Self-clean and commit readiness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/trashnavi-wave42-readiness-temp.yml
          git add tools/trashnavi/app.js tools/trashnavi/data/direct-waste-links-supply-wave42.json
          git commit -m 'feat(trashnavi): finalize Wave42 readiness'
          git push origin HEAD:feat/trashnavi-wave42-readiness-20260917
