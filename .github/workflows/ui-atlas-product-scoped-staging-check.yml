name: UI Atlas product-scoped staging check

on:
  pull_request:
    paths:
      - 'assets/nw-product-scoped-controller.mjs'
      - 'tools/ui-atlas/product-scoped-controller.mjs'
      - 'tools/ui-atlas/SPEC.md'
      - 'tools/ui-atlas/app.js'
      - 'tools/ui-atlas/pro-generator.js'
      - 'scripts/check-ui-atlas-product-scoped-staging.mjs'
      - 'docs/billing/pro-product-contracts-wave1.md'
      - '.agent/plans/2026-09-12-ui-atlas-product-scoped-staging.md'
      - '.github/workflows/ui-atlas-product-scoped-staging-check.yml'
  push:
    branches:
      - main
    paths:
      - 'assets/nw-product-scoped-controller.mjs'
      - 'tools/ui-atlas/product-scoped-controller.mjs'
      - 'tools/ui-atlas/SPEC.md'
      - 'tools/ui-atlas/app.js'
      - 'tools/ui-atlas/pro-generator.js'
      - 'scripts/check-ui-atlas-product-scoped-staging.mjs'
      - 'docs/billing/pro-product-contracts-wave1.md'
      - '.agent/plans/2026-09-12-ui-atlas-product-scoped-staging.md'
      - '.github/workflows/ui-atlas-product-scoped-staging-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check assets/nw-product-scoped-controller.mjs
          node --check tools/ui-atlas/product-scoped-controller.mjs
          node --check scripts/check-ui-atlas-product-scoped-staging.mjs
      - name: UI Atlas product-scoped staging contracts
        run: node scripts/check-ui-atlas-product-scoped-staging.mjs
