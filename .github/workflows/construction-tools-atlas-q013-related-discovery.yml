name: Construction Tools Atlas q013 related discovery

on:
  push:
    branches:
      - audit/construction-atlas-q013-identity-closure-20260916
    paths:
      - '.github/workflows/construction-tools-atlas-q013-related-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover q013 semantically near canonical candidates
        run: |
          node <<'NODE'
          const fs=require('node:fs'), path=require('node:path'), vm=require('node:vm');
          const ROOT='tools/construction-tools-atlas', DATA=path.join(ROOT,'data');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8')); const text=v=>typeof v==='string'?v.trim():''; const arr=v=>Array.isArray(v)?v:[];
          const stop=new Set(['a','an','the','for','of','to','and','or','used','use','tool','tools','material','materials','construction','site']);
          const words=v=>new Set(text(v).normalize('NFKC').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(x=>x&&x.length>2&&!stop.has(x)));
          const ja=v=>text(v).normalize('NFKC').replace(/[\s・･\-‐‑‒–—―_()（）/]/g,'');
          const slug=v=>text(v).toLowerCase().replace(/^q013_/,'').split('_').filter(x=>x.length>2);
          const rows=read(path.join(DATA,'tools.quality-013.json')).rows;
          function localFile(p){return path.resolve(ROOT,String(p||'').replace(/[?#].*$/,'').replace(/^\.\//,''));}
          async function runtime(){const src=fs.readFileSync(path.join(DATA,'quality-loader.js'),'utf8');const w={};w.fetch=async i=>{const f=localFile(typeof i==='string'?i:i?.url);if(!fs.existsSync(f))return{ok:false,async json(){return null;}};return{ok:true,async json(){return read(f);}}};const d={addEventListener(){},getElementById(){return null;},querySelector(){return null;},createElement(){return{setAttribute(){}}},head:{appendChild(){}}};vm.runInNewContext(src,{window:w,document:d,console:{info(){},warn(){},error:console.error},Set,Map});return await w.CTA_DATA_LOADER.loadEntries();}
          function name(e){return{ja:text(e?.term?.ja||e?.ja),en:text(e?.term?.en||e?.en),type:text(e?.type||e?.t),dja:text(e?.description?.ja||e?.dj),den:text(e?.description?.en||e?.de)}};
          function inter(a,b){let n=0;for(const x of a)if(b.has(x))n++;return n;}
          (async()=>{const rt=await runtime();const reports=[];
            for(const s of rows){const sw=words(s.en), sj=ja(s.ja), ss=slug(s.id);const cand=[];
              for(const e of rt){const id=text(e.id);if(id===s.id)continue;const n=name(e), ew=words(n.en), ej=ja(n.ja), es=slug(id);let score=0;const reasons=[];
                const iw=inter(sw,ew); if(iw){const ratio=iw/Math.max(1,Math.min(sw.size,ew.size)); if(ratio>=0.5){score+=3*ratio;reasons.push(`en_token:${ratio.toFixed(2)}`);}}
                if(sj.length>=2&&ej.length>=2&&(sj.includes(ej)||ej.includes(sj))&&sj!==ej){score+=2;reasons.push('ja_contains');}
                const is=ss.filter(x=>es.includes(x)).length; if(is){const ratio=is/Math.max(1,Math.min(ss.length,es.length));if(ratio>=0.5){score+=2*ratio;reasons.push(`id_token:${ratio.toFixed(2)}`);}}
                if(score>=2.5)cand.push({id,...n,score:Number(score.toFixed(2)),reasons});
              }
              cand.sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id)); if(cand.length)reports.push({source:{id:s.id,type:s.t,ja:s.ja,en:s.en,dja:s.dj,den:s.de},candidates:cand.slice(0,8)});
            }
            console.log('CTA_Q013_RELATED_SUMMARY='+JSON.stringify({q013_rows:rows.length,rows_with_related_candidates:reports.length}));
            for(const r of reports)console.log('CTA_Q013_RELATED_CASE='+JSON.stringify(r));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
