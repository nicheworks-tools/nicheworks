name: Pattern Dictionary Phase 2 researched runtime overlay

on:
  push:
    branches:
      - feat/pattern-dictionary-production-20-20260914
    paths:
      - .github/workflows/pattern-dictionary-phase2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-production-20-20260914
          fetch-depth: 0
      - name: Apply researched overlay to runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('tools/pattern-dictionary/app.js')
          s = app.read_text()
          s = s.replace("const DATA=ROOT+'data/patterns.json';\nconst DICT=ROOT+'data/search-dictionary.json';\nlet patternsPromise,dictPromise;", "const DATA=ROOT+'data/patterns.json';\nconst PROD=ROOT+'data/production-content.json';\nconst DICT=ROOT+'data/search-dictionary.json';\nlet patternsPromise,dictPromise;")
          old = "async function patterns(){return patternsPromise||(patternsPromise=fetch(DATA).then(r=>r.json()))}"
          new = """async function patterns(){return patternsPromise||(patternsPromise=Promise.all([fetch(DATA).then(r=>r.json()),fetch(PROD).then(r=>r.json())]).then(([base,prod])=>{const overlays=Object.fromEntries((prod.patterns||[]).map(x=>[x.pattern_id,x]));return base.map(p=>{const o=overlays[p.id]||{};return {...p,...o,id:p.id,names:{...p.names,...(o.names||{})},aliases:{ja:[...new Set([...(p.aliases?.ja||[]),...(o.aliases?.ja||[])])],en:[...new Set([...(p.aliases?.en||[]),...(o.aliases?.en||[])])]},colors:{...p.colors,...(o.colors||{})},description:o.definition||p.description,relationships:p.relationships,search_terms:p.search_terms,families:p.families,motifs:p.motifs,visual:p.visual,uses:p.uses,culture:p.culture}})}))}"""
          if old not in s:
              raise SystemExit('patterns() source contract not found')
          s = s.replace(old, new)
          old_bag = "function bag(p,lang){return norm([p.names?.[lang],p.names?.[lang==='ja'?'en':'ja'],...(p.aliases?.[lang]||[]),...(p.search_terms?.[lang]||[]),...(p.motifs||[]),...(p.families||[]),...(p.visual?.geometry||[]),...(p.visual?.line||[]),...(p.colors?.primary||[]),...(p.uses||[]),...(p.culture||[])].join(' '))}"
          new_bag = "function bag(p,lang){return norm([p.names?.[lang],p.names?.[lang==='ja'?'en':'ja'],...(p.aliases?.[lang]||[]),...(p.search_terms?.[lang]||[]),...(p.motifs||[]),...(p.families||[]),...(p.visual?.geometry||[]),...(p.visual?.line||[]),...(p.colors?.primary||[]),...(p.uses||[]),...(p.culture||[]),p.term_scope,p.definition?.[lang],...(p.distinguishing_features?.[lang]||[]),...(p.common_uses?.[lang]||[])].join(' '))}"
          if old_bag not in s:
              raise SystemExit('bag() source contract not found')
          s = s.replace(old_bag, new_bag)
          start = s.index('async function initDetail(lang){')
          end = s.index('async function initCompare(lang){')
          detail = '''async function initDetail(lang){const ps=await patterns(),map=Object.fromEntries(ps.map(p=>[p.id,p])),id=document.body.dataset.patternId||new URLSearchParams(location.search).get('id'),p=map[id]||ps[0],rel=[...(p.relationships?.often_confused_with||[]),...(p.relationships?.similar||[])].filter((x,i,a)=>a.indexOf(x)===i).map(x=>map[x]).filter(Boolean),features=p.distinguishing_features?.[lang]||[],uses=p.common_uses?.[lang]||[];document.title=`${p.names[lang]} | Pattern Dictionary | NicheWorks`;$('#detail').innerHTML=`<section class="pd-detail-head"><div><img class="pd-detail-image" src="${patternSvg(p)}" alt=""><p class="pd-warning">${lang==='ja'?'この画像はUI検証用DEVプレースホルダーです。辞典用Reference Imageとして未検証です。':'This image is a DEV placeholder for UI validation, not a verified dictionary Reference Image.'}</p></div><div><p class="pd-kicker">${p.verification_state==='qualified'?'RESEARCHED · QUALIFIED':'RESEARCHED'}</p><h1 class="pd-title">${esc(p.names[lang])}</h1><p class="pd-enname">${esc(p.names[lang==='ja'?'en':'ja'])}</p><div class="pd-tags">${[...p.families,...p.motifs.slice(0,3)].map(x=>`<span class="pd-tag">${esc(x)}</span>`).join('')}</div><p class="pd-copy">${esc(p.definition?.[lang]||p.description?.[lang]||'')}</p><table class="pd-table"><tr><th>${lang==='ja'?'別名':'Aliases'}</th><td>${esc((p.aliases?.[lang]||[]).join(', ')||'—')}</td></tr><tr><th>${lang==='ja'?'用語の範囲':'Term scope'}</th><td>${esc(p.term_scope||'—')}</td></tr><tr><th>${lang==='ja'?'代表色':'Primary colors'}</th><td>${esc(p.colors.primary.join(' + '))}</td></tr><tr><th>${lang==='ja'?'色の扱い':'Color role'}</th><td>${esc(p.colors.color_role)}</td></tr><tr><th>${lang==='ja'?'主な用途':'Common uses'}</th><td>${esc(uses.join(', ')||'—')}</td></tr></table>${rel[0]?`<a class="pd-button secondary" href="${compareUrl(p.id,rel[0].id,lang)}">${lang==='ja'?'似た柄と比較':'Compare with a similar pattern'}</a>`:''}</div></section><section class="pd-section"><div class="pd-section-head"><h2>${lang==='ja'?'見分け方':'How to identify it'}</h2></div><ul class="pd-copy">${features.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${p.qualification?.[lang]?`<div class="pd-warning"><strong>${lang==='ja'?'用語上の注意':'Scope note'}</strong><br>${esc(p.qualification[lang])}</div>`:''}</section><section class="pd-section"><div class="pd-section-head"><h2>${lang==='ja'?'似ている・間違えやすい模様':'Similar or commonly confused patterns'}</h2></div><div class="pd-related">${rel.map(x=>card(x,lang)).join('')}</div></section><section class="pd-section"><div class="pd-commerce"><h2>${lang==='ja'?'この柄の商品を探す':'Find products in this pattern'}</h2><p class="pd-note">${lang==='ja'?'Amazonリンクはまだ接続していません。辞典本文とReference Imageの検証後に接続します。':'Amazon links are not connected yet. They will be added after dictionary copy and Reference Images are verified.'}</p></div></section>`;const langLink=$('#lang-link');if(langLink)langLink.href=ROOT+(lang==='ja'?'en/':'')+'patterns/'+encodeURIComponent(p.id)+'/'}
'''
          s = s[:start] + detail + s[end:]
          app.write_text(s)
          PY

          cat > tools/pattern-dictionary/tests/production-content-test.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import {fileURLToPath} from 'node:url';
          const root=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');
          const base=JSON.parse(fs.readFileSync(path.join(root,'data/patterns.json'),'utf8'));
          const prod=JSON.parse(fs.readFileSync(path.join(root,'data/production-content.json'),'utf8'));
          const ledger=JSON.parse(fs.readFileSync(path.join(root,'data/source-verification.json'),'utf8'));
          const canonical=['houndstooth','gingham','tartan','glen-check','argyle','chevron','polka-dot','moroccan-trellis','seigaiha','asanoha','shippo','ichimatsu','kikko','karakusa','damask','arabesque','paisley','leopard-print','ikat','kilim'].sort();
          const fail=m=>{console.error(`FAIL: ${m}`);process.exitCode=1};
          const pmap=Object.fromEntries(prod.patterns.map(x=>[x.pattern_id,x]));
          if(prod.patterns.length!==20)fail(`expected 20 production records, got ${prod.patterns.length}`);
          if(JSON.stringify(Object.keys(pmap).sort())!==JSON.stringify(canonical))fail('production content canonical ID set differs');
          for(const id of canonical){
            const p=pmap[id], source=ledger.patterns.find(x=>x.pattern_id===id), raw=base.find(x=>x.id===id);
            if(!p||!source||!raw){fail(`${id}: missing joined record`);continue}
            if(p.review_state!=='researched')fail(`${id}: review_state must be researched`);
            if(p.verification_state!==source.verification_state)fail(`${id}: verification state differs from source ledger`);
            if(p.names?.ja!==source.verified_names?.ja||p.names?.en!==source.verified_names?.en)fail(`${id}: production names differ from source ledger`);
            if(!p.term_scope||!p.definition?.ja||!p.definition?.en)fail(`${id}: incomplete definition contract`);
            if((p.distinguishing_features?.ja||[]).length<3||(p.distinguishing_features?.en||[]).length<3)fail(`${id}: needs 3+ JA/EN distinguishing features`);
            if(!(p.common_uses?.ja||[]).length||!(p.common_uses?.en||[]).length)fail(`${id}: missing JA/EN common uses`);
            if(!['non-essential','traditional','identity-relevant','variable'].includes(p.colors?.color_role))fail(`${id}: invalid color role`);
            if(!p.colors?.primary?.length||!p.colors?.primary_reason)fail(`${id}: incomplete color contract`);
            if(p.verification_state==='qualified'&&(!p.qualification?.ja||!p.qualification?.en))fail(`${id}: qualified term requires JA/EN scope note`);
          }
          const q=prod.patterns.filter(x=>x.verification_state==='qualified').map(x=>x.pattern_id).sort();
          if(JSON.stringify(q)!==JSON.stringify(['ikat','kilim','moroccan-trellis']))fail(`qualified set changed: ${q.join(', ')}`);
          if(!process.exitCode)console.log('OK: 20/20 production content records are researched and source-ledger aligned.');
          EOF

          cat > tools/pattern-dictionary/tests/source-verification-test.mjs <<'EOF'
          import fs from 'node:fs';
          const patterns=JSON.parse(fs.readFileSync(new URL('../data/production-content.json',import.meta.url),'utf8')).patterns;
          const ledger=JSON.parse(fs.readFileSync(new URL('../data/source-verification.json',import.meta.url),'utf8'));
          const canonical=['houndstooth','gingham','tartan','glen-check','argyle','chevron','polka-dot','moroccan-trellis','seigaiha','asanoha','shippo','ichimatsu','kikko','karakusa','damask','arabesque','paisley','leopard-print','ikat','kilim'].sort();
          const fail=m=>{console.error(`FAIL: ${m}`);process.exitCode=1};
          const ids=patterns.map(p=>p.pattern_id).sort(), ledgerIds=ledger.patterns.map(p=>p.pattern_id).sort();
          if(JSON.stringify(ids)!==JSON.stringify(canonical))fail('production canonical ID set differs from fixed 20');
          if(JSON.stringify(ledgerIds)!==JSON.stringify(canonical))fail('source ledger canonical ID set differs from fixed 20');
          for(const record of ledger.patterns){const p=patterns.find(x=>x.pattern_id===record.pattern_id);if(!p){fail(`${record.pattern_id}: missing production record`);continue}if(!['verified','qualified'].includes(record.verification_state))fail(`${record.pattern_id}: invalid verification_state`);if(!record.term_scope||!record.structure)fail(`${record.pattern_id}: incomplete source verification`);if(record.verified_names.ja!==p.names.ja||record.verified_names.en!==p.names.en)fail(`${record.pattern_id}: verified names differ from production content`);if(!Array.isArray(record.sources)||!record.sources.length)fail(`${record.pattern_id}: no evidence sources`);for(const source of record.sources||[])if(!source.publisher||!/^https:\/\//.test(source.url||'')||!Array.isArray(source.supports)||!source.supports.length)fail(`${record.pattern_id}: malformed source record`);if(record.verification_state==='qualified'&&!record.qualification)fail(`${record.pattern_id}: missing source qualification`)}
          const q=ledger.patterns.filter(p=>p.verification_state==='qualified').map(p=>p.pattern_id).sort();if(JSON.stringify(q)!==JSON.stringify(['ikat','kilim','moroccan-trellis']))fail(`qualified set changed: ${q.join(', ')}`);if(!process.exitCode)console.log(`OK: source verification ledger covers exactly 20 canonical patterns; verified=${20-q.length} qualified=${q.length}.`);
          EOF

          cat > tools/pattern-dictionary/tests/search-test.mjs <<'EOF'
          import fs from 'node:fs';import path from 'node:path';import {fileURLToPath} from 'node:url';const here=path.dirname(fileURLToPath(import.meta.url)),root=path.resolve(here,'..');const raw=JSON.parse(fs.readFileSync(path.join(root,'data/patterns.json'),'utf8')),prod=JSON.parse(fs.readFileSync(path.join(root,'data/production-content.json'),'utf8')),dict=JSON.parse(fs.readFileSync(path.join(root,'data/search-dictionary.json'),'utf8')),cases=JSON.parse(fs.readFileSync(path.join(root,'tests/search-cases.json'),'utf8'));const om=Object.fromEntries(prod.patterns.map(x=>[x.pattern_id,x])),ps=raw.map(p=>{const o=om[p.id]||{};return{...p,...o,id:p.id,names:{...p.names,...(o.names||{})},aliases:{ja:[...new Set([...(p.aliases?.ja||[]),...(o.aliases?.ja||[])])],en:[...new Set([...(p.aliases?.en||[]),...(o.aliases?.en||[])])]},colors:{...p.colors,...(o.colors||{})},relationships:p.relationships,search_terms:p.search_terms,families:p.families,motifs:p.motifs,visual:p.visual,uses:p.uses,culture:p.culture}});const norm=s=>(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();function rank(q,lang){q=norm(q);const sig=[];for(const[k,v]of Object.entries(dict[lang]))if(q.includes(norm(k)))sig.push({label:k,...v});return ps.map(p=>{let s=0,bag=norm([p.names[lang],p.names[lang==='ja'?'en':'ja'],...(p.aliases[lang]||[]),...(p.search_terms[lang]||[]),...(p.motifs||[]),...(p.families||[]),...(p.colors.primary||[]),...(p.uses||[]),...(p.culture||[]),p.term_scope,p.definition?.[lang],...(p.distinguishing_features?.[lang]||[]),...(p.common_uses?.[lang]||[])].join(' '));if(q===norm(p.names[lang]))s+=100;for(const a of p.aliases[lang]||[])if(q===norm(a))s+=90;for(const t of p.search_terms[lang]||[]){const nt=norm(t);if(q.includes(nt)||nt.includes(q))s+=55}for(const tok of q.split(/\s+/))if(tok.length>1&&bag.includes(tok))s+=12;for(const x of sig){if((x.ids||[]).includes(p.id))s+=72;if((x.families||[]).some(v=>p.families.includes(v)))s+=45;if((x.colors||[]).some(v=>p.colors.primary.includes(v)))s+=15;if((x.culture||[]).some(v=>p.culture.includes(v)))s+=35;if((x.uses||[]).some(v=>p.uses.includes(v)))s+=25;for(const c of x.concepts||[])if(bag.includes(norm(c)))s+=35}return[p.id,s]}).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}let fail=0;for(const c of cases){const r=rank(c.query,c.lang),top=r[0]?.[0],top3=r.slice(0,3).map(x=>x[0]),ok=c.top1?top===c.expected:top3.includes(c.expected),target=c.top1?'Top1':'Top3';console.log(`${ok?'PASS':'FAIL'} ${c.lang} ${c.query} -> ${top} [${top3.join(', ')}] expected ${c.expected} in ${target}`);if(!ok)fail++}if(fail)process.exit(1);console.log(`OK: ${cases.length}/${cases.length} search expectations passed with researched overlay.`);
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/pattern-dictionary/tests/validate.mjs')
          s=p.read_text()
          s=s.replace("const p=JSON.parse(fs.readFileSync(path.join(r,'data/patterns.json'),'utf8'));", "const base=JSON.parse(fs.readFileSync(path.join(r,'data/patterns.json'),'utf8'));\nconst prod=JSON.parse(fs.readFileSync(path.join(r,'data/production-content.json'),'utf8'));\nconst om=Object.fromEntries(prod.patterns.map(x=>[x.pattern_id,x]));\nconst p=base.map(x=>({...x,...(om[x.id]||{}),id:x.id}));")
          s=s.replace("if(x.review_state!=='prototype-curated') errors.push(`${x.id}: unexpected review state ${x.review_state}`);", "if(x.review_state!=='researched') errors.push(`${x.id}: expected researched review state, got ${x.review_state}`);")
          s=s.replace("for(const f of ['index.html'", "for(const f of ['data/production-content.json','data/source-verification.json','index.html'")
          s=s.replace("console.log('OK: 20 canonical records, 40 static noindex detail pages, and required slice files.');", "console.log('OK: 20 researched canonical records, 40 static noindex detail pages, and required production-phase files.');")
          p.write_text(s)
          PY

          node tools/pattern-dictionary/tests/source-verification-test.mjs
          node tools/pattern-dictionary/tests/production-content-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node --check tools/pattern-dictionary/app.js

          rm -f .github/workflows/pattern-dictionary-source-ledger-check.yml
          rm -f .github/workflows/pattern-dictionary-phase2-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pattern-dictionary .github/workflows/pattern-dictionary-source-ledger-check.yml .github/workflows/pattern-dictionary-phase2-apply.yml
          git commit -m 'feat: wire researched Pattern Dictionary content into runtime'
          git push origin HEAD:feat/pattern-dictionary-production-20-20260914
