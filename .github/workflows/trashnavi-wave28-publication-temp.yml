name: TrashNavi Wave28 publication temp
on:
  push:
    branches:
      - feat/trashnavi-batch-wave28-publication-20260916
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch, generate, verify, and commit Wave28
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/trashnavi-wave28-patch-temp.py
          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          python3 .github/trashnavi-wave28-verify-temp.py
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap-trashnavi.xml sitemap.xml tools/trashnavi/SPEC.md tools/trashnavi/ai-reference.json tools/trashnavi/index.html tools/trashnavi/municipality-page-manifest.json tools/trashnavi/scripts/check-affiliate-contract.mjs tools/trashnavi/scripts/generate-municipality-pages.mjs tools/trashnavi/iwate/morioka/index.html tools/trashnavi/akita/akita/index.html tools/trashnavi/fukushima/fukushima/index.html tools/trashnavi/ibaraki/mito/index.html tools/trashnavi/kanagawa/kawasaki/index.html tools/trashnavi/kanagawa/sagamihara/index.html tools/trashnavi/osaka/sakai/index.html tools/trashnavi/okayama/okayama/index.html tools/trashnavi/fukuoka/fukuoka/index.html tools/trashnavi/fukuoka/kitakyushu/index.html
          git diff --cached --check
          git commit -m 'Publish ten TrashNavi Wave28 municipality pages'
          git push origin HEAD:feat/trashnavi-batch-wave28-publication-20260916
