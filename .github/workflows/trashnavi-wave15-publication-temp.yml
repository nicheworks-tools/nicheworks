name: TrashNavi Wave 15 publication temp

on:
  push:
    branches:
      - feat/trashnavi-otsu-publication-wave15-20260914

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-otsu-publication-wave15-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Wave 15 publication delta
        run: |
          node <<'NODE'
          const fs = require('fs');
          function rw(file, fn) { const s=fs.readFileSync(file,'utf8'); const n=fn(s); if(n===s) throw new Error(`no change: ${file}`); fs.writeFileSync(file,n); }

          rw('tools/trashnavi/municipality-page-manifest.json', s => s.replace(
            '  {"lgcode":"352039","pref_slug":"yamaguchi","city_slug":"yamaguchi","publish":true}\n]',
            '  {"lgcode":"352039","pref_slug":"yamaguchi","city_slug":"yamaguchi","publish":true},\n  {"lgcode":"252018","pref_slug":"shiga","city_slug":"otsu","publish":true}\n]'
          ));

          rw('tools/trashnavi/scripts/generate-municipality-pages.mjs', s => s.replace(
            "if(outputs.length!==21) throw new Error(`municipality page count must be 21; got ${outputs.length}`);",
            "if(outputs.length!==22) throw new Error(`municipality page count must be 22; got ${outputs.length}`);"
          ));

          rw('tools/trashnavi/scripts/check-affiliate-contract.mjs', s => s.replace(
            "check(manifest.length === 21, `expected 21 published municipality pages, got ${manifest.length}`);",
            "check(manifest.length === 22, `expected 22 published municipality pages, got ${manifest.length}`);"
          ));

          rw('tools/trashnavi/index.html', s => s.replace(
            '<a href="/tools/trashnavi/yamaguchi/yamaguchi/">山口市</a></div>',
            '<a href="/tools/trashnavi/yamaguchi/yamaguchi/">山口市</a><a href="/tools/trashnavi/shiga/otsu/">大津市</a></div>'
          ));

          rw('tools/trashnavi/SPEC.md', s => {
            let n=s;
            n=n.replace(
              '- 山口県 山口市 — `/tools/trashnavi/yamaguchi/yamaguchi/`\n\n生成器は',
              '- 山口県 山口市 — `/tools/trashnavi/yamaguchi/yamaguchi/`\n\nWave 15では、供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から大津市を選定した。大津市公式の令和8年4月〜令和9年3月ごみ収集カレンダー導線と大型ごみ案内を追加し、既存のごみ分別導線と合わせてpreferred candidateへ引き上げた。data enrichment検証後、公開対象を **22自治体** とする。\n\n- 滋賀県 大津市 — `/tools/trashnavi/shiga/otsu/`\n\n生成器は'
            );
            n=n.replace(
              '### Direct-link health monitoring — Phase 4',
              '### Wave 15 verified coverage baseline\n\n2026-09-14のWave 15 CI基準値は次のとおり。\n\n- municipalities: 1,916\n- records: 2,208 / 2,208 valid HTTP(S)\n- municipalities with any waste-specific direct link: 78\n- publish candidates (2+ types): 22\n- preferred candidates (3+ types): 22\n- collection calendar coverage: 22 municipalities\n- bulky-waste coverage: 21 municipalities\n- drop-off facility coverage: 1 municipality\n- waste-app coverage: 1 municipality\n- direct-link inventory: 18 datasets / 140 records / 121 unique URLs / 0 invalid URLs\n- invalid records: 0\n- unknown type labels: 0\n\n### Direct-link health monitoring — Phase 4'
            );
            n=n.replace('- [x] 公開21自治体をmanifest allowlistで管理する。','- [x] 公開22自治体をmanifest allowlistで管理する。');
            n=n.replace('- [x] generator `--check` で21ページの生成driftを検出する。','- [x] generator `--check` で22ページの生成driftを検出する。');
            n=n.replace('- [x] Wave 14で山口市をpreferred candidateへ引き上げ、自治体pageを公開する。','- [x] Wave 14で山口市をpreferred candidateへ引き上げ、自治体pageを公開する。\n- [x] Wave 15で大津市をpreferred candidateへ引き上げ、自治体pageを公開する。');
            n=n.replace('- `tools/trashnavi/data/direct-waste-links-supply-wave14.json` — 山口市のWave 14 collection-calendar / bulky-waste enrichment。','- `tools/trashnavi/data/direct-waste-links-supply-wave14.json` — 山口市のWave 14 collection-calendar / bulky-waste enrichment。\n- `tools/trashnavi/data/direct-waste-links-supply-wave15.json` — 大津市のWave 15 collection-calendar / bulky-waste enrichment。');
            n=n.replace('- `tools/trashnavi/yamaguchi/yamaguchi/index.html` — Wave 14 municipality page。','- `tools/trashnavi/yamaguchi/yamaguchi/index.html` — Wave 14 municipality page。\n- `tools/trashnavi/shiga/otsu/index.html` — Wave 15 municipality page。');
            return n;
          });
          NODE
      - name: Generate municipality pages and dedicated sitemap
        run: node tools/trashnavi/scripts/generate-municipality-pages.mjs
      - name: Add Otsu to root sitemap
        run: |
          node <<'NODE'
          const fs=require('fs');
          const f='sitemap.xml';
          let s=fs.readFileSync(f,'utf8');
          const u='https://nicheworks.app/tools/trashnavi/shiga/otsu/';
          if(s.includes(`<loc>${u}</loc>`)) throw new Error('Otsu already present in root sitemap');
          s=s.replace('</urlset>',`  <url>\n    <loc>${u}</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>\n</urlset>`);
          fs.writeFileSync(f,s);
          NODE
      - name: Verify generated Otsu page contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='tools/trashnavi/shiga/otsu/index.html';
          const s=fs.readFileSync(p,'utf8');
          const cards=(s.match(/class="official-link-card"/g)||[]).length;
          if(cards!==3) throw new Error(`expected exactly 3 official link cards, got ${cards}`);
          for(const needle of ['2026年の収集カレンダー','https://nicheworks.app/tools/trashnavi/shiga/otsu/','id="trashnaviAmazonAffiliate"','[PR]']) if(!s.includes(needle)) throw new Error(`missing ${needle}`);
          NODE
      - name: Required TrashNavi audits
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit publication output and remove temporary workflow
        run: |
          rm .github/workflows/trashnavi-wave15-publication-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/trashnavi/municipality-page-manifest.json tools/trashnavi/scripts/generate-municipality-pages.mjs tools/trashnavi/scripts/check-affiliate-contract.mjs tools/trashnavi/index.html tools/trashnavi/SPEC.md tools/trashnavi/shiga/otsu/index.html sitemap.xml sitemap-trashnavi.xml .github/workflows/trashnavi-wave15-publication-temp.yml
          git commit -m "Publish Otsu as 22nd TrashNavi municipality page"
          git push origin HEAD:feat/trashnavi-otsu-publication-wave15-20260914
