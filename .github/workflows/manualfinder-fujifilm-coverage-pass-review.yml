name: ManualFinder Fujifilm GFX X coverage-pass review

on:
  pull_request:
    paths:
      - 'tools/manual-finder/coverage-passes/fujifilm/**'
      - 'tools/manual-finder/scripts/fujifilm-gfx-x-review.mjs'
      - '.github/workflows/manualfinder-fujifilm-coverage-pass-review.yml'

permissions:
  contents: read

jobs:
  fujifilm-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Fujifilm GFX X official review candidates
        run: |
          mkdir -p manualfinder-coverage-pass-artifacts
          node tools/manual-finder/scripts/fujifilm-gfx-x-review.mjs \
            --pass tools/manual-finder/coverage-passes/fujifilm/jp-gfx-x-camera-manual-index.json \
            --output manualfinder-coverage-pass-artifacts/fujifilm-gfx-x-review.json
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: manualfinder-fujifilm-gfx-x-review
          path: manualfinder-coverage-pass-artifacts/fujifilm-gfx-x-review.json
          if-no-files-found: error
