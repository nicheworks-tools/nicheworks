name: Old Kanji Wave 8 guarded patch

on:
  push:
    branches:
      - seo/old-kanji-wave8-name-intent-20260917
    paths:
      - .github/workflows/tmp-old-kanji-wave8-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/old-kanji-wave8-name-intent-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded patch
        run: node scripts/tmp-old-kanji-wave8-apply.mjs
      - name: Commit final Wave 8 patch
        run: |
          git config user.name "nicheworks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/old-kanji-reference/index.html sitemap.xml .github/workflows/tmp-old-kanji-wave8-apply.yml scripts/tmp-old-kanji-wave8-apply.mjs
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Old Kanji Wave 8: route name intent to dedicated checker"
          git push origin HEAD:seo/old-kanji-wave8-name-intent-20260917
