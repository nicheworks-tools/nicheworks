name: Construction Tools Atlas q013 identity apply

on:
  push:
    branches:
      - audit/construction-atlas-q013-identity-closure-20260916
    paths:
      - '.github/workflows/construction-tools-atlas-q013-identity-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed q013 identity decisions
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const base='tools/construction-tools-atlas/data';
          const ip=`${base}/canonical-identity-resolutions-v2.3.json`;
          const rp=`${base}/canonical-redirects-v2.3.json`;
          const identity=JSON.parse(fs.readFileSync(ip,'utf8'));
          const redirects=JSON.parse(fs.readFileSync(rp,'utf8'));
          identity.version='2026-09-16-q013-closure-1';
          identity.policy.purpose='Record reviewed canonical naming, taxonomy, alias, and distinct-concept decisions discovered during q011/q012/q013 identity closure.';
          function upsert(list,row){const i=list.findIndex(x=>x.id===row.id);if(i>=0)list[i]=row;else list.push(row);}
          function addPair(row){const key=[row.a,row.b].sort().join('\t');const i=identity.resolved_distinct_pairs.findIndex(x=>[x.a,x.b].sort().join('\t')===key);if(i>=0)identity.resolved_distinct_pairs[i]=row;else identity.resolved_distinct_pairs.push(row);}
          [
            {id:'clamp_bar',from:{ja:'クランプ',en:'Clamp'},to:{ja:'バークランプ',en:'Bar Clamp'},reason:'The existing record describes a bar clamp; generic クランプ/Clamp conflicts with the distinct scaffold-clamp canonical.'},
            {id:'q013_dolly',from:{ja:'台車',en:'Dolly'},to:{ja:'平台車',en:'Platform Dolly'},reason:'The q013 definition is a wheeled platform cart; distinguish it from the two-wheel hand-truck canonical.'},
            {id:'tamper',from:{ja:'ランマー(転圧)',en:'Hand Tamper'},to:{ja:'タンパー（手動）',en:'Hand Tamper'},reason:'The record is the manual soil tamper, not the powered rammer/compactor.'},
            {id:'caulking_scraper',from:{ja:'スクレーパー',en:'Scraper'},to:{ja:'皮すき',en:'Paint Scraper'},reason:'The record definition and aliases identify a paint/putty scraper; make the canonical identity explicit.'},
            {id:'screed',from:{ja:'トンボ（ならし）',en:'Screed'},to:{ja:'スクリード（均し定規）',en:'Screed'},reason:'The canonical is the straightedge/screed tool, distinct from q011 Screeding process.'}
          ].forEach(r=>upsert(identity.name_overrides,r));
          [
            {id:'sling_belt',from:'tool',to:'rigging',reason:'A textile lifting sling is rigging gear rather than a general hand tool.'},
            {id:'lever_hoist',from:'tool',to:'equipment',reason:'Lever hoist is lifting equipment and must match the q013 duplicate source taxonomy.'},
            {id:'q013_mixing_paddle',from:'consumable',to:'accessory',reason:'A reusable mixer paddle is an attachment/accessory rather than a consumable.'},
            {id:'mixing_paddle',from:'tool',to:'accessory',reason:'The existing mixing-paddle canonical is an attachment/accessory for a powered mixer.'}
          ].forEach(r=>upsert(identity.type_overrides,r));
          [
            {id:'clamp_bar',ja:[],en:['C-clamp'],reason:'A C-clamp is a different clamp form and must not be an alias of the bar-clamp canonical.'},
            {id:'sling_belt',ja:[],en:['Lifting sling'],reason:'Lifting sling is the broader parent class; sling belt is the textile/webbing subtype.'},
            {id:'hand_truck',ja:[],en:['Dolly','Utility cart'],reason:'Reserve Dolly for the platform-dolly canonical; hand truck is a two-wheel upright transport device.'},
            {id:'tape_measure',ja:['巻尺'],en:[],reason:'Reserve 巻尺 here for the long reel tape canonical; pocket/retractable tape measure remains a separate entry.'}
          ].forEach(r=>upsert(identity.alias_removals,r));
          [
            {a:'q013_scaffold_clamp',b:'clamp_bar',resolution:'keep_distinct_scope',reason:'Scaffold clamp connects scaffold tubes; bar clamp holds workpieces for fabrication.'},
            {a:'q013_lifting_sling',b:'sling_belt',resolution:'keep_distinct_parent_subtype',reason:'Lifting sling is the general rigging class; sling belt is the textile/webbing subtype.'},
            {a:'q013_dolly',b:'hand_truck',resolution:'keep_distinct',reason:'Platform dolly is a flat wheeled platform; hand truck is an upright two-wheel transport device.'},
            {a:'q013_long_tape',b:'tape_measure',resolution:'keep_distinct_scope',reason:'Long reel tape is for longer site dimensions; tape_measure is the pocket/retractable tape canonical.'}
          ].forEach(addPair);
          fs.writeFileSync(ip,JSON.stringify(identity,null,2)+'\n');

          redirects.version='2026-09-16-q013-identity-closure-1';
          const additions=[
            ['q013_lever_hoist','lever_hoist','same lever-hoist concept'],
            ['q013_mixing_paddle','mixing_paddle','same mixer-paddle attachment concept'],
            ['q013_soil_tamper','tamper','same manual hand-tamper concept'],
            ['q013_crowbar','pry_bar','same crowbar/pry-bar concept'],
            ['q013_level_staff','leveling_staff','same leveling-staff concept'],
            ['q013_marking_paint','marking_spray','same temporary marking-spray paint concept'],
            ['q013_line_level','line_level','same string-line level concept'],
            ['q013_utility_knife','utility_knife','same utility-knife concept'],
            ['q013_tape_measure','tape_measure','same retractable tape-measure concept'],
            ['q013_carpenter_pencil','marking_pencil','same carpenter/marking pencil concept'],
            ['q013_putty_scraper','caulking_scraper','same paint/putty scraper concept'],
            ['q013_paint_roller','paint_roller','same paint-roller concept'],
            ['q013_paint_tray','paint_tray','same paint-tray concept'],
            ['q013_screed_board','screed','same concrete/mortar screed straightedge tool concept'],
            ['q013_marker_pen','marker','same general site marker-pen concept']
          ].map(([from,to,reason])=>({from,to,reason}));
          const byFrom=new Map(redirects.redirects.map((r,i)=>[r.from,i]));
          for(const r of additions){if(byFrom.has(r.from))redirects.redirects[byFrom.get(r.from)]=r;else redirects.redirects.push(r);}
          if(redirects.redirects.length!==55)throw new Error(`Expected 55 redirects after q013 decisions, got ${redirects.redirects.length}`);
          fs.writeFileSync(rp,JSON.stringify(redirects,null,2)+'\n');
          NODE
      - name: Make prior closure gates extensible and create q013 closure auditor
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p='tools/construction-tools-atlas/scripts/audit-q012-identity-closure-v2.3.cjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("if(redirects.length!==40) throw new Error(`Expected 40 total redirects, got ${redirects.length}`);","if(redirects.length<40) throw new Error(`Expected at least the 40 q011/q012 redirects, got ${redirects.length}`);");
          s=s.replace("  if(entries.length!==896) throw new Error(`Expected 896 public canonicals after q012 closure, got ${entries.length}`);\n",'');
          fs.writeFileSync(p,s);
          NODE
          cat > tools/construction-tools-atlas/scripts/audit-q013-identity-closure-v2.3.cjs <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const vm=require('node:vm');
          const ROOT=path.resolve(__dirname,'..');
          const DATA=path.join(ROOT,'data');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const text=v=>typeof v==='string'?v.trim():'';
          const arr=v=>Array.isArray(v)?v:[];
          const normJa=v=>text(v).normalize('NFKC').replace(/[\s・･\-‐‑‒–—―_()（）/]/g,'').toLowerCase();
          const normEn=v=>text(v).normalize('NFKC').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const rowsFrom=raw=>Array.isArray(raw)?raw:Array.isArray(raw?.rows)?raw.rows:Array.isArray(raw?.entries)?raw.entries:[];
          const EXPECTED_REDIRECTED=new Set([
            'q013_lever_hoist','q013_mixing_paddle','q013_soil_tamper','q013_crowbar','q013_level_staff',
            'q013_marking_paint','q013_line_level','q013_utility_knife','q013_tape_measure','q013_carpenter_pencil',
            'q013_putty_scraper','q013_paint_roller','q013_paint_tray','q013_screed_board','q013_marker_pen'
          ]);
          const EXPECTED_DISTINCT=new Set(['q013_scaffold_clamp','q013_lifting_sling','q013_dolly','q013_long_tape']);
          function localFile(v){return path.resolve(ROOT,String(v||'').replace(/[?#].*$/,'').replace(/^\.\//,''));}
          async function runtime(){
            const src=fs.readFileSync(path.join(DATA,'quality-loader.js'),'utf8');
            const w={localStorage:{getItem(){return null;},setItem(){}}};
            w.fetch=async input=>{const f=localFile(typeof input==='string'?input:input?.url);if(!fs.existsSync(f))return{ok:false,async json(){return null;}};return{ok:true,async json(){return read(f);}}};
            const d={addEventListener(){},getElementById(){return null;},querySelector(){return null;},createElement(){return{setAttribute(){}}},head:{appendChild(){}}};
            vm.runInNewContext(src,{window:w,document:d,console:{info(){},warn(){},error:console.error},Set,Map},{filename:'quality-loader.js'});
            return {entries:await w.CTA_DATA_LOADER.loadEntries(),diagnostics:w.CTA_DATA_DIAGNOSTICS||{}};
          }
          function names(e){return{ja:text(e?.term?.ja),en:text(e?.term?.en),aja:arr(e?.aliases?.ja).map(text),aen:arr(e?.aliases?.en).map(text)}};
          (async()=>{
            const redirectDoc=read(path.join(DATA,'canonical-redirects-v2.3.json'));
            const redirects=arr(redirectDoc.redirects);
            if(redirects.length<55)throw new Error(`Expected at least 55 redirects through q013 closure, got ${redirects.length}`);
            const redirectMap=new Map(redirects.map(r=>[text(r.from),text(r.to)]));
            for(const id of EXPECTED_REDIRECTED)if(!redirectMap.has(id))throw new Error(`${id}: expected q013 redirect missing`);
            for(const id of EXPECTED_DISTINCT)if(redirectMap.has(id))throw new Error(`${id}: reviewed distinct q013 canonical must survive`);
            const source=rowsFrom(read(path.join(DATA,'tools.quality-013.json')));
            const activeIds=source.map(r=>text(r.id)).filter(id=>id&&!redirectMap.has(id));
            if(source.length!==85)throw new Error(`Expected 85 q013 source rows, got ${source.length}`);
            if(activeIds.length!==70)throw new Error(`Expected 70 active q013 canonicals, got ${activeIds.length}`);
            const rt=await runtime();
            const byId=new Map(rt.entries.map(e=>[text(e.id),e]));
            for(const id of EXPECTED_REDIRECTED)if(byId.has(id))throw new Error(`${id}: redirected q013 duplicate is still public`);
            for(const id of activeIds)if(!byId.has(id))throw new Error(`${id}: active q013 canonical missing from runtime`);
            const identity=read(path.join(DATA,'canonical-identity-resolutions-v2.3.json'));
            const pairKey=(a,b)=>[a,b].sort().join('\t');
            const allowed=new Set(arr(identity.resolved_distinct_pairs).map(r=>pairKey(text(r.a),text(r.b))));
            const unresolved=[];
            for(const id of activeIds){const e=byId.get(id),n=names(e),sj=normJa(n.ja),se=normEn(n.en);
              for(const other of rt.entries){const oid=text(other.id);if(!oid||oid===id)continue;const o=names(other),reasons=[];
                if(sj&&normJa(o.ja)===sj)reasons.push('exact_ja');
                if(se&&normEn(o.en)===se)reasons.push('exact_en');
                if(sj&&o.aja.some(v=>normJa(v)===sj))reasons.push('target_alias_ja');
                if(se&&o.aen.some(v=>normEn(v)===se))reasons.push('target_alias_en');
                if(reasons.length&&!allowed.has(pairKey(id,oid)))unresolved.push({id,other:oid,reasons});
              }
            }
            if(unresolved.length)throw new Error(`Unresolved q013 exact/alias collisions: ${JSON.stringify(unresolved)}`);
            const expectedNames={
              clamp_bar:['バークランプ','Bar Clamp'],
              q013_dolly:['平台車','Platform Dolly'],
              tamper:['タンパー（手動）','Hand Tamper'],
              caulking_scraper:['皮すき','Paint Scraper'],
              screed:['スクリード（均し定規）','Screed']
            };
            for(const [id,[ja,en]] of Object.entries(expectedNames)){const e=byId.get(id);if(!e||text(e?.term?.ja)!==ja||text(e?.term?.en)!==en)throw new Error(`${id}: reviewed public identity not applied`);}
            console.log(`CTA_Q013_IDENTITY_CLOSURE=${JSON.stringify({source_rows:85,active_q013:70,q013_redirects:EXPECTED_REDIRECTED.size,total_redirects:redirects.length,public_entries:rt.entries.length,reviewed_distinct:EXPECTED_DISTINCT.size,unresolved_collisions:0})}`);
            console.log('Construction Tools Atlas q013 identity closure v2.3: PASS');
          })().catch(e=>{console.error('Construction Tools Atlas q013 identity closure v2.3: FAIL');console.error('- '+e.message);process.exit(1)});
          NODE
          node --check tools/construction-tools-atlas/scripts/audit-q012-identity-closure-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/audit-q013-identity-closure-v2.3.cjs
      - name: Validate and freeze q013 identity boundary
        run: |
          node tools/construction-tools-atlas/scripts/check-canonical-identity-resolutions-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-canonical-redirects-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-q011-identity-closure-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-q012-identity-closure-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-q013-identity-closure-v2.3.cjs
          node <<'NODE'
          const fs=require('node:fs');
          const changes=[
            ['tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs',"version: '2026-09-16-q012-identity-closure-1'","version: '2026-09-16-q013-identity-closure-1'"],
            ['tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs',"version: '2026-09-16-q012-identity-closure-1'","version: '2026-09-16-q013-identity-closure-1'"],
            ['tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs',"version: '2026-09-16-q012-content-complete-1'","version: '2026-09-16-q013-identity-closure-1'"]
          ];
          for(const [p,from,to] of changes){let s=fs.readFileSync(p,'utf8');if(!s.includes(from))throw new Error(`${p}: version marker not found`);fs.writeFileSync(p,s.replace(from,to));}
          NODE
          node tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/check-q012-content-completion-v2.3.cjs
      - name: Commit non-workflow q013 identity state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/construction-tools-atlas/data/canonical-identity-resolutions-v2.3.json \
                  tools/construction-tools-atlas/data/canonical-redirects-v2.3.json \
                  tools/construction-tools-atlas/data/publication-inventory-v2.3.json \
                  tools/construction-tools-atlas/data/public-image-inventory-v2.3.json \
                  tools/construction-tools-atlas/data/public-content-quality-v2.3.json \
                  tools/construction-tools-atlas/scripts/audit-q012-identity-closure-v2.3.cjs \
                  tools/construction-tools-atlas/scripts/audit-q013-identity-closure-v2.3.cjs \
                  tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs \
                  tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs \
                  tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs
          git commit -m 'feat(construction-atlas): apply q013 identity closure'
          git push
