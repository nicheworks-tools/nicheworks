name: Pattern Dictionary Wave 4 finalize images

on:
  push:
    branches:
      - feat/pattern-dictionary-wave4-production-staging-20260916
    paths:
      - .github/workflows/pattern-dictionary-wave4-finalize-images.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave4-production-staging-20260916
      - name: Generate pass-3 references
        run: |
          python -m py_compile tools/pattern-dictionary/scripts/generate-reference-images-wave4-v3.py
          python tools/pattern-dictionary/scripts/generate-reference-images-wave4-v3.py
      - name: Validate dimensions
        run: |
          node - <<'NODE'
          const fs=require('fs'); for(const id of ['kagome','nami-chidori']){const f=fs.readFileSync(`tools/pattern-dictionary/assets/reference/${id}.png`);if(f.toString('hex',0,8)!=='89504e470d0a1a0a'||f.readUInt32BE(16)!==1536||f.readUInt32BE(20)!==1536)throw Error(id);}
          NODE
      - name: Commit pass-3 references
        run: |
          git config user.name nicheworks-tools
          git config user.email nicheworks.tools@gmail.com
          git add tools/pattern-dictionary/assets/reference/kagome.png tools/pattern-dictionary/assets/reference/nami-chidori.png
          if git diff --cached --quiet; then echo 'Nothing to commit'; else git commit -m 'Pattern Dictionary: finalize Wave 4 reference images'; git push origin HEAD:feat/pattern-dictionary-wave4-production-staging-20260916; fi
      - name: Build pass-3 contact sheet
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          ids='baroque-scroll chinoiserie flame-stitch tree-of-life moire yagasuri sayagata uroko tatewaku kagome kanoko hanabishi same-komon nami-chidori tomoe shibori batik bandhani ajrakh kalamkari'.split()
          base=Path('tools/pattern-dictionary/assets/reference'); thumb=280; label=36; gap=12; cols=5; rows=4
          sheet=Image.new('RGB',(cols*(thumb+gap)+gap,rows*(thumb+label+gap)+gap),'white'); d=ImageDraw.Draw(sheet)
          for i,pid in enumerate(ids):
              im=Image.open(base/f'{pid}.png').convert('RGB').resize((thumb,thumb)); x=gap+(i%cols)*(thumb+gap); y=gap+(i//cols)*(thumb+label+gap)
              sheet.paste(im,(x,y)); d.text((x,y+thumb+7),f'{61+i} {pid}',fill='black')
          sheet.save('wave4-contact-sheet-pass3.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave4-contact-sheet-pass3
          path: wave4-contact-sheet-pass3.png
