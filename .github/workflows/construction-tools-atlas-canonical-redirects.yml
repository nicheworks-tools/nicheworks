name: Construction Tools Atlas canonical redirects

on:
  push:
    paths:
      - 'tools/construction-tools-atlas/**'
      - '.github/workflows/construction-tools-atlas-canonical-redirects.yml'
  pull_request:
    paths:
      - 'tools/construction-tools-atlas/**'
      - '.github/workflows/construction-tools-atlas-canonical-redirects.yml'

permissions:
  contents: read

jobs:
  canonical-redirects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check redirect and identity runtime syntax
        run: |
          node --check tools/construction-tools-atlas/data/quality-loader.js
          node --check tools/construction-tools-atlas/canonical-deep-link-v2.3.js
          node --check tools/construction-tools-atlas/detail-image-hotfix.js
          node --check tools/construction-tools-atlas/scripts/check-canonical-redirects-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/check-canonical-identity-resolutions-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/audit-q011-identity-closure-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/check-image-runtime-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs

      - name: Validate canonical redirects and compatibility migration
        run: node tools/construction-tools-atlas/scripts/check-canonical-redirects-v2.3.cjs

      - name: Validate canonical identity resolutions
        run: node tools/construction-tools-atlas/scripts/check-canonical-identity-resolutions-v2.3.cjs

      - name: Require zero unresolved q011 identity collisions
        run: node tools/construction-tools-atlas/scripts/audit-q011-identity-closure-v2.3.cjs

      - name: Validate redirect-aware canonical image runtime
        run: node tools/construction-tools-atlas/scripts/check-image-runtime-v2.3.cjs

      - name: Validate redirect-aware publication inventory
        run: node tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs --check

      - name: Validate redirect-aware public image inventory
        run: node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --check

      - name: Validate redirect-aware public content quality
        run: node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --check
