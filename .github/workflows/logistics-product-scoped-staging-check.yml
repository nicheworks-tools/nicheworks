name: Logistics product-scoped staging check

on:
  pull_request:
    paths:
      - 'tools/logistics-compliance-kit-jp/product-scoped-controller.mjs'
      - 'tools/logistics-compliance-kit-jp/SPEC.md'
      - 'scripts/check-logistics-product-scoped-staging.mjs'
      - 'docs/billing/pro-product-contracts-wave1.md'
      - '.agent/plans/2026-09-12-logistics-product-scoped-staging.md'
      - '.github/workflows/logistics-product-scoped-staging-check.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/logistics-compliance-kit-jp/product-scoped-controller.mjs'
      - 'tools/logistics-compliance-kit-jp/SPEC.md'
      - 'scripts/check-logistics-product-scoped-staging.mjs'
      - 'docs/billing/pro-product-contracts-wave1.md'
      - '.agent/plans/2026-09-12-logistics-product-scoped-staging.md'
      - '.github/workflows/logistics-product-scoped-staging-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check tools/logistics-compliance-kit-jp/product-scoped-controller.mjs
          node --check scripts/check-logistics-product-scoped-staging.mjs
      - name: Logistics product-scoped staging contracts
        run: node scripts/check-logistics-product-scoped-staging.mjs
