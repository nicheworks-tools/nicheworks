name: Pattern Dictionary Wave 4 publish

on:
  push:
    branches:
      - feat/pattern-dictionary-wave4-production-staging-20260916
    paths:
      - .github/workflows/pattern-dictionary-wave4-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave4-production-staging-20260916
          fetch-depth: 0
      - name: Patch milestone-aware historical tests
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'tools/pattern-dictionary/tests/wave2-production-content-test.mjs': [
              ("if(![20,40,60].includes(published.length))", "if(![20,40,60,80,100].includes(published.length))"),
            ],
            'tools/pattern-dictionary/tests/wave2-reference-image-test.mjs': [
              ("if(![20,40].includes(published.length))", "if(![20,40,60,80,100].includes(published.length))"),
              ("if(published.length===40&&!published.some(x=>x.id===id))", "if(published.length>=40&&!published.some(x=>x.id===id))"),
            ],
            'tools/pattern-dictionary/tests/wave3-source-verification-test.mjs': [
              ("if(![40,60].includes(published.length))", "if(![40,60,80,100].includes(published.length))"),
              ("if(published.length===60&&planned.length!==0)", "if(published.length>=60&&planned.length!==0)"),
            ],
            'tools/pattern-dictionary/tests/validate.mjs': [
              ("if(p.length!==60)errors.push(`expected 60 patterns, got ${p.length}`);", "if(p.length!==80)errors.push(`expected 80 patterns, got ${p.length}`);"),
              ("if(new Set(p.map(x=>x.id)).size!==60)errors.push('duplicate pattern ids');", "if(new Set(p.map(x=>x.id)).size!==80)errors.push('duplicate pattern ids');"),
              ("if(detailCount!==120)errors.push(`expected 120 static detail pages, got ${detailCount}`);", "if(detailCount!==160)errors.push(`expected 160 static detail pages, got ${detailCount}`);"),
              ("console.log('OK: 60 published records, 120 static detail pages, and all required runtime/production files satisfy the publication structure contract.');", "console.log('OK: 80 published records, 160 static detail pages, and all required runtime/production files satisfy the publication structure contract.');"),
            ],
          }
          for filename, reps in replacements.items():
            p=Path(filename); text=p.read_text()
            for old,new in reps:
              if old not in text:
                raise SystemExit(f'missing expected text in {filename}: {old}')
              text=text.replace(old,new)
            p.write_text(text)
          PY
      - name: Normalize and validate Wave 4 staging
        run: |
          node tools/pattern-dictionary/scripts/normalize-wave4-staging.mjs
          node tools/pattern-dictionary/scripts/check-wave4-staging.mjs
          node tools/pattern-dictionary/tests/wave4-source-verification-test.mjs
      - name: Publish Wave 4 transform
        run: node tools/pattern-dictionary/scripts/publish-wave4.mjs
      - name: Run Pattern Dictionary publication suite
        run: |
          set -euo pipefail
          tests=(
            validate.mjs
            source-verification-test.mjs
            production-content-test.mjs
            reference-image-test.mjs
            search-test.mjs
            compare-test.mjs
            affiliate-test.mjs
            canonical-100-test.mjs
            browse-mobile-test.mjs
            seo-detail-test.mjs
            publication-test.mjs
            wave2-source-verification-test.mjs
            wave2-production-content-test.mjs
            wave2-reference-image-test.mjs
            wave3-source-verification-test.mjs
            wave4-source-verification-test.mjs
          )
          for test in "${tests[@]}"; do
            echo "=== $test ==="
            node "tools/pattern-dictionary/tests/$test"
          done
          git diff --check
      - name: Commit publication output
        run: |
          git config user.name nicheworks-tools
          git config user.email nicheworks.tools@gmail.com
          git add tools/pattern-dictionary sitemap.xml
          git commit -m "Pattern Dictionary: publish Wave 4 entries 61-80"
          git push origin HEAD:feat/pattern-dictionary-wave4-production-staging-20260916
