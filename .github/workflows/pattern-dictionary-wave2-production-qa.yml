name: Pattern Dictionary Wave 2 production QA

on:
  push:
    branches:
      - qa/pattern-dictionary-wave2-production-20260916
    paths:
      - '.github/workflows/pattern-dictionary-wave2-production-qa.yml'

jobs:
  production-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare custom domain and deployment HTML
        run: |
          node <<'NODE'
          const urls=[
            'https://nicheworks.app/tools/pattern-dictionary/',
            'https://nicheworks.app/tools/pattern-dictionary/?qa=21ca4fe7',
            'https://203f283a.nicheworks.pages.dev/tools/pattern-dictionary/'
          ];
          for(const url of urls){
            const r=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'NicheWorks-production-QA'}});
            const s=await r.text();
            console.log(JSON.stringify({
              url,
              status:r.status,
              cfCache:r.headers.get('cf-cache-status'),
              age:r.headers.get('age'),
              etag:r.headers.get('etag'),
              stripe:s.includes('data-family="stripe"'),
              dot:s.includes('data-family="dot"'),
              footer40:s.includes('現在の40件'),
              footer20:s.includes('現在の20件'),
              length:s.length
            }));
          }
          NODE
