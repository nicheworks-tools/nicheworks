name: Pattern Dictionary Wave 2 production QA

on:
  push:
    branches:
      - qa/pattern-dictionary-wave2-production-20260916
    paths:
      - '.github/workflows/pattern-dictionary-wave2-production-qa.yml'

permissions:
  contents: write

jobs:
  production-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/pattern-dictionary-wave2-production-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for canonical 40 production data
        run: |
          node <<'NODE'
          const url='https://nicheworks.app/tools/pattern-dictionary/data/patterns.json';
          let last='';
          for(let i=0;i<30;i++){
            try{
              const r=await fetch(url,{cache:'no-store',headers:{'cache-control':'no-cache'}});
              const j=await r.json();
              last=`HTTP ${r.status}, count ${Array.isArray(j)?j.length:'not-array'}`;
              if(r.ok&&Array.isArray(j)&&j.length===40){console.log('Production canonical 40 detected.');process.exit(0)}
            }catch(e){last=e.message}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error(`Production did not expose 40 records: ${last}`);
          NODE
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run production Chromium QA
        run: |
          cat > /tmp/pd-prod-qa.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const base='https://nicheworks.app/tools/pattern-dictionary/';
          const wave2=['buffalo-check','shepherd-check','windowpane-check','madras-check','tattersall','gun-club-check','prince-of-wales-check','pinstripe','chalk-stripe','bengal-stripe','koushi','awning-stripe','regimental-stripe','breton-stripe','swiss-dot','herringbone','zigzag','diamond','harlequin','checkerboard'];
          const searches=[
            ['ja','赤黒の大きいチェック','バッファローチェック'],
            ['ja','グレンチェックに大きい格子','プリンス・オブ・ウェールズチェック'],
            ['ja','スーツの極細縦線','ピンストライプ'],
            ['ja','フランス海軍みたいな横縞','ブレトンストライプ'],
            ['ja','ぽこぽこ小ドット','スイスドット'],
            ['ja','ピエロみたいな赤黒ダイヤ','ハーレクイン'],
            ['en','Japanese lattice not alternating squares','Koushi']
          ];
          const fail=m=>{throw new Error(m)};
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1365,height:900}});
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('.pd-card').length===40);
            if(await page.locator('.pd-card').count()!==40)fail('JA home does not render 40 cards');
            if((await page.locator('#pattern-count').textContent()).trim()!=='40件')fail('JA count is not 40件');
            for(const family of ['stripe','dot'])if(await page.locator(`[data-family="${family}"]`).count()!==1)fail(`JA missing ${family} filter`);
            await page.goto(base+'en/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('.pd-card').length===40);
            if(await page.locator('.pd-card').count()!==40)fail('EN home does not render 40 cards');
            if(!(await page.locator('#pattern-count').textContent()).includes('40'))fail('EN count is not 40');

            let affiliateTotal=0;
            for(const id of wave2){
              for(const lang of ['ja','en']){
                const url=base+(lang==='en'?'en/':'')+'patterns/'+id+'/';
                await page.goto(url,{waitUntil:'domcontentloaded'});
                if(await page.locator(`body[data-pattern-id="${id}"]`).count()!==1)fail(`${lang}/${id}: body id mismatch`);
                await page.waitForSelector('.pd-detail-image');
                const imageOk=await page.locator('.pd-detail-image').evaluate(img=>img.complete&&img.naturalWidth>0&&img.naturalHeight>0);
                if(!imageOk)fail(`${lang}/${id}: reference image failed`);
                await page.waitForFunction(()=>document.querySelectorAll('a.pd-amazon-offer-link').length>=2,{timeout:15000});
                const links=page.locator('a.pd-amazon-offer-link');
                const n=await links.count();
                if(n<2||n>4)fail(`${lang}/${id}: expected 2-4 Amazon links, got ${n}`);
                if(lang==='ja')affiliateTotal+=n;
                for(let i=0;i<n;i++){
                  const a=links.nth(i),href=await a.getAttribute('href'),rel=await a.getAttribute('rel');
                  const u=new URL(href);
                  if(u.hostname!=='www.amazon.co.jp'||u.pathname!=='/s'||u.searchParams.get('tag')!=='nicheworks09-22'||!u.searchParams.get('k'))fail(`${lang}/${id}: malformed Amazon URL ${href}`);
                  if(!(rel||'').includes('sponsored')||!(rel||'').includes('noopener'))fail(`${lang}/${id}: Amazon rel semantics missing`);
                }
                await page.waitForFunction(()=>{const x=document.querySelector('#pd-amazon-disclosure');return x&&!x.hidden&&x.textContent.trim().length>0},{timeout:10000});
              }
            }
            if(affiliateTotal!==60)fail(`Wave 2 JA affiliate total expected 60, got ${affiliateTotal}`);

            for(const [lang,q,expected] of searches){
              const url=base+(lang==='en'?'en/':'')+'search.html?q='+encodeURIComponent(q);
              await page.goto(url,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelector('.pd-top-result')||document.querySelector('.pd-empty'));
              const title=await page.locator('.pd-title').count()?((await page.locator('.pd-title').textContent())||'').trim():'';
              if(title!==expected)fail(`${lang} search ${q}: expected ${expected}, got ${title||'ZERO'}`);
            }
            for(const q of ['black','purple barcode stripes']){
              await page.goto(base+'en/search.html?q='+encodeURIComponent(q),{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelector('.pd-top-result')||document.querySelector('.pd-empty'));
              if(await page.locator('.pd-top-result').count()){
                const conf=((await page.locator('.pd-kicker').first().textContent())||'').trim();
                if(conf==='MEDIUM confidence'||conf==='HIGH confidence')fail(`${q}: false confident match remains (${conf})`);
              }
            }

            for(const [a,b] of [['glen-check','prince-of-wales-check'],['chevron','herringbone'],['ichimatsu','checkerboard']]){
              await page.goto(base+'compare.html?a='+a+'&b='+b,{waitUntil:'domcontentloaded'});
              await page.waitForSelector('.pd-compare-guide');
              const text=(await page.locator('.pd-compare-guide').textContent())||'';
              if(text.trim().length<40)fail(`${a}/${b}: compare guide missing`);
            }

            const mobile=await browser.newPage({viewport:{width:390,height:844}});
            await mobile.goto(base,{waitUntil:'domcontentloaded'});
            await mobile.waitForFunction(()=>document.querySelectorAll('.pd-card').length===40);
            const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(overflow>2)fail(`390px home horizontal overflow ${overflow}px`);
            const filterScrollable=await mobile.locator('.pd-filter-row').first().evaluate(x=>x.scrollWidth>x.clientWidth);
            if(!filterScrollable)fail('390px filter row is not horizontally scrollable');
            await mobile.goto(base+'patterns/prince-of-wales-check/',{waitUntil:'domcontentloaded'});
            await mobile.waitForFunction(()=>document.querySelectorAll('a.pd-amazon-offer-link').length>=2);
            const detailOverflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(detailOverflow>2)fail(`390px detail horizontal overflow ${detailOverflow}px`);

            const sitemap=await (await fetch('https://nicheworks.app/sitemap.xml',{cache:'no-store'})).text();
            for(const id of wave2){
              for(const p of [`/tools/pattern-dictionary/patterns/${id}/`,`/tools/pattern-dictionary/en/patterns/${id}/`])if(!sitemap.includes(p))fail(`sitemap missing ${p}`);
            }
            console.log(`PRODUCTION QA PASS: 40 JA + 40 EN runtime routes; Wave 2 20 patterns; 60 JA Amazon intent links; search/compare/mobile/sitemap passed.`);
          } finally {await browser.close()}
          NODE
          node /tmp/pd-prod-qa.cjs
      - name: Remove one-shot QA workflow
        if: success()
        run: |
          rm .github/workflows/pattern-dictionary-wave2-production-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove Pattern Dictionary Wave 2 production QA'
          git push origin HEAD:qa/pattern-dictionary-wave2-production-20260916
