name: Pattern Dictionary browser QA

on:
  push:

jobs:
  browser-qa:
    if: ${{ github.ref == 'refs/heads/feat/pattern-dictionary-production-20-20260914' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pd-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/tools/pattern-dictionary/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pd-server.log
          exit 1
      - name: Install Chromium QA runtime
        working-directory: /tmp
        run: |
          mkdir -p pd-browser-qa
          cd pd-browser-qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser QA
        working-directory: /tmp/pd-browser-qa
        run: |
          cat > qa.mjs <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:4173/tools/pattern-dictionary';
          const browser=await chromium.launch({headless:true});
          try{
            const desktop=await browser.newPage({viewport:{width:1440,height:1000}});
            await desktop.goto(base+'/',{waitUntil:'networkidle'});
            await desktop.waitForSelector('#pattern-grid .pd-card');
            assert.equal(await desktop.locator('#pattern-grid .pd-card').count(),20,'desktop home must render 20 patterns');
            assert.equal((await desktop.locator('body').innerText()).includes('DEV PLACEHOLDER'),false,'home must not expose DEV placeholders');
            await desktop.locator('[data-family="japanese"]').click();
            const filtered=await desktop.locator('#pattern-grid .pd-card').count();
            assert.ok(filtered>0&&filtered<20,'Japanese filter must narrow the grid');

            await desktop.goto(base+'/search.html?q='+encodeURIComponent('白黒のギザギザしたチェック'),{waitUntil:'networkidle'});
            await desktop.waitForSelector('.pd-top-result');
            assert.equal((await desktop.locator('.pd-top-result h1').innerText()).trim(),'千鳥格子','mandatory natural-language search must resolve Houndstooth Top1');

            await desktop.goto(base+'/patterns/houndstooth/',{waitUntil:'networkidle'});
            await desktop.waitForSelector('.pd-detail-image');
            const src=await desktop.locator('.pd-detail-image').getAttribute('src');
            assert.ok(src?.endsWith('/assets/reference/houndstooth.png'),'detail must use production reference PNG');
            const detailText=await desktop.locator('body').innerText();
            assert.equal(detailText.includes('DEVプレースホルダー'),false,'detail must not show stale DEV warning');
            assert.ok(detailText.includes('reviewed'),'detail must report reviewed reference state before publication');
            assert.ok(detailText.includes('Amazonアソシエイトはまだ有効化していません'),'affiliate-disabled state must be explicit');
            assert.equal(await desktop.locator('a[href*="amazon.co.jp"]').count(),0,'Amazon link must not render without a real tracking ID');

            await desktop.goto(base+'/compare.html?a=houndstooth&b=glen-check',{waitUntil:'networkidle'});
            await desktop.waitForSelector('.pd-compare-guide');
            assert.equal(await desktop.locator('.pd-compare-preset').count(),6,'compare page must expose six canonical comparison presets');
            assert.ok((await desktop.locator('.pd-compare-guide').innerText()).includes('歯のような尖り'),'Houndstooth/Glen decisive cue must render');
            await desktop.locator('[data-ca="argyle"][data-cb="diamond-family"]').click();
            await desktop.waitForTimeout(100);
            assert.ok((await desktop.locator('#compare').innerText()).includes('一般的なダイヤ柄'),'Argyle vs generic diamond-family concept must render without adding a dictionary entry');

            await desktop.goto(base+'/en/patterns/paisley/',{waitUntil:'networkidle'});
            await desktop.waitForSelector('.pd-title');
            assert.equal((await desktop.locator('.pd-title').innerText()).trim(),'Paisley','English detail route must render production content');

            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            await mobile.goto(base+'/',{waitUntil:'networkidle'});
            await mobile.waitForSelector('#pattern-grid .pd-card');
            const overflowHome=await mobile.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+1);
            assert.equal(overflowHome,false,'mobile home must not overflow horizontally');
            const firstTwo=await mobile.locator('#pattern-grid .pd-card').evaluateAll(nodes=>nodes.slice(0,2).map(n=>n.getBoundingClientRect()));
            assert.ok(Math.abs(firstTwo[0].top-firstTwo[1].top)<3,'mobile browse grid should remain two columns');

            await mobile.goto(base+'/compare.html?a=seigaiha&b=asanoha',{waitUntil:'networkidle'});
            await mobile.waitForSelector('.pd-compare-grid .pd-compare-panel');
            const panels=await mobile.locator('.pd-compare-grid .pd-compare-panel').evaluateAll(nodes=>nodes.map(n=>n.getBoundingClientRect()));
            assert.ok(panels[1].top>=panels[0].bottom,'mobile compare panels must stack vertically');
            const overflowCompare=await mobile.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+1);
            assert.equal(overflowCompare,false,'mobile compare page must not overflow horizontally');
            console.log('OK: Chromium desktop/mobile QA passed for browse, search, detail, compare, bilingual routes, and disabled affiliate flow.');
          } finally { await browser.close(); }
          JS
          node qa.mjs
