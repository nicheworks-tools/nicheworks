name: ManualFinder Epson Colorio Wave 3I official manuals + tagged ink
on:
  pull_request:
    paths:
      - 'tools/manual-finder/**'
      - '.github/workflows/manualfinder-epson-wave3i.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  epson-colorio-wave3i:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new nine Epson manuals, ink mapping, and previous manufacturer regressions
        run: |
          node tools/manual-finder/tests/epson-colorio-wave3i-publication.test.mjs
          node tools/manual-finder/tests/epson-colorio-wave3h-publication.test.mjs
          node tools/manual-finder/tests/epson-colorio-wave3g-publication.test.mjs
          node tools/manual-finder/tests/affiliate-behavior-core.test.mjs
          node tools/manual-finder/tests/brother-mfcj-wave3f-publication.test.mjs
          node tools/manual-finder/tests/canon-jp-lens-publication.test.mjs
          node tools/manual-finder/tests/xiaomi-jp-mobile-publication.test.mjs
          node tools/manual-finder/tests/affiliate-coverage.test.mjs
          node tools/manual-finder/tests/affiliate-doc-sync.test.mjs
