name: Pattern Dictionary Wave 5 sync main

on:
  push:
    branches:
      - feat/pattern-dictionary-wave5-production-staging-20260916
    paths:
      - .github/workflows/pattern-dictionary-wave5-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave5-production-staging-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge latest main and union sitemap
        run: |
          set -euo pipefail
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git fetch origin main
          BRANCH_SITEMAP="$(mktemp)"
          MAIN_SITEMAP="$(mktemp)"
          git show HEAD:sitemap.xml > "$BRANCH_SITEMAP"
          git show origin/main:sitemap.xml > "$MAIN_SITEMAP"
          git merge origin/main --no-commit --no-ff || true
          node - "$BRANCH_SITEMAP" "$MAIN_SITEMAP" <<'NODE'
          const fs=require('fs');
          const [branchFile,mainFile]=process.argv.slice(2);
          const branch=fs.readFileSync(branchFile,'utf8');
          let main=fs.readFileSync(mainFile,'utf8');
          const blocks=s=>[...s.matchAll(/<url>[\s\S]*?<\/url>/g)].map(m=>m[0]);
          const loc=b=>b.match(/<loc>([\s\S]*?)<\/loc>/)?.[1]?.trim();
          const seen=new Set(blocks(main).map(loc).filter(Boolean));
          const add=[];
          for(const block of blocks(branch)){
            const u=loc(block);
            if(u&&!seen.has(u)){seen.add(u);add.push(block);}
          }
          if(add.length) main=main.replace('</urlset>',add.map(x=>'  '+x.replace(/\n/g,'\n  ')).join('\n')+'\n</urlset>');
          fs.writeFileSync('sitemap.xml',main);
          console.log(`sitemap union appended ${add.length} branch-only URLs; total unique locs ${seen.size}`);
          NODE
          git add sitemap.xml
          unresolved="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$unresolved" ]; then
            echo "Unexpected unresolved merge conflicts:"
            echo "$unresolved"
            exit 1
          fi
      - name: Revalidate canonical 100 after main sync
        run: |
          set -euo pipefail
          cd tools/pattern-dictionary
          node tests/validate.mjs
          node tests/canonical-100-test.mjs
          node tests/publication-test.mjs
          node tests/production-content-test.mjs
          node tests/source-verification-test.mjs
          node tests/reference-image-test.mjs
          node tests/search-test.mjs
          node tests/compare-test.mjs
          node tests/affiliate-test.mjs
          node tests/seo-detail-test.mjs
          node tests/browse-mobile-test.mjs
          node tests/wave2-production-content-test.mjs
          node tests/wave2-source-verification-test.mjs
          node tests/wave3-source-verification-test.mjs
          node tests/wave4-source-verification-test.mjs
          node tests/wave5-source-verification-test.mjs
          cd ../..
          git diff --check
      - name: Commit main sync
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge latest main into Pattern Dictionary canonical 100"
          git push origin HEAD:feat/pattern-dictionary-wave5-production-staging-20260916
