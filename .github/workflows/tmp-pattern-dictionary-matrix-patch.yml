name: Temporary Pattern Dictionary quality matrix patch

on:
  push:
    branches:
      - feat/pattern-dictionary-vertical-slice-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-vertical-slice-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Append Pattern Dictionary quality record
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'audits/tool-quality-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(path, 'utf8'));
          const slug = 'pattern-dictionary';
          if (!matrix.records.some((record) => record.slug === slug)) {
            matrix.records.push({
              slug,
              display_name: { ja: '模様辞典', en: 'Pattern Dictionary' },
              implementation: 'tools/pattern-dictionary/',
              active_state: 'active',
              category: ['pattern', 'dictionary', 'visual-search', 'reference'],
              spec: 'docs/tools/pattern-dictionary.md',
              spec_coverage: 'complete',
              implementation_exists: true,
              layout_class: 'desktop-wide',
              language_policy: 'separate JA/EN pages',
              functional_completeness: 'documented-current-contract',
              inputs_summary: '- Ambiguous natural-language pattern search in Japanese or English. - Visual pattern-card selection. - Interpretation-chip and visual-filter refinement. - Similar-pattern navigation and two-pattern comparison selections.',
              outputs_summary: '- Ranked visual pattern candidates with match reasons. - Static JA/EN pattern detail pages. - Similar/common-confusion navigation. - Two-pattern visual comparison. - Prototype imagery and publication-state notices until reference images are verified.',
              network_dependency: { status: 'not-found', external_hosts: [] },
              storage: { localStorage: false, sessionStorage: false },
              capabilities: { copy: false, download: false },
              responsive_status: 'no-observed-defect',
              usage_status: 'optional-absent',
              faq_status: 'optional-absent',
              ga4_status: 'present',
              adsense_status: 'present',
              canonical_status: 'present',
              json_ld_status: 'present',
              donation_status: 'present',
              privacy_compliance: 'documented',
              functional_test_status: 'behavior-test-present',
              automated_tests: [
                'tools/pattern-dictionary/tests/search-test.mjs',
                'tools/pattern-dictionary/tests/validate.mjs'
              ],
              outstanding_issues: [],
              final_state: 'PASS',
              evidence: [
                'tools/pattern-dictionary/index.html',
                'tools/pattern-dictionary/app.js',
                'tools/pattern-dictionary/style.css',
                'tools/pattern-dictionary/README.md',
                'tools/pattern-dictionary/SPEC.md'
              ],
              usage_html_present: false,
              usage_en_html_present: false,
              common_spec_compliance: 'no-hard-gap-found',
              obvious_broken_or_incomplete_behavior: [],
              help_documentation: {
                main_page_summary: 'required-and-present',
                usage: 'optional-absent',
                faq: 'optional-absent',
                usage_evidence: [],
                usage_language_coverage: { ja: false, en: false }
              },
              test_evidence: [
                { path: 'tools/pattern-dictionary/tests/search-test.mjs', classification: 'behavior test' },
                { path: 'tools/pattern-dictionary/tests/validate.mjs', classification: 'data validation' }
              ],
              decision_gaps: [],
              hard_compliance_gaps: [],
              recommendation_only_gaps: []
            });
          }
          matrix.registered_tool_count = matrix.records.length;
          matrix.record_count = matrix.records.length;
          for (const state of ['PASS', 'FIX', 'BLOCKED', 'NEEDS_DECISION']) {
            matrix.counts[state] = matrix.records.filter((record) => record.final_state === state).length;
          }
          fs.writeFileSync(path, JSON.stringify(matrix, null, 2) + '\n');
          NODE
      - name: Validate quality matrix
        run: node scripts/check-tool-quality-contract.mjs
      - name: Commit quality matrix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/tool-quality-matrix.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: register Pattern Dictionary in quality matrix"
          git push origin HEAD:feat/pattern-dictionary-vertical-slice-20260914
