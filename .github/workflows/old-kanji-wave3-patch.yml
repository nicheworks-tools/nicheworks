name: Old Kanji Wave 3 guarded patch

on:
  push:
    branches:
      - seo/old-kanji-wave3-old-20260917
    paths:
      - scripts/tmp-old-kanji-wave3-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/old-kanji-wave3-old-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded patch
        run: node scripts/tmp-old-kanji-wave3-patch.mjs
      - name: Remove temporary patch files
        run: |
          rm scripts/tmp-old-kanji-wave3-patch.mjs
          rm .github/workflows/old-kanji-wave3-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Old Kanji Wave 3 discovery links"
          git push origin HEAD:seo/old-kanji-wave3-old-20260917
