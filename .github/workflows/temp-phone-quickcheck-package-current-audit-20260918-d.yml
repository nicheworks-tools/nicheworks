name: Temp Phone QuickCheck current package audit 20260918 d

on:
  pull_request:
    paths:
      - '.github/workflows/temp-phone-quickcheck-package-current-audit-20260918-d.yml'
      - 'tools/phone-quickcheck/data/phones.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print current package unknowns
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('tools/phone-quickcheck/data/phones.json','utf8'));
          const adapter = data.phones.filter(p => p.included?.adapter === 'unknown');
          const cable = data.phones.filter(p => p.included?.cable === 'unknown');
          console.log('ADAPTER_COUNT=' + adapter.length);
          console.log('ADAPTER_IDS=' + JSON.stringify(adapter.map(p => p.id)));
          console.log('CABLE_COUNT=' + cable.length);
          console.log('CABLE_IDS=' + JSON.stringify(cable.map(p => p.id)));
          console.log('UNKNOWN_RECORDS=' + JSON.stringify(data.phones.filter(p => p.included?.adapter === 'unknown' || p.included?.cable === 'unknown').map(p => ({id:p.id,manufacturer:p.manufacturer,model:p.model,market:p.market??null,included:p.included,specificationsUrl:p.sources?.specificationsUrl??null,manualUrl:p.sources?.manualUrl??null,releaseUrl:p.sources?.releaseUrl??null})), null, 2));
          NODE
