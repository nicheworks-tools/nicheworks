name: One-shot Old Kanji sales cleanup

on:
  push:
    branches:
      - chore/adsense-old-kanji-sales-cleanup-20260915
    paths:
      - '.github/workflows/_tmp-old-kanji-sales-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/adsense-old-kanji-sales-cleanup-20260915
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove unfinished public Pro panels
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'tools/name-old-kanji-checker/index.html',
            'tools/old-document-kanji-highlighter/index.html',
            'tools/old-kanji-ocr-scanner/index.html',
            'tools/old-kanji-reference/index.html',
            'tools/place-old-kanji-checker/index.html',
            'tools/unicode-kanji-checker/index.html',
            'tools/variant-kanji-compare/index.html'
          ];

          function removeSection(html, predicate) {
            const tags = [...html.matchAll(/<\/?section\b[^>]*>/gi)];
            for (let i = 0; i < tags.length; i++) {
              const tag = tags[i][0];
              if (/^<\/section/i.test(tag) || !predicate(tag)) continue;
              let depth = 1;
              for (let j = i + 1; j < tags.length; j++) {
                depth += /^<\/section/i.test(tags[j][0]) ? -1 : 1;
                if (depth === 0) {
                  const start = tags[i].index;
                  const end = tags[j].index + tags[j][0].length;
                  return { html: html.slice(0, start) + html.slice(end), removed: true };
                }
              }
              throw new Error('Unclosed section while removing unfinished Pro panel');
            }
            return { html, removed: false };
          }

          for (const file of files) {
            let html = fs.readFileSync(file, 'utf8');
            const result = removeSection(html, (tag) => /class=["'][^"']*\bokj-pro-panel\b/i.test(tag));
            if (!result.removed) throw new Error(`${file}: expected one okj-pro-panel section`);
            html = result.html;

            if (file.includes('old-kanji-ocr-scanner')) {
              html = html.replace(/\s*<section class=["']notice-panel["']>\s*<p data-i18n=["']proNote["']>[\s\S]*?<\/p>\s*<\/section>/i, '');
            }

            if (/data-okj-pro-state=["']billing-unavailable["']|okj-pro-state-billing-unavailable|課金導線はまだ接続されていません|課金未接続|Billing is not connected yet|Billing unavailable/i.test(html)) {
              throw new Error(`${file}: unfinished billing marker remains after cleanup`);
            }

            html = html
              .replace(/\n{3,}/g, '\n\n')
              .split('\n')
              .map((line) => line.replace(/[ \t]+$/g, ''))
              .join('\n');
            fs.writeFileSync(file, html);
          }
          NODE

      - name: Validate AdSense and SEO contracts
        run: |
          node scripts/check-adsense-review-surface.mjs
          node scripts/check-seo-public-url-contract.mjs
          node scripts/check-seo-indexable-url-identity.mjs
          node scripts/audit-publishing-mode.mjs
          node scripts/audit-seo.mjs --strict
          git diff --check

      - name: Commit validated cleanup and remove temporary workflows
        run: |
          rm .github/workflows/_tmp-old-kanji-sales-cleanup.yml
          rm .github/workflows/_tmp-old-kanji-sales-diagnose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/name-old-kanji-checker/index.html \
            tools/old-document-kanji-highlighter/index.html \
            tools/old-kanji-ocr-scanner/index.html \
            tools/old-kanji-reference/index.html \
            tools/place-old-kanji-checker/index.html \
            tools/unicode-kanji-checker/index.html \
            tools/variant-kanji-compare/index.html \
            scripts/check-adsense-review-surface.mjs \
            .github/workflows/_tmp-old-kanji-sales-cleanup.yml \
            .github/workflows/_tmp-old-kanji-sales-diagnose.yml
          git commit -m 'chore: remove unfinished Old Kanji sales UI'
          git push origin HEAD:chore/adsense-old-kanji-sales-cleanup-20260915
