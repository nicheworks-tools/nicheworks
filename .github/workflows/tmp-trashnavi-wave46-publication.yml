name: tmp TrashNavi Wave46 publication
on:
  push:
    branches: [feat/trashnavi-wave46-publication-20260918]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave46-publication-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and validate Wave46 publication
        run: |
          node .github/tmp-trashnavi-wave46-publication.mjs
          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          entries=[
            ('082023','hitachi',True),('082031','tsuchiura',False),('082058','ishioka',True),
            ('082082','ryugasaki',True),('082104','shimotsuma',False),('082163','kasama',False),
            ('082198','ushiku',False),('082201','tsukuba',True),('082210','hitachinaka',False),
            ('082244','moriya',True)
          ]
          manifest=json.loads(Path('tools/trashnavi/municipality-page-manifest.json').read_text())
          assert len(manifest)==244
          ai=json.loads(Path('tools/trashnavi/ai-reference.json').read_text())
          assert ai['snapshot_date']=='2026-09-18'
          assert ai['published_municipality_count']==244 and len(ai['municipalities'])==244
          root=Path('sitemap.xml').read_text()
          dedicated=Path('sitemap-trashnavi.xml').read_text()
          index=Path('tools/trashnavi/index.html').read_text()
          assert dedicated.count('<url>')==245
          assert 'データ更新日：2026-09-18' in index
          for code,slug,has_callout in entries:
            canonical=f'https://nicheworks.app/tools/trashnavi/ibaraki/{slug}/'
            href=f'/tools/trashnavi/ibaraki/{slug}/'
            assert root.count(f'<loc>{canonical}</loc>')==1
            assert dedicated.count(f'<loc>{canonical}</loc>')==1
            assert index.count(f'href="{href}"')==1
            page=Path(f'tools/trashnavi/ibaraki/{slug}/index.html').read_text()
            assert f'<link rel="canonical" href="{canonical}">' in page
            assert page.count('class="official-link-card"')==3
            assert 'ごみ出し・片付け用品 [PR]' in page
            assert ('class="current-calendar-callout"' in page)==has_callout
          print('Wave46 publication acceptance: 244 pages / 10 new canonical URLs / 5 explicit 2026 callouts / 245 dedicated sitemap URLs')
          PY
      - name: Commit generated publication
        run: |
          rm .github/tmp-trashnavi-wave46-publication.mjs .github/workflows/tmp-trashnavi-wave46-publication.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(trashnavi): publish Wave46 municipalities"
          git push origin HEAD:feat/trashnavi-wave46-publication-20260918
