name: TrashNavi metadata contract fix temp
on:
  push:
    branches:
      - fix/trashnavi-metadata-by-available-types-20260915
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trashnavi-metadata-by-available-types-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fix municipality metadata claims and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/trashnavi/scripts/generate-municipality-pages.mjs')
          s = p.read_text()
          old = """  const title = `${city}のごみ分別・収集カレンダー・粗大ごみ公式情報｜TrashNavi | NicheWorks`;\n  const desc = `${pref}${city}のごみ分別、収集カレンダー、粗大ごみなどの自治体公式ページをまとめています。TrashNaviは公式情報への案内で、分別ルールの最終判断や申込みは行いません。`;\n"""
          new = """  const hasBulky = types.has('bulky_waste') || types.has('bulky_application');\n  const nonBulkyTitleLabels = { waste_sorting:'ごみ分別', waste_search:'ごみ検索', collection_calendar:'収集日', dropoff_facility:'持込施設', waste_app:'ごみ分別アプリ', special_disposal:'特別処分' };\n  const nonBulkyTitleTerms = TYPE_ORDER.filter(type=>types.has(type) && nonBulkyTitleLabels[type]).map(type=>nonBulkyTitleLabels[type]).slice(0,3);\n  const title = hasBulky ? `${city}のごみ分別・収集カレンダー・粗大ごみ公式情報｜TrashNavi | NicheWorks` : `${city}の${nonBulkyTitleTerms.join('・')}公式情報｜TrashNavi | NicheWorks`;\n  const desc = hasBulky ? `${pref}${city}のごみ分別、収集カレンダー、粗大ごみなどの自治体公式ページをまとめています。TrashNaviは公式情報への案内で、分別ルールの最終判断や申込みは行いません。` : `${pref}${city}の確認済み自治体公式ごみ情報をまとめています。TrashNaviは公式情報への案内で、分別ルール・料金・収集日の最終判断や申込みは行いません。`;\n  const heroJa = hasBulky ? '分別、収集カレンダー、粗大ごみなど、確認済みの自治体公式ページをまとめています。具体的な分別方法・料金・収集日は、必ず各公式ページの最新情報を確認してください。' : '分別、収集日など、確認済みの自治体公式ごみ情報をまとめています。具体的な分別方法・料金・収集日は、必ず各公式ページの最新情報を確認してください。';\n  const heroEn = hasBulky ? 'Use these verified municipal links for sorting, collection calendars and bulky waste. Confirm current rules, fees and dates on the official source.' : 'Use these verified municipal waste-information links. Confirm current sorting rules, fees and collection dates on the official source.';\n"""
          if old not in s:
              raise SystemExit('metadata source block not found')
          s = s.replace(old, new, 1)
          old_hero = '<section class="municipality-hero"><h2 data-i18n="ja">${esc(city)}の公式ごみ情報</h2><h2 data-i18n="en">Official waste information for ${esc(city)}</h2><p data-i18n="ja">分別、収集カレンダー、粗大ごみなど、確認済みの自治体公式ページをまとめています。具体的な分別方法・料金・収集日は、必ず各公式ページの最新情報を確認してください。</p><p data-i18n="en">Use these verified municipal links for sorting, collection calendars and bulky waste. Confirm current rules, fees and dates on the official source.</p>${checked?`<p class="verification-summary"><span data-i18n="ja">最新のリンク確認記録: ${esc(checked)}</span><span data-i18n="en">Latest recorded link check: ${esc(checked)}</span></p>`:\'\'}</section>'
          new_hero = '<section class="municipality-hero"><h2 data-i18n="ja">${esc(city)}の公式ごみ情報</h2><h2 data-i18n="en">Official waste information for ${esc(city)}</h2><p data-i18n="ja">${esc(heroJa)}</p><p data-i18n="en">${esc(heroEn)}</p>${checked?`<p class="verification-summary"><span data-i18n="ja">最新のリンク確認記録: ${esc(checked)}</span><span data-i18n="en">Latest recorded link check: ${esc(checked)}</span></p>`:\'\'}</section>'
          if old_hero not in s:
              raise SystemExit('hero source block not found')
          s = s.replace(old_hero, new_hero, 1)
          p.write_text(s)
          PY

          node tools/trashnavi/scripts/generate-municipality-pages.mjs

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dataDir = 'tools/trashnavi/data';
          const manifest = JSON.parse(fs.readFileSync('tools/trashnavi/municipality-page-manifest.json','utf8')).filter(x=>x.publish);
          const typeMap = new Map([['自治体公式ページ','municipal_home'],['公式サイト','municipal_home'],['ごみ分別ページ','waste_sorting'],['収集カレンダー','collection_calendar'],['粗大ごみ','bulky_waste'],['粗大ごみ申込み','bulky_application'],['検索ページ','waste_search'],['持込施設','dropoff_facility'],['ごみ分別アプリ','waste_app']]);
          const files = fs.readdirSync(dataDir).filter(n=>/^direct-waste-links.*\.json$/.test(n));
          const rows = files.flatMap(n=>JSON.parse(fs.readFileSync(path.join(dataDir,n),'utf8')));
          const canonicalType = r => String(r.link_type||'').trim() || typeMap.get(String(r.type||'').trim()) || '';
          const noBulky = [];
          for (const entry of manifest) {
            const types = new Set(rows.filter(r=>String(r.lgcode||'').trim()===entry.lgcode).map(canonicalType));
            const hasBulky = types.has('bulky_waste') || types.has('bulky_application');
            if (!hasBulky) {
              const rel = `tools/trashnavi/${entry.pref_slug}/${entry.city_slug}/index.html`;
              const html = fs.readFileSync(rel,'utf8');
              if (html.includes('粗大ごみ公式情報｜TrashNavi')) throw new Error(`${rel}: unsupported bulky claim remains in title`);
              if (html.includes('collection calendars and bulky waste')) throw new Error(`${rel}: unsupported bulky claim remains in hero`);
              noBulky.push({lgcode:entry.lgcode, page:rel, types:[...types].sort()});
            }
          }
          if (!noBulky.length) throw new Error('expected at least one published municipality without bulky coverage');
          console.log('NO_BULKY_PUBLISHED=' + JSON.stringify(noBulky));
          NODE

          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs

          rm .github/workflows/trashnavi-metadata-fix-temp.yml
          git status --short
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make TrashNavi municipality metadata match available link types'
          git push origin HEAD:fix/trashnavi-metadata-by-available-types-20260915
