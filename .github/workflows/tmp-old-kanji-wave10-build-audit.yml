name: Old Kanji Wave 10 temporary audit build

on:
  push:
    branches:
      - completion/old-kanji-wave10-data-finalization-20260918

permissions:
  contents: write

jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: completion/old-kanji-wave10-data-finalization-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate and verify dictionary audit
        run: |
          node scripts/build-old-kanji-dictionary-audit.mjs
          node scripts/build-old-kanji-dictionary-audit.mjs --check
          node -e "const a=require('./tools/old-kanji-reference/dictionary-audit.json'); console.log(JSON.stringify({summary:a.summary,maintenanceSummary:a.maintenanceSummary},null,2))"
      - name: Commit generated audit and remove temporary workflow
        run: |
          git config user.name "nicheworks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/old-kanji-reference/dictionary-audit.json
          git rm .github/workflows/tmp-old-kanji-wave10-build-audit.yml
          git commit -m "Old Kanji Wave 10: regenerate dictionary audit artifact"
          git push origin HEAD:completion/old-kanji-wave10-data-finalization-20260918
