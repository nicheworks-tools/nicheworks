name: One-shot reapply validated AdSense header sitemap alignment

on:
  push:
    branches:
      - fix/adsense-header-sitemap-contract-v2-20260915
    paths:
      - '.github/workflows/_tmp-reapply-adsense-header-sitemap.yml'

permissions:
  contents: write

jobs:
  reapply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adsense-header-sitemap-contract-v2-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copy validated files from completed alignment branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/adsense-header-sitemap-contract-20260915
          src=origin/fix/adsense-header-sitemap-contract-20260915
          files=(
            '.github/workflows/seo-audit.yml'
            '_headers'
            'scripts/check-adsense-review-surface.mjs'
            'sitemap.xml'
            'tools/ai-interaction-atlas/ja/pro/index.html'
            'tools/ai-interaction-atlas/pro/index.html'
            'tools/command-safety-checker/pro.html'
            'tools/logistics-compliance-kit-jp/pro.html'
            'tools/motion-atlas/ja/pro/index.html'
            'tools/motion-atlas/pro/index.html'
            'tools/ui-atlas/ja/pro/index.html'
            'tools/ui-atlas/pro/index.html'
            'tools/vibe-lexicon/ja/pro/index.html'
            'tools/vibe-lexicon/pro/index.html'
          )
          for file in "${files[@]}"; do
            git show "$src:$file" > "$file"
          done

      - name: Validate latest-main result
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-adsense-review-surface.mjs
          node scripts/check-seo-public-url-contract.mjs
          node scripts/check-seo-indexable-url-identity.mjs
          node scripts/audit-publishing-mode.mjs
          node scripts/audit-seo.mjs --strict
          node scripts/check-tool-runtime-contracts.mjs
          node scripts/check-tool-spec-contract.mjs
          git diff --check

      - name: Commit validated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/seo-audit.yml _headers scripts/check-adsense-review-surface.mjs sitemap.xml tools/ai-interaction-atlas/ja/pro/index.html tools/ai-interaction-atlas/pro/index.html tools/command-safety-checker/pro.html tools/logistics-compliance-kit-jp/pro.html tools/motion-atlas/ja/pro/index.html tools/motion-atlas/pro/index.html tools/ui-atlas/ja/pro/index.html tools/ui-atlas/pro/index.html tools/vibe-lexicon/ja/pro/index.html tools/vibe-lexicon/pro/index.html
          git commit -m 'fix: align AdSense headers sitemap and noindex pages'
          git push origin HEAD:fix/adsense-header-sitemap-contract-v2-20260915
