name: CTA q011 identity runtime apply

on:
  push:
    branches:
      - audit/construction-atlas-q011-identity-closure-20260915
    paths:
      - 'tools/construction-tools-atlas/scripts/apply-q011-identity-runtime-v2.3.cjs'
      - 'tools/construction-tools-atlas/scripts/apply-q011-identity-auditor-patch-v2.3.cjs'
      - 'tools/construction-tools-atlas/data/canonical-identity-resolutions-v2.3.json'
      - 'tools/construction-tools-atlas/data/canonical-redirects-v2.3.json'
      - '.github/workflows/cta-q011-identity-runtime-apply.yml'

permissions:
  contents: write

jobs:
  apply-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/construction-atlas-q011-identity-closure-20260915
      - name: Apply deterministic runtime and auditor patches
        run: |
          node tools/construction-tools-atlas/scripts/apply-q011-identity-runtime-v2.3.cjs
          node tools/construction-tools-atlas/scripts/apply-q011-identity-auditor-patch-v2.3.cjs
      - name: Check syntax and identity contract
        run: |
          node --check tools/construction-tools-atlas/data/quality-loader.js
          node --check tools/construction-tools-atlas/scripts/check-canonical-redirects-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs
          node --check tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-canonical-redirects-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-canonical-identity-resolutions-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs
      - name: Commit generated runtime and audit changes
        run: |
          if git diff --quiet; then
            echo 'No generated runtime/audit changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/construction-tools-atlas/data/quality-loader.js \
            tools/construction-tools-atlas/scripts/check-canonical-redirects-v2.3.cjs \
            tools/construction-tools-atlas/scripts/audit-publication-corpus-v2.3.cjs \
            tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs
          git commit -m 'fix(construction-atlas): apply q011 identity runtime resolutions'
          git push origin HEAD:audit/construction-atlas-q011-identity-closure-20260915
