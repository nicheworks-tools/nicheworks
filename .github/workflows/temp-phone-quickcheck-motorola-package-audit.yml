name: Temp Phone QuickCheck Motorola package audit

on:
  pull_request:
    paths:
      - '.github/workflows/temp-phone-quickcheck-motorola-package-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Print target records
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('tools/phone-quickcheck/data/phones.json','utf8'));
          for (const id of ['motorola-moto-g24','motorola-moto-g64-5g']) {
            const p = data.phones.find(x => x.id === id);
            if (!p) throw new Error(`${id} missing`);
            console.log(`@@${id}`);
            console.log(JSON.stringify({market:p.market ?? null,included:p.included,sources:p.sources,charging:p.charging},null,2));
          }
          NODE
