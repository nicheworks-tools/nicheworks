name: TrashNavi Wave 12 Oita SPEC sync

on:
  push:
    branches:
      - feat/trashnavi-wave12-oita-20260913
    paths:
      - .github/workflows/trashnavi-wave12-oita-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave12-oita-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch Wave 12 SPEC
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'tools/trashnavi/SPEC.md';
          let s = fs.readFileSync(p, 'utf8');
          const wave11 = '- 香川県 高松市 — `/tools/trashnavi/kagawa/takamatsu/`';
          const wave12 = 'Wave 12では、Wave 11と同じ供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から大分市を選定した。大分市公式の2026年度（令和8年度）ごみ収集カレンダー（住所別検索）と粗大ごみ・一時的多量ごみ案内を追加し、既存のごみ導線と合わせてpreferred candidateへ引き上げた。data enrichment検証は完了し、自治体page publicationは別PRで行う。\n\n- 大分県 大分市 — publication pending';
          if (!s.includes(wave12)) {
            if (!s.includes(wave11)) throw new Error('Wave 11 municipality anchor missing');
            s = s.replace(wave11, `${wave11}\n\n${wave12}`);
          }
          const baseline11 = `### Wave 11 verified coverage baseline\n\n2026-09-13のWave 11 CI基準値は次のとおり。\n\n- municipalities: 1,916\n- records: 2,200 / 2,200 valid HTTP(S)\n- municipalities with any waste-specific direct link: 78\n- publish candidates (2+ types): 18\n- preferred candidates (3+ types): 18\n- collection calendar coverage: 18 municipalities\n- bulky-waste coverage: 17 municipalities\n- drop-off facility coverage: 1 municipality\n- waste-app coverage: 1 municipality\n- invalid records: 0\n- unknown type labels: 0`;
          const baseline12 = `### Wave 12 verified coverage baseline\n\n2026-09-13のWave 12 CI基準値は次のとおり。\n\n- municipalities: 1,916\n- records: 2,202 / 2,202 valid HTTP(S)\n- municipalities with any waste-specific direct link: 78\n- publish candidates (2+ types): 19\n- preferred candidates (3+ types): 19\n- collection calendar coverage: 19 municipalities\n- bulky-waste coverage: 18 municipalities\n- drop-off facility coverage: 1 municipality\n- waste-app coverage: 1 municipality\n- invalid records: 0\n- unknown type labels: 0`;
          if (!s.includes('### Wave 12 verified coverage baseline')) {
            if (!s.includes(baseline11)) throw new Error('Wave 11 baseline anchor missing');
            s = s.replace(baseline11, `${baseline11}\n\n${baseline12}`);
          }
          const acceptance11 = '- [x] Wave 11で高松市をpreferred candidateへ引き上げ、自治体pageを公開する。';
          const acceptance12 = '- [x] Wave 12で大分市をpreferred candidateへ引き上げる。自治体page publicationは別PRで閉じる。';
          if (!s.includes(acceptance12)) {
            if (!s.includes(acceptance11)) throw new Error('Wave 11 acceptance anchor missing');
            s = s.replace(acceptance11, `${acceptance11}\n${acceptance12}`);
          }
          const evidence11 = '- `tools/trashnavi/data/direct-waste-links-supply-wave11.json` — 高松市のWave 11 collection-calendar / bulky-waste enrichment。';
          const evidence12 = '- `tools/trashnavi/data/direct-waste-links-supply-wave12.json` — 大分市のWave 12 collection-calendar / bulky-waste enrichment。';
          if (!s.includes(evidence12)) {
            if (!s.includes(evidence11)) throw new Error('Wave 11 evidence anchor missing');
            s = s.replace(evidence11, `${evidence11}\n${evidence12}`);
          }
          fs.writeFileSync(p, s);
          NODE
      - name: Validate Wave 12 state
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit SPEC sync
        shell: bash
        run: |
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add tools/trashnavi/SPEC.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync TrashNavi Wave 12 Oita SPEC'
          git push origin HEAD:feat/trashnavi-wave12-oita-20260913
