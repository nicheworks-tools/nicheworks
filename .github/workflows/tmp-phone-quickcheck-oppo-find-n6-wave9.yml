name: Temporary Phone QuickCheck OPPO Find N6 wave 9

on:
  push:
    branches:
      - feat/phone-quickcheck-oppo-find-n6-wave9-20260914
    paths:
      - .github/workflows/tmp-phone-quickcheck-oppo-find-n6-wave9.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-quickcheck-oppo-find-n6-wave9-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add official OPPO Japan user guide source
        run: |
          sed -i "/specificationsUrl: 'https:\/\/www.oppo.com\/jp\/smartphones\/series-find-n\/find-n6\/specs\/',/a\\      manualUrl: 'https://support.oppo.com/jp/user-guide/'," scripts/tmp-phone-quickcheck-oppo-find-n6-wave9.mjs
      - run: node scripts/tmp-phone-quickcheck-oppo-find-n6-wave9.mjs
      - run: node scripts/check-phone-quickcheck-data.mjs
      - run: node scripts/check-phone-quickcheck-source-semantics.mjs
      - run: node scripts/check-phone-quickcheck-affiliate.mjs
      - run: node tools/phone-quickcheck/tests/behavior.test.mjs
      - name: Commit validated canonical files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/phone-quickcheck/data/phones.json \
            tools/phone-quickcheck/index.html \
            tools/phone-quickcheck/usage.html \
            tools/phone-quickcheck/SPEC.md \
            docs/tools/phone-quickcheck.md \
            scripts/check-phone-quickcheck-data.mjs \
            tools/phone-quickcheck/tests/behavior.test.mjs
          git diff --cached --check
          git commit -m "Phone QuickCheck: add OPPO Find N6"
          git push origin HEAD:feat/phone-quickcheck-oppo-find-n6-wave9-20260914
