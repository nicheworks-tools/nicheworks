name: Pattern Dictionary v1 final sync QA

on:
  push:
    branches:
      - audit/pattern-dictionary-v1-product-quality-20260917
    paths:
      - .github/workflows/pattern-dictionary-v1-final-sync-qa.yml

permissions:
  contents: write

jobs:
  sync-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pattern-dictionary-v1-product-quality-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge latest main
        run: |
          set -euo pipefail
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Run full Pattern Dictionary static gates
        run: |
          set -euo pipefail
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/tests/canonical-100-test.mjs
          node tools/pattern-dictionary/tests/production-content-test.mjs
          node tools/pattern-dictionary/tests/source-verification-test.mjs
          node tools/pattern-dictionary/tests/reference-image-test.mjs
          node tools/pattern-dictionary/tests/reference-image-accuracy-audit-test.mjs
          node tools/pattern-dictionary/tests/publication-test.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node tools/pattern-dictionary/tests/compare-test.mjs
          node tools/pattern-dictionary/tests/affiliate-test.mjs
          node tools/pattern-dictionary/tests/seo-detail-test.mjs
          node tools/pattern-dictionary/tests/browse-mobile-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
          node tools/pattern-dictionary/tests/wave2-production-content-test.mjs
          node tools/pattern-dictionary/tests/wave2-source-verification-test.mjs
          node tools/pattern-dictionary/tests/wave3-source-verification-test.mjs
          node tools/pattern-dictionary/tests/wave4-source-verification-test.mjs
          node tools/pattern-dictionary/tests/wave5-source-verification-test.mjs
          git diff --check
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/pd-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/tools/pattern-dictionary/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pd-http.log; exit 1
      - name: Run final browser and WCAG QA
        run: |
          cat > .pd-final-qa.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const axePath=require.resolve('axe-core/axe.min.js');
          const base='http://127.0.0.1:8000/tools/pattern-dictionary/';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            await context.route('**/*',route=>{const u=new URL(route.request().url());if(u.hostname==='127.0.0.1')return route.continue();return route.abort();});
            const page=await context.newPage({viewport:{width:1440,height:1000}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const goto=async u=>{errors.length=0;await page.goto(u,{waitUntil:'domcontentloaded'});};
            const cards=()=>page.waitForFunction(()=>document.querySelectorAll('#pattern-grid .pd-card').length===100);
            const noOverflow=async label=>{const x=await page.evaluate(()=>({s:document.documentElement.scrollWidth,c:document.documentElement.clientWidth}));assert.ok(x.s<=x.c+1,`${label}: ${x.s}/${x.c}`)};

            await goto(base);await cards();assert.equal(await page.locator('#pattern-grid .pd-card').count(),100);assert.equal(await page.locator('#q').getAttribute('aria-label'),'模様を検索');
            await page.locator('#q').fill('千鳥');await page.waitForFunction(()=>{const x=document.querySelector('#autocomplete');return x&&!x.hidden&&x.textContent.includes('千鳥格子')});
            await goto(base+'en/');await cards();assert.equal(await page.locator('#q').getAttribute('aria-label'),'Search patterns');await page.locator('#q').fill('hound');await page.waitForFunction(()=>{const x=document.querySelector('#autocomplete');return x&&!x.hidden&&/Houndstooth/i.test(x.textContent)});

            await goto(base+'search.html?q='+encodeURIComponent('白黒のギザギザしたチェック'));await page.waitForFunction(()=>document.querySelector('#results')?.textContent.includes('千鳥格子'));
            await page.locator('#q').fill('zzzz-no-known-pattern-987654321');await page.locator('#search-form').evaluate(f=>f.requestSubmit());await page.waitForFunction(()=>/特定できません/.test(document.querySelector('#results')?.textContent||''));

            await goto(base+'patterns/houndstooth/');await page.waitForSelector('.pd-detail-image');const d=await page.locator('.pd-detail-image').evaluate(i=>({alt:i.alt,nw:i.naturalWidth,nh:i.naturalHeight,complete:i.complete}));assert.match(d.alt,/千鳥格子/);assert.ok(d.complete&&d.nw===1536&&d.nh===1536);assert.ok((await page.locator('.pd-lang').getAttribute('href')).endsWith('/en/patterns/houndstooth/'));
            await page.waitForFunction(()=>document.querySelectorAll('a[href*="amazon.co.jp"]').length>=2);const amazon=await page.locator('a[href*="amazon.co.jp"]').evaluateAll(xs=>xs.map(a=>({href:a.href,rel:a.rel,text:a.textContent.trim()})));assert.ok(amazon.length>=2&&amazon.length<=4);for(const a of amazon){assert.match(a.href,/tag=nicheworks09-22/);assert.match(a.rel,/sponsored/);assert.ok(a.text)}

            await goto(base+'compare.html?a=chevron&b=herringbone');await page.waitForSelector('.pd-compare-guide');assert.ok((await page.locator('.pd-compare-panel img').evaluateAll(xs=>xs.map(i=>i.alt))).every(Boolean));const reg=await page.locator('.pd-table-wrap').evaluate(el=>({tab:el.tabIndex,role:el.getAttribute('role'),label:el.getAttribute('aria-label')}));assert.deepEqual(reg,{tab:0,role:'region',label:'比較表'});

            for(const width of [1440,768,390,320]){await page.setViewportSize({width,height:900});await goto(base);await cards();await noOverflow(`home-${width}`);if(width<=390){const b=await page.locator('#pattern-grid .pd-card').evaluateAll(xs=>xs.slice(0,3).map(x=>{const r=x.getBoundingClientRect();return{x:r.x,y:r.y}}));assert.ok(Math.abs(b[0].y-b[1].y)<2);assert.ok(b[2].y>b[0].y+5)}await goto(base+'compare.html?a=chevron&b=herringbone');await page.waitForSelector('.pd-compare-guide');await noOverflow(`compare-${width}`)}

            const urls=[base,base+'en/',base+'search.html?q='+encodeURIComponent('白黒のギザギザしたチェック'),base+'patterns/houndstooth/',base+'compare.html?a=chevron&b=herringbone'];const violations=[];
            for(const u of urls){await goto(u);if(u===base||u===base+'en/')await cards();if(u.includes('search.html'))await page.waitForFunction(()=>document.querySelector('#results')?.textContent.trim().length>0);if(u.includes('/patterns/'))await page.waitForSelector('.pd-detail-image');if(u.includes('compare.html'))await page.waitForSelector('.pd-compare-guide');await page.addScriptTag({path:axePath});const r=await page.evaluate(async()=>axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa']}}));for(const v of r.violations)violations.push({url:u,id:v.id,impact:v.impact,nodes:v.nodes.length})}
            console.log('AXE_VIOLATIONS',JSON.stringify(violations));assert.deepEqual(violations.filter(v=>v.impact==='serious'||v.impact==='critical'),[]);assert.deepEqual(errors,[]);
            console.log('OK: latest-main synced canonical v1 static, browser, responsive, affiliate, autocomplete, and WCAG QA passed.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node .pd-final-qa.cjs
      - name: Push synced head
        run: git push origin HEAD:audit/pattern-dictionary-v1-product-quality-20260917
