name: Reconcile entitlement production smoke temp

on:
  push:
    branches:
      - feat/reconcile-publication-20260912
    paths:
      - .github/workflows/reconcile-entitlement-smoke-temp.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reconcile-publication-20260912

      - name: Verify production entitlement fails closed
        shell: bash
        run: |
          set -euo pipefail
          url='https://nicheworks.app/api/billing/entitlement?productId=reconcile.pro_v1&sessionId=cs_test_ReconcileSmoke0000000001'
          status=$(curl -sS -o /tmp/entitlement.json -w '%{http_code}' "$url")
          echo "entitlement_http_status=$status"
          STATUS="$status" node <<'NODE'
          const fs = require('fs');
          const status = Number(process.env.STATUS);
          const data = JSON.parse(fs.readFileSync('/tmp/entitlement.json', 'utf8'));
          console.log(`entitlement_result ok=${Boolean(data?.ok)} active=${Boolean(data?.active)} state=${data?.state || ''} error=${data?.error || ''}`);
          if (status === 503 && data?.error === 'entitlement_storage_not_configured') {
            throw new Error('production entitlement storage is not configured');
          }
          if (status !== 200 || data?.ok !== true || data?.active !== false || data?.state !== 'restore-required') {
            throw new Error(`unexpected fake-session entitlement result: ${status} ${JSON.stringify(data)}`);
          }
          if (Array.isArray(data.features) && data.features.length !== 0) {
            throw new Error('fake session unexpectedly received features');
          }
          NODE

      - name: Verify malformed session rejected
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/invalid.json -w '%{http_code}' 'https://nicheworks.app/api/billing/entitlement?productId=reconcile.pro_v1&sessionId=forged-local-storage')
          echo "invalid_session_http_status=$status"
          STATUS="$status" node <<'NODE'
          const fs = require('fs');
          const status = Number(process.env.STATUS);
          const data = JSON.parse(fs.readFileSync('/tmp/invalid.json', 'utf8'));
          console.log(`invalid_session_result error=${data?.error || ''}`);
          if (status !== 400 || data?.error !== 'invalid_session_id') {
            throw new Error(`malformed session did not fail closed: ${status} ${JSON.stringify(data)}`);
          }
          NODE

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reconcile-entitlement-smoke-temp.yml
          git commit -m 'Remove temporary Reconcile entitlement smoke workflow'
          git push origin HEAD:feat/reconcile-publication-20260912
