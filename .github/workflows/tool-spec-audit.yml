name: Tool spec audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/tools-index.json'
      - 'tools/tool-spec-manifest.json'
      - 'tools/*/SPEC.md'
      - 'tools/*/index.html'
      - 'docs/tool-spec-standard.md'
      - 'docs/tools/**'
      - 'audits/tool-quality-matrix.json'
      - 'audits/tool-quality-matrix.md'
      - 'assets/nw-support.css'
      - 'scripts/check-common-support-contract.mjs'
      - 'scripts/check-tool-spec-contract.mjs'
      - 'scripts/check-tool-spec-coverage.mjs'
      - 'scripts/check-tool-quality-contract.mjs'
      - '.github/workflows/tool-spec-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/tools-index.json'
      - 'tools/tool-spec-manifest.json'
      - 'tools/*/SPEC.md'
      - 'tools/*/index.html'
      - 'docs/tool-spec-standard.md'
      - 'docs/tools/**'
      - 'audits/tool-quality-matrix.json'
      - 'audits/tool-quality-matrix.md'
      - 'assets/nw-support.css'
      - 'scripts/check-common-support-contract.mjs'
      - 'scripts/check-tool-spec-contract.mjs'
      - 'scripts/check-tool-spec-coverage.mjs'
      - 'scripts/check-tool-quality-contract.mjs'
      - '.github/workflows/tool-spec-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check per-tool specification contract
        run: node scripts/check-tool-spec-contract.mjs

      - name: Check canonical specification coverage
        run: node scripts/check-tool-spec-coverage.mjs

      - name: Check quality matrix contract
        run: node scripts/check-tool-quality-contract.mjs

      - name: Check registered-tool support contract
        run: node scripts/check-common-support-contract.mjs

      - name: Confirm repository was not modified
        run: git diff --exit-code
