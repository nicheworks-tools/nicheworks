name: Tool spec audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/tools-index.json'
      - 'tools/tool-spec-manifest.json'
      - 'tools/*/SPEC.md'
      - 'docs/tool-spec-standard.md'
      - 'docs/tools/ats-paste-doctor.md'
      - 'docs/tools/message-generator.md'
      - 'docs/tools/old-document-kanji-highlighter.md'
      - 'docs/tools/old-kanji-ocr-scanner.md'
      - 'docs/tools/place-old-kanji-checker.md'
      - 'docs/tools/unicode-kanji-checker.md'
      - 'docs/tools/url-title-collector.md'
      - 'docs/tools/variant-kanji-compare.md'
      - 'audits/tool-quality-matrix.json'
      - 'audits/tool-quality-matrix.md'
      - 'tools/ats-paste-doctor/index.html'
      - 'tools/message-generator/index.html'
      - 'tools/old-document-kanji-highlighter/index.html'
      - 'tools/old-kanji-ocr-scanner/index.html'
      - 'tools/place-old-kanji-checker/index.html'
      - 'tools/unicode-kanji-checker/index.html'
      - 'tools/url-title-collector/index.html'
      - 'tools/url-title-collector/en/index.html'
      - 'tools/variant-kanji-compare/index.html'
      - 'assets/nw-support.css'
      - 'scripts/check-common-support-contract.mjs'
      - 'scripts/check-tool-spec-contract.mjs'
      - '.github/workflows/tool-spec-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/tools-index.json'
      - 'tools/tool-spec-manifest.json'
      - 'tools/*/SPEC.md'
      - 'docs/tool-spec-standard.md'
      - 'docs/tools/ats-paste-doctor.md'
      - 'docs/tools/message-generator.md'
      - 'docs/tools/old-document-kanji-highlighter.md'
      - 'docs/tools/old-kanji-ocr-scanner.md'
      - 'docs/tools/place-old-kanji-checker.md'
      - 'docs/tools/unicode-kanji-checker.md'
      - 'docs/tools/url-title-collector.md'
      - 'docs/tools/variant-kanji-compare.md'
      - 'audits/tool-quality-matrix.json'
      - 'audits/tool-quality-matrix.md'
      - 'tools/ats-paste-doctor/index.html'
      - 'tools/message-generator/index.html'
      - 'tools/old-document-kanji-highlighter/index.html'
      - 'tools/old-kanji-ocr-scanner/index.html'
      - 'tools/place-old-kanji-checker/index.html'
      - 'tools/unicode-kanji-checker/index.html'
      - 'tools/url-title-collector/index.html'
      - 'tools/url-title-collector/en/index.html'
      - 'tools/variant-kanji-compare/index.html'
      - 'assets/nw-support.css'
      - 'scripts/check-common-support-contract.mjs'
      - 'scripts/check-tool-spec-contract.mjs'
      - '.github/workflows/tool-spec-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check per-tool specification contract
        run: node scripts/check-tool-spec-contract.mjs

      - name: Check repaired common support contract
        run: node scripts/check-common-support-contract.mjs

      - name: Confirm repository was not modified
        run: git diff --exit-code
