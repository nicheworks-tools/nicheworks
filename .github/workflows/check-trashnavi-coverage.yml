name: Check TrashNavi coverage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/trashnavi/**'
      - 'scripts/check-trashnavi-direct-links.mjs'
      - 'sitemap.xml'
      - 'sitemap-trashnavi.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - '.github/workflows/check-trashnavi-coverage.yml'
      - '.github/workflows/check-trashnavi-direct-links.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Report coverage baseline
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs | tee /tmp/trashnavi-coverage.txt
          {
            echo '## TrashNavi coverage audit'
            echo '```text'
            cat /tmp/trashnavi-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage data quality
        run: node tools/trashnavi/scripts/audit-coverage.mjs --strict

      - name: Check direct-link dataset inventory
        run: node scripts/check-trashnavi-direct-links.mjs --inventory

      - name: Check generated municipality pages
        run: node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
