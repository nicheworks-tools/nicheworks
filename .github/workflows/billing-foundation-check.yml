name: Billing foundation check

on:
  pull_request:
    paths:
      - 'functions/api/billing/**'
      - 'assets/nw-pro-entitlement.js'
      - 'assets/old-kanji-pro-sales.*'
      - 'assets/okj-history-collection.js'
      - 'assets/okj-workspace-*.js'
      - 'assets/okj-name-place-batch*'
      - 'assets/okj-multi-*'
      - 'assets/okj-batch-hub*'
      - 'scripts/check-old-kanji-batch-hub.mjs'
      - 'scripts/check-old-kanji-multitool-batch.mjs'
      - 'scripts/check-old-kanji-name-place-batch.mjs'
      - 'assets/okj-workspace.css'
      - 'scripts/check-old-kanji-workspaces.mjs'
      - 'assets/okj-ocr-pro-*.js'
      - 'assets/okj-ocr-crop-*.js'
      - 'assets/okj-ocr-crop.css'
      - 'scripts/check-old-kanji-crop.mjs'
      - 'assets/okj-report-*.js'
      - 'assets/okj-report-export.css'
      - 'assets/okj-export-engine.js'
      - 'scripts/check-old-kanji-reports-export.mjs'
      - 'assets/okj-ocr-pro-phase1.css'
      - 'tools/old-kanji-ocr-scanner/index.html'
      - 'scripts/check-old-kanji-pro-functional.mjs'
      - 'scripts/check-old-kanji-checkout-closed.mjs'
      - 'scripts/check-old-kanji-live-readiness.mjs'
      - 'billing/success.html'
      - 'billing/cancel.html'
      - 'config/billing/products.json'
      - 'config/old-kanji-toolkit-pro-phase1.json'
      - 'schema/billing_entitlements.sql'
      - 'scripts/check-old-kanji-pro-phase1.mjs'
      - 'tools/OLD_KANJI_CLUSTER.md'
      - 'tools/**/SPEC.md'
      - 'tools/reconcile/index.html'
      - 'tools/reconcile/refund.html'
      - 'tools/reconcile/SPEC.md'
      - 'scripts/check-billing-foundation.mjs'
      - '.github/workflows/billing-foundation-check.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/api/billing/**'
      - 'assets/nw-pro-entitlement.js'
      - 'assets/old-kanji-pro-sales.*'
      - 'assets/okj-history-collection.js'
      - 'assets/okj-workspace-*.js'
      - 'assets/okj-name-place-batch*'
      - 'assets/okj-multi-*'
      - 'assets/okj-batch-hub*'
      - 'scripts/check-old-kanji-batch-hub.mjs'
      - 'scripts/check-old-kanji-multitool-batch.mjs'
      - 'scripts/check-old-kanji-name-place-batch.mjs'
      - 'assets/okj-workspace.css'
      - 'scripts/check-old-kanji-workspaces.mjs'
      - 'assets/okj-ocr-pro-*.js'
      - 'assets/okj-ocr-crop-*.js'
      - 'assets/okj-ocr-crop.css'
      - 'scripts/check-old-kanji-crop.mjs'
      - 'assets/okj-report-*.js'
      - 'assets/okj-report-export.css'
      - 'assets/okj-export-engine.js'
      - 'scripts/check-old-kanji-reports-export.mjs'
      - 'assets/okj-ocr-pro-phase1.css'
      - 'tools/old-kanji-ocr-scanner/index.html'
      - 'scripts/check-old-kanji-pro-functional.mjs'
      - 'billing/success.html'
      - 'billing/cancel.html'
      - 'config/billing/products.json'
      - 'config/old-kanji-toolkit-pro-phase1.json'
      - 'schema/billing_entitlements.sql'
      - 'scripts/check-old-kanji-pro-phase1.mjs'
      - 'tools/OLD_KANJI_CLUSTER.md'
      - 'tools/**/SPEC.md'
      - 'tools/reconcile/index.html'
      - 'tools/reconcile/refund.html'
      - 'tools/reconcile/SPEC.md'
      - 'scripts/check-billing-foundation.mjs'
      - '.github/workflows/billing-foundation-check.yml'
  workflow_dispatch:

jobs:
  check-billing-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check billing modules
        run: |
          node --check functions/api/billing/product-config.js
          node --check functions/api/billing/old-kanji-launch-guard.js
          node --check functions/api/billing/product-availability.js
          node --check functions/api/billing/create-checkout-session.js
          node --check functions/api/billing/entitlement-store.js
          node --check functions/api/billing/entitlement.js
          node --check functions/api/billing/stripe-webhook.js
          node --check assets/nw-pro-entitlement.js
          node --check assets/old-kanji-pro-sales.js
          node --check assets/okj-ocr-pro-engine.js
          node --check assets/okj-ocr-pro-ui.js
          node --check assets/okj-ocr-crop-engine.js
          node --check assets/okj-ocr-crop-ui.js
          node --check assets/okj-report-engine.js
          node --check assets/okj-export-engine.js
          node --check assets/okj-report-export-ui.js
          node --check assets/okj-history-collection.js
          node --check assets/okj-workspace-store.js
          node --check assets/okj-workspace-ui.js
          node --check assets/okj-name-place-batch.js
          node --check assets/okj-name-place-batch-ui.js
          node --check assets/okj-multi-core.js
          node --check assets/okj-multi-batch.js
          node --check assets/okj-multi-batch-ui.js
          node --check assets/okj-batch-hub.js
          node --check assets/okj-batch-hub-ui.js
      - name: Check billing contract
        run: node scripts/check-billing-foundation.mjs
      - name: Test fail-closed unpriced and unknown products
        run: node scripts/check-old-kanji-checkout-closed.mjs
      - name: Test live launch and pricing guard
        run: node scripts/check-old-kanji-live-readiness.mjs
      - name: Check Old Kanji product contract
        run: node scripts/check-old-kanji-pro-phase1.mjs
      - name: Test real local OCR Batch and History Pro gate
        run: node scripts/check-old-kanji-pro-functional.mjs
      - name: Test actual selected region OCR and Pro authorization
        run: node scripts/check-old-kanji-crop.mjs
      - name: Test cross-tool Pro workspaces with entitlement-specific gates
        run: node scripts/check-old-kanji-workspaces.mjs
      - name: Test actual reference-backed Name and Place CSV batch
        run: node scripts/check-old-kanji-name-place-batch.mjs
      - name: Verify shared Batch hub across all seven feature paths
        run: node scripts/check-old-kanji-batch-hub.mjs
      - name: Test all four real local reference-backed batch processors
        run: node scripts/check-old-kanji-multitool-batch.mjs
      - name: Test actual OCR reports, advanced exports and CSV formula safety
        run: node scripts/check-old-kanji-reports-export.mjs
