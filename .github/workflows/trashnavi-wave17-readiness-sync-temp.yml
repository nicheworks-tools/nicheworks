name: TrashNavi Wave 17 readiness sync temp

on:
  push:
    branches:
      - feat/trashnavi-saga-readiness-wave17-20260914

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-saga-readiness-wave17-20260914
          fetch-depth: 0
      - name: Merge latest main and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/trashnavi-wave17-readiness-sync-temp.yml
          git commit -m 'Remove temporary Wave 17 readiness sync workflow'
          git push origin HEAD:feat/trashnavi-saga-readiness-wave17-20260914
