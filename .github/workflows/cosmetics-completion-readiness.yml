name: Cosmetics completion readiness

on:
  pull_request:
    paths:
      - 'tools/inci-fastscan/data/ingredients*.json'
      - 'tools/_shared/check-cosmetics-completion-readiness.mjs'
      - 'tools/cosmetic-ingredient-checker-lite/**'
      - 'tools/inci-fastscan/**'
      - '.github/workflows/cosmetics-completion-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inventory cosmetics completion debt
        run: node tools/_shared/check-cosmetics-completion-readiness.mjs
