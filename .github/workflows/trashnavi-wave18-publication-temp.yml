name: TrashNavi Wave 18 publication temp

on:
  push:
    branches:
      - feat/trashnavi-tottori-publication-wave18-20260914

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-tottori-publication-wave18-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Wave 18 publication delta
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # Manifest: preserve compact one-entry-per-line style.
          p = Path('tools/trashnavi/municipality-page-manifest.json')
          rows = json.loads(p.read_text())
          if any(str(r.get('lgcode')) == '312011' for r in rows):
              raise SystemExit('Tottori already present in manifest')
          rows.append({'lgcode':'312011','pref_slug':'tottori','city_slug':'tottori','publish':True})
          p.write_text('[\n' + ',\n'.join('  ' + json.dumps(r, ensure_ascii=False, separators=(',', ':')) for r in rows) + '\n]\n')

          # Generator publication-count guard.
          p = Path('tools/trashnavi/scripts/generate-municipality-pages.mjs')
          text = p.read_text()
          old = "if(outputs.length!==24) throw new Error(`municipality page count must be 24; got ${outputs.length}`);"
          new = "if(outputs.length!==25) throw new Error(`municipality page count must be 25; got ${outputs.length}`);"
          if old not in text:
              raise SystemExit('generator 24-page guard not found')
          p.write_text(text.replace(old, new, 1))

          # Affiliate checker publication-count guard.
          p = Path('tools/trashnavi/scripts/check-affiliate-contract.mjs')
          text = p.read_text()
          old = "check(manifest.length === 24, `expected 24 published municipality pages, got ${manifest.length}`);"
          new = "check(manifest.length === 25, `expected 25 published municipality pages, got ${manifest.length}`);"
          if old not in text:
              raise SystemExit('affiliate 24-page guard not found')
          p.write_text(text.replace(old, new, 1))

          # Root TrashNavi municipality links.
          p = Path('tools/trashnavi/index.html')
          text = p.read_text()
          saga = '<a href="/tools/trashnavi/saga/saga/">佐賀市</a>'
          tottori = '<a href="/tools/trashnavi/tottori/tottori/">鳥取市</a>'
          if text.count(saga) != 1 or tottori in text:
              raise SystemExit('root municipality-link anchor state unexpected')
          p.write_text(text.replace(saga, saga + tottori, 1))

          # AI reference: keep compact entry style and synchronize count/list.
          p = Path('tools/trashnavi/ai-reference.json')
          text = p.read_text()
          if '"published_municipality_count": 24' not in text:
              raise SystemExit('AI reference count 24 not found')
          text = text.replace('"published_municipality_count": 24', '"published_municipality_count": 25', 1)
          saga_row = '    {"lgcode":"412015","pref_slug":"saga","city_slug":"saga","url":"https://nicheworks.app/tools/trashnavi/saga/saga/"}'
          tottori_row = '    {"lgcode":"312011","pref_slug":"tottori","city_slug":"tottori","url":"https://nicheworks.app/tools/trashnavi/tottori/tottori/"}'
          if text.count(saga_row) != 1 or tottori_row in text:
              raise SystemExit('AI reference Saga/Tottori state unexpected')
          text = text.replace(saga_row, saga_row + ',\n' + tottori_row, 1)
          p.write_text(text)

          # SPEC Wave 18 narrative, baseline, acceptance, and evidence.
          p = Path('tools/trashnavi/SPEC.md')
          text = p.read_text()
          saga_line = '- 佐賀県 佐賀市 — `/tools/trashnavi/saga/saga/`'
          wave18_narrative = '''\n\nWave 18では、供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から鳥取市を選定した。鳥取市公式のごみ分別導線を現行ページへ更新し、令和8年度収集曜日一覧と大型ごみ案内を追加して、preferred candidateへ引き上げた。data enrichment検証後、公開対象を **25自治体** とする。\n\n- 鳥取県 鳥取市 — `/tools/trashnavi/tottori/tottori/`'''
          if text.count(saga_line) != 1 or 'Wave 18では' in text:
              raise SystemExit('SPEC Wave 18 narrative insertion state unexpected')
          text = text.replace(saga_line, saga_line + wave18_narrative, 1)

          baseline_anchor = '### Direct-link health monitoring — Phase 4'
          wave18_baseline = '''### Wave 18 verified coverage baseline\n\n2026-09-14のWave 18 CI基準値は次のとおり。\n\n- municipalities: 1,916\n- records: 2,214 / 2,214 valid HTTP(S)\n- municipalities with any waste-specific direct link: 78\n- publish candidates (2+ types): 25\n- preferred candidates (3+ types): 25\n- collection calendar coverage: 25 municipalities\n- bulky-waste coverage: 24 municipalities\n- drop-off facility coverage: 1 municipality\n- waste-app coverage: 1 municipality\n- direct-link inventory: 21 datasets / 146 records / 127 unique URLs / 0 invalid URLs\n- invalid records: 0\n- unknown type labels: 0\n\n'''
          if text.count(baseline_anchor) != 1 or '### Wave 18 verified coverage baseline' in text:
              raise SystemExit('SPEC Wave 18 baseline insertion state unexpected')
          text = text.replace(baseline_anchor, wave18_baseline + baseline_anchor, 1)

          replacements = [
            ('- [x] 公開24自治体をmanifest allowlistで管理する。', '- [x] 公開25自治体をmanifest allowlistで管理する。'),
            ('- [x] generator `--check` で24ページの生成driftを検出する。', '- [x] generator `--check` で25ページの生成driftを検出する。'),
            ('- [x] Wave 17で佐賀市をpreferred candidateへ引き上げ、自治体pageを公開する。', '- [x] Wave 17で佐賀市をpreferred candidateへ引き上げ、自治体pageを公開する。\n- [x] Wave 18で鳥取市をpreferred candidateへ引き上げ、自治体pageを公開する。'),
            ('- `tools/trashnavi/data/direct-waste-links-supply-wave17.json` — 佐賀市のWave 17 collection-calendar / bulky-waste enrichment。', '- `tools/trashnavi/data/direct-waste-links-supply-wave17.json` — 佐賀市のWave 17 collection-calendar / bulky-waste enrichment。\n- `tools/trashnavi/data/direct-waste-links-supply-wave18.json` — 鳥取市のWave 18 collection-calendar / bulky-waste enrichment。'),
            ('- `tools/trashnavi/saga/saga/index.html` — Wave 17 municipality page。', '- `tools/trashnavi/saga/saga/index.html` — Wave 17 municipality page。\n- `tools/trashnavi/tottori/tottori/index.html` — Wave 18 municipality page。'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'SPEC expected exactly one anchor: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Generate municipality pages and dedicated sitemap
        run: node tools/trashnavi/scripts/generate-municipality-pages.mjs
      - name: Add Tottori to root sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          text=p.read_text()
          url='https://nicheworks.app/tools/trashnavi/tottori/tottori/'
          if url in text:
              raise SystemExit('Tottori already present in root sitemap')
          entry=f'  <url>\n    <loc>{url}</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>\n'
          if '</urlset>' not in text:
              raise SystemExit('root sitemap closing tag missing')
          p.write_text(text.replace('</urlset>', entry + '</urlset>', 1))
          PY
      - name: Verify generated Tottori and machine-readable contracts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='tools/trashnavi/tottori/tottori/index.html';
          const page=fs.readFileSync(path,'utf8');
          const count=(page.match(/class="official-link-card"/g)||[]).length;
          const required=[
            'https://nicheworks.app/tools/trashnavi/tottori/tottori/',
            'https://www.city.tottori.lg.jp/page/4083.html',
            'https://www.city.tottori.lg.jp/page/31552.html',
            'https://www.city.tottori.lg.jp/page/4042.html',
            '2026年の収集カレンダー',
            '[PR]'
          ];
          const legacy='https://www.city.tottori.lg.jp/www/genre/1000000000000/1000000000001/1000000000011/';
          if(count!==3) throw new Error(`Tottori official-link-card count=${count}`);
          for(const s of required) if(!page.includes(s)) throw new Error(`Tottori page missing: ${s}`);
          if(page.includes(legacy)) throw new Error('Tottori page contains legacy sorting URL');
          if((page.match(/<link rel="canonical" href="https:\/\/nicheworks\.app\/tools\/trashnavi\/tottori\/tottori\/">/g)||[]).length!==1) throw new Error('Tottori canonical mismatch');

          const ai=JSON.parse(fs.readFileSync('tools/trashnavi/ai-reference.json','utf8'));
          if(ai.published_municipality_count!==25 || ai.municipalities.length!==25) throw new Error(`AI reference count/list mismatch: ${ai.published_municipality_count}/${ai.municipalities.length}`);
          const hits=ai.municipalities.filter(x=>String(x.lgcode)==='312011');
          if(hits.length!==1 || hits[0].url!=='https://nicheworks.app/tools/trashnavi/tottori/tottori/') throw new Error('AI reference Tottori entry mismatch');

          const root=fs.readFileSync('sitemap.xml','utf8');
          const dedicated=fs.readFileSync('sitemap-trashnavi.xml','utf8');
          const url='https://nicheworks.app/tools/trashnavi/tottori/tottori/';
          if(root.split(url).length-1!==1) throw new Error('root sitemap Tottori URL cardinality mismatch');
          if(dedicated.split(url).length-1!==1) throw new Error('TrashNavi sitemap Tottori URL cardinality mismatch');
          console.log(JSON.stringify({official_cards:count,ai_count:ai.published_municipality_count,ai_list:ai.municipalities.length,tottori_ai_entries:hits.length},null,2));
          NODE
      - name: Required TrashNavi audits
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit publication output and remove temporary workflow
        run: |
          rm .github/workflows/trashnavi-wave18-publication-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish Tottori as 25th TrashNavi municipality page'
          git push origin HEAD:feat/trashnavi-tottori-publication-wave18-20260914
