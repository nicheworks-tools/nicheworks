name: Temporary Phone QuickCheck quality sync

on:
  push:
    branches:
      - docs/phone-quickcheck-usage-quality-sync-20260914
    paths:
      - '.github/workflows/tmp-phone-quickcheck-quality-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phone-quickcheck-usage-quality-sync-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync Phone QuickCheck usage and quality evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const indexPath = 'tools/phone-quickcheck/index.html';
          let index = fs.readFileSync(indexPath, 'utf8');
          const oldLinks = `      <div class="nw-other-links">\n        <a href="/tools/manual-finder/">ManualFinder</a>`;
          const newLinks = `      <div class="nw-other-links">\n        <a href="./usage.html" data-i18n="ja">使い方・FAQ</a>\n        <a href="./usage.html" data-i18n="en" hidden>Usage & FAQ</a>\n        <a href="/tools/manual-finder/">ManualFinder</a>`;
          if (!index.includes(oldLinks)) throw new Error('Phone QuickCheck related-link insertion point missing');
          index = index.replace(oldLinks, newLinks);
          fs.writeFileSync(indexPath, index);

          const docsPath = 'docs/tools/phone-quickcheck.md';
          let docs = fs.readFileSync(docsPath, 'utf8');
          docs = docs.replace('- **Usage documentation:** `recommended-and-missing`. Missing recommended usage documentation is an improvement opportunity, not a hard compliance failure.', '- **Usage documentation:** `recommended-and-present` at `tools/phone-quickcheck/usage.html`.');
          docs = docs.replace('- **FAQ:** `optional-absent` for the current Quick Check baseline.', '- **FAQ:** `optional-present` inside the bilingual usage page.');
          docs = docs.replace('- **Language handling:** the main tool UI provides JP/EN on one page; no standalone usage pages are currently maintained.', '- **Language handling:** the main tool UI and `usage.html` both provide JP/EN on one page and share the `nw_lang` preference.');
          if (!docs.includes('tools/phone-quickcheck/usage.html')) throw new Error('canonical usage evidence missing');
          if (!docs.includes('- `tools/phone-quickcheck/usage.html`')) {
            docs = docs.replace('- `tools/phone-quickcheck/index.html`', '- `tools/phone-quickcheck/index.html`\n- `tools/phone-quickcheck/usage.html`');
          }
          fs.writeFileSync(docsPath, docs);

          const specPath = 'tools/phone-quickcheck/SPEC.md';
          let spec = fs.readFileSync(specPath, 'utf8');
          if (!spec.includes('- [x] A bilingual usage/FAQ guide is available from the main Phone QuickCheck page.')) {
            spec = spec.replace('- [x] Phone search/filter behavior requires no application backend or user account.', '- [x] Phone search/filter behavior requires no application backend or user account.\n- [x] A bilingual usage/FAQ guide is available from the main Phone QuickCheck page.');
          }
          if (!spec.includes('- `tools/phone-quickcheck/usage.html`')) {
            spec = spec.replace('- `tools/phone-quickcheck/style.css`', '- `tools/phone-quickcheck/style.css`\n- `tools/phone-quickcheck/usage.html`');
          }
          if (!spec.includes('- usage / quality evidence sync: current PR')) {
            spec = spec.replace('- public promotion: PR #689', '- public promotion: PR #689\n- verified dataset expansion to 150 models: PR #749\n- behavior regression coverage: PR #741\n- usage / quality evidence sync: current PR');
          }
          fs.writeFileSync(specPath, spec);

          const matrixPath = 'audits/tool-quality-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          const tools = Array.isArray(matrix) ? matrix : matrix.tools;
          if (!Array.isArray(tools)) throw new Error('tool-quality-matrix tools array missing');
          const item = tools.find((row) => row.slug === 'phone-quickcheck');
          if (!item) throw new Error('phone-quickcheck quality record missing');

          item.usage_status = 'recommended-and-present';
          item.faq_status = 'optional-present';
          item.functional_test_status = 'behavior-test-present';
          item.automated_tests = [
            'scripts/check-tool-runtime-contracts.mjs',
            'scripts/check-phone-quickcheck-data.mjs',
            'scripts/check-phone-quickcheck-affiliate.mjs',
            'tools/phone-quickcheck/tests/behavior.test.mjs'
          ];
          item.outstanding_issues = [];
          item.evidence = Array.from(new Set([...(item.evidence || []),
            'tools/phone-quickcheck/usage.html',
            'tools/phone-quickcheck/affiliate-config.js',
            'tools/phone-quickcheck/affiliate-runtime.js',
            'tools/phone-quickcheck/tests/behavior.test.mjs'
          ]));
          item.usage_html_present = true;
          item.usage_en_html_present = false;
          item.help_documentation = {
            main_page_summary: 'required-and-present',
            usage: 'recommended-and-present',
            faq: 'optional-present',
            usage_evidence: ['tools/phone-quickcheck/usage.html'],
            usage_language_coverage: { ja: true, en: true }
          };
          item.test_evidence = [
            { path: 'scripts/check-tool-runtime-contracts.mjs', classification: 'regression/contract test' },
            { path: 'scripts/check-phone-quickcheck-data.mjs', classification: 'data validation' },
            { path: 'scripts/check-phone-quickcheck-affiliate.mjs', classification: 'affiliate contract test' },
            { path: 'tools/phone-quickcheck/tests/behavior.test.mjs', classification: 'behavior test' }
          ];
          item.recommendation_only_gaps = [];
          item.decision_gaps = [];
          item.hard_compliance_gaps = [];
          item.network_dependency = item.network_dependency || { status: 'present', external_hosts: [] };
          item.network_dependency.status = 'present';
          item.network_dependency.external_hosts = [
            'www.apple.com','support.apple.com','store.google.com','support.google.com',
            'www.samsung.com','www.sony.jp','jp.sharp','www.oppo.com','support.oppo.com',
            'www.mi.com','jp-jp.support.motorola.com','en-us.support.motorola.com',
            'www.amazon.co.jp','ofuse.me','ko-fi.com'
          ];

          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/check-phone-quickcheck-data.mjs
          node scripts/check-phone-quickcheck-affiliate.mjs
          node tools/phone-quickcheck/tests/behavior.test.mjs
          node scripts/check-tool-runtime-contracts.mjs

          rm .github/workflows/tmp-phone-quickcheck-quality-sync.yml
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add -A
          git commit -m "Add Phone QuickCheck usage guide and sync quality evidence"
          git push origin HEAD:docs/phone-quickcheck-usage-quality-sync-20260914
