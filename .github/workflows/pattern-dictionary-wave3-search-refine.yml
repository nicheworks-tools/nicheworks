name: Pattern Dictionary Wave 3 search refinement

on:
  push:
    branches:
      - feat/pattern-dictionary-wave3-production-staging-20260916
    paths:
      - .github/workflows/pattern-dictionary-wave3-search-refine.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave3-production-staging-20260916
          fetch-depth: 0
      - name: Apply search refinements
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='tools/pattern-dictionary';
          const dictPath=`${root}/data/wave3-search-dictionary.json`;
          const extraPath=`${root}/data/wave3-search-disambiguation.json`;
          const dict=JSON.parse(fs.readFileSync(dictPath,'utf8'));
          const extra=JSON.parse(fs.readFileSync(extraPath,'utf8'));
          dict.ja={...(dict.ja||{}),...(extra.ja||{})};
          dict.en={...(dict.en||{}),...(extra.en||{})};
          fs.writeFileSync(dictPath,JSON.stringify(dict,null,2)+'\n');

          const appPath=`${root}/app.js`;
          let app=fs.readFileSync(appPath,'utf8');
          const oldApp="function confidence(r){if(!r.length||r[0].score<MATCH_THRESHOLD)return'LOW';const d=r[0].score-(r[1]?.score||0);if(r[0].score>=70&&d>=20)return'HIGH';if(r[0].score>=35)return'MEDIUM';return'LOW'}";
          const newApp="function confidence(r,q='',lang='en'){if(!r.length||r[0].score<MATCH_THRESHOLD)return'LOW';const nq=norm(q),p=r[0].pattern,other=lang==='ja'?'en':'ja',exact=[p.names?.[lang],p.names?.[other],...(p.aliases?.[lang]||[]),...(p.aliases?.[other]||[])].some(v=>norm(v)===nq),d=r[0].score-(r[1]?.score||0);if(queryTokens(nq).length===1&&!exact&&r[0].score>=35)return'MEDIUM';if(r[0].score>=70&&d>=20)return'HIGH';if(r[0].score>=35)return'MEDIUM';return'LOW'}";
          if(!app.includes(oldApp))throw new Error('app confidence contract not found');
          app=app.replace(oldApp,newApp).replace('const c=confidence(vis),top=vis[0],p=top.pattern;','const c=confidence(vis,q,lang),top=vis[0],p=top.pattern;');
          fs.writeFileSync(appPath,app);

          const testPath=`${root}/tests/search-test.mjs`;
          let test=fs.readFileSync(testPath,'utf8');
          const oldTest="function confidence(r){if(!r.length||r[0].score<MATCH_THRESHOLD)return'LOW';const d=r[0].score-(r[1]?.score||0);if(r[0].score>=70&&d>=20)return'HIGH';if(r[0].score>=35)return'MEDIUM';return'LOW'}";
          const newTest="function confidence(r,q='',lang='en'){if(!r.length||r[0].score<MATCH_THRESHOLD)return'LOW';const nq=norm(q),p=r[0].pattern,other=lang==='ja'?'en':'ja',exact=[p.names?.[lang],p.names?.[other],...(p.aliases?.[lang]||[]),...(p.aliases?.[other]||[])].some(v=>norm(v)===nq),d=r[0].score-(r[1]?.score||0);if(tokens(nq).length===1&&!exact&&r[0].score>=35)return'MEDIUM';if(r[0].score>=70&&d>=20)return'HIGH';if(r[0].score>=35)return'MEDIUM';return'LOW'}";
          if(!test.includes(oldTest))throw new Error('search-test confidence contract not found');
          test=test.replace(oldTest,newTest).replace('conf=confidence(vis);','conf=confidence(vis,c.query,c.lang);');
          fs.writeFileSync(testPath,test);
          NODE
      - name: Verify pre-publication staging remains locked
        run: |
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/scripts/check-wave3-staging.mjs
      - name: Commit search refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pattern-dictionary/data/wave3-search-dictionary.json tools/pattern-dictionary/app.js tools/pattern-dictionary/tests/search-test.mjs
          git commit -m "Pattern Dictionary: refine Wave 3 search disambiguation"
          git push origin HEAD:feat/pattern-dictionary-wave3-production-staging-20260916
