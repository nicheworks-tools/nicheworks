name: Apply Reconcile CSV reparse fix

on:
  push:
    branches:
      - fix/reconcile-csv-reparse-source-20260913
    paths:
      - '.github/workflows/reconcile-csv-reparse-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/reconcile-csv-reparse-source-20260913
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply fix
        run: node scripts/apply-reconcile-csv-reparse-fix.mjs

      - name: Verify syntax and Reconcile tests
        run: |
          node --check tools/reconcile/app.mjs
          for test in tools/reconcile/tests/*.test.mjs; do
            echo "==> $test"
            node "$test"
          done
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/reconcile/app.mjs tools/reconcile/tests/app-csv-reparse.test.mjs
          git commit -m "Fix Reconcile CSV reparse source retention"
          git push origin HEAD:fix/reconcile-csv-reparse-source-20260913
