name: TrashNavi Katsushika publication one-shot

on:
  push:
    branches:
      - feat/trashnavi-katsushika-publication-20260913
    paths:
      - 'tools/trashnavi/municipality-page-manifest.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-katsushika-publication-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch publication contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const genPath = 'tools/trashnavi/scripts/generate-municipality-pages.mjs';
          let gen = fs.readFileSync(genPath, 'utf8');
          const oldCount = 'if(outputs.length!==11) throw new Error(`municipality page count must be 11; got ${outputs.length}`);';
          const newCount = 'if(outputs.length!==12) throw new Error(`municipality page count must be 12; got ${outputs.length}`);';
          if (!gen.includes(newCount)) {
            if (!gen.includes(oldCount)) throw new Error('generator page-count contract not found');
            gen = gen.replace(oldCount, newCount);
          }
          fs.writeFileSync(genPath, gen);

          const indexPath = 'tools/trashnavi/index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          if (!html.includes('/tools/trashnavi/tokyo/katsushika/')) {
            const anchor = '<a href="/tools/trashnavi/tokyo/chuo/">中央区</a></div>';
            const replacement = '<a href="/tools/trashnavi/tokyo/chuo/">中央区</a><a href="/tools/trashnavi/tokyo/katsushika/">葛飾区</a></div>';
            if (!html.includes(anchor)) throw new Error('TrashNavi root municipality link anchor not found');
            html = html.replace(anchor, replacement);
          }
          fs.writeFileSync(indexPath, html);

          const rootSitemapPath = 'sitemap.xml';
          let rootSitemap = fs.readFileSync(rootSitemapPath, 'utf8');
          const katsushikaUrl = 'https://nicheworks.app/tools/trashnavi/tokyo/katsushika/';
          if (!rootSitemap.includes(`<loc>${katsushikaUrl}</loc>`)) {
            const entry = `  <url>\n    <loc>${katsushikaUrl}</loc>\n    <lastmod>2026-09-13</lastmod>\n  </url>\n`;
            if (!rootSitemap.includes('</urlset>')) throw new Error('root sitemap closing tag missing');
            rootSitemap = rootSitemap.replace('</urlset>', `${entry}</urlset>`);
          }
          fs.writeFileSync(rootSitemapPath, rootSitemap);

          const specPath = 'tools/trashnavi/SPEC.md';
          let spec = fs.readFileSync(specPath, 'utf8');
          spec = spec.replace(
            'Wave 5では、Search Consoleで葛飾区の粗大ごみ需要が確認されたため、葛飾区に2026年度収集カレンダーと粗大ごみ案内のofficial linkを追加し、既存のごみ分別導線と合わせてpreferred candidateへ引き上げる。公開page化はdata enrichment検証後の別PRで行う。',
            'Wave 5では、Search Consoleで葛飾区の粗大ごみ需要が確認されたため、葛飾区に2026年度収集カレンダーと粗大ごみ案内のofficial linkを追加し、既存のごみ分別導線と合わせてpreferred candidateへ引き上げた。data enrichment検証後、公開対象を **12自治体** とする。'
          );
          spec = spec.replace(
            '- 東京都 葛飾区 — preferred candidate（publication pending）',
            '- 東京都 葛飾区 — `/tools/trashnavi/tokyo/katsushika/`'
          );
          spec = spec.replace('- [x] 公開11自治体をmanifest allowlistで管理する。', '- [x] 公開12自治体をmanifest allowlistで管理する。');
          spec = spec.replace('- [x] generator `--check` で11ページの生成driftを検出する。', '- [x] generator `--check` で12ページの生成driftを検出する。');
          spec = spec.replace('- [x] Wave 5で葛飾区をpreferred candidateへ引き上げる。', '- [x] Wave 5で葛飾区をpreferred candidateへ引き上げ、自治体pageを公開する。');
          const chuoEvidence = '- `tools/trashnavi/tokyo/chuo/index.html` — Wave 4 municipality page。';
          const katsushikaEvidence = '- `tools/trashnavi/tokyo/katsushika/index.html` — Wave 5 municipality page。';
          if (!spec.includes(katsushikaEvidence)) {
            if (!spec.includes(chuoEvidence)) throw new Error('SPEC municipality page evidence anchor not found');
            spec = spec.replace(chuoEvidence, `${chuoEvidence}\n${katsushikaEvidence}`);
          }
          fs.writeFileSync(specPath, spec);
          NODE
      - name: Generate municipality pages and dedicated sitemap
        run: node tools/trashnavi/scripts/generate-municipality-pages.mjs
      - name: Validate publication state
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit generated publication
        shell: bash
        run: |
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add tools/trashnavi/scripts/generate-municipality-pages.mjs tools/trashnavi/index.html tools/trashnavi/SPEC.md tools/trashnavi/tokyo/katsushika/index.html sitemap.xml sitemap-trashnavi.xml
          git commit -m 'Publish Katsushika Ward TrashNavi municipality page'
          git push origin HEAD:feat/trashnavi-katsushika-publication-20260913
