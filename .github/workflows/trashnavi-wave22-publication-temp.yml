name: TrashNavi Wave 22 publication temp

on:
  push:
    branches:
      - feat/trashnavi-kochi-publication-wave22-20260914
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish Kochi municipality page
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const mustReplace=(text,from,to,label)=>{if(!text.includes(from))throw new Error(`missing anchor: ${label}`);return text.replace(from,to)};

          // Manifest 28 -> 29.
          const manifestPath='tools/trashnavi/municipality-page-manifest.json';
          let manifest=fs.readFileSync(manifestPath,'utf8');
          if(manifest.includes('"lgcode":"392014"')) throw new Error('Kochi already in manifest');
          manifest=mustReplace(manifest,
            '  {"lgcode":"422011","pref_slug":"nagasaki","city_slug":"nagasaki","publish":true}\n]',
            '  {"lgcode":"422011","pref_slug":"nagasaki","city_slug":"nagasaki","publish":true},\n  {"lgcode":"392014","pref_slug":"kochi","city_slug":"kochi","publish":true}\n]',
            'manifest Nagasaki tail');
          fs.writeFileSync(manifestPath,manifest);

          // Publication guards 28 -> 29.
          const genPath='tools/trashnavi/scripts/generate-municipality-pages.mjs';
          let gen=fs.readFileSync(genPath,'utf8');
          gen=mustReplace(gen,'if(outputs.length!==28) throw new Error(`municipality page count must be 28; got ${outputs.length}`);','if(outputs.length!==29) throw new Error(`municipality page count must be 29; got ${outputs.length}`);','generator page guard');
          fs.writeFileSync(genPath,gen);

          const affPath='tools/trashnavi/scripts/check-affiliate-contract.mjs';
          let aff=fs.readFileSync(affPath,'utf8');
          aff=mustReplace(aff,'check(manifest.length === 28, `expected 28 published municipality pages, got ${manifest.length}`);','check(manifest.length === 29, `expected 29 published municipality pages, got ${manifest.length}`);','affiliate page guard');
          fs.writeFileSync(affPath,aff);

          // TrashNavi root municipality link.
          const indexPath='tools/trashnavi/index.html';
          let index=fs.readFileSync(indexPath,'utf8');
          if(index.includes('/tools/trashnavi/kochi/kochi/')) throw new Error('Kochi already linked');
          index=mustReplace(index,
            '<a href="/tools/trashnavi/nagasaki/nagasaki/">長崎市</a></div>',
            '<a href="/tools/trashnavi/nagasaki/nagasaki/">長崎市</a><a href="/tools/trashnavi/kochi/kochi/">高知市</a></div>',
            'TrashNavi municipality link tail');
          fs.writeFileSync(indexPath,index);

          // AI reference 28 -> 29.
          const aiPath='tools/trashnavi/ai-reference.json';
          let ai=fs.readFileSync(aiPath,'utf8');
          if(ai.includes('"lgcode":"392014"')) throw new Error('Kochi already in AI reference');
          ai=mustReplace(ai,'"published_municipality_count": 28','"published_municipality_count": 29','AI count');
          ai=mustReplace(ai,
            '    {"lgcode":"422011","pref_slug":"nagasaki","city_slug":"nagasaki","url":"https://nicheworks.app/tools/trashnavi/nagasaki/nagasaki/"}\n  ]',
            '    {"lgcode":"422011","pref_slug":"nagasaki","city_slug":"nagasaki","url":"https://nicheworks.app/tools/trashnavi/nagasaki/nagasaki/"},\n    {"lgcode":"392014","pref_slug":"kochi","city_slug":"kochi","url":"https://nicheworks.app/tools/trashnavi/kochi/kochi/"}\n  ]',
            'AI Nagasaki tail');
          fs.writeFileSync(aiPath,ai);

          // SPEC Wave 22 narrative, baseline, acceptance and evidence.
          const specPath='tools/trashnavi/SPEC.md';
          let spec=fs.readFileSync(specPath,'utf8');
          if(spec.includes('Wave 22では、供給側拡張方針')) throw new Error('Wave 22 already documented');
          const narrative='Wave 22では、供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から高知市を選定した。高知市公式の家庭ごみ分別導線を現行ページへ更新し、ごみ収集日、ごみの収集日検索、家庭ごみの自己搬入案内を追加して、4種類のwaste-specific canonical typeを持つpreferred candidateへ引き上げた。data enrichment検証後、公開対象を **29自治体** とする。\n\n- 高知県 高知市 — `/tools/trashnavi/kochi/kochi/`\n\n';
          spec=mustReplace(spec,
            '- 長崎県 長崎市 — `/tools/trashnavi/nagasaki/nagasaki/`\n\n生成器は',
            '- 長崎県 長崎市 — `/tools/trashnavi/nagasaki/nagasaki/`\n\n'+narrative+'生成器は',
            'Wave 21 narrative tail');

          const baseline='### Wave 22 verified coverage baseline\n\n2026-09-14のWave 22 CI基準値は次のとおり。\n\n- municipalities: 1,916\n- records: 2,224 / 2,224 valid HTTP(S)\n- municipalities with any waste-specific direct link: 78\n- publish candidates (2+ types): 29\n- preferred candidates (3+ types): 29\n- collection calendar coverage: 29 municipalities\n- bulky-waste coverage: 27 municipalities\n- waste-search coverage: 2 municipalities\n- drop-off facility coverage: 2 municipalities\n- waste-app coverage: 1 municipality\n- direct-link inventory: 25 datasets / 156 records / 137 unique URLs / 0 invalid URLs\n- invalid records: 0\n- unknown type labels: 0\n\n';
          spec=mustReplace(spec,'### Direct-link health monitoring — Phase 4',baseline+'### Direct-link health monitoring — Phase 4','Wave 22 baseline insertion');
          spec=mustReplace(spec,'- [x] 公開28自治体をmanifest allowlistで管理する。','- [x] 公開29自治体をmanifest allowlistで管理する。','published count contract');
          spec=mustReplace(spec,'- [x] generator `--check` で28ページの生成driftを検出する。','- [x] generator `--check` で29ページの生成driftを検出する。','generator count contract');
          spec=mustReplace(spec,'- [x] Wave 21で長崎市をpreferred candidateへ引き上げ、自治体pageを公開する。','- [x] Wave 21で長崎市をpreferred candidateへ引き上げ、自治体pageを公開する。\n- [x] Wave 22で高知市をpreferred candidateへ引き上げ、自治体pageを公開する。','Wave 22 acceptance');
          spec=mustReplace(spec,'- `tools/trashnavi/data/direct-waste-links-supply-wave21.json` — 長崎市のWave 21 collection-calendar / bulky-waste enrichment。','- `tools/trashnavi/data/direct-waste-links-supply-wave21.json` — 長崎市のWave 21 collection-calendar / bulky-waste enrichment。\n- `tools/trashnavi/data/direct-waste-links-supply-wave22.json` — 高知市のWave 22 collection-calendar / waste-search / drop-off enrichment。','Wave 22 supply evidence');
          spec=mustReplace(spec,'- `tools/trashnavi/nagasaki/nagasaki/index.html` — Wave 21 municipality page。','- `tools/trashnavi/nagasaki/nagasaki/index.html` — Wave 21 municipality page。\n- `tools/trashnavi/kochi/kochi/index.html` — Wave 22 municipality page。','Wave 22 page evidence');
          fs.writeFileSync(specPath,spec);
          NODE

          # Generate Kochi and TrashNavi sitemap.
          node tools/trashnavi/scripts/generate-municipality-pages.mjs

          # Sync canonical root sitemap explicitly; generator checks it but does not write it.
          node <<'NODE'
          const fs=require('fs');
          const p='sitemap.xml';
          let s=fs.readFileSync(p,'utf8');
          const canonical='https://nicheworks.app/tools/trashnavi/kochi/kochi/';
          if(!s.includes(canonical)){
            const entry=`  <url>\n    <loc>${canonical}</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>\n`;
            if(!s.includes('</urlset>')) throw new Error('root sitemap closing tag missing');
            s=s.replace('</urlset>',entry+'</urlset>');
            fs.writeFileSync(p,s);
          }
          NODE

          # Explicit publication assertions.
          node <<'NODE'
          const fs=require('fs');
          const pagePath='tools/trashnavi/kochi/kochi/index.html';
          const page=fs.readFileSync(pagePath,'utf8');
          const canonical='https://nicheworks.app/tools/trashnavi/kochi/kochi/';
          const urls=[
            'https://www.city.kochi.kochi.jp/soshiki/64/gomitop.html',
            'https://www.city.kochi.kochi.jp/soshiki/64/collection-kochi2.html',
            'https://www.city.kochi.kochi.jp/garbage-day/search/search.php',
            'https://www.city.kochi.kochi.jp/soshiki/64/gomi1-motikomi01.html'
          ];
          const count=(s,n)=>s.split(n).length-1;
          if(count(page,'class="official-link-card"')!==4) throw new Error('Kochi page must have exactly 4 official cards');
          if(!page.includes(`<link rel="canonical" href="${canonical}">`)) throw new Error('Kochi canonical missing');
          for(const u of urls) if(!page.includes(u)) throw new Error(`Kochi official URL missing: ${u}`);
          if(page.includes('https://www.city.kochi.kochi.jp/soshiki/67/')) throw new Error('legacy Kochi department URL leaked into page');
          if(page.includes('class="current-calendar-callout"')) throw new Error('Kochi must not render annual 2026 calendar callout for ongoing collection-day page');
          if(!page.includes('[PR]')) throw new Error('Kochi affiliate disclosure missing');

          const ai=JSON.parse(fs.readFileSync('tools/trashnavi/ai-reference.json','utf8'));
          if(ai.published_municipality_count!==29) throw new Error('AI count must be 29');
          if(!Array.isArray(ai.municipalities)||ai.municipalities.length!==29) throw new Error('AI list length must be 29');
          const k=ai.municipalities.filter(x=>x.lgcode==='392014');
          if(k.length!==1) throw new Error(`AI Kochi entry count must be 1; got ${k.length}`);
          if(k[0].url!==canonical) throw new Error('AI Kochi canonical mismatch');
          for(const f of ['sitemap.xml','sitemap-trashnavi.xml']){
            const t=fs.readFileSync(f,'utf8');
            if(count(t,canonical)!==1) throw new Error(`${f}: Kochi canonical count must be 1`);
          }
          console.log(JSON.stringify({page_cards:4,annual_calendar_callout:false,ai_count:29,canonical},null,2));
          NODE

          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          git diff --check

          rm .github/workflows/trashnavi-wave22-publication-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-trashnavi.xml tools/trashnavi/SPEC.md tools/trashnavi/ai-reference.json tools/trashnavi/index.html tools/trashnavi/municipality-page-manifest.json tools/trashnavi/scripts/check-affiliate-contract.mjs tools/trashnavi/scripts/generate-municipality-pages.mjs tools/trashnavi/kochi/kochi/index.html .github/workflows/trashnavi-wave22-publication-temp.yml
          git diff --cached --check
          git commit -m "Publish Kochi as 29th TrashNavi municipality page"
          git push origin HEAD:feat/trashnavi-kochi-publication-wave22-20260914
