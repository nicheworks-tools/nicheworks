name: Construction Atlas Wave11 Three Verified Images
on:
  pull_request:
    paths:
      - '.github/workflows/construction-atlas-image-wave11-promotion.yml'
      - 'tools/construction-tools-atlas/scripts/promote-image-wave11-three-v2.3.cjs'
permissions:
  contents: write
jobs:
  promote-reviewed-wave11:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/atlas-image-wave11-three-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install raster optimizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y imagemagick
      - name: Verify Commons originals and pin SHA1 before promotion
        run: node tools/construction-tools-atlas/scripts/promote-image-wave11-three-v2.3.cjs
      - name: Commit reviewed image binary and generated SEO snapshots to PR
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            tools/construction-tools-atlas/images/cable_tie/ \
            tools/construction-tools-atlas/images/bucket/ \
            tools/construction-tools-atlas/images/chisel/ \
            tools/construction-tools-atlas/images/ATTRIBUTION.md \
            tools/construction-tools-atlas/data/image-wave11-sources-v2.3.json \
            tools/construction-tools-atlas/data/image-registry-v2.3.json \
            tools/construction-tools-atlas/data/image-lifecycle-v2.3.json \
            tools/construction-tools-atlas/data/image-inventory-v2.3.json \
            tools/construction-tools-atlas/data/public-image-inventory-v2.3.json \
            tools/construction-tools-atlas/data/affiliate-image-acquisition-wave6-v2.3.json \
            tools/construction-tools-atlas/data/affiliate-image-acquisition-queue-v2.3.json \
            tools/construction-tools-atlas/data/seo-detail-pages-v2.3.json \
            tools/construction-tools-atlas/detail-image-hotfix.js \
            tools/construction-tools-atlas/entries/ tools/construction-tools-atlas/sitemap.xml sitemap.xml
          git diff --cached --stat
          if git diff --cached --quiet; then echo 'No verified Wave11 images staged'; exit 1; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'feat(atlas): promote three licensed photos and 48-page SEO cohort'
          git push origin HEAD:feat/atlas-image-wave11-three-20261105
