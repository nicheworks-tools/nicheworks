name: Validate Construction Tools Atlas Data

on:
  push:
  pull_request:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run data validation
        run: node tools/construction-tools-atlas/scripts/validate-data.mjs

  pattern-dictionary-affiliate-runtime:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/pattern-dictionary-production-20-20260914' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-production-20-20260914
          fetch-depth: 2
      - name: Wire affiliate configuration into runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/pattern-dictionary/app.js')
          s=p.read_text()
          old="const COMPARE=ROOT+'data/compare-guides.json';\nlet patternsPromise,dictPromise,comparePromise;"
          new="const COMPARE=ROOT+'data/compare-guides.json';\nconst AFFILIATE=ROOT+'data/affiliate-config.json';\nlet patternsPromise,dictPromise,comparePromise,affiliatePromise;"
          if old not in s: raise SystemExit('compare constants anchor not found')
          s=s.replace(old,new,1)
          old="async function compareGuides(){return comparePromise||(comparePromise=fetch(COMPARE).then(r=>r.json()).then(x=>x.guides||[]))}"
          new="""async function compareGuides(){return comparePromise||(comparePromise=fetch(COMPARE).then(r=>r.json()).then(x=>x.guides||[]))}
          async function affiliateConfig(){return affiliatePromise||(affiliatePromise=fetch(AFFILIATE).then(r=>r.json()))}
          function affiliateActive(cfg){return cfg?.enabled===true&&/^[A-Za-z0-9_-]+-\\d{2}$/.test(cfg.tracking_id||'')}
          function amazonSearchUrl(query,cfg){return `https://www.amazon.co.jp/s?k=${encodeURIComponent(query)}&tag=${encodeURIComponent(cfg.tracking_id)}`}
          async function mountAffiliateDisclosure(lang){const cfg=await affiliateConfig();if(!affiliateActive(cfg))return;const shell=$('.pd-footer .pd-shell');if(!shell||shell.querySelector('.pd-affiliate-disclosure'))return;const p=document.createElement('p');p.className='pd-affiliate-disclosure';p.textContent=cfg.disclosure?.[lang]||cfg.disclosure?.ja||'';shell.prepend(p)}"""
          if old not in s: raise SystemExit('compare loader anchor not found')
          s=s.replace(old,new,1)
          old="async function initDetail(lang){const ps=await patterns(),map=Object.fromEntries(ps.map(p=>[p.id,p])),id=document.body.dataset.patternId||new URLSearchParams(location.search).get('id'),p=map[id]||ps[0],rel=[...(p.relationships?.often_confused_with||[]),...(p.relationships?.similar||[])].filter((x,i,a)=>a.indexOf(x)===i).map(x=>map[x]).filter(Boolean),features=p.distinguishing_features?.[lang]||[],uses=p.common_uses?.[lang]||[];document.title="
          new="async function initDetail(lang){const [ps,cfg]=await Promise.all([patterns(),affiliateConfig()]),map=Object.fromEntries(ps.map(p=>[p.id,p])),id=document.body.dataset.patternId||new URLSearchParams(location.search).get('id'),p=map[id]||ps[0],rel=[...(p.relationships?.often_confused_with||[]),...(p.relationships?.similar||[])].filter((x,i,a)=>a.indexOf(x)===i).map(x=>map[x]).filter(Boolean),features=p.distinguishing_features?.[lang]||[],uses=p.common_uses?.[lang]||[],amazonQuery=cfg.queries?.[p.id]?.[lang]||p.names[lang],commerce=affiliateActive(cfg)?`<div class=\"pd-commerce\"><h2>${lang==='ja'?'この柄の商品をAmazonで探す':'Find products in this pattern on Amazon'}</h2><p class=\"pd-affiliate-disclosure\">${esc(cfg.disclosure?.[lang]||cfg.disclosure?.ja||'')}</p><a class=\"pd-button\" href=\"${amazonSearchUrl(amazonQuery,cfg)}\" target=\"_blank\" rel=\"sponsored nofollow noopener\">${lang==='ja'?'Amazon.co.jpで検索':'Search Amazon.co.jp'}</a></div>`:`<div class=\"pd-commerce\"><h2>${lang==='ja'?'この柄の商品を探す':'Find products in this pattern'}</h2><p class=\"pd-note\">${lang==='ja'?'Amazonアソシエイトはまだ有効化していません。tracking ID設定後に検索リンクを表示します。':'Amazon Associates links are not active yet. Search links will appear only after a valid tracking ID is configured.'}</p></div>`;document.title="
          if old not in s: raise SystemExit('initDetail anchor not found')
          s=s.replace(old,new,1)
          old="<section class=\"pd-section\"><div class=\"pd-commerce\"><h2>${lang==='ja'?'この柄の商品を探す':'Find products in this pattern'}</h2><p class=\"pd-note\">${lang==='ja'?'Amazonリンクはまだ接続していません。辞典本文とReference Imageの検証後に接続します。':'Amazon links are not connected yet. They will be added after dictionary copy and Reference Images are verified.'}</p></div></section>"
          new="<section class=\"pd-section\">${commerce}</section>"
          if old not in s: raise SystemExit('commerce anchor not found')
          s=s.replace(old,new,1)
          old="const page=document.body.dataset.page,lang=document.documentElement.lang==='en'?'en':'ja';if(page==='home')initHome(lang);if(page==='search')initSearch(lang);if(page==='detail')initDetail(lang);if(page==='compare')initCompare(lang);"
          new="const page=document.body.dataset.page,lang=document.documentElement.lang==='en'?'en':'ja';if(page==='home')initHome(lang);if(page==='search')initSearch(lang);if(page==='detail')initDetail(lang);if(page==='compare')initCompare(lang);mountAffiliateDisclosure(lang);"
          if old not in s: raise SystemExit('runtime bootstrap anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate affiliate and existing contracts
        run: |
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/tests/affiliate-test.mjs
          node tools/pattern-dictionary/tests/browse-mobile-test.mjs
          node tools/pattern-dictionary/tests/compare-test.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node tools/pattern-dictionary/tests/reference-image-test.mjs
          node tools/pattern-dictionary/tests/source-verification-test.mjs
          node tools/pattern-dictionary/tests/production-content-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
      - name: Persist affiliate runtime and restore workflow
        run: |
          cat > .github/workflows/validate-atlas-data.yml <<'YAML'
          name: Validate Construction Tools Atlas Data

          on:
            push:
            pull_request:

          jobs:
            validate-data:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4
                - name: Use Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: '20'
                - name: Run data validation
                  run: node tools/construction-tools-atlas/scripts/validate-data.mjs
          YAML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/pattern-dictionary/app.js .github/workflows/validate-atlas-data.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add safe Pattern Dictionary Amazon affiliate flow"
          git push origin HEAD:feat/pattern-dictionary-production-20-20260914
