name: Validate Construction Tools Atlas Data

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run data validation
        run: node tools/construction-tools-atlas/scripts/validate-data.mjs

  pattern-dictionary-phase2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Source verification contract
        run: node tools/pattern-dictionary/tests/source-verification-test.mjs
      - name: Researched content contract
        run: node tools/pattern-dictionary/tests/production-content-test.mjs
      - name: Static/runtime contract
        run: node tools/pattern-dictionary/tests/validate.mjs
      - name: Search regressions
        run: node tools/pattern-dictionary/tests/search-test.mjs
      - name: JavaScript syntax
        run: node --check tools/pattern-dictionary/app.js

  pattern-dictionary-kilim-fix:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'fix: align Kilim production record') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-production-20-20260914
      - name: Align Kilim production record with source ledger
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tools/pattern-dictionary/data/production-content.json')
          data=json.loads(p.read_text())
          rec=next(x for x in data['patterns'] if x['pattern_id']=='kilim')
          rec['names']['en']='Kilim Pattern'
          rec['aliases']['en']=['Kilim','kelim','kilim rug pattern']
          rec['term_scope']='flat-woven textile category and kilim-inspired visual family, not one fixed motif'
          rec['colors']['primary']=['red','navy','cream']
          rec['colors']['primary_reason']='Kilim traditions use diverse colors and designs; this fixed palette is only an editorial recognition reference.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Run all Pattern Dictionary Phase 2 contracts
        run: |
          node tools/pattern-dictionary/tests/source-verification-test.mjs
          node tools/pattern-dictionary/tests/production-content-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node --check tools/pattern-dictionary/app.js
      - name: Commit repaired production record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pattern-dictionary/data/production-content.json
          git commit -m 'fix: align Kilim production record with source ledger'
          git push origin HEAD:feat/pattern-dictionary-production-20-20260914
