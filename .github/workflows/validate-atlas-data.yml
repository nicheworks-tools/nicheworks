name: Validate Construction Tools Atlas Data

on:
  push:
  pull_request:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run data validation
        run: node tools/construction-tools-atlas/scripts/validate-data.mjs

  pattern-dictionary-phase2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Source verification contract
        run: node tools/pattern-dictionary/tests/source-verification-test.mjs
      - name: Researched content contract
        run: node tools/pattern-dictionary/tests/production-content-test.mjs
      - name: Static/runtime contract
        run: node tools/pattern-dictionary/tests/validate.mjs
      - name: Search regressions
        run: node tools/pattern-dictionary/tests/search-test.mjs
      - name: JavaScript syntax
        run: node --check tools/pattern-dictionary/app.js
