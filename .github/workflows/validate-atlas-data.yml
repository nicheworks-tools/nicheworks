name: Validate Construction Tools Atlas Data

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run data validation
        run: node tools/construction-tools-atlas/scripts/validate-data.mjs

  pattern-dictionary-phase3-install:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/pattern-dictionary-production-20-20260914' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-production-20-20260914
      - name: Install eight geometric reference images
        run: |
          base64 -d tools/pattern-dictionary/tests/.phase3-bundle.b64 > /tmp/pdphase3.zip
          unzip -qo /tmp/pdphase3.zip -d tools/pattern-dictionary
      - name: Wire image_ready records into runtime
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          root=Path('tools/pattern-dictionary')
          ids={'houndstooth','gingham','chevron','seigaiha','asanoha','shippo','ichimatsu','kikko'}
          prod=root/'data/production-content.json'
          d=json.loads(prod.read_text())
          hit=0
          for r in d['patterns']:
              if r['pattern_id'] in ids:
                  r['review_state']='image_ready'
                  hit += 1
          assert hit == 8, hit
          prod.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

          app=root/'app.js'
          s=app.read_text()
          anchor='let patternsPromise,dictPromise;'
          ref_line="const REFERENCE_IDS=new Set(['houndstooth','gingham','chevron','seigaiha','asanoha','shippo','ichimatsu','kikko']);"
          if ref_line not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+'\n'+ref_line,1)
          old="function patternSvg(p){\n  const id=p.id, fam=p.families?.[0]||''; let body='';"
          new="function patternSvg(p){\n  if(REFERENCE_IDS.has(p.id))return ROOT+'assets/reference/'+p.id+'.png';\n  const id=p.id, fam=p.families?.[0]||''; let body='';"
          if "if(REFERENCE_IDS.has(p.id))return ROOT+'assets/reference/'" not in s:
              assert old in s
              s=s.replace(old,new,1)
          s=s.replace(' — DEV placeholder','')
          badge='<div class="pd-dev">DEV PLACEHOLDER</div>'
          if "REFERENCE_IDS.has(p.id)?'':'<div class=\"pd-dev\">DEV PLACEHOLDER</div>'" not in s:
              assert badge in s
              s=s.replace(badge,"${REFERENCE_IDS.has(p.id)?'':'<div class=\"pd-dev\">DEV PLACEHOLDER</div>'}")
          status_func="function imageStatus(p,lang){if(REFERENCE_IDS.has(p.id))return `<p class=\"pd-warning\">${lang==='ja'?'Reference Image候補は1536×1536 PNGで生成済みです。現在はimage_readyで、最終reviewed/verified前です。':'A 1536×1536 PNG Reference Image candidate is generated. Status: image_ready; final reviewed/verified is still pending.'}</p>`;return `<p class=\"pd-warning\">${lang==='ja'?'この画像はUI検証用DEVプレースホルダーです。辞典用Reference Imageとして未検証です。':'This image is a DEV placeholder for UI validation, not a verified dictionary Reference Image.'}</p>`;}\n"
          if 'function imageStatus(' not in s:
              assert 'function bag(p,lang){' in s
              s=s.replace('function bag(p,lang){',status_func+'function bag(p,lang){',1)
          warning='<p class="pd-warning">${lang===\'ja\'?\'この画像はUI検証用DEVプレースホルダーです。辞典用Reference Imageとして未検証です。\':\'This image is a DEV placeholder for UI validation, not a verified dictionary Reference Image.\'}</p>'
          if warning in s:
              s=s.replace(warning,'${imageStatus(p,lang)}',1)
          app.write_text(s)
          PY
      - name: Validate Pattern Dictionary Phase 2 and 3 contracts
        run: |
          node tools/pattern-dictionary/tests/source-verification-test.mjs
          node tools/pattern-dictionary/tests/production-content-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node tools/pattern-dictionary/tests/reference-image-test.mjs
          node --check tools/pattern-dictionary/app.js
      - name: Persist Phase 3 and restore CI workflow
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/validate-atlas-data.yml
          rm tools/pattern-dictionary/tests/.phase3-bundle.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-atlas-data.yml tools/pattern-dictionary
          git commit -m 'feat: add first 8 Pattern Dictionary reference images [phase3]'
          git push origin HEAD:feat/pattern-dictionary-production-20-20260914
