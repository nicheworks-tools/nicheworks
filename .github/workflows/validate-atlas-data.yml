name: Validate Construction Tools Atlas Data

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run data validation
        run: node tools/construction-tools-atlas/scripts/validate-data.mjs

  pattern-dictionary-phase3-batch2:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/pattern-dictionary-production-20-20260914' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-production-20-20260914
      - name: Generate thirteen deterministic reference images
        run: python3 tools/pattern-dictionary/scripts/generate-reference-images.py
      - name: Advance five more records and runtime image set
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          root=Path('tools/pattern-dictionary')
          new_ids={'tartan','glen-check','argyle','polka-dot','moroccan-trellis'}
          all_ids=['houndstooth','gingham','tartan','glen-check','argyle','chevron','polka-dot','moroccan-trellis','seigaiha','asanoha','shippo','ichimatsu','kikko']

          prod=root/'data/production-content.json'
          d=json.loads(prod.read_text())
          hit=0
          for r in d['patterns']:
              if r['pattern_id'] in new_ids:
                  r['review_state']='image_ready'
                  hit += 1
          assert hit == 5, hit
          d['policy']['review_state']='mixed'
          d['policy']['image_state']='partial'
          prod.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

          app=root/'app.js'
          s=app.read_text()
          old="const REFERENCE_IDS=new Set(['houndstooth','gingham','chevron','seigaiha','asanoha','shippo','ichimatsu','kikko']);"
          new='const REFERENCE_IDS=new Set('+repr(all_ids).replace(' ', '')+');'
          assert old in s
          s=s.replace(old,new,1)
          app.write_text(s)
          PY
      - name: Validate Phase 2 and Phase 3 contracts
        run: |
          node tools/pattern-dictionary/tests/source-verification-test.mjs
          node tools/pattern-dictionary/tests/production-content-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node tools/pattern-dictionary/tests/reference-image-test.mjs
          node --check tools/pattern-dictionary/app.js
      - name: Persist batch 2 and restore CI workflow
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/validate-atlas-data.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/validate-atlas-data.yml tools/pattern-dictionary
          git commit -m 'feat: expand Pattern Dictionary reference images to 13 [phase3]'
          git push origin HEAD:feat/pattern-dictionary-production-20-20260914
