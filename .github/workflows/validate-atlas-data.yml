name: Validate Construction Tools Atlas Data

on:
  push:
  pull_request:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run data validation
        run: node tools/construction-tools-atlas/scripts/validate-data.mjs

  pattern-dictionary-search-runtime:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/pattern-dictionary-production-20-20260914' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-production-20-20260914
          fetch-depth: 2
      - name: Harden runtime search behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/pattern-dictionary/app.js')
          s=p.read_text()
          old="const norm=s=>(s||'').toLowerCase().normalize('NFKC').replace(/[’']/g,\"'\").replace(/[‐‑‒–—―]/g,'-').replace(/\\s+/g,' ').trim();"
          helper="""const norm=s=>(s||'').toLowerCase().normalize('NFKC').replace(/[’']/g,\"'\").replace(/[‐‑‒–—―]/g,'-').replace(/\\s+/g,' ').trim();
          const MATCH_THRESHOLD=20;
          const queryTokens=s=>norm(s).split(/[\\s,、。/]+/).filter(Boolean);
          function editDistance(a,b){const m=a.length,n=b.length,prev=Array.from({length:n+1},(_,i)=>i),cur=new Array(n+1);for(let i=1;i<=m;i++){cur[0]=i;for(let j=1;j<=n;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));for(let j=0;j<=n;j++)prev[j]=cur[j]}return prev[n]}
          function nearTypo(a,b){a=norm(a);b=norm(b);if(!a||!b||a===b||Math.min(a.length,b.length)<5||Math.abs(a.length-b.length)>1)return false;if(a.length===b.length){const d=[];for(let i=0;i<a.length;i++)if(a[i]!==b[i])d.push(i);if(d.length===2&&d[1]===d[0]+1&&a[d[0]]===b[d[1]]&&a[d[1]]===b[d[0]])return true}return editDistance(a,b)<=1}
          function typoHit(q,p){const qt=queryTokens(q),ct=[p.names?.ja,p.names?.en,...(p.aliases?.ja||[]),...(p.aliases?.en||[])].flatMap(queryTokens);return qt.some(a=>ct.some(b=>nearTypo(a,b)))}"""
          if old not in s: raise SystemExit('norm anchor not found')
          s=s.replace(old,helper,1)
          old_status="function imageStatus(p,lang){if(REFERENCE_IDS.has(p.id))return `<p class=\"pd-warning\">${lang==='ja'?'Reference Image候補は1536×1536 PNGで生成済みです。現在はimage_readyで、最終reviewed/verified前です。':'A 1536×1536 PNG Reference Image candidate is generated. Status: image_ready; final reviewed/verified is still pending.'}</p>`;return `${imageStatus(p,lang)}`;}"
          new_status="function imageStatus(p,lang){if(REFERENCE_IDS.has(p.id))return `<p class=\"pd-warning\">${lang==='ja'?'1536×1536 PNG Reference Imageは構造レビュー済みです。現在はreviewedで、最終verified前です。':'The 1536×1536 PNG Reference Image has passed structural review. Status: reviewed; final verification is still pending.'}</p>`;return '';}"
          if old_status not in s: raise SystemExit('imageStatus anchor not found')
          s=s.replace(old_status,new_status,1)
          start=s.index('async function interpret(q,lang)')
          end=s.index('async function initHome(lang)',start)
          replacement="""async function interpret(q,lang){const all=await dict(),nq=norm(q),out=[],seen=new Set();for(const l of [lang,lang==='ja'?'en':'ja'])for(const [k,v] of Object.entries(all[l]||{})){const nk=norm(k);if(nq.includes(nk)&&!seen.has(nk)){seen.add(nk);out.push({label:k,...v})}}return out}
          async function rank(q,lang,removed=[]){const ps=await patterns(),nq=norm(q),sig=(await interpret(q,lang)).filter(x=>!removed.includes(x.label)),tokens=queryTokens(nq);return {signals:sig,results:ps.map(p=>{let score=0,reasons=[];const add=(n,r)=>{score+=n;if(r&&!reasons.includes(r))reasons.push(r)};const name=norm(p.names[lang]),other=norm(p.names[lang==='ja'?'en':'ja']);if(nq===name)add(100,lang==='ja'?'正式名称':'exact name');if(nq===other)add(70,lang==='ja'?'他言語名':'other language name');for(const a of p.aliases?.[lang]||[]){const na=norm(a);if(nq===na)add(90,lang==='ja'?'別名':'alias');else if(nq.includes(na)||na.includes(nq))add(45,lang==='ja'?'別名':'alias')}for(const t of p.search_terms?.[lang]||[]){const nt=norm(t);if(nq.includes(nt)||nt.includes(nq))add(55,lang==='ja'?'説明語':'descriptive phrase')}if(typoHit(nq,p))add(38,lang==='ja'?'表記ゆれ候補':'possible typo');const b=bag(p,lang);for(const tok of tokens)if(tok.length>1&&b.includes(tok))add(12,tok);for(const x of sig){if((x.ids||[]).includes(p.id))add(72,x.label);if((x.families||[]).some(v=>p.families.includes(v)))add(45,x.label);if((x.colors||[]).some(v=>(p.colors?.primary||[]).includes(v)))add(15,x.label);if((x.culture||[]).some(v=>(p.culture||[]).includes(v)))add(35,x.label);if((x.uses||[]).some(v=>(p.uses||[]).includes(v)))add(25,x.label);for(const c of x.concepts||[])if(b.includes(norm(c)))add(35,x.label)}return{pattern:p,score,reasons}}).sort((a,b)=>b.score-a.score||a.pattern.id.localeCompare(b.pattern.id))}}
          function confidence(r){if(!r.length||r[0].score<MATCH_THRESHOLD)return'LOW';const d=r[0].score-(r[1]?.score||0);if(r[0].score>=70&&d>=20)return'HIGH';if(r[0].score>=35)return'MEDIUM';return'LOW'}
          """
          s=s[:start]+replacement+s[end:]
          s=s.replace(".results.filter(x=>x.score>0).slice(0,4)",".results.filter(x=>x.score>=MATCH_THRESHOLD).slice(0,4)")
          s=s.replace("rr.results.filter(x=>x.score>0).slice(0,8)","rr.results.filter(x=>x.score>=MATCH_THRESHOLD).slice(0,8)")
          p.write_text(s)
          PY
      - name: Validate search and runtime contracts
        run: |
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/tests/search-test.mjs
          node tools/pattern-dictionary/tests/reference-image-test.mjs
          node tools/pattern-dictionary/tests/source-verification-test.mjs
          node tools/pattern-dictionary/tests/production-content-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs
          grep -q "MATCH_THRESHOLD=20" tools/pattern-dictionary/app.js
          grep -q "possible typo" tools/pattern-dictionary/app.js
          grep -q "final verification is still pending" tools/pattern-dictionary/app.js
      - name: Persist runtime changes and restore CI workflow
        shell: bash
        run: |
          cat > .github/workflows/validate-atlas-data.yml <<'YAML'
          name: Validate Construction Tools Atlas Data

          on:
            push:
            pull_request:

          jobs:
            validate-data:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4
                - name: Use Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: '20'
                - name: Run data validation
                  run: node tools/construction-tools-atlas/scripts/validate-data.mjs
          YAML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/pattern-dictionary/app.js .github/workflows/validate-atlas-data.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: harden Pattern Dictionary search matching"
          git push origin HEAD:feat/pattern-dictionary-production-20-20260914
