name: TrashNavi Wave 10 Miyazaki one-shot

on:
  push:
    branches:
      - feat/trashnavi-wave10-miyazaki-20260913
    paths:
      - '.github/workflows/trashnavi-wave10-miyazaki-once.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave10-miyazaki-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wire Wave 10 dataset
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'tools/trashnavi/app.js';
          let s = fs.readFileSync(p, 'utf8');
          const old = '"data/direct-waste-links-supply-wave9.json"]';
          const next = '"data/direct-waste-links-supply-wave9.json","data/direct-waste-links-supply-wave10.json"]';
          if (!s.includes(next)) {
            if (!s.includes(old)) throw new Error('Wave 9 app anchor missing');
            s = s.replace(old, next);
            fs.writeFileSync(p, s);
          }
          NODE
      - name: Validate Wave 10 readiness
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit runtime wiring
        shell: bash
        run: |
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add tools/trashnavi/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire TrashNavi Wave 10 Miyazaki data'
          git push origin HEAD:feat/trashnavi-wave10-miyazaki-20260913
