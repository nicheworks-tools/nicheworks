name: TrashNavi Wave28 candidate inventory temp
on:
  push:
    branches:
      - feat/trashnavi-batch-wave28-readiness-20260916
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print unpublished direct-link inventory
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const dir='tools/trashnavi/data';
          const files=fs.readdirSync(dir).filter(n=>/^direct-waste-links.*\.json$/.test(n)).sort();
          const manifest=JSON.parse(fs.readFileSync('tools/trashnavi/municipality-page-manifest.json','utf8'));
          const published=new Set(manifest.filter(x=>x.publish).map(x=>x.lgcode));
          const by=new Map();
          for(const f of files){
            const rows=JSON.parse(fs.readFileSync(path.join(dir,f),'utf8'));
            for(const r of rows){
              if(!r.lgcode || published.has(r.lgcode)) continue;
              if(!by.has(r.lgcode)) by.set(r.lgcode,{pref:r.pref,city:r.city,rows:[]});
              by.get(r.lgcode).rows.push({...r,file:f});
            }
          }
          const list=[...by.entries()].map(([lg,v])=>({lg,...v,types:[...new Set(v.rows.map(r=>r.type))]}))
            .sort((a,b)=>b.types.length-a.types.length || (a.pref+a.city).localeCompare(b.pref+b.city,'ja'));
          console.log('PUBLISHED',published.size,'UNPUBLISHED_WITH_DIRECT',list.length);
          for(const x of list){
            console.log(`\n${x.lg}\t${x.pref}\t${x.city}\tTYPES=${x.types.length}\t${x.types.join(' | ')}`);
            for(const r of x.rows) console.log(`  ${r.type}\t${r.url}\t[${r.file}]`);
          }
          NODE
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
