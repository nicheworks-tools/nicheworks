name: Construction Tools Atlas q012 content completion freeze

on:
  push:
    branches:
      - feat/construction-atlas-q012-content-completion-20260916
    paths:
      - '.github/workflows/construction-tools-atlas-q012-content-completion-freeze.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze q012-complete content state
        run: |
          node --check tools/construction-tools-atlas/scripts/check-q012-content-completion-v2.3.cjs
          node <<'NODE'
          const fs=require('node:fs');
          const p='tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs';
          let s=fs.readFileSync(p,'utf8');
          const from="version: '2026-09-16-content-wave3c-q012-identity-closure-1'";
          const to="version: '2026-09-16-q012-content-complete-1'";
          if(!s.includes(from)) throw new Error('expected q012 identity content version missing');
          fs.writeFileSync(p,s.replace(from,to));
          NODE
          node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/check-q012-content-wave3a-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-q012-content-wave3b-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-q012-content-wave3c-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-q012-content-completion-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --check
          node - <<'NODE'
          const j=require('./tools/construction-tools-atlas/data/public-content-quality-v2.3.json');
          const s=j.summary||{};
          const expected={public_entries:896,fallback_independent_core:241,runtime_fallback_dependent:655,missing_core_bilingual_content:0,content_enriched_entries:101,explicit_bilingual_detail:460,explicit_bilingual_bullets:241,explicit_bilingual_examples:460};
          for(const [k,v] of Object.entries(expected)) if(s[k]!==v) throw new Error(`${k}: ${s[k]} != ${v}`);
          console.log('CTA_Q012_COMPLETE_CONTENT_SNAPSHOT='+JSON.stringify(expected));
          NODE
      - name: Commit non-workflow q012 completion state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs \
                  tools/construction-tools-atlas/data/public-content-quality-v2.3.json
          git commit -m 'feat(construction-atlas): freeze complete q012 content state'
          git push
