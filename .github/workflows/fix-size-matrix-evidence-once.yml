name: Fix Size Converter matrix evidence once

on:
  push:
    branches:
      - audit/quality-baseline-88-reconcile-20260913
    paths:
      - '.github/workflows/fix-size-matrix-evidence-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/quality-baseline-88-reconcile-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove stale Size Converter evidence path
        run: |
          node -e "const fs=require('fs'); const p='audits/tool-quality-matrix.json'; let s=fs.readFileSync(p,'utf8'); const old='        \\\"tools/size-converter/app-complete.js\\\",\\n'; if(!s.includes(old)) throw new Error('stale evidence path not found'); s=s.replace(old,''); fs.writeFileSync(p,s);"
      - name: Commit matrix correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/tool-quality-matrix.json
          git diff --cached --quiet && exit 0
          git commit -m "Remove stale Size Converter matrix evidence"
          git push origin HEAD:audit/quality-baseline-88-reconcile-20260913
