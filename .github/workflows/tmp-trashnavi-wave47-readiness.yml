name: tmp TrashNavi Wave47 readiness
on:
  push:
    branches: [feat/trashnavi-wave47-readiness-20260918]
permissions:
  contents: write
jobs:
  readiness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave47-readiness-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Wave47 readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=json.loads(Path('tools/trashnavi/data/direct-waste-links-supply-wave47.json').read_text())
          expected={
            '082171':('取手市','toride'),'082261':('那珂市','naka'),
            '082279':('筑西市','chikusei'),'082295':('稲敷市','inashiki'),
            '082309':('かすみがうら市','kasumigaura'),'082350':('つくばみらい市','tsukubamirai'),
            '082228':('鹿嶋市','kashima'),'082325':('神栖市','kamisu'),
            '082368':('小美玉市','omitama'),'082333':('行方市','namegata')
          }
          assert len(rows)==30
          by={}
          for r in rows:
            assert r['pref']=='茨城県'
            assert r['lgcode'] in expected and r['city']==expected[r['lgcode']][0]
            assert r['last_checked']=='2026-09-18'
            assert r['status']=='active' and r['language']=='ja'
            assert r['link_type']!='municipal_home'
            assert r['url'].startswith('https://')
            by.setdefault(r['lgcode'],[]).append(r)
          assert set(by)==set(expected)
          for code,rs in by.items():
            assert len(rs)==3
            assert len({r['link_type'] for r in rs})==3
            assert len({r['url'] for r in rs})==3
          app=Path('tools/trashnavi/app.js').read_text()
          assert 'data/direct-waste-links-supply-wave47.json' in app
          manifest=json.loads(Path('tools/trashnavi/municipality-page-manifest.json').read_text())
          assert len(manifest)==244
          root=Path('sitemap.xml').read_text()
          dedicated=Path('sitemap-trashnavi.xml').read_text()
          index=Path('tools/trashnavi/index.html').read_text()
          for code,(city,slug) in expected.items():
            canonical=f'https://nicheworks.app/tools/trashnavi/ibaraki/{slug}/'
            href=f'/tools/trashnavi/ibaraki/{slug}/'
            assert canonical not in root
            assert canonical not in dedicated
            assert href not in index
          assert dedicated.count('<url>')==245
          assert 'id="trashnaviAmazonAffiliate"' in index
          print('Wave47 readiness static acceptance: 10 municipalities / 30 records / published surface remains 244')
          PY
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          rm .github/workflows/tmp-trashnavi-wave47-readiness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(trashnavi): validate Wave47 readiness"
          git push origin HEAD:feat/trashnavi-wave47-readiness-20260918
