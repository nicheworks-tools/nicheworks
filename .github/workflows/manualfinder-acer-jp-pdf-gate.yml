name: ManualFinder Acer JP six official PDF source gate
on:
  pull_request:
    paths:
      - 'tools/manual-finder/**'
      - '.github/workflows/manualfinder-acer-jp-pdf-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acer-manufacturer-pdf-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned manufacturer PDF evidence and fail-closed parser
        run: node tools/manual-finder/tests/acer-jp-manual-pdf-probe.test.mjs
      - name: Verify Acer six official JP PDFs and exact 17 model identities from PDF contents
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          node tools/manual-finder/scripts/acer-jp-manual-pdf-probe.mjs
