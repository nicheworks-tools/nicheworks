name: TrashNavi Wave26 metadata hotfix v2 temp
on:
  push:
    branches: [fix/trashnavi-metadata-actual-types-wave26-20260915]
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix metadata contract and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/trashnavi/scripts/generate-municipality-pages.mjs')
          s=p.read_text()
          start=s.index("  const hasBulky = types.has('bulky_waste') || types.has('bulky_application');")
          end=s.index("  const calendar = links.find", start)
          replacement='\n'.join([
              "  const hasBulky = types.has('bulky_waste') || types.has('bulky_application');",
              "  const hasCalendar = types.has('collection_calendar');",
              "  const hasSorting = types.has('waste_sorting');",
              "  const titleLabels = { waste_sorting:'ごみ分別', waste_search:'ごみ検索', collection_calendar:'収集日', bulky_waste:'粗大ごみ', bulky_application:'粗大ごみ', dropoff_facility:'持込施設', waste_app:'ごみ分別アプリ', special_disposal:'特別処分' };",
              "  const titleTerms = [];",
              "  for (const type of TYPE_ORDER) {",
              "    if (!types.has(type) || !titleLabels[type] || titleTerms.includes(titleLabels[type])) continue;",
              "    titleTerms.push(titleLabels[type]);",
              "  }",
              "  const legacyCore = hasSorting && hasCalendar && hasBulky;",
              "  const title = legacyCore ? `${city}のごみ分別・収集カレンダー・粗大ごみ公式情報｜TrashNavi | NicheWorks` : `${city}の${titleTerms.slice(0,3).join('・')}公式情報｜TrashNavi | NicheWorks`;",
              "  const desc = legacyCore ? `${pref}${city}のごみ分別、収集カレンダー、粗大ごみなどの自治体公式ページをまとめています。TrashNaviは公式情報への案内で、分別ルールの最終判断や申込みは行いません。` : `${pref}${city}の確認済み自治体公式ごみ情報をまとめています。TrashNaviは公式情報への案内で、分別ルール・料金・収集日の最終判断や申込みは行いません。`;",
              "  const heroJa = legacyCore ? '分別、収集カレンダー、粗大ごみなど、確認済みの自治体公式ページをまとめています。具体的な分別方法・料金・収集日は、必ず各公式ページの最新情報を確認してください。' : hasBulky ? '確認済みの自治体公式ごみ情報へのリンクをまとめています。具体的な分別方法・料金・収集日などは、必ず各公式ページの最新情報を確認してください。' : '分別、収集日など、確認済みの自治体公式ごみ情報をまとめています。具体的な分別方法・料金・収集日は、必ず各公式ページの最新情報を確認してください。';",
              "  const heroEn = legacyCore ? 'Use these verified municipal links for sorting, collection calendars and bulky waste. Confirm current rules, fees and dates on the official source.' : 'Use these verified municipal waste-information links. Confirm current sorting rules, fees and collection dates on the official source.';",
          ])+'\n'
          s=s[:start]+replacement+s[end:]
          old='<section class="faq-section"><h2 data-i18n="ja">よくある確認</h2><h2 data-i18n="en">Common checks</h2><div class="faq-item"><h3 data-i18n="ja">今日・今週の収集日はどこで確認しますか？</h3><h3 data-i18n="en">Where should I check today\'s collection date?</h3><p data-i18n="ja">上の収集カレンダーを開き、住所・地域に対応する最新日程を確認してください。</p><p data-i18n="en">Open the official collection calendar and confirm the current schedule for your area.</p></div><div class="faq-item"><h3 data-i18n="ja">粗大ごみの料金や対象品をTrashNaviで確認できますか？</h3><h3 data-i18n="en">Does TrashNavi determine bulky-waste fees?</h3><p data-i18n="ja">いいえ。料金・対象品・申込方法は自治体公式の粗大ごみページで確認してください。</p><p data-i18n="en">No. Confirm fees, eligible items and application routes on the official municipal page.</p></div></section>'
          new='<section class="faq-section"><h2 data-i18n="ja">よくある確認</h2><h2 data-i18n="en">Common checks</h2>${hasCalendar?`<div class="faq-item"><h3 data-i18n="ja">今日・今週の収集日はどこで確認しますか？</h3><h3 data-i18n="en">Where should I check today\'s collection date?</h3><p data-i18n="ja">上の収集カレンダーを開き、住所・地域に対応する最新日程を確認してください。</p><p data-i18n="en">Open the official collection calendar and confirm the current schedule for your area.</p></div>`:`<div class="faq-item"><h3 data-i18n="ja">収集日などの最新情報はどこで確認しますか？</h3><h3 data-i18n="en">Where should I confirm current collection information?</h3><p data-i18n="ja">上の自治体公式リンクから、住所・地域に対応する最新情報を確認してください。</p><p data-i18n="en">Use the official municipal links above to confirm current information for your area.</p></div>`}<div class="faq-item"><h3 data-i18n="ja">粗大ごみの料金や対象品をTrashNaviで確認できますか？</h3><h3 data-i18n="en">Does TrashNavi determine bulky-waste fees?</h3><p data-i18n="ja">いいえ。料金・対象品・申込方法は自治体公式の粗大ごみページで確認してください。</p><p data-i18n="en">No. Confirm fees, eligible items and application routes on the official municipal page.</p></div></section>'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          shizuoka=Path('tools/trashnavi/shizuoka/shizuoka/index.html').read_text()
          assert '<title>静岡市のごみ分別・ごみ検索・粗大ごみ公式情報｜TrashNavi | NicheWorks</title>' in shizuoka
          head=shizuoka.split('</head>',1)[0]; hero=shizuoka.split('<section class="municipality-hero">',1)[1].split('</section>',1)[0]
          assert '収集カレンダー' not in head and '収集カレンダー' not in hero and 'ごみ検索' in head
          assert shizuoka.count('class="official-link-card"')==3 and 'class="current-calendar-callout"' not in shizuoka
          assert '上の収集カレンダーを開き' not in shizuoka
          for rel in ['tools/trashnavi/shizuoka/hamamatsu/index.html','tools/trashnavi/hyogo/kobe/index.html','tools/trashnavi/hiroshima/hiroshima/index.html','tools/trashnavi/kumamoto/kumamoto/index.html']:
              page=Path(rel).read_text(); assert 'ごみ分別・収集カレンダー・粗大ごみ公式情報' in page.split('</head>',1)[0]; assert 'class="current-calendar-callout"' in page; assert page.count('class="official-link-card"')==3
          mappings={'ごみ分別':'ごみの分別・出し方','ごみ検索':'ごみ分別検索','収集日':'収集カレンダー','収集カレンダー':'収集カレンダー','粗大ごみ':'粗大ごみ','持込施設':'持込施設','ごみ分別アプリ':'ごみ分別アプリ・Web','特別処分':'特別な処分案内'}
          for m in json.loads(Path('tools/trashnavi/municipality-page-manifest.json').read_text()):
              if not m.get('publish'): continue
              p=Path(f"tools/trashnavi/{m['pref_slug']}/{m['city_slug']}/index.html"); html=p.read_text(); title=re.search(r'<title>(.*?)</title>',html).group(1); cards=html.split('<section class="municipality-links-section">',1)[1].split('</section>',1)[0]
              terms=title.split('の',1)[1].split('公式情報',1)[0].split('・')
              for term in terms:
                  label=mappings.get(term)
                  if label: assert label in cards, f'{p}: title claims {term} without matching official card'
          print('Wave26 metadata actual-type regression: OK')
          PY
          git diff --check
          git status --short
          git add tools/trashnavi/scripts/generate-municipality-pages.mjs tools/trashnavi/*/*/index.html sitemap-trashnavi.xml
          git commit -m "Make TrashNavi metadata reflect actual link types"
          git rm .github/workflows/trashnavi-wave26-metadata-hotfix-temp.yml .github/workflows/trashnavi-wave26-metadata-hotfix-v2-temp.yml
          git commit -m "Remove TrashNavi Wave26 metadata hotfix workflows"
          git push origin HEAD:fix/trashnavi-metadata-actual-types-wave26-20260915
