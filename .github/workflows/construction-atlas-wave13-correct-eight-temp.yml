name: Construction Atlas Wave13 correct eight-image selection
on:
  pull_request:
    paths:
      - .github/workflows/construction-atlas-wave13-correct-eight-temp.yml
permissions:
  contents: write
jobs:
  correct-staged-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/atlas-wave13-reviewed-ten-20261106
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore prior approved baseline without changing unrelated source paths
        shell: bash
        run: |
          set -euo pipefail
          BASE=51a86ff338bd3abcf669b3dd553c87cede57c846
          git cat-file -e "$BASE^{commit}"
          while IFS=$'\t' read -r state file; do
            case "$state" in
              A*) git rm -f -- "$file" ;;
              M*|D*) git restore --source="$BASE" --staged --worktree -- "$file" ;;
              *) echo "Unexpected state $state: $file"; exit 1 ;;
            esac
          done < <(git diff --name-status "$BASE" HEAD -- sitemap.xml tools/construction-tools-atlas/data tools/construction-tools-atlas/entries tools/construction-tools-atlas/images tools/construction-tools-atlas/detail-image-hotfix.js tools/construction-tools-atlas/sitemap.xml)
      - name: Install ImageMagick for source-preserving WebP conversion
        run: |
          if command -v magick >/dev/null || command -v convert >/dev/null; then
            (magick -version || convert -version)
          else
            sudo apt-get update -qq && sudo apt-get install -y imagemagick
          fi
      - name: Rebuild only visually accepted source images and public pages
        run: |
          node tools/construction-tools-atlas/scripts/promote-image-wave13-eight-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-image-wave13-source-leads-v2.3.cjs
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/check-image-registry-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-image-attribution-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-image-lifecycle-v2.3.cjs
      - name: Commit corrected content and remove temporary write workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/construction-atlas-wave13-correct-eight-temp.yml
          git rm tools/construction-tools-atlas/scripts/promote-image-wave13-ten-v2.3.cjs
          git add -A tools/construction-tools-atlas sitemap.xml
          git diff --cached --check -- tools/construction-tools-atlas/data tools/construction-tools-atlas/images/ATTRIBUTION.md tools/construction-tools-atlas/scripts sitemap.xml
          git commit -m "fix(atlas): reject two weak subjects; retain eight verified Wave13 images"
          git push origin HEAD:refs/heads/feat/atlas-wave13-reviewed-ten-20261106
