name: One-shot stage Earth placeholders

on:
  push:
    branches:
      - chore/adsense-earth-staged-v2-20260914

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply transformation
        run: node scripts/_tmp-stage-earth-placeholders.mjs
      - name: Validate contracts
        id: validate
        shell: bash
        run: |
          set +e
          : > earth-stage-validation.txt
          status=0
          for cmd in \
            "node scripts/audit-publishing-mode.mjs" \
            "node scripts/check-tool-spec-contract.mjs" \
            "node scripts/check-tool-spec-coverage.mjs" \
            "node scripts/check-tool-quality-contract.mjs" \
            "node scripts/check-monetization-classification.mjs" \
            "node scripts/check-common-support-contract.mjs" \
            "node scripts/check-seo-public-url-contract.mjs" \
            "node scripts/check-seo-indexable-url-identity.mjs" \
            "node scripts/audit-seo.mjs --strict"
          do
            echo "### $cmd" >> earth-stage-validation.txt
            bash -lc "$cmd" >> earth-stage-validation.txt 2>&1
            code=$?
            echo "exit=$code" >> earth-stage-validation.txt
            echo >> earth-stage-validation.txt
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat earth-stage-validation.txt
          exit 0
      - name: Persist diagnostics on failure
        if: steps.validate.outputs.status != '0'
        run: |
          git reset --hard HEAD
          git clean -fd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf '%s\n' "Validation failed. Inspect the workflow log for command output." > earth-stage-validation-failed.txt
          git add earth-stage-validation-failed.txt
          git commit -m "chore: record Earth staging validation failure"
          git push origin HEAD:chore/adsense-earth-staged-v2-20260914
          exit 1
      - name: Commit validated final state
        if: steps.validate.outputs.status == '0'
        run: |
          rm -f scripts/_tmp-stage-earth-placeholders.mjs
          rm -f .github/workflows/_tmp-stage-earth-placeholders.yml
          rm -f earth-stage-validation.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: stage Earth placeholders outside public AdSense surface"
          git push origin HEAD:chore/adsense-earth-staged-v2-20260914
