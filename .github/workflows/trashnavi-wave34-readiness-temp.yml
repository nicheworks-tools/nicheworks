name: TrashNavi Wave34 readiness temporary

on:
  push:
    branches:
      - feat/trashnavi-wave34-readiness-20260916

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave34-readiness-20260916
      - name: Register Wave34 and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/trashnavi/app.js')
          s = p.read_text()
          old = '"data/direct-waste-links-supply-wave33.json"]'
          new = '"data/direct-waste-links-supply-wave33.json","data/direct-waste-links-supply-wave34.json"]'
          if old not in s:
              raise SystemExit('Wave33 registration anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/trashnavi-wave34-readiness-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/trashnavi/app.js .github/workflows/trashnavi-wave34-readiness-temp.yml
          git commit -m 'feat(trashnavi): register Wave34 direct links'
          git push origin HEAD:feat/trashnavi-wave34-readiness-20260916
