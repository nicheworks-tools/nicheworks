name: Temporary Phone QuickCheck on-page SEO polish

on:
  push:
    branches:
      - fix/phone-quickcheck-onpage-seo-20260914
    paths:
      - '.github/workflows/tmp-phone-quickcheck-onpage-seo.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-quickcheck-onpage-seo-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply and verify on-page SEO cleanup
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'tools/phone-quickcheck/index.html';
          let html = fs.readFileSync(path, 'utf8');

          const oldDescription = '<meta name="description" content="スマホのサイズ・重さ・充電端子・必要な充電器・モバイルバッテリーの充電回数目安・公式マニュアルを素早く確認する無料ツール。">';
          const newDescription = '<meta name="description" content="150機種のスマホを検索し、サイズ・重さ・USB-C/Lightning端子・充電器条件・USB PD/PPS・Qi/Qi2・モバイルバッテリー充電回数の目安・メーカー公式仕様をすぐ確認できる無料QuickCheckツール。">';
          if (!html.includes(oldDescription)) throw new Error('meta description insertion point missing');
          html = html.replace(oldDescription, newDescription);

          const oldH1 = `        <h1 class="nw-title" data-i18n="ja">スマホ QuickCheck</h1>\n        <h1 class="nw-title" data-i18n="en" hidden>Phone QuickCheck</h1>`;
          const newH1 = `        <h1 class="nw-title"><span data-i18n="ja">スマホ QuickCheck</span><span data-i18n="en" hidden>Phone QuickCheck</span></h1>`;
          if (!html.includes(oldH1)) throw new Error('bilingual H1 insertion point missing');
          html = html.replace(oldH1, newH1);

          const marker = `    <div class="ad-slot ad-bottom" data-i18n="ja">広告枠</div>`;
          const staticCopy = `    <section class="method-note quickcheck-overview">\n      <h2 data-i18n="ja">150機種をすばやく確認</h2>\n      <h2 data-i18n="en" hidden>Quick checks across 150 maintained phones</h2>\n      <p data-i18n="ja">Phone QuickCheckは、ケーブルや充電器、モバイルバッテリーを買う前に「この機種の端子は何か」「どの充電器クラスを確認すればよいか」「本体サイズや重さはどの程度か」を短時間で確認するための一覧です。現在はApple、Google、Samsung、Sony、SHARP、OPPO、Xiaomi、Motorolaの検証済み150機種を維持しています。</p>\n      <p data-i18n="en" hidden>Phone QuickCheck is built for the practical questions that come up before buying a cable, charger, wireless charger, or power bank. Search the maintained list to check a phone's physical size and weight, USB-C or Lightning connector, charger guidance, supported charging standards, wireless charging information, and manufacturer source links. The current dataset maintains 150 verified models from Apple, Google, Samsung, Sony, SHARP, OPPO, Xiaomi, and Motorola.</p>\n      <p data-i18n="ja">充電器の目安と端末側の最大W数は別の情報として扱い、USB PD、PPS、Qi、Qi2などもメーカー資料で確認できる範囲だけを表示します。独自の急速充電規格をUSB PDとして推測したり、不明なW数を補完したりしません。</p>\n      <p data-i18n="en" hidden>The charging section separates charger guidance from a source-backed device-side maximum. USB PD, PPS, Qi, Qi2, and proprietary fast-charging labels are shown only when the maintained evidence supports them. A proprietary charging standard is not silently relabeled as USB PD, and unknown wattage remains unknown rather than being inferred from a charger recommendation.</p>\n      <p data-i18n="ja">モバイルバッテリーの充電回数は、確認できた端末バッテリー容量に対して共通の変換効率67%を使った概算です。メーカーがmAhを公表していない場合は回数を作らず、最終確認には各機種のメーカー公式仕様・サポート情報へ移動できます。</p>\n      <p data-i18n="en" hidden>Power-bank figures are approximate full-charge equivalents using the maintained 67% conversion assumption. If an accepted battery capacity is unavailable, the tool does not fabricate a recharge count. Manufacturer specification and support links remain available for final verification, and Amazon accessory handoffs stay separate from the official-source information shown by the tool.</p>\n    </section>\n\n`;
          if (!html.includes(marker)) throw new Error('static copy insertion point missing');
          html = html.replace(marker, staticCopy + marker);

          const h1Count = (html.match(/<h1\b/gi) || []).length;
          if (h1Count !== 1) throw new Error(`expected exactly one h1, got ${h1Count}`);
          if (!html.includes('150機種のスマホを検索')) throw new Error('expanded description missing');
          if (!html.includes('Quick checks across 150 maintained phones')) throw new Error('bilingual static copy missing');
          fs.writeFileSync(path, html);
          NODE

          node scripts/check-phone-quickcheck-data.mjs
          node scripts/check-phone-quickcheck-affiliate.mjs
          node tools/phone-quickcheck/tests/behavior.test.mjs
          node scripts/check-tool-runtime-contracts.mjs

          rm .github/workflows/tmp-phone-quickcheck-onpage-seo.yml
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add -A
          git commit -m "Polish Phone QuickCheck on-page SEO"
          git push origin HEAD:fix/phone-quickcheck-onpage-seo-20260914
