name: Reconcile publication verification

on:
  push:
    branches:
      - feat/reconcile-publication-20260912
    paths:
      - .github/workflows/reconcile-publication-verification.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconcile full test suite
        run: node --test tools/reconcile/tests/*.test.mjs
      - name: Reconcile app syntax
        run: node --check tools/reconcile/app.mjs
      - name: Billing foundation
        run: |
          node --check functions/api/billing/product-config.js
          node --check functions/api/billing/create-checkout-session.js
          node --check functions/api/billing/entitlement-store.js
          node --check functions/api/billing/entitlement.js
          node --check functions/api/billing/stripe-webhook.js
          node --check assets/nw-pro-entitlement.js
          node scripts/check-billing-foundation.mjs
      - name: Validate data
        run: node tools/construction-tools-atlas/scripts/validate-data.mjs
      - name: Remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reconcile-publication-verification.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/reconcile-publication-verification.yml
          git commit -m "chore(reconcile): remove publication verifier"
          git push origin HEAD:feat/reconcile-publication-20260912

# trigger after workflow registration
