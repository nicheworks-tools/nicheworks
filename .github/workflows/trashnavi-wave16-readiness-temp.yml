name: TrashNavi Wave 16 readiness temp

on:
  push:
    branches:
      - feat/trashnavi-matsue-readiness-wave16-20260914

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Wave 16 readiness delta
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pref = Path('tools/trashnavi/data/direct-waste-links-pref-capitals-extra.json')
          rows = json.loads(pref.read_text())
          found = False
          for row in rows:
              if str(row.get('lgcode')) == '322016':
                  row['name'] = '松江市 家庭ごみの分別区分と出し方'
                  row['url'] = 'https://www.city.matsue.lg.jp/kurashi_tetsuzuki/gomi_kankyo_pet/6/2/index.html'
                  found = True
          if not found:
              raise SystemExit('Matsue pref-capital sorting record missing')
          pref.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n')

          wave = [
            {
              'pref': '島根県',
              'city': '松江市',
              'name': '松江市 令和8年度家庭ごみ収集日程',
              'type': '収集カレンダー',
              'link_type': 'collection_calendar',
              'url': 'https://www.city.matsue.lg.jp/kurashi_tetsuzuki/gomi_kankyo_pet/6/R8gominittei/index.html',
              'lgcode': '322016',
              'fiscal_year': '2026',
              'last_checked': '2026-09-14',
              'status': 'active',
              'language': 'ja'
            },
            {
              'pref': '島根県',
              'city': '松江市',
              'name': '松江市 粗大ごみの回収申し込み',
              'type': '粗大ごみ',
              'link_type': 'bulky_waste',
              'url': 'https://www.city.matsue.lg.jp/soshikikarasagasu/kankyoenergybu_recycletoshisuishinka/5/5-2/244.html',
              'lgcode': '322016',
              'last_checked': '2026-09-14',
              'status': 'active',
              'language': 'ja'
            }
          ]
          Path('tools/trashnavi/data/direct-waste-links-supply-wave16.json').write_text(json.dumps(wave, ensure_ascii=False, indent=2) + '\n')

          app = Path('tools/trashnavi/app.js')
          text = app.read_text()
          old = '"data/direct-waste-links-supply-wave15.json"]'
          new = '"data/direct-waste-links-supply-wave15.json","data/direct-waste-links-supply-wave16.json"]'
          if old not in text:
              raise SystemExit('Wave 15 app anchor missing')
          app.write_text(text.replace(old, new, 1))
          PY
      - name: Required TrashNavi audits
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit verified readiness delta and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/trashnavi/app.js tools/trashnavi/data/direct-waste-links-pref-capitals-extra.json tools/trashnavi/data/direct-waste-links-supply-wave16.json
          git commit -m 'Promote Matsue to TrashNavi preferred candidate'
          git rm .github/workflows/trashnavi-wave16-readiness-temp.yml
          git commit -m 'Remove temporary TrashNavi Wave 16 readiness workflow'
          git push origin HEAD:${{ github.ref_name }}
