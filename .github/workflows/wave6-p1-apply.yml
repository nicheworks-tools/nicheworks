name: Apply Wave 6 P1 fixes

on:
  push:
    branches:
      - audit/spec-conformance-wave6-20260913
    paths:
      - '.github/workflows/wave6-p1-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wave 6 branch
        uses: actions/checkout@v4
        with:
          ref: audit/spec-conformance-wave6-20260913
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply targeted fixes
        run: node scripts/apply-wave6-p1-fixes.mjs

      - name: Syntax checks
        run: |
          node --check tools/ui-atlas/pro-bridge.js
          node --check tools/ui-atlas/app.js
          node --check tools/vibe-lexicon/pro-bridge.js
          node --check tools/vibe-lexicon/app.js
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ui-atlas/pro-bridge.js tools/ui-atlas/app.js tools/ui-atlas/SPEC.md \
            tools/vibe-lexicon/pro-bridge.js tools/vibe-lexicon/app.js tools/vibe-lexicon/SPEC.md \
            tools/url-title-collector/SPEC.md
          git commit -m "Fix Wave 6 entitlement isolation"
          git push origin HEAD:audit/spec-conformance-wave6-20260913
