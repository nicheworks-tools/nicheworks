name: Tool runtime contract audit

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'assets/amazon-affiliate.js'
      - 'scripts/check-tool-runtime-contracts.mjs'
      - 'scripts/check-tool-runtime-contracts-wave4.mjs'
      - 'scripts/check-tool-runtime-contracts-wave5.mjs'
      - 'scripts/check-tool-runtime-contracts-wave6.mjs'
      - 'scripts/check-tool-runtime-contracts-wave7.mjs'
      - 'scripts/check-amazon-ready-tools.mjs'
      - 'scripts/check-size-audio-growth-wave.mjs'
      - 'scripts/check-size-audio-growth-wave3.mjs'
      - 'scripts/check-size-converter-growth-wave4.mjs'
      - 'scripts/check-old-kanji-reference-layout.mjs'
      - 'scripts/check-old-kanji-cluster-contract.mjs'
      - 'scripts/check-old-kanji-reference-seo.mjs'
      - 'scripts/run-tool-behavior-tests.mjs'
      - '.github/workflows/tool-runtime-contract-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - 'assets/amazon-affiliate.js'
      - 'scripts/check-tool-runtime-contracts.mjs'
      - 'scripts/check-tool-runtime-contracts-wave4.mjs'
      - 'scripts/check-tool-runtime-contracts-wave5.mjs'
      - 'scripts/check-tool-runtime-contracts-wave6.mjs'
      - 'scripts/check-tool-runtime-contracts-wave7.mjs'
      - 'scripts/check-amazon-ready-tools.mjs'
      - 'scripts/check-size-audio-growth-wave.mjs'
      - 'scripts/check-size-audio-growth-wave3.mjs'
      - 'scripts/check-size-converter-growth-wave4.mjs'
      - 'scripts/check-old-kanji-reference-layout.mjs'
      - 'scripts/check-old-kanji-cluster-contract.mjs'
      - 'scripts/check-old-kanji-reference-seo.mjs'
      - 'scripts/run-tool-behavior-tests.mjs'
      - '.github/workflows/tool-runtime-contract-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check runtime contracts waves 1-3
        run: node scripts/check-tool-runtime-contracts.mjs

      - name: Check runtime contracts wave 4
        run: node scripts/check-tool-runtime-contracts-wave4.mjs

      - name: Check runtime contracts wave 5
        run: node scripts/check-tool-runtime-contracts-wave5.mjs

      - name: Check runtime contracts wave 6
        run: node scripts/check-tool-runtime-contracts-wave6.mjs

      - name: Check runtime contracts wave 7
        run: node scripts/check-tool-runtime-contracts-wave7.mjs

      - name: Run discovered tool behavior tests
        run: node scripts/run-tool-behavior-tests.mjs

      - name: Check Amazon-ready tool contracts
        run: node scripts/check-amazon-ready-tools.mjs

      - name: Check Size and Tiny Audio growth wave
        run: node scripts/check-size-audio-growth-wave.mjs

      - name: Check Size and Tiny Audio growth wave 3
        run: node scripts/check-size-audio-growth-wave3.mjs

      - name: Check Size Converter growth wave 4
        run: node scripts/check-size-converter-growth-wave4.mjs

      - name: Check Old Kanji Reference layout
        run: node scripts/check-old-kanji-reference-layout.mjs

      - name: Check Old Kanji cluster contract
        run: node scripts/check-old-kanji-cluster-contract.mjs

      - name: Check Old Kanji Reference SEO contract
        run: node scripts/check-old-kanji-reference-seo.mjs

      - name: Verify audit is read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
