name: Tool runtime contract audit

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'assets/amazon-affiliate.js'
      - 'scripts/check-tool-runtime-contracts.mjs'
      - 'scripts/check-tool-runtime-contracts-wave4.mjs'
      - 'scripts/check-tool-runtime-contracts-wave5.mjs'
      - 'scripts/check-amazon-ready-tools.mjs'
      - '.github/workflows/tool-runtime-contract-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - 'assets/amazon-affiliate.js'
      - 'scripts/check-tool-runtime-contracts.mjs'
      - 'scripts/check-tool-runtime-contracts-wave4.mjs'
      - 'scripts/check-tool-runtime-contracts-wave5.mjs'
      - 'scripts/check-amazon-ready-tools.mjs'
      - '.github/workflows/tool-runtime-contract-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check runtime contracts waves 1-3
        run: node scripts/check-tool-runtime-contracts.mjs

      - name: Check runtime contracts wave 4
        run: node scripts/check-tool-runtime-contracts-wave4.mjs

      - name: Check runtime contracts wave 5
        run: node scripts/check-tool-runtime-contracts-wave5.mjs

      - name: Check Amazon-ready tool contracts
        run: node scripts/check-amazon-ready-tools.mjs

      - name: Verify audit is read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
