name: Tool runtime contract audit

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'scripts/check-tool-runtime-contracts.mjs'
      - '.github/workflows/tool-runtime-contract-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - 'scripts/check-tool-runtime-contracts.mjs'
      - '.github/workflows/tool-runtime-contract-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check runtime contracts
        run: node scripts/check-tool-runtime-contracts.mjs

      - name: Verify audit is read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
