name: Temporary Phone QuickCheck foldable spec sync

on:
  push:
    branches:
      - feat/phone-quickcheck-foldable-schema-20260914
    paths:
      - '.github/workflows/tmp-phone-foldable-spec-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-quickcheck-foldable-schema-20260914
          fetch-depth: 0
      - name: Sync foldable schema documentation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const toolPath = 'tools/phone-quickcheck/SPEC.md';
          const docPath = 'docs/tools/phone-quickcheck.md';

          let tool = fs.readFileSync(toolPath, 'utf8');
          tool = tool.replace(
            'Phone records use stable model IDs, canonical manufacturer/model names, maintained aliases, dimensions in millimetres, mass in grams, charging facts, provenance/source URLs, verification date, and optional additive accessory keys.',
            'Phone records use stable model IDs, canonical manufacturer/model names, maintained aliases, dimensions in millimetres, mass in grams, charging facts, provenance/source URLs, verification date, and optional additive accessory keys. Standard phones use `dimensions`; foldables use `formFactor: foldable` plus complete `dimensionsFolded` and `dimensionsUnfolded` sets. Foldables are listed and compact-sorted by folded dimensions while detail output shows both physical states.'
          );
          tool = tool.replace(
            '- selected phone dimensions and weight;',
            '- selected phone dimensions and weight; foldables show separate folded and unfolded dimensions;'
          );
          fs.writeFileSync(toolPath, tool);

          let doc = fs.readFileSync(docPath, 'utf8');
          doc = doc.replace(
            '- 一覧は走査性を優先し、モデル、発売年、サイズ、重量、端子を中心に表示する。',
            '- 一覧は走査性を優先し、モデル、発売年、サイズ、重量、端子を中心に表示する。通常機は `dimensions`、foldableは `dimensionsFolded` / `dimensionsUnfolded` を使い、一覧と「小さい順」は折りたたみ時寸法、詳細は折りたたみ時／展開時の両方を表示する。'
          );
          doc = doc.replace(
            '- 選択機種の高さ × 幅 × 厚さ、重量、画面サイズ等の維持済み本体情報。',
            '- 選択機種の高さ × 幅 × 厚さ、重量、画面サイズ等の維持済み本体情報。foldableでは折りたたみ時／展開時の外形寸法を分けて表示する。'
          );
          fs.writeFileSync(docPath, doc);
          NODE

          rm .github/workflows/tmp-phone-foldable-spec-sync.yml
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add -A
          git commit -m "Document Phone QuickCheck foldable dimension schema"
          git push origin HEAD:feat/phone-quickcheck-foldable-schema-20260914
