name: Pattern Dictionary reference audit final gate

on:
  push:
    branches:
      - fix/pattern-dictionary-reference-audit-20260917
    paths:
      - .github/workflows/pattern-dictionary-reference-audit-final-gate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pattern-dictionary-reference-audit-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run canonical 100 Pattern Dictionary gates
        run: |
          set -euo pipefail
          cd tools/pattern-dictionary
          node tests/validate.mjs
          node tests/canonical-100-test.mjs
          node tests/production-content-test.mjs
          node tests/source-verification-test.mjs
          node tests/reference-image-test.mjs
          node tests/reference-image-accuracy-audit-test.mjs
          node tests/publication-test.mjs
          node tests/search-test.mjs
          node tests/compare-test.mjs
          node tests/affiliate-test.mjs
          node tests/seo-detail-test.mjs
          node tests/browse-mobile-test.mjs
          node tests/wave2-production-content-test.mjs
          node tests/wave2-source-verification-test.mjs
          node tests/wave3-source-verification-test.mjs
          node tests/wave4-source-verification-test.mjs
          node tests/wave5-source-verification-test.mjs
          cd ../..
          git diff --check
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/pd-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/tools/pattern-dictionary/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pd-http.log
          exit 1
      - name: Run desktop and 390px Chromium reference QA
        run: |
          cat >.pd-reference-qa.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const base='http://127.0.0.1:8000/tools/pattern-dictionary/';
            const corrected=['shepherd-check','glen-check','prince-of-wales-check','gun-club-check','herringbone','kagome','same-komon','tomoe','fleur-de-lis','marbling','sayagata','giraffe-print','zebra-print'];
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:1000}});
              const goto=async u=>page.goto(u,{waitUntil:'domcontentloaded'});
              const waitCards=async()=>page.waitForFunction(()=>document.querySelectorAll('#pattern-grid .pd-card').length===100);
              const overflow=async()=>page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
              await goto(base); await waitCards();
              assert.equal(await page.locator('#pattern-grid .pd-card').count(),100,'JA home must render 100 cards');
              let ov=await overflow(); assert.ok(ov.scroll<=ov.client+1,`desktop JA overflow ${ov.scroll}/${ov.client}`);
              await goto(base+'en/'); await waitCards();
              assert.equal(await page.locator('#pattern-grid .pd-card').count(),100,'EN home must render 100 cards');
              for(const id of corrected){
                await goto(base+'patterns/'+id+'/');
                await page.waitForSelector('.pd-detail-image');
                const info=await page.locator('.pd-detail-image').evaluate(img=>({src:img.getAttribute('src'),complete:img.complete,nw:img.naturalWidth,nh:img.naturalHeight}));
                assert.ok(info.src.includes('/assets/reference/'+id+'.png'),id+': wrong reference src');
                assert.ok(info.complete&&info.nw===1536&&info.nh===1536,`${id}: reference image did not decode at 1536x1536 (${info.nw}x${info.nh})`);
              }
              await goto(base+'compare.html?a=kagome&b=lattice');
              await page.waitForSelector('.pd-compare-guide');
              assert.ok((await page.locator('body').innerText()).includes('籠目'),'Kagome compare must render');
              await page.setViewportSize({width:390,height:844});
              for(const u of [base,base+'patterns/same-komon/',base+'patterns/fleur-de-lis/',base+'patterns/marbling/',base+'compare.html?a=kagome&b=lattice']){
                await goto(u);
                if(u===base) await waitCards(); else await page.waitForSelector(u.includes('compare')?'.pd-compare-guide':'.pd-detail-image');
                ov=await overflow(); assert.ok(ov.scroll<=ov.client+1,`390px overflow at ${u}: ${ov.scroll}/${ov.client}`);
              }
              console.log('OK: desktop + 390px Chromium QA passed for canonical-100 browse and all 13 corrected reference images.');
            } finally { await browser.close(); }
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          node .pd-reference-qa.cjs
