name: Reconcile quality apply

on:
  push:
    branches:
      - fix/reconcile-quality-performance-20260913

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reconcile-quality-performance-20260913
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply scoped Reconcile hardening
        run: python3 .agent/plans/reconcile-quality-apply.py
      - name: Run Reconcile suite before commit
        run: |
          node --check tools/reconcile/app.mjs
          node --check tools/reconcile/normalize.mjs
          for test in tools/reconcile/tests/*.test.mjs; do
            echo "==> $test"
            node "$test"
          done
      - name: Commit Reconcile implementation only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/reconcile .agent/plans/reconcile-quality-apply.py
          git diff --cached --quiet && exit 0
          git commit -m "Harden Reconcile quality, scale, and result UX"
          git push origin HEAD:fix/reconcile-quality-performance-20260913
