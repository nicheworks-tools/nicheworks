name: Temporary Phone QuickCheck quality enum fix

on:
  push:
    branches:
      - docs/phone-quickcheck-usage-quality-sync-20260914
    paths:
      - '.github/workflows/tmp-phone-quickcheck-quality-enum-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phone-quickcheck-usage-quality-sync-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize quality test classification
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'audits/tool-quality-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(path, 'utf8'));
          const item = matrix.records.find((row) => row.slug === 'phone-quickcheck');
          if (!item) throw new Error('phone-quickcheck record missing');
          const evidence = item.test_evidence.find((row) => row.path === 'scripts/check-phone-quickcheck-affiliate.mjs');
          if (!evidence) throw new Error('affiliate evidence missing');
          evidence.classification = 'regression/contract test';
          fs.writeFileSync(path, JSON.stringify(matrix, null, 2) + '\n');
          NODE
          node scripts/check-tool-quality-contract.mjs
          rm .github/workflows/tmp-phone-quickcheck-quality-enum-fix.yml
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add -A
          git commit -m "Normalize Phone QuickCheck quality evidence classification"
          git push origin HEAD:docs/phone-quickcheck-usage-quality-sync-20260914
