name: TrashNavi Takamatsu publication one-shot

on:
  push:
    branches:
      - feat/trashnavi-takamatsu-publication-20260913
    paths:
      - .github/workflows/trashnavi-takamatsu-publication-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-takamatsu-publication-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Takamatsu publication contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          function replaceOnce(text, from, to, label) {
            if (text.includes(to)) return text;
            if (!text.includes(from)) throw new Error(`${label}: anchor missing`);
            return text.replace(from, to);
          }

          const manifestPath = 'tools/trashnavi/municipality-page-manifest.json';
          let manifest = fs.readFileSync(manifestPath, 'utf8');
          manifest = replaceOnce(
            manifest,
            '  {"lgcode":"452017","pref_slug":"miyazaki","city_slug":"miyazaki","publish":true}\n]',
            '  {"lgcode":"452017","pref_slug":"miyazaki","city_slug":"miyazaki","publish":true},\n  {"lgcode":"372013","pref_slug":"kagawa","city_slug":"takamatsu","publish":true}\n]',
            'manifest'
          );
          fs.writeFileSync(manifestPath, manifest);

          const generatorPath = 'tools/trashnavi/scripts/generate-municipality-pages.mjs';
          let generator = fs.readFileSync(generatorPath, 'utf8');
          generator = replaceOnce(
            generator,
            'if(outputs.length!==17) throw new Error(`municipality page count must be 17; got ${outputs.length}`);',
            'if(outputs.length!==18) throw new Error(`municipality page count must be 18; got ${outputs.length}`);',
            'generator count'
          );
          fs.writeFileSync(generatorPath, generator);

          const indexPath = 'tools/trashnavi/index.html';
          let index = fs.readFileSync(indexPath, 'utf8');
          index = replaceOnce(
            index,
            '<a href="/tools/trashnavi/miyazaki/miyazaki/">宮崎市</a></div>',
            '<a href="/tools/trashnavi/miyazaki/miyazaki/">宮崎市</a><a href="/tools/trashnavi/kagawa/takamatsu/">高松市</a></div>',
            'root municipality link'
          );
          fs.writeFileSync(indexPath, index);

          const rootSitemapPath = 'sitemap.xml';
          let rootSitemap = fs.readFileSync(rootSitemapPath, 'utf8');
          const takamatsuBlock = '  <url>\n    <loc>https://nicheworks.app/tools/trashnavi/kagawa/takamatsu/</loc>\n    <lastmod>2026-09-13</lastmod>\n  </url>\n';
          if (!rootSitemap.includes('https://nicheworks.app/tools/trashnavi/kagawa/takamatsu/')) {
            if (!rootSitemap.includes('</urlset>')) throw new Error('root sitemap closing tag missing');
            rootSitemap = rootSitemap.replace('</urlset>', `${takamatsuBlock}</urlset>`);
          }
          fs.writeFileSync(rootSitemapPath, rootSitemap);

          const specPath = 'tools/trashnavi/SPEC.md';
          let spec = fs.readFileSync(specPath, 'utf8');
          spec = replaceOnce(
            spec,
            'Wave 11では、Wave 10と同じ供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から高松市を選定した。高松市公式の令和8年度ごみ収集カレンダーと臨時・粗大ごみ案内を追加し、既存のごみ分別導線と合わせてpreferred candidateへ引き上げた。data enrichment検証は完了し、自治体page publicationは別PRで行う。\n\n- 香川県 高松市 — publication pending',
            'Wave 11では、Wave 10と同じ供給側拡張方針を維持し、既存direct-link coverageが1種類止まりの県庁所在地から高松市を選定した。高松市公式の令和8年度ごみ収集カレンダーと臨時・粗大ごみ案内を追加し、既存のごみ分別導線と合わせてpreferred candidateへ引き上げた。data enrichment検証後、公開対象を **18自治体** とする。\n\n- 香川県 高松市 — `/tools/trashnavi/kagawa/takamatsu/`',
            'Wave 11 publication state'
          );
          spec = replaceOnce(spec, '- [x] 公開17自治体をmanifest allowlistで管理する。', '- [x] 公開18自治体をmanifest allowlistで管理する。', 'manifest acceptance');
          spec = replaceOnce(spec, '- [x] generator `--check` で17ページの生成driftを検出する。', '- [x] generator `--check` で18ページの生成driftを検出する。', 'generator acceptance');
          spec = replaceOnce(spec, '- [x] Wave 11で高松市をpreferred candidateへ引き上げる。自治体page publicationは別PRで閉じる。', '- [x] Wave 11で高松市をpreferred candidateへ引き上げ、自治体pageを公開する。', 'Wave 11 acceptance');
          const evidence = '- `tools/trashnavi/kagawa/takamatsu/index.html` — Wave 11 municipality page。';
          if (!spec.includes(evidence)) {
            const anchor = '- `tools/trashnavi/miyazaki/miyazaki/index.html` — Wave 10 municipality page。';
            if (!spec.includes(anchor)) throw new Error('Wave 10 page evidence anchor missing');
            spec = spec.replace(anchor, `${anchor}\n${evidence}`);
          }
          fs.writeFileSync(specPath, spec);
          NODE

          node tools/trashnavi/scripts/generate-municipality-pages.mjs
      - name: Validate Takamatsu publication
        shell: bash
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('tools/trashnavi/municipality-page-manifest.json', 'utf8'));
          if (manifest.filter(x => x.publish).length !== 18) throw new Error('manifest must publish 18 municipalities');
          const page = fs.readFileSync('tools/trashnavi/kagawa/takamatsu/index.html', 'utf8');
          const cards = (page.match(/<article class="official-link-card">/g) || []).length;
          if (cards !== 3) throw new Error(`Takamatsu official-link cards must be 3; got ${cards}`);
          if (!page.includes('2026年の収集カレンダー')) throw new Error('Takamatsu FY2026 calendar callout missing');
          if (!page.includes('https://www.city.takamatsu.kagawa.jp/kurashi/kurashi/gomi/r8_gomi_calendar.html')) throw new Error('Takamatsu calendar URL missing');
          if (!page.includes('https://www.city.takamatsu.kagawa.jp/kurashi/kurashi/gomi/rinjisodai/dashikata.html')) throw new Error('Takamatsu bulky-waste URL missing');
          const root = fs.readFileSync('tools/trashnavi/index.html', 'utf8');
          if ((root.match(/\/tools\/trashnavi\/kagawa\/takamatsu\//g) || []).length !== 1) throw new Error('Takamatsu root link must appear once');
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          if ((sitemap.match(/https:\/\/nicheworks\.app\/tools\/trashnavi\/kagawa\/takamatsu\//g) || []).length !== 1) throw new Error('Takamatsu root sitemap URL must appear once');
          console.log('Takamatsu publication contract: 18 pages / 3 official cards / FY2026 calendar / root link+sitemap OK');
          NODE
      - name: Commit publication output
        shell: bash
        run: |
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add sitemap-trashnavi.xml sitemap.xml tools/trashnavi/SPEC.md tools/trashnavi/index.html tools/trashnavi/kagawa/takamatsu/index.html tools/trashnavi/municipality-page-manifest.json tools/trashnavi/scripts/generate-municipality-pages.mjs
          git commit -m 'Publish Takamatsu as TrashNavi municipality page'
          git push origin HEAD:feat/trashnavi-takamatsu-publication-20260913
