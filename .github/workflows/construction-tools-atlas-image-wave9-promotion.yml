name: Construction Tools Atlas Reviewed Wave9 Promotion
on:
  pull_request:
    paths:
      - '.github/workflows/construction-tools-atlas-image-wave9-promotion.yml'
      - 'tools/construction-tools-atlas/scripts/promote-image-wave9-reviewed-v2.3.cjs'
permissions:
  contents: write
  actions: read
jobs:
  prepare-reviewed-four-images:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download Commons-verified exact original images
        uses: actions/download-artifact@v4
        with:
          name: construction-atlas-wave9-commons-verified-staging
          run-id: 41210014523
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cta-wave9
      - name: Promote 4 approved tool images; never publish rejected reciprocating saw
        run: |
          if [ -f tools/construction-tools-atlas/data/image-wave9-sources-v2.3.json ]; then
            echo "Source ledger exists: already promoted; verify immutable SHA and generated pages."
          else
            for id in laser_distance_meter pipe_wrench speed_square nail_gun; do
              mkdir -p "tools/construction-tools-atlas/images/$id"
              cp "${{ runner.temp }}/cta-wave9/$id/source.jpg" "tools/construction-tools-atlas/images/$id/source.jpg"
              cp "${{ runner.temp }}/cta-wave9/$id/primary.webp" "tools/construction-tools-atlas/images/$id/primary.webp"
              cp "${{ runner.temp }}/cta-wave9/$id/thumb.webp" "tools/construction-tools-atlas/images/$id/thumb.webp"
            done
            node tools/construction-tools-atlas/scripts/promote-image-wave9-reviewed-v2.3.cjs
          fi
      - name: Regenerate image, public and SEO source-of-truth snapshots
        run: |
          node tools/construction-tools-atlas/scripts/audit-image-inventory-v2.3.cjs --write > /dev/null
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --write > /dev/null
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs
          node tools/construction-tools-atlas/scripts/build-affiliate-image-acquisition-queue-v2.3.cjs --write
      - name: Run source, lifecycle, SEO, comparison and affiliate queue audits
        run: |
          node tools/construction-tools-atlas/scripts/check-image-registry-v2.3.cjs
          node tools/construction-tools-atlas/scripts/check-image-attribution-v2.3.cjs
          node tools/construction-tools-atlas/scripts/image-lifecycle-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-image-inventory-v2.3.cjs --check > /dev/null
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --check > /dev/null
          node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/build-affiliate-image-acquisition-queue-v2.3.cjs --check
          node tools/construction-tools-atlas/scripts/build-comparison-pages-v2.3.cjs --check
      - name: Commit approved binary images and static SEO outputs only on this PR
        run: |
          git config user.name "nicheworks-image-wave9[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/construction-tools-atlas sitemap.xml
          git diff --cached --quiet && { echo "Already generated"; exit 0; }
          git commit -m "Construction Atlas: publish 4 verified tool images and 44 static detail pages"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
