name: Temporary Phone QuickCheck foldable schema finalizer

on:
  push:
    branches:
      - feat/phone-quickcheck-foldable-schema-20260914
    paths:
      - '.github/workflows/tmp-phone-foldable-schema-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-quickcheck-foldable-schema-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add backward-compatible foldable schema support
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const appPath = 'tools/phone-quickcheck/app.js';
          let app = fs.readFileSync(appPath, 'utf8');

          app = app.replace('      dimensions: "外形寸法",', '      dimensions: "外形寸法",\n      dimensionsFolded: "外形寸法（折りたたみ時）",\n      dimensionsUnfolded: "外形寸法（展開時）",\n      foldedShort: "折りたたみ時",');
          app = app.replace('      dimensions: "Dimensions",', '      dimensions: "Dimensions",\n      dimensionsFolded: "Dimensions (folded)",\n      dimensionsUnfolded: "Dimensions (unfolded)",\n      foldedShort: "folded",');

          app = app.replace(
            "result.sort((a, b) => numberOrInfinity(a.dimensions?.widthMm) - numberOrInfinity(b.dimensions?.widthMm) || numberOrInfinity(a.dimensions?.heightMm) - numberOrInfinity(b.dimensions?.heightMm));",
            "result.sort((a, b) => numberOrInfinity(sortDimensions(a)?.widthMm) - numberOrInfinity(sortDimensions(b)?.widthMm) || numberOrInfinity(sortDimensions(a)?.heightMm) - numberOrInfinity(sortDimensions(b)?.heightMm));"
          );

          app = app.replace(
            "      <section class=\"detail-section\"><h3>${escapeHtml(msg('device'))}</h3>${kv(msg('dimensions'), dimensions)}${kv(msg('display'), display)}${kv(msg('water'), water)}</section>",
            "      <section class=\"detail-section\"><h3>${escapeHtml(msg('device'))}</h3>${dimensionRowsHtml(phone)}${kv(msg('display'), display)}${kv(msg('water'), water)}</section>"
          );

          const oldDimensionFns = `  function compactDimensions(phone) {\n    const h = phone.dimensions?.heightMm;\n    const w = phone.dimensions?.widthMm;\n    if (!h || !w) return '—';\n    return \`${'${formatNumber(h)} × ${formatNumber(w)} mm'}\`;\n  }\n\n  function fullDimensions(phone) {\n    const h = phone.dimensions?.heightMm;\n    const w = phone.dimensions?.widthMm;\n    const d = phone.dimensions?.depthMm;\n    if (!h || !w) return '—';\n    return [h, w, d].filter((value) => value !== null && value !== undefined).map(formatNumber).join(' × ') + ' mm';\n  }`;
          const newDimensionFns = `  function isFoldable(phone) {\n    return phone?.formFactor === 'foldable';\n  }\n\n  function sortDimensions(phone) {\n    return isFoldable(phone) ? phone.dimensionsFolded : phone.dimensions;\n  }\n\n  function dimensionString(dimensions) {\n    const h = dimensions?.heightMm;\n    const w = dimensions?.widthMm;\n    const d = dimensions?.depthMm;\n    if (!h || !w) return '—';\n    return [h, w, d].filter((value) => value !== null && value !== undefined).map(formatNumber).join(' × ') + ' mm';\n  }\n\n  function compactDimensions(phone) {\n    const dimensions = sortDimensions(phone);\n    const h = dimensions?.heightMm;\n    const w = dimensions?.widthMm;\n    if (!h || !w) return '—';\n    const suffix = isFoldable(phone) ? \` (${ '${msg(\'foldedShort\')}' })\` : '';\n    return \`${'${formatNumber(h)} × ${formatNumber(w)} mm${suffix}'}\`;\n  }\n\n  function fullDimensions(phone) {\n    return dimensionString(sortDimensions(phone));\n  }\n\n  function dimensionRowsHtml(phone) {\n    if (isFoldable(phone)) {\n      return kv(msg('dimensionsFolded'), dimensionString(phone.dimensionsFolded))\n        + kv(msg('dimensionsUnfolded'), dimensionString(phone.dimensionsUnfolded));\n    }\n    return kv(msg('dimensions'), fullDimensions(phone));\n  }`;
          if (!app.includes(oldDimensionFns)) throw new Error('dimension function marker missing');
          app = app.replace(oldDimensionFns, newDimensionFns);
          fs.writeFileSync(appPath, app);

          const validatorPath = 'scripts/check-phone-quickcheck-data.mjs';
          let validator = fs.readFileSync(validatorPath, 'utf8');
          const oldDimensions = `  const d = phone.dimensions || {};\n  for (const key of ['heightMm', 'widthMm', 'depthMm']) {\n    if (!finitePositive(d[key])) fail(\`${'${label}'}: invalid dimensions.${'${key}'}\`);\n  }`;
          const newDimensions = `  const isFoldable = phone.formFactor === 'foldable';\n  if (phone.formFactor !== undefined && !['foldable'].includes(phone.formFactor)) fail(\`${'${label}'}: unsupported formFactor\`);\n  const dimensionSets = isFoldable\n    ? [['dimensionsFolded', phone.dimensionsFolded], ['dimensionsUnfolded', phone.dimensionsUnfolded]]\n    : [['dimensions', phone.dimensions]];\n  for (const [dimensionLabel, d] of dimensionSets) {\n    for (const key of ['heightMm', 'widthMm', 'depthMm']) {\n      if (!finitePositive(d?.[key])) fail(\`${'${label}'}: invalid ${'${dimensionLabel}'}.${'${key}'}\`);\n    }\n  }\n  if (isFoldable && phone.dimensions !== undefined) fail(\`${'${label}'}: foldable records must use dimensionsFolded/dimensionsUnfolded, not dimensions\`);`;
          if (!validator.includes(oldDimensions)) throw new Error('validator dimension marker missing');
          validator = validator.replace(oldDimensions, newDimensions);
          fs.writeFileSync(validatorPath, validator);

          const testPath = 'tools/phone-quickcheck/tests/behavior.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const mapMarker = `const byId = new Map(allPhones.map((phone) => [phone.id, phone]));`;
          const synthetic = `const syntheticFoldable = {\n  id: 'synthetic-foldable',\n  manufacturer: 'Samsung',\n  model: 'Synthetic Foldable',\n  aliases: ['Fold Fixture'],\n  releaseYear: 2026,\n  formFactor: 'foldable',\n  dimensionsFolded: { heightMm: 155, widthMm: 68, depthMm: 13 },\n  dimensionsUnfolded: { heightMm: 155, widthMm: 132, depthMm: 6 },\n  weightG: 240,\n  displayInch: 7.6,\n  charging: { connector: 'USB-C', battery: { capacityMah: 4400, valueClass: 'manufacturer', sourceRef: 'https://www.samsung.com/' }, wiredRecommendedW: 25, protocols: [], pps: 'unknown', wirelessStandard: 'Qi', wirelessMaxW: 15 },\n  included: { cable: 'included', adapter: 'not_included' },\n  waterRating: 'IPX8',\n  sources: { specificationsUrl: 'https://www.samsung.com/', manualUrl: 'https://www.samsung.com/', verifiedAt: '2026-09-14' },\n  affiliateKeys: []\n};\nconst byId = new Map([...allPhones, syntheticFoldable].map((phone) => [phone.id, phone]));`;
          if (!test.includes('syntheticFoldable')) {
            if (!test.includes(mapMarker)) throw new Error('test map marker missing');
            test = test.replace(mapMarker, synthetic);
          }
          const consoleMarker = `console.log('Phone QuickCheck behavior tests passed:`;
          const foldTest = `// Foldable schema renders folded/unfolded dimensions without changing slab records.\n{\n  const h = await createHarness(['synthetic-foldable']);\n  assert.match(h.elements.phoneList.innerHTML, /155 × 68 mm \(折りたたみ時\)/);\n  assert.match(h.elements.desktopDetail.innerHTML, /外形寸法（折りたたみ時）/);\n  assert.match(h.elements.desktopDetail.innerHTML, /155 × 68 × 13 mm/);\n  assert.match(h.elements.desktopDetail.innerHTML, /外形寸法（展開時）/);\n  assert.match(h.elements.desktopDetail.innerHTML, /155 × 132 × 6 mm/);\n  h.langEn.click();\n  assert.match(h.elements.desktopDetail.innerHTML, /Dimensions \(folded\)/);\n  assert.match(h.elements.desktopDetail.innerHTML, /Dimensions \(unfolded\)/);\n}\n\n`;
          if (!test.includes('Dimensions \\(folded\\)')) {
            const idx = test.indexOf(consoleMarker);
            if (idx < 0) throw new Error('console marker missing');
            test = test.slice(0, idx) + foldTest + test.slice(idx);
          }
          fs.writeFileSync(testPath, test);
          NODE

          node scripts/check-phone-quickcheck-data.mjs
          node scripts/check-phone-quickcheck-source-semantics.mjs
          node scripts/check-phone-quickcheck-affiliate.mjs
          node tools/phone-quickcheck/tests/behavior.test.mjs

          rm .github/workflows/tmp-phone-foldable-schema-finalize.yml
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add -A
          git commit -m "Add foldable dimension schema support"
          git push origin HEAD:feat/phone-quickcheck-foldable-schema-20260914
