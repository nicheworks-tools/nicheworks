name: Reconcile publication sitemap fix

on:
  push:
    branches:
      - feat/reconcile-publication-20260912
    paths:
      - .github/workflows/reconcile-publication-sitemap-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild sitemap from current main and add Reconcile
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:sitemap.xml > sitemap.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sitemap.xml')
          s = p.read_text()
          url = 'https://nicheworks.app/tools/reconcile/'
          if url not in s:
              block = '''  <url>\n    <loc>https://nicheworks.app/tools/reconcile/</loc>\n    <lastmod>2026-09-12</lastmod>\n  </url>\n'''
              marker = '</urlset>'
              if marker not in s:
                  raise SystemExit('missing </urlset>')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          if p.read_text().count(url) != 1:
              raise SystemExit('Reconcile sitemap URL count must be exactly 1')
          PY
          rm .github/workflows/reconcile-publication-sitemap-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sitemap.xml .github/workflows/reconcile-publication-sitemap-fix.yml
          git diff --cached --check
          git commit -m "fix(reconcile): preserve latest sitemap entries"
          git push origin HEAD:feat/reconcile-publication-20260912
