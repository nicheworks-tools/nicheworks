name: Pattern Dictionary one-shot finalize slice

on:
  push:
    branches:
      - feat/pattern-dictionary-vertical-slice-20260914
    paths:
      - .github/workflows/pattern-dictionary-finalize-slice.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/pattern-dictionary-vertical-slice-20260914

      - name: Normalize canonical set and validation notes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              Path('tools/pattern-dictionary/app.js'): [
                  ("['houndstooth','chevron','yagasuri']", "['houndstooth','chevron']"),
              ],
              Path('tools/pattern-dictionary/README.md'): [
                  ('Current search smoke set: 9/9 expected patterns appear in Top3. This is a vertical-slice check, not a final search-quality benchmark.',
                   'Current search smoke set: 12/12 expectations pass; Houndstooth and Kilim include Top1-locked regression cases. This is a vertical-slice check, not a final search-quality benchmark.'),
                  ('4. Run desktop/tablet/mobile browser QA.',
                   '4. Re-run desktop/tablet/mobile browser QA after production data/image replacement.'),
              ],
              Path('tools/pattern-dictionary/SPEC.md'): [
                  ('- [ ] Browser QA is complete at 1200px, 768px, 390px, and 320px.',
                   '- [x] Browser QA is complete at 1200px, 768px, 390px, and 320px for this vertical slice; production data/image changes require a final re-run.'),
              ],
              Path('docs/tools/pattern-dictionary.md'): [
                  ('Browser QA at 1200px, 768px, 390px, and 320px remains a pre-ready-for-review gate.',
                   'Browser QA at 1200px, 768px, 390px, and 320px is complete for this vertical slice; production data/image changes require a final re-run before detail indexing.'),
              ],
              Path('.agent/plans/2026-09-14-pattern-dictionary-vertical-slice.md'): [
                  ('- Search smoke: 10/10 expectations pass; the ambiguous JA `白黒のギザギザしたチェック` and EN `black white jagged check` cases are locked to Houndstooth as Top1 regressions.',
                   '- Search smoke: 12/12 expectations pass; the ambiguous JA `白黒のギザギザしたチェック` and EN `black white jagged check` cases are locked to Houndstooth as Top1 regressions, and JA `幾何学の絨毯柄` / EN `kilim rug pattern` are locked to Kilim as Top1 regressions.'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Validate canonical 20-pattern contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const expected = [
            'houndstooth','gingham','tartan','glen-check','argyle','chevron','polka-dot','moroccan-trellis',
            'seigaiha','asanoha','shippo','ichimatsu','kikko','karakusa','damask','arabesque','paisley',
            'leopard-print','ikat','kilim'
          ].sort();
          const patterns = JSON.parse(fs.readFileSync('tools/pattern-dictionary/data/patterns.json','utf8'));
          const actual = patterns.map(p => p.id).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error({expected, actual});
            process.exit(1);
          }
          if (patterns.some(p => p.id === 'yagasuri')) process.exit(1);
          for (const id of expected) {
            for (const path of [
              `tools/pattern-dictionary/patterns/${id}/index.html`,
              `tools/pattern-dictionary/en/patterns/${id}/index.html`
            ]) {
              if (!fs.existsSync(path)) throw new Error(`Missing static detail: ${path}`);
            }
          }
          for (const path of [
            'tools/pattern-dictionary/patterns/yagasuri/index.html',
            'tools/pattern-dictionary/en/patterns/yagasuri/index.html'
          ]) {
            if (fs.existsSync(path)) throw new Error(`Stale Yagasuri route remains: ${path}`);
          }
          console.log('OK: canonical Pattern Dictionary set is exactly 20 IDs including Kilim and excluding Yagasuri.');
          NODE

          node tools/pattern-dictionary/tests/validate.mjs
          node tools/pattern-dictionary/tests/search-test.mjs
          node --check tools/pattern-dictionary/app.js

      - name: Commit finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pattern-dictionary/app.js tools/pattern-dictionary/README.md tools/pattern-dictionary/SPEC.md docs/tools/pattern-dictionary.md .agent/plans/2026-09-14-pattern-dictionary-vertical-slice.md
          git commit -m "fix: finalize canonical Pattern Dictionary vertical slice"
          git push origin HEAD:feat/pattern-dictionary-vertical-slice-20260914
