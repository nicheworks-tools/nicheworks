      - 'tools/_shared/check-fastscan-ocr-line-repair.mjs'
      - 'tools/_shared/check-fastscan-ocr-robustness.mjs'
      - 'tools/_shared/check-fastscan-result-controls.mjs'
      - 'tools/_shared/check-fastscan-review-queue.mjs'
      - 'tools/_shared/check-lite-wave3-navigation.mjs'
      - 'tools/_shared/check-cosmetics-cross-tool-release.mjs'
      - 'tools/_shared/check-cosmetics-wave2-release.mjs'
      - 'tools/_shared/check-cosmetics-wave3-release.mjs'
      - 'tools/_shared/COSMETICS_ACCURACY_BENCHMARK.md'
      - 'tools/_shared/COSMETICS_ALIAS_POLICY.md'
      - 'tools/_shared/COSMETICS_CANONICAL_MERGE.md'
      - 'tools/_shared/COSMETICS_CANONICAL_SEMANTICS.md'
      - 'tools/_shared/COSMETICS_CATEGORY_GAPS.md'
      - 'tools/_shared/COSMETICS_CATEGORY_PROVENANCE.md'
      - 'tools/_shared/COSMETICS_CATEGORY_TAXONOMY.md'
      - 'tools/_shared/COSMETICS_JP_LABEL_VARIANTS.md'
      - 'tools/_shared/COSMETICS_NOTE_PROVENANCE.md'
      - 'tools/_shared/COSMETICS_OCR_LINE_REPAIR.md'
      - 'tools/_shared/COSMETICS_OCR_ROBUSTNESS.md'
      - 'tools/_shared/COSMETICS_RELEASE_GATE.md'
      - 'tools/_shared/COSMETICS_WAVE2_RELEASE.md'
      - 'tools/_shared/COSMETICS_WAVE3_RELEASE.md'
      - 'tools/_shared/COSMETICS_REAL_LABEL_CORPUS.md'
      - 'tools/_shared/COSMETICS_SEMANTIC_QUALITY.md'
      - 'tools/_shared/COSMETICS_LEGACY_SAFETY_ISOLATION.md'
      - 'tools/_shared/cosmetics-affiliate-*.js'
      - 'tools/_shared/cosmetics-affiliate-*.css'
      - '.github/workflows/cosmetics-accuracy-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Shared parser regression
        run: node tools/_shared/check-cosmetic-ingredient-parser.mjs
      - name: Dictionary and alias quality
        run: node tools/_shared/check-cosmetics-dictionary-quality.mjs
      - name: Dictionary semantic quality audit
        run: node tools/_shared/check-cosmetics-semantic-quality.mjs
      - name: Category gap inventory
        run: node tools/_shared/check-cosmetics-category-gap-inventory.mjs
      - name: Verified category provenance
        run: node tools/_shared/check-cosmetics-category-provenance.mjs
      - name: Verified category taxonomy
        run: node tools/_shared/check-cosmetics-category-taxonomy.mjs
      - name: Legacy safety runtime isolation
        run: node tools/_shared/check-cosmetics-legacy-safety-isolation.mjs
      - name: Canonical runtime semantic merge
        run: node tools/_shared/check-cosmetics-runtime-semantic-merge.mjs
      - name: Note provenance runtime isolation
        run: node tools/_shared/check-cosmetics-note-provenance-isolation.mjs
      - name: Note provenance schema
        run: node tools/_shared/check-cosmetics-note-provenance-schema.mjs
      - name: Claim-bearing note inventory
        run: node tools/_shared/check-cosmetics-claim-note-inventory.mjs
      - name: Verified note wave 1
        run: node tools/_shared/check-cosmetics-verified-note-wave1.mjs
      - name: Verified note wave 2
        run: node tools/_shared/check-cosmetics-verified-note-wave2.mjs
      - name: Verified note wave 3
        run: node tools/_shared/check-cosmetics-verified-note-wave3.mjs
      - name: Verified note wave 4
        run: node tools/_shared/check-cosmetics-verified-note-wave4.mjs
      - name: Verified note wave 5 final
        run: node tools/_shared/check-cosmetics-verified-note-wave5.mjs
      - name: Verified note wave 6 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave6.mjs
      - name: Verified note wave 7 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave7.mjs
      - name: Verified note wave 8 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave8.mjs
      - name: Verified note wave 9 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave9.mjs
      - name: Verified note wave 10 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave10.mjs
      - name: Verified note wave 11 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave11.mjs
      - name: Verified note wave 12 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave12.mjs
      - name: Verified note wave 13 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave13.mjs
      - name: Verified note wave 14 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave14.mjs
      - name: Verified note wave 15 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave15.mjs
      - name: Verified note wave 16 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave16.mjs
      - name: Verified note wave 17 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave17.mjs
      - name: Verified note wave 18 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave18.mjs
      - name: Verified note wave 19 common-label priority
        run: node tools/_shared/check-cosmetics-verified-note-wave19.mjs
      - name: Japanese label variant regression
        run: node tools/_shared/check-cosmetics-jp-label-variants.mjs
      - name: Canonical merge regression
        run: node tools/_shared/check-cosmetics-canonical-merge.mjs
      - name: Canonical equivalent regression
        run: node tools/_shared/check-cosmetics-canonical-equivalents.mjs
      - name: Cosmetics JavaScript syntax
        run: |
          node --check tools/_shared/cosmetic-ingredient-parser.js
          node --check tools/_shared/cosmetics-affiliate-config.js
          node --check tools/_shared/cosmetics-affiliate-slot.js
          node --check tools/_shared/check-cosmetics-semantic-quality.mjs
          node --check tools/_shared/check-cosmetics-category-gap-inventory.mjs
          node --check tools/_shared/check-cosmetics-category-provenance.mjs
          node --check tools/_shared/check-cosmetics-category-taxonomy.mjs
          node --check tools/_shared/check-cosmetics-legacy-safety-isolation.mjs
