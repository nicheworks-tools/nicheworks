name: Cosmetics accuracy benchmark

on:
  pull_request:
    paths:
      - 'tools/cosmetic-ingredient-checker-lite/**'
      - 'tools/inci-fastscan/**'
      - 'tools/_shared/cosmetic-ingredient-parser.js'
      - 'tools/_shared/check-cosmetic-ingredient-parser.mjs'
      - 'tools/_shared/check-cosmetics-accuracy-benchmark.mjs'
      - 'tools/_shared/check-cosmetics-full-label-benchmark.mjs'
      - 'tools/_shared/cosmetics-full-label-fixtures.json'
      - 'tools/_shared/cosmetics-real-label-corpus.json'
      - 'tools/_shared/check-cosmetics-real-label-corpus.mjs'
      - 'tools/_shared/check-cosmetics-dictionary-quality.mjs'
      - 'tools/_shared/check-cosmetics-semantic-quality.mjs'
      - 'tools/_shared/check-cosmetics-category-gap-inventory.mjs'
      - 'tools/_shared/check-cosmetics-category-provenance.mjs'
      - 'tools/_shared/check-cosmetics-category-taxonomy.mjs'
      - 'tools/_shared/cosmetics-category-taxonomy.json'
      - 'tools/_shared/check-cosmetics-legacy-safety-isolation.mjs'
      - 'tools/_shared/check-cosmetics-runtime-semantic-merge.mjs'
      - 'tools/_shared/check-cosmetics-note-provenance-isolation.mjs'
      - 'tools/_shared/check-cosmetics-note-provenance-schema.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave1.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave2.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave3.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave4.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave5.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave6.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave7.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave8.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave9.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave10.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave11.mjs'
      - 'tools/_shared/check-cosmetics-verified-note-wave12.mjs'
      - 'tools/_shared/check-cosmetics-claim-note-inventory.mjs'
