      - name: FastScan OCR line repair regression
        run: node tools/_shared/check-fastscan-ocr-line-repair.mjs
      - name: FastScan source-backed OCR robustness
        run: node tools/_shared/check-fastscan-ocr-robustness.mjs
      - name: FastScan result controls regression
        run: node tools/_shared/check-fastscan-result-controls.mjs
      - name: FastScan review queue regression
        run: node tools/_shared/check-fastscan-review-queue.mjs
      - name: Lite wave 3 navigation regression
        run: node tools/_shared/check-lite-wave3-navigation.mjs
      - name: Cosmetics 100-case accuracy benchmark
        run: node tools/_shared/check-cosmetics-accuracy-benchmark.mjs
      - name: Cosmetics full-label coverage benchmark
        run: node tools/_shared/check-cosmetics-full-label-benchmark.mjs
      - name: Source-backed real-label baseline
        run: node tools/_shared/check-cosmetics-real-label-corpus.mjs
      - name: Cross-tool release gate
        run: node tools/_shared/check-cosmetics-cross-tool-release.mjs
      - name: Wave 2 release gate
