          node --check tools/_shared/check-cosmetics-verified-note-wave8.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave9.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave10.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave11.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave12.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave13.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave14.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave15.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave16.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave17.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave18.mjs
          node --check tools/_shared/check-cosmetics-verified-note-wave19.mjs
          node --check tools/_shared/check-cosmetics-jp-label-variants.mjs
          node --check tools/_shared/check-fastscan-ocr-robustness.mjs
          node --check tools/cosmetic-ingredient-checker-lite/app.js
          node --check tools/cosmetic-ingredient-checker-lite/enhancements.js
          node --check tools/inci-fastscan/enhancements.js
          node --check tools/inci-fastscan/js/app.js
          node --check tools/inci-fastscan/js/core_parser.js
          node --check tools/inci-fastscan/js/core_matcher.js
          node --check tools/inci-fastscan/js/core_analyze.js
          node --check tools/inci-fastscan/js/core_ocr_post.js
          node --check tools/inci-fastscan/js/web_ui.js
          node --check tools/inci-fastscan/js/web_ocr.js
          node --check tools/inci-fastscan/js/strings.js
          node --check tools/inci-fastscan/js/generated_dictionary.js
      - name: FastScan detailed result contract
        run: node tools/_shared/check-fastscan-result-contract.mjs
      - name: FastScan OCR confusion regression
