name: One-shot final AdSense review cleanup v2

on:
  push:
    branches:
      - chore/adsense-review-surface-final-v2-20260915
    paths:
      - '.github/workflows/_tmp-adsense-review-surface-final-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/adsense-review-surface-final-v2-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply reviewed AdSense contract and public-surface cleanup
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin chore/adsense-review-surface-final-20260915
          git show origin/chore/adsense-review-surface-final-20260915:common-spec/spec-ja.md > common-spec/spec-ja.md
          git show origin/chore/adsense-review-surface-final-20260915:scripts/check-adsense-review-surface.mjs > scripts/check-adsense-review-surface.mjs

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const skip = new Set(['.git','node_modules','_archive']);
          const placeholderText = /^(?:(?:広告枠(?:（準備中）)?|Ad slot|Advertisement placeholder)(?:\s*(?:\/|\||・)\s*)?)+$/i;
          const elementRe = /<(div|p|span|aside|section|li|td|th)\b([^>]*)>([\s\S]*?)<\/\1>/gi;
          function plain(inner) {
            return inner.replace(/<!--[\s\S]*?-->/g,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/\s+/g,' ').trim();
          }
          function walk(dir) {
            for (const ent of fs.readdirSync(dir,{withFileTypes:true})) {
              if (skip.has(ent.name)) continue;
              const full = path.join(dir,ent.name);
              if (ent.isDirectory()) walk(full);
              else if (ent.isFile() && ent.name.endsWith('.html')) {
                const before = fs.readFileSync(full,'utf8');
                let after = before.replace(/<!--[\s\S]*?YOUR_TOKEN_HERE[\s\S]*?-->/gi,'');
                after = after.replace(elementRe,(all,tag,attrs,inner) => {
                  if (/<ins\b|adsbygoogle|pagead2\.googlesyndication\.com/i.test(inner)) return all;
                  return placeholderText.test(plain(inner)) ? '' : all;
                });
                after = after.replace(/\s*<p class="hint">広告枠は整備済みです。公開後もページ上下のみの表示を想定しています。<\/p>\s*/g,'\n');
                after = after.replace(/[ \t]+$/gm,'');
                if (after !== before) fs.writeFileSync(full,after);
              }
            }
          }
          walk(root);

          const genFile = 'tools/trashnavi/scripts/generate-municipality-pages.mjs';
          let gen = fs.readFileSync(genFile,'utf8');
          gen = gen
            .replace('<nav class="municipality-breadcrumb" aria-label="Breadcrumb"><a href="/tools/trashnavi/">TrashNavi</a><span>›</span><span>${esc(pref)}</span><span>›</span><span>${esc(city)}</span></nav><div class="ad-slot ad-top">広告枠</div>', '<nav class="municipality-breadcrumb" aria-label="Breadcrumb"><a href="/tools/trashnavi/">TrashNavi</a><span>›</span><span>${esc(pref)}</span><span>›</span><span>${esc(city)}</span></nav>')
            .replace('</div></section><div class="ad-slot ad-inline">広告枠</div>\n<section class="municipality-guide">', '</div></section>\n<section class="municipality-guide">')
            .replace('</section><div class="ad-slot ad-bottom">広告枠</div>\n<section class="municipality-related">', '</section>\n<section class="municipality-related">');
          if (/class="ad-slot ad-(?:top|inline|bottom)">広告枠/.test(gen)) throw new Error('TrashNavi generator still emits placeholder ad UI');
          fs.writeFileSync(genFile,gen);
          NODE

          node tools/trashnavi/scripts/generate-municipality-pages.mjs
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
      - name: Validate contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-adsense-review-surface.mjs
          node scripts/check-seo-public-url-contract.mjs
          node scripts/check-seo-indexable-url-identity.mjs
          node scripts/audit-publishing-mode.mjs
          node scripts/audit-seo.mjs --strict
          node scripts/check-tool-runtime-contracts.mjs
          node scripts/check-tool-runtime-contracts-wave4.mjs
          node scripts/check-tool-runtime-contracts-wave5.mjs
          node scripts/check-tool-runtime-contracts-wave6.mjs
          node scripts/check-tool-runtime-contracts-wave7.mjs
          node scripts/check-tool-spec-contract.mjs
          node scripts/check-tool-spec-coverage.mjs
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          git diff --check
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common-spec/spec-ja.md scripts/check-adsense-review-surface.mjs tools/trashnavi/scripts/generate-municipality-pages.mjs tools/trashnavi sitemap.xml sitemap-trashnavi.xml '*.html' en tools templates billing 2>/dev/null || true
          git add -u
          git reset .github/workflows/_tmp-adsense-review-surface-final-v2.yml
          if git diff --cached --quiet; then
            echo 'No validated content changes to commit.'
            exit 0
          fi
          git commit -m 'chore: remove public ad placeholder UI on latest main'
          git push origin HEAD:chore/adsense-review-surface-final-v2-20260915
