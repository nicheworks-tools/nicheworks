name: TrashNavi Wave 6 Inawashiro one-shot

on:
  push:
    branches:
      - feat/trashnavi-wave6-inawashiro-20260913
    paths:
      - '.github/workflows/trashnavi-wave6-inawashiro-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave6-inawashiro-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update Wave 6 specification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const specPath = 'tools/trashnavi/SPEC.md';
          let spec = fs.readFileSync(specPath, 'utf8');

          const wave5Bullet = '- 東京都 葛飾区 — `/tools/trashnavi/tokyo/katsushika/`\n';
          const wave6Text = '\nWave 6では、Search Consoleの過去180日データで猪苗代町のごみカレンダー需要を確認したため、町公式の家庭ごみ分別、令和8年度ごみリサイクルカレンダー、粗大ごみの3導線を追加し、preferred candidateへ引き上げる。公開page化はdata enrichment検証後の別PRで行う。\n\n- 福島県 猪苗代町 — preferred candidate（publication pending）\n';
          if (!spec.includes('福島県 猪苗代町 — preferred candidate')) {
            if (!spec.includes(wave5Bullet)) throw new Error('Wave 5 anchor not found');
            spec = spec.replace(wave5Bullet, wave5Bullet + wave6Text);
          }

          spec = spec.replace('### Wave 5 verified coverage baseline', '### Wave 6 verified coverage baseline');
          spec = spec.replace('2026-09-13のWave 5 CI基準値は次のとおり。', '2026-09-13のWave 6 CI基準値は次のとおり。');
          spec = spec.replace('- records: 2,187 / 2,187 valid HTTP(S)', '- records: 2,190 / 2,190 valid HTTP(S)');
          spec = spec.replace('- municipalities with any waste-specific direct link: 77', '- municipalities with any waste-specific direct link: 78');
          spec = spec.replace('- publish candidates (2+ types): 12', '- publish candidates (2+ types): 13');
          spec = spec.replace('- preferred candidates (3+ types): 12', '- preferred candidates (3+ types): 13');
          spec = spec.replace('- collection calendar coverage: 12 municipalities', '- collection calendar coverage: 13 municipalities');
          spec = spec.replace('- bulky-waste coverage: 11 municipalities', '- bulky-waste coverage: 12 municipalities');

          const acceptance = '- [x] Wave 5で葛飾区をpreferred candidateへ引き上げ、自治体pageを公開する。';
          if (!spec.includes('Wave 6で猪苗代町をpreferred candidateへ引き上げる。')) {
            if (!spec.includes(acceptance)) throw new Error('Wave 5 acceptance anchor not found');
            spec = spec.replace(acceptance, acceptance + '\n- [x] Wave 6で猪苗代町をpreferred candidateへ引き上げる。');
          }

          const evidence = '- `tools/trashnavi/data/direct-waste-links-demand-wave5.json` — 葛飾区のWave 5 collection-calendar / bulky-waste enrichment。';
          if (!spec.includes('direct-waste-links-demand-wave6.json')) {
            if (!spec.includes(evidence)) throw new Error('Wave 5 evidence anchor not found');
            spec = spec.replace(evidence, evidence + '\n- `tools/trashnavi/data/direct-waste-links-demand-wave6.json` — 猪苗代町のWave 6 waste-sorting / collection-calendar / bulky-waste enrichment。');
          }

          fs.writeFileSync(specPath, spec);
          NODE
      - name: Validate Wave 6 specification state
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit Wave 6 specification
        shell: bash
        run: |
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add tools/trashnavi/SPEC.md
          if git diff --cached --quiet; then
            echo 'No Wave 6 SPEC changes to commit.'
            exit 0
          fi
          git commit -m 'Document TrashNavi Wave 6 Inawashiro baseline'
          git push origin HEAD:feat/trashnavi-wave6-inawashiro-20260913
