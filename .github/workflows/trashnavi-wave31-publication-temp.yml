name: TrashNavi Wave31 publication temporary

on:
  push:
    branches:
      - feat/trashnavi-wave31-publication-20260916

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave31-publication-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate and validate Wave31 publication
        run: node tools/trashnavi/scripts/wave31-publish-temp.mjs
