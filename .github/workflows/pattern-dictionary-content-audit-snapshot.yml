name: Pattern Dictionary content audit snapshot

on:
  push:
    branches:
      - audit/pattern-dictionary-content-quality-v1-20260918
    paths:
      - .github/workflows/pattern-dictionary-content-audit-snapshot.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pattern-dictionary-content-quality-v1-20260918
      - name: Build compact content audit snapshot
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('tools/pattern-dictionary/data')
          prod=json.loads((root/'production-content.json').read_text())
          src=json.loads((root/'source-verification.json').read_text())
          srcmap={x.get('pattern_id'):x for x in src.get('patterns',[])}
          out=[]
          for p in prod['patterns']:
              s=srcmap.get(p['pattern_id'],{})
              out.append({
                  'id':p['pattern_id'],
                  'verification_state':p.get('verification_state'),
                  'term_scope':p.get('term_scope'),
                  'names':p.get('names'),
                  'aliases':p.get('aliases'),
                  'definition':p.get('definition'),
                  'distinguishing_features':p.get('distinguishing_features'),
                  'common_uses':p.get('common_uses'),
                  'source_state':s.get('verification_state') or s.get('state'),
                  'source_summary':s.get('source_summary') or s.get('notes') or s.get('verification_notes'),
                  'sources':s.get('sources') or s.get('references') or []
              })
          Path('tools/pattern-dictionary/data/content-audit-input.json').write_text(json.dumps({'count':len(out),'qualified_terms':prod['policy'].get('qualified_terms',[]),'patterns':out},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit snapshot
        run: |
          git config user.name "nicheworks-tools"
          git config user.email "nicheworks.tools@gmail.com"
          git add tools/pattern-dictionary/data/content-audit-input.json
          git commit -m "Pattern Dictionary: add content audit input snapshot"
          git push origin HEAD:audit/pattern-dictionary-content-quality-v1-20260918
