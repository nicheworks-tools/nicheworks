name: Construction Atlas SEO detail generation temp

on:
  push:
    branches:
      - 'feat/construction-atlas-seo-detail-pages-20260919'
    paths:
      - 'tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs'
      - 'tools/construction-tools-atlas/data/**'
      - 'tools/construction-tools-atlas/sitemap.xml'
      - 'sitemap.xml'
      - '.github/workflows/construction-tools-atlas-seo-generate-temp.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/construction-atlas-seo-detail-pages-20260919
          fetch-depth: 0

      - name: Generate static SEO detail pages
        run: node tools/construction-tools-atlas/scripts/build-seo-detail-pages-v2.3.cjs

      - name: Commit generated publication artifacts
        run: |
          if git diff --quiet -- tools/construction-tools-atlas/entries tools/construction-tools-atlas/data/seo-detail-pages-v2.3.json tools/construction-tools-atlas/sitemap.xml sitemap.xml; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/construction-tools-atlas/entries
          git add tools/construction-tools-atlas/data/seo-detail-pages-v2.3.json
          git add tools/construction-tools-atlas/sitemap.xml
          git add sitemap.xml
          git commit -m "Construction Atlas: refresh strict SEO metadata"
          git push origin HEAD:feat/construction-atlas-seo-detail-pages-20260919
