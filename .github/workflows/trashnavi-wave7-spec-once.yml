name: TrashNavi Wave 7 SPEC one-shot

on:
  push:
    branches:
      - feat/trashnavi-wave7-matsuyama-20260913
    paths:
      - 'tools/trashnavi/data/direct-waste-links-supply-wave7.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trashnavi-wave7-matsuyama-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update Wave 7 SPEC
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'tools/trashnavi/SPEC.md';
          let s = fs.readFileSync(p, 'utf8');
          const wave6 = '- 福島県 猪苗代町 — `/tools/trashnavi/fukushima/inawashiro/`';
          const wave7 = `Wave 7では、Search Consoleの過去180日データを再確認したが、公開済み・対応済み自治体以外に新しいmunicipality-specific demand signalは確認できなかった。そのため需要閾値を下げず、既存direct-link coverageのうち1種類止まりの県庁所在地から、current official sourceで3種類へ到達できる自治体を供給側候補として選ぶ。松山市について、既存のごみ分別導線に2026年度地区別ごみカレンダーと粗大ごみ収集申込み方法を追加し、preferred candidateへ引き上げる。公開page化はdata enrichment検証後の別PRで行う。\n\n- 愛媛県 松山市 — preferred candidate（publication pending）`;
          if (!s.includes('Wave 7では、Search Consoleの過去180日データを再確認したが')) {
            if (!s.includes(wave6)) throw new Error('Wave 6 anchor missing');
            s = s.replace(wave6, `${wave6}\n\n${wave7}`);
          }
          const oldBaseline = `### Wave 6 verified coverage baseline\n\n2026-09-13のWave 6 CI基準値は次のとおり。\n\n- municipalities: 1,916\n- records: 2,190 / 2,190 valid HTTP(S)\n- municipalities with any waste-specific direct link: 78\n- publish candidates (2+ types): 13\n- preferred candidates (3+ types): 13\n- collection calendar coverage: 13 municipalities\n- bulky-waste coverage: 12 municipalities\n- drop-off facility coverage: 1 municipality\n- waste-app coverage: 1 municipality\n- invalid records: 0\n- unknown type labels: 0`;
          const newBaseline = `### Wave 7 verified coverage baseline\n\n2026-09-13のWave 7 CI基準値は次のとおり。\n\n- municipalities: 1,916\n- records: 2,192 / 2,192 valid HTTP(S)\n- municipalities with any waste-specific direct link: 78\n- publish candidates (2+ types): 14\n- preferred candidates (3+ types): 14\n- collection calendar coverage: 14 municipalities\n- bulky-waste coverage: 13 municipalities\n- drop-off facility coverage: 1 municipality\n- waste-app coverage: 1 municipality\n- invalid records: 0\n- unknown type labels: 0`;
          if (s.includes(oldBaseline)) s = s.replace(oldBaseline, newBaseline);
          else if (!s.includes('### Wave 7 verified coverage baseline')) throw new Error('Wave 6 baseline block missing');
          const wave6Check = '- [x] Wave 6で猪苗代町をpreferred candidateへ引き上げ、自治体pageを公開する。';
          const wave7Check = '- [x] Wave 7で松山市をpreferred candidateへ引き上げる。';
          if (!s.includes(wave7Check)) {
            if (!s.includes(wave6Check)) throw new Error('Wave 6 acceptance anchor missing');
            s = s.replace(wave6Check, `${wave6Check}\n${wave7Check}`);
          }
          const evidence6 = '- `tools/trashnavi/data/direct-waste-links-demand-wave6.json` — 猪苗代町のWave 6 waste-sorting / collection-calendar / bulky-waste enrichment。';
          const evidence7 = '- `tools/trashnavi/data/direct-waste-links-supply-wave7.json` — 松山市のWave 7 collection-calendar / bulky-waste enrichment。';
          if (!s.includes(evidence7)) {
            if (!s.includes(evidence6)) throw new Error('Wave 6 evidence anchor missing');
            s = s.replace(evidence6, `${evidence6}\n${evidence7}`);
          }
          fs.writeFileSync(p, s);
          NODE
      - name: Validate TrashNavi state
        run: |
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-runtime-contract.mjs
      - name: Commit SPEC
        shell: bash
        run: |
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add tools/trashnavi/SPEC.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Document TrashNavi Wave 7 Matsuyama readiness'
          git push origin HEAD:feat/trashnavi-wave7-matsuyama-20260913
