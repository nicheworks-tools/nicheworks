name: Materialize TrashNavi Wave 3

on:
  pull_request:
    paths:
      - 'tools/trashnavi/**'
      - 'sitemap.xml'
      - 'sitemap-trashnavi.xml'
      - '.github/workflows/materialize-trashnavi-wave3.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Wave 3 outputs
        run: node tools/trashnavi/scripts/materialize-wave3.mjs

      - name: Commit generated outputs when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No materialization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml sitemap-trashnavi.xml tools/trashnavi/index.html tools/trashnavi/tokyo tools/trashnavi/mie tools/trashnavi/gifu tools/trashnavi/ibaraki
          git commit -m 'Materialize TrashNavi Wave 3 municipality pages'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
