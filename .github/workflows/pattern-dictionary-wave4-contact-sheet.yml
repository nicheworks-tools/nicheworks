name: Pattern Dictionary Wave 4 contact sheet

on:
  push:
    branches:
      - feat/pattern-dictionary-wave4-production-staging-20260916
    paths:
      - .github/workflows/pattern-dictionary-wave4-contact-sheet.yml

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-wave4-production-staging-20260916
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Build labeled contact sheet
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          ids='baroque-scroll chinoiserie flame-stitch tree-of-life moire yagasuri sayagata uroko tatewaku kagome kanoko hanabishi same-komon nami-chidori tomoe shibori batik bandhani ajrakh kalamkari'.split()
          base=Path('tools/pattern-dictionary/assets/reference')
          thumb=280; label=36; gap=12; cols=5; rows=4
          sheet=Image.new('RGB',(cols*(thumb+gap)+gap,rows*(thumb+label+gap)+gap),'white'); d=ImageDraw.Draw(sheet)
          for i,pid in enumerate(ids):
              im=Image.open(base/f'{pid}.png').convert('RGB').resize((thumb,thumb))
              x=gap+(i%cols)*(thumb+gap); y=gap+(i//cols)*(thumb+label+gap)
              sheet.paste(im,(x,y)); d.text((x,y+thumb+7),f'{61+i} {pid}',fill='black')
          sheet.save('wave4-contact-sheet.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave4-contact-sheet
          path: wave4-contact-sheet.png
