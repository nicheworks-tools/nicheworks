name: TrashNavi Wave 19 readiness temp
on:
  push:
    branches:
      - feat/trashnavi-naha-readiness-wave19-20260914
permissions:
  contents: write
jobs:
  readiness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Promote Naha to preferred candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('tools/trashnavi')
          data_dir = root / 'data'
          lgcode = '472018'
          current_sorting = 'https://www.city.naha.okinawa.jp/kurasitetuduki/gomi-recycling/1001934/1001935.html'
          old_urls = set()
          matched = []
          for path in sorted(data_dir.glob('direct-waste-links*.json')):
              rows = json.loads(path.read_text())
              changed = False
              for row in rows:
                  if str(row.get('lgcode','')) != lgcode:
                      continue
                  matched.append((str(path), row.get('type'), row.get('link_type'), row.get('url')))
                  canonical = row.get('link_type') == 'waste_sorting' or row.get('type') == 'ごみ分別ページ'
                  if canonical:
                      old_urls.add(row.get('url'))
                      row['url'] = current_sorting
                      row['name'] = '那覇市 家庭ごみ分別'
                      changed = True
              if changed:
                  indent = 2 if path.name == 'direct-waste-links-pref-capitals-extra.json' else None
                  if indent:
                      path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n')
                  else:
                      # Preserve compact one-record-per-line style used by the base dataset.
                      path.write_text('[\n' + ',\n'.join(json.dumps(r, ensure_ascii=False, separators=(',', ':')) for r in rows) + '\n]\n')
          print('Existing Naha occurrences:')
          for item in matched:
              print(item)
          if len(matched) < 2:
              raise SystemExit(f'Expected at least two existing Naha records, found {len(matched)}')
          supply = [
            {
              'pref':'沖縄県','city':'那覇市','name':'那覇市 ごみ・資源分別検索','type':'検索ページ','link_type':'waste_search',
              'url':'https://www.city.naha.okinawa.jp/kurasitetuduki/gomi-recycling/1001934/1008613.html','lgcode':lgcode,
              'last_checked':'2026-09-14','status':'active','language':'ja'
            },
            {
              'pref':'沖縄県','city':'那覇市','name':'那覇市 ごみ収集日検索','type':'収集カレンダー','link_type':'collection_calendar',
              'url':'https://www.city.naha.okinawa.jp/kurasitetuduki/gomi-recycling/1001934/1008614.html','lgcode':lgcode,
              'last_checked':'2026-09-14','status':'active','language':'ja'
            },
            {
              'pref':'沖縄県','city':'那覇市','name':'那覇市 そ大ごみ・スプリング入り製品','type':'粗大ごみ','link_type':'bulky_waste',
              'url':'https://www.city.naha.okinawa.jp/kurasitetuduki/gomi-recycling/1001934/1007525/1001941.html','lgcode':lgcode,
              'last_checked':'2026-09-14','status':'active','language':'ja'
            }
          ]
          supply_path = data_dir / 'direct-waste-links-supply-wave19.json'
          supply_path.write_text(json.dumps(supply, ensure_ascii=False, indent=2) + '\n')
          app = (root / 'app.js').read_text()
          needle = '"data/direct-waste-links-supply-wave18.json"]'
          repl = '"data/direct-waste-links-supply-wave18.json","data/direct-waste-links-supply-wave19.json"]'
          if needle not in app:
              raise SystemExit('Wave18 dataset tail not found in app.js')
          (root / 'app.js').write_text(app.replace(needle, repl, 1))
          # Re-scan all direct datasets: no stale Naha sorting URL may remain.
          all_naha = []
          for path in sorted(data_dir.glob('direct-waste-links*.json')):
              for row in json.loads(path.read_text()):
                  if str(row.get('lgcode','')) == lgcode:
                      all_naha.append((path.name, row.get('link_type') or row.get('type'), row.get('url')))
          print('Post-edit Naha occurrences:')
          for item in all_naha:
              print(item)
          types = set()
          for _, typ, url in all_naha:
              if typ in ('waste_sorting','ごみ分別ページ'): types.add('waste_sorting')
              elif typ in ('waste_search','検索ページ'): types.add('waste_search')
              elif typ in ('collection_calendar','収集カレンダー'): types.add('collection_calendar')
              elif typ in ('bulky_waste','粗大ごみ'): types.add('bulky_waste')
          expected = {'waste_sorting','waste_search','collection_calendar','bulky_waste'}
          if not expected.issubset(types):
              raise SystemExit(f'Naha canonical types incomplete: {types}')
          for _, typ, url in all_naha:
              if typ in ('waste_sorting','ごみ分別ページ') and url != current_sorting:
                  raise SystemExit(f'Stale Naha sorting URL remains: {url}')
          print('Naha canonical types:', sorted(types))
          PY
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          rm .github/workflows/trashnavi-wave19-readiness-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/trashnavi/app.js tools/trashnavi/data/direct-waste-links.json tools/trashnavi/data/direct-waste-links-pref-capitals-extra.json tools/trashnavi/data/direct-waste-links-supply-wave19.json .github/workflows/trashnavi-wave19-readiness-temp.yml
          git diff --cached --check
          git commit -m "Promote Naha to TrashNavi preferred candidate"
          git push
