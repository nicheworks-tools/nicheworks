name: JSON Repair product-scoped staging check

on:
  pull_request:
    paths:
      - 'tools/json-repair/**'
      - 'assets/nw-product-scoped-controller.mjs'
      - 'scripts/check-json-repair-product-scoped-staging.mjs'
      - 'docs/tools/json-repair.md'
      - 'docs/billing/pro-product-contracts-wave7.md'
      - 'docs/billing/nicheworks-pro-bundle-contract.md'
      - 'MONETIZATION_CLASSIFICATION_87.json'
      - '.github/workflows/json-repair-product-scoped-staging-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check tools/json-repair/app.js
          node --check tools/json-repair/product-scoped-controller.mjs
          node --check scripts/check-json-repair-product-scoped-staging.mjs
      - name: JSON Repair bundle boundary contracts
        run: node scripts/check-json-repair-product-scoped-staging.mjs
