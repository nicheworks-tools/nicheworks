name: ManualFinder Acer official Aspire candidate discovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/manual-finder/scripts/acer-official-aspire-candidates.mjs'
      - '.github/workflows/manualfinder-acer-aspire-candidates.yml'
jobs:
  live-official-candidate-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify parser syntax
        run: node --check tools/manual-finder/scripts/acer-official-aspire-candidates.mjs
      - name: Fetch manufacturer source and measure elapsed time
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          node tools/manual-finder/scripts/acer-official-aspire-candidates.mjs --out acer-candidates.json
          end=$(date +%s)
          node -e 'const x=require("./acer-candidates.json"); if(x.publicationReady!==false||x.manualVerified!==0||x.models.length<50)process.exit(1);console.log(JSON.stringify({officialCandidateCount:x.models.length,manualVerified:0,published:0,sha256:x.sha256,elapsedSeconds:process.argv[1]}))' "$((end-start))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acer-official-aspire-candidates
          path: acer-candidates.json
          if-no-files-found: ignore
