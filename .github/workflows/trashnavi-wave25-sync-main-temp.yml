name: TrashNavi Wave25 sync latest main temp
on:
  push:
    branches:
      - feat/trashnavi-batch-wave25-publication-20260915
permissions:
  contents: write
jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main, preserve sitemap contract, and reverify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:sitemap.xml > /tmp/main-sitemap.xml

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$unresolved" ]; then
            unexpected="$(printf '%s\n' "$unresolved" | grep -v '^sitemap.xml$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
          fi

          # Latest main owns the root sitemap cleanup. Start from that exact file,
          # then add only the five Wave25 canonical URLs.
          cp /tmp/main-sitemap.xml sitemap.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          s=p.read_text()
          urls=[
            'https://nicheworks.app/tools/trashnavi/miyagi/sendai/',
            'https://nicheworks.app/tools/trashnavi/chiba/chiba/',
            'https://nicheworks.app/tools/trashnavi/niigata/niigata/',
            'https://nicheworks.app/tools/trashnavi/kyoto/kyoto/',
            'https://nicheworks.app/tools/trashnavi/osaka/osaka/',
          ]
          blocks=[]
          for url in urls:
            assert s.count(f'<loc>{url}</loc>') == 0, url
            blocks.append(f'  <url>\n    <loc>{url}</loc>\n    <lastmod>2026-09-15</lastmod>\n  </url>')
          assert s.count('</urlset>') == 1
          p.write_text(s.replace('</urlset>', '\n'.join(blocks)+'\n</urlset>'))
          PY
          git add sitemap.xml

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          test -z "$unresolved"
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Sync latest main into TrashNavi Wave25 publication"
          elif [ "$merge_rc" -ne 0 ]; then
            echo "Merge failed without a resolvable merge state"
            exit 1
          fi

          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs

          python3 - <<'PY'
          import json
          from pathlib import Path
          urls=[
            ('041009','miyagi','sendai',False),
            ('121002','chiba','chiba',False),
            ('151009','niigata','niigata',True),
            ('261009','kyoto','kyoto',False),
            ('271004','osaka','osaka',False),
          ]
          ai=json.loads(Path('tools/trashnavi/ai-reference.json').read_text())
          assert ai['published_municipality_count']==44
          assert len(ai['municipalities'])==44
          root=Path('sitemap.xml').read_text()
          trash=Path('sitemap-trashnavi.xml').read_text()
          main=Path('/tmp/main-sitemap.xml').read_text()
          stripped=root
          for lg,pref,city,annual in urls:
            canonical=f'https://nicheworks.app/tools/trashnavi/{pref}/{city}/'
            assert root.count(f'<loc>{canonical}</loc>')==1
            assert trash.count(f'<loc>{canonical}</loc>')==1
            assert sum(1 for x in ai['municipalities'] if x['lgcode']==lg and x['url']==canonical)==1
            page=Path(f'tools/trashnavi/{pref}/{city}/index.html').read_text()
            assert page.count('class="official-link-card"')==3
            assert ('class="current-calendar-callout"' in page)==annual
            assert 'id="trashnaviAmazonAffiliate"' in page
            assert 'class="ad-slot' not in page
            block=f'  <url>\n    <loc>{canonical}</loc>\n    <lastmod>2026-09-15</lastmod>\n  </url>\n'
            stripped=stripped.replace(block,'')
          assert stripped==main, 'root sitemap differs from latest main beyond five Wave25 additions'
          print('Wave25 post-main-sync acceptance: OK')
          PY
          git diff --check

          git rm .github/workflows/trashnavi-wave25-sync-main-temp.yml
          git commit -m "Remove TrashNavi Wave25 main-sync workflow"
          git push origin HEAD:feat/trashnavi-batch-wave25-publication-20260915
