name: CTA Wave5N affiliate helper
on:
  push:
    branches:
      - content/construction-atlas-wave5n-q015-support-testing-20260917
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/construction-atlas-wave5n-q015-support-testing-20260917
      - name: Append Wave5N mappings without reformatting existing rows
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='tools/construction-tools-atlas/data/affiliate-offers-v2.3.json';
          let text=fs.readFileSync(file,'utf8');
          const data=JSON.parse(text);
          if(data.offers.length!==127) throw new Error(`expected 127 offers, got ${data.offers.length}`);
          const rows=[
            ['q015_pipe_shoe','パイプシュー 配管','パイプシュー','pipe shoes'],
            ['q015_u_bolt_pipe','Uボルト 配管','配管用Uボルト','pipe U-bolts'],
            ['q015_pipe_saddle','サドルバンド 配管','サドルバンド','pipe saddle clamps'],
            ['q015_riser_clamp','立管バンド','立管バンド','riser clamps'],
            ['q015_anti_vibration_hanger','防振吊り金物','防振吊り金物','vibration isolation hangers'],
            ['q015_equipment_anchor','設備 アンカー コンクリート','設備アンカー','equipment anchors'],
            ['q015_access_door_mep','設備 点検口','設備点検口','MEP access doors'],
            ['q015_balancing_valve','バランシングバルブ 配管','バランシングバルブ','balancing valves'],
            ['q015_air_vent_valve','自動 空気抜き弁','空気抜き弁','air vent valves'],
            ['q015_drain_valve','ドレン弁 配管','ドレン弁','drain valves'],
            ['q015_temperature_gauge','配管 温度計','配管用温度計','temperature gauges'],
            ['q015_flow_meter','配管 流量計','流量計','flow meters'],
            ['q015_test_plug','排水管 テストプラグ','テストプラグ','test plugs'],
            ['q015_pressure_test_pump','水圧試験ポンプ','水圧試験ポンプ','pressure test pumps']
          ];
          const ids=new Set(data.offers.map(o=>o.entry_id));
          const additions=[];
          for(const [entryId,query,ja,en] of rows){
            if(ids.has(entryId)) continue;
            const suffix=entryId.replace(/^q015_/,'');
            const params=new URLSearchParams({k:query,tag:data.tracking_id});
            additions.push({entry_id:entryId,status:'active',offer_id:`amazon_q015_${suffix}_search`,query,amazon_url:`https://www.amazon.co.jp/s?${params.toString()}`,label_ja:`Amazonで${ja}を探す`,label_en:`Find ${en} on Amazon`});
          }
          if(additions.length!==14) throw new Error(`expected 14 new mappings, got ${additions.length}`);
          text=text.replace(/"version":\s*"[^"]+"/, '"version": "2026-09-17-wave5n-affiliate-1"');
          const marker='\n  ]\n}';
          if(!text.includes(marker)) throw new Error('affiliate closing marker not found');
          const rendered=additions.map(o=>'    '+JSON.stringify(o)).join(',\n');
          text=text.replace(marker, ',\n'+rendered+'\n  ]\n}');
          const out=JSON.parse(text);
          if(out.offers.length!==141) throw new Error(`expected 141 offers, got ${out.offers.length}`);
          if(new Set(out.offers.map(o=>o.entry_id)).size!==141) throw new Error('duplicate affiliate entry_id');
          fs.writeFileSync(file,text.endsWith('\n')?text:text+'\n');
          NODE
      - name: Commit
        run: |
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add tools/construction-tools-atlas/data/affiliate-offers-v2.3.json
          git commit -m 'Construction Atlas: add Wave5N affiliate mappings'
          git push origin HEAD:content/construction-atlas-wave5n-q015-support-testing-20260917
