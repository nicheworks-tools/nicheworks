name: Apply TrashNavi National Batch 02
# Re-run after ensuring Toshima village and Toshima ward have distinct paths.
on:
  push:
    branches:
      - feat/trashnavi-national-batch02-20261031
    paths:
      - '.github/workflows/trashnavi-national-batch02-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize national batch02
        run: node tools/trashnavi/scripts/apply-national-batch02-once.mjs
      - name: Enforce complete batch data quality
        run: |
          node tools/trashnavi/scripts/check-national-completion.mjs
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          node scripts/check-trashnavi-direct-links.mjs --inventory
      - name: Commit validated output and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trashnavi-national-batch02-once.yml
          git rm tools/trashnavi/scripts/apply-national-batch02-once.mjs
          git add -A
          git diff --cached --stat
          git commit -m "feat(trashnavi): review and publish national batch02"
          git push origin HEAD:feat/trashnavi-national-batch02-20261031
