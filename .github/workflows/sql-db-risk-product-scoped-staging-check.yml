name: SQL DB Risk product-scoped staging check

on:
  pull_request:
    paths:
      - 'assets/nw-product-scoped-controller.mjs'
      - 'tools/sql-db-risk-checker/product-scoped-controller.mjs'
      - 'tools/sql-db-risk-checker/SPEC.md'
      - 'tools/sql-db-risk-checker/app-sdrc.js'
      - 'tools/sql-db-risk-checker/pro-bridge.js'
      - 'scripts/check-sql-db-risk-product-scoped-staging.mjs'
      - 'docs/billing/pro-product-contracts-wave2.md'
      - '.agent/plans/2026-09-12-sql-db-risk-product-scoped-staging.md'
      - '.github/workflows/sql-db-risk-product-scoped-staging-check.yml'
  push:
    branches:
      - main
    paths:
      - 'assets/nw-product-scoped-controller.mjs'
      - 'tools/sql-db-risk-checker/product-scoped-controller.mjs'
      - 'tools/sql-db-risk-checker/SPEC.md'
      - 'tools/sql-db-risk-checker/app-sdrc.js'
      - 'tools/sql-db-risk-checker/pro-bridge.js'
      - 'scripts/check-sql-db-risk-product-scoped-staging.mjs'
      - 'docs/billing/pro-product-contracts-wave2.md'
      - '.agent/plans/2026-09-12-sql-db-risk-product-scoped-staging.md'
      - '.github/workflows/sql-db-risk-product-scoped-staging-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check assets/nw-product-scoped-controller.mjs
          node --check tools/sql-db-risk-checker/product-scoped-controller.mjs
          node --check scripts/check-sql-db-risk-product-scoped-staging.mjs
      - name: SQL DB Risk product-scoped staging contracts
        run: node scripts/check-sql-db-risk-product-scoped-staging.mjs
