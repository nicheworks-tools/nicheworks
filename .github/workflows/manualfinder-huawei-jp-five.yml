name: ManualFinder Huawei JP five official guide download indexes
on:
  pull_request:
    paths:
      - 'tools/manual-finder/**'
      - '.github/workflows/manualfinder-huawei-jp-five.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  huawei-jp-five:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded 5 Huawei index records and conservative link semantics
        run: |
          node tools/manual-finder/tests/huawei-jp-five-publication.test.mjs
          node tools/manual-finder/tests/huawei-jp-five-live-source.test.mjs
      - name: Manufacturer Japanese FAQ source and 5 exact product manual pages
        run: node tools/manual-finder/scripts/huawei-jp-5-live-source.mjs
      - name: Previous maker regressions
        run: |
          node tools/manual-finder/tests/coverage-pass-pipeline.test.mjs
          node tools/manual-finder/tests/msi-jp-ms1542-six-publication.test.mjs
          node tools/manual-finder/tests/nec-lavie-jp-exact18-publication.test.mjs
          node tools/manual-finder/tests/acer-jp-pdf16-publication.test.mjs
          node tools/manual-finder/tests/hp-jp-17-publication.test.mjs
          node tools/manual-finder/tests/lenovo-jp-13-publication.test.mjs
          node tools/manual-finder/tests/dell-jp-20-publication.test.mjs
          node tools/manual-finder/tests/canon-pixus-wave3l-publication.test.mjs
          node tools/manual-finder/tests/affiliate-coverage.test.mjs
          node tools/manual-finder/tests/affiliate-doc-sync.test.mjs
