name: Pattern Dictionary affiliate surface cleanup

on:
  push:
    branches:
      - fix/pattern-dictionary-search-affiliate-surface-20260915
    paths:
      - '.github/workflows/pattern-dictionary-affiliate-surface.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pattern-dictionary-search-affiliate-surface-20260915

      - name: Hide disabled affiliate surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/pattern-dictionary/app.js')
          source = path.read_text()
          pattern = re.compile(r'''(commerce=affiliateActive\(cfg\)\?`[\s\S]*?`):`<div class="pd-commerce"><h2>\$\{lang==='ja'\?'この柄の商品を探す':'Find products in this pattern'\}</h2><p class="pd-note">\$\{lang==='ja'\?'Amazonアソシエイトはまだ有効化していません。tracking ID設定後に検索リンクを表示します。':'Amazon Associates links are not active yet. Search links will appear only after a valid tracking ID is configured.'\}</p></div>`''')
          updated, count = pattern.subn(r"\1:''", source, count=1)
          if count != 1:
              raise SystemExit(f'expected one disabled affiliate branch, replaced {count}')
          path.write_text(updated)
          PY

      - name: Validate Pattern Dictionary affiliate surface
        run: |
          node --check tools/pattern-dictionary/app.js
          node tools/pattern-dictionary/tests/affiliate-test.mjs
          node tools/pattern-dictionary/tests/browse-mobile-test.mjs
          node tools/pattern-dictionary/tests/validate.mjs

      - name: Persist cleanup and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pattern-dictionary/app.js
          git rm .github/workflows/pattern-dictionary-affiliate-surface.yml
          git commit -m 'fix: hide inactive Pattern Dictionary affiliate surface'
          git push origin HEAD:fix/pattern-dictionary-search-affiliate-surface-20260915
