name: Pattern Dictionary reference audit preview

on:
  push:
    branches:
      - fix/pattern-dictionary-reference-audit-20260917
    paths:
      - tools/pattern-dictionary/scripts/generate-reference-images-audit-fixes.py
      - .github/workflows/pattern-dictionary-reference-audit-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pattern-dictionary-reference-audit-20260917
      - name: Generate corrected reference images
        run: python3 tools/pattern-dictionary/scripts/generate-reference-images-audit-fixes.py
      - name: Verify dimensions and PNG signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          ids=['shepherd-check','glen-check','prince-of-wales-check','gun-club-check','herringbone','kagome','same-komon','tomoe','fleur-de-lis','marbling','giraffe-print','zebra-print']
          root=Path('tools/pattern-dictionary/assets/reference')
          for pid in ids:
              p=root/f'{pid}.png'; b=p.read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n', pid
              w,h=struct.unpack('>II',b[16:24]); assert (w,h)==(1536,1536),(pid,w,h)
              print(pid,p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pattern-dictionary-reference-audit-preview
          path: |
            tools/pattern-dictionary/assets/reference/shepherd-check.png
            tools/pattern-dictionary/assets/reference/glen-check.png
            tools/pattern-dictionary/assets/reference/prince-of-wales-check.png
            tools/pattern-dictionary/assets/reference/gun-club-check.png
            tools/pattern-dictionary/assets/reference/herringbone.png
            tools/pattern-dictionary/assets/reference/kagome.png
            tools/pattern-dictionary/assets/reference/same-komon.png
            tools/pattern-dictionary/assets/reference/tomoe.png
            tools/pattern-dictionary/assets/reference/fleur-de-lis.png
            tools/pattern-dictionary/assets/reference/marbling.png
            tools/pattern-dictionary/assets/reference/giraffe-print.png
            tools/pattern-dictionary/assets/reference/zebra-print.png
