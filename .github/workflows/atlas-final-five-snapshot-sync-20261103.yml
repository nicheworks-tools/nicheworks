name: Atlas final-five audited snapshot sync (one-off)
on:
  push:
    branches:
      - fix/atlas-five-canonical-identities-20261103
    paths:
      - .github/workflows/atlas-final-five-snapshot-sync-20261103.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record two outstanding real-loader alias gaps
        run: node tools/construction-tools-atlas/scripts/report-runtime-alias-gaps-v3.cjs --verbose
      - name: Recompute frozen snapshots from the 865-record real runtime
        shell: bash
        run: |
          set -euo pipefail
          node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/audit-image-inventory-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs --write
          node tools/construction-tools-atlas/scripts/audit-public-content-quality-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-image-inventory-v2.3.cjs
          node tools/construction-tools-atlas/scripts/audit-public-image-inventory-v2.3.cjs
          git diff --check
          git diff --stat
      - name: Commit only audited frozen datasets to existing PR branch
        shell: bash
        env:
          TARGET: fix/atlas-five-canonical-identities-20261103
        run: |
          set -euo pipefail
          git add --             tools/construction-tools-atlas/data/public-content-quality-v2.3.json             tools/construction-tools-atlas/data/image-inventory-v2.3.json             tools/construction-tools-atlas/data/public-image-inventory-v2.3.json
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo 'No stale snapshots; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(atlas): regenerate frozen snapshots for 865 canonical terms'
          git push origin "HEAD:refs/heads/$TARGET"
