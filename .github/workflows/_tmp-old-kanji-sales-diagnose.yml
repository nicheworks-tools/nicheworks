name: Diagnose Old Kanji sales cleanup

on:
  push:
    branches:
      - chore/adsense-old-kanji-sales-cleanup-20260915
    paths:
      - '.github/workflows/_tmp-old-kanji-sales-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reproduce cleanup
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'tools/old-document-kanji-highlighter/index.html',
            'tools/old-kanji-ocr-scanner/index.html',
            'tools/old-kanji-reference/index.html',
            'tools/place-old-kanji-checker/index.html',
            'tools/unicode-kanji-checker/index.html',
            'tools/variant-kanji-compare/index.html'
          ];
          function removeSection(html, predicate) {
            const tags = [...html.matchAll(/<\/?section\b[^>]*>/gi)];
            for (let i=0;i<tags.length;i++) {
              if (/^<\/section/i.test(tags[i][0]) || !predicate(tags[i][0])) continue;
              let depth=1;
              for (let j=i+1;j<tags.length;j++) {
                depth += /^<\/section/i.test(tags[j][0]) ? -1 : 1;
                if (!depth) return {html:html.slice(0,tags[i].index)+html.slice(tags[j].index+tags[j][0].length),removed:true};
              }
            }
            return {html,removed:false};
          }
          for (const file of files) {
            let html=fs.readFileSync(file,'utf8');
            const r=removeSection(html,t=>/class=["'][^"']*\bokj-pro-panel\b/i.test(t));
            if(!r.removed) throw new Error(`${file}: no Pro panel found`);
            html=r.html;
            if(file.includes('old-kanji-ocr-scanner')) html=html.replace(/\s*<section class=["']notice-panel["']>\s*<p data-i18n=["']proNote["']>[\s\S]*?<\/p>\s*<\/section>/i,'');
            fs.writeFileSync(file,html.replace(/\n{3,}/g,'\n\n'));
          }
          NODE
      - name: Run validators and save output
        shell: bash
        run: |
          set +e
          : > diagnostic.txt
          for cmd in \
            "node scripts/check-adsense-review-surface.mjs" \
            "node scripts/check-seo-public-url-contract.mjs" \
            "node scripts/check-seo-indexable-url-identity.mjs" \
            "node scripts/audit-publishing-mode.mjs" \
            "node scripts/audit-seo.mjs --strict" \
            "git diff --check"; do
            echo "=== $cmd ===" | tee -a diagnostic.txt
            bash -lc "$cmd" >> diagnostic.txt 2>&1
            code=$?
            echo "EXIT=$code" | tee -a diagnostic.txt
          done
          cat diagnostic.txt
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: old-kanji-sales-diagnostic
          path: diagnostic.txt
          if-no-files-found: error
