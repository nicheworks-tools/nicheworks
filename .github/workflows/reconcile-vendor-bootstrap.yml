name: Reconcile vendor bootstrap

on:
  push:
    branches:
      - feat/reconcile-v1-20260912
    paths:
      - .github/workflows/reconcile-vendor-bootstrap.yml

permissions:
  contents: write

jobs:
  vendor-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reconcile-v1-20260912
          fetch-depth: 0

      - name: Fetch pinned SheetJS CE 0.20.3 mini
        shell: bash
        run: |
          set -euo pipefail
          target='tools/reconcile/vendor/xlsx.mini.min.js'
          url='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.mini.min.js'
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$target"
          test "$(wc -c < "$target" | tr -d ' ')" = '279523'
          test "$(sha256sum "$target" | awk '{print $1}')" = '0cb353f830d7288385492c83d277b058ddeac664ca51cf1393aa1fd3e2b70939'
          test "$(git hash-object "$target")" = '5bf1c223ce4bd59685ba711b77dce6da7a9747b8'
          grep -F 'version="0.20.3"' "$target" >/dev/null

      - name: Run all Reconcile tests
        run: node --test tools/reconcile/tests/*.test.mjs

      - name: Commit vendor and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reconcile-vendor-bootstrap.yml
          git config user.name 'nicheworks-tools'
          git config user.email 'nicheworks.tools@gmail.com'
          git add tools/reconcile/vendor/xlsx.mini.min.js .github/workflows/reconcile-vendor-bootstrap.yml
          git diff --cached --check
          git commit -m 'vendor(reconcile): add pinned SheetJS CE 0.20.3 mini'
          git push origin HEAD:feat/reconcile-v1-20260912
