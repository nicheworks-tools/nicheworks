name: Temporary Pattern Dictionary broken CSS cleanup

on:
  push:
    branches:
      - feat/pattern-dictionary-vertical-slice-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-dictionary-vertical-slice-20260914
      - name: Remove nonexistent nw-base stylesheet reference
        run: |
          python3 <<'PY'
          from pathlib import Path
          needle = '<link rel="stylesheet" href="/assets/nw-base.css">'
          changed = []
          for path in Path('tools/pattern-dictionary').rglob('*.html'):
              text = path.read_text()
              if needle in text:
                  path.write_text(text.replace(needle, ''))
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No Pattern Dictionary HTML references to /assets/nw-base.css were found')
          print(f'Removed broken stylesheet reference from {len(changed)} HTML files')
          PY
      - name: Verify reference is gone
        run: |
          if grep -R '/assets/nw-base.css' tools/pattern-dictionary --include='*.html'; then
            echo 'Broken stylesheet reference remains' >&2
            exit 1
          fi
      - name: Commit Pattern Dictionary HTML cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pattern-dictionary
          git diff --cached --check
          git commit -m "fix: remove nonexistent Pattern Dictionary stylesheet"
          git push origin HEAD:feat/pattern-dictionary-vertical-slice-20260914
