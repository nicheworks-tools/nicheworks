name: Pattern Dictionary final main sync

on:
  push:
    branches:
      - feat/pattern-dictionary-vertical-slice-20260914
    paths:
      - .github/workflows/pattern-dictionary-final-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/pattern-dictionary-vertical-slice-20260914

      - name: Merge latest main, preserve shared ledgers, and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          FEATURE_HEAD="$(git rev-parse HEAD)"
          MAIN_HEAD="$(git rev-parse origin/main)"
          git merge --no-commit --no-ff origin/main || true

          unmerged="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$unmerged" | grep -Ev '^(audits/tool-quality-matrix\.json|sitemap\.xml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          FEATURE_HEAD="$FEATURE_HEAD" node <<'NODE'
          const fs = require('fs');
          const {execFileSync} = require('child_process');
          const show = spec => execFileSync('git',['show',spec],{encoding:'utf8'});
          const featureHead = process.env.FEATURE_HEAD;
          const featureMatrix = JSON.parse(show(`${featureHead}:audits/tool-quality-matrix.json`));
          const mainMatrix = JSON.parse(show('origin/main:audits/tool-quality-matrix.json'));
          const pd = featureMatrix.records.find(x => x.slug === 'pattern-dictionary');
          if (!pd) throw new Error('Pattern Dictionary quality record missing');
          const records = mainMatrix.records.filter(x => x.slug !== 'pattern-dictionary');
          records.push(pd);
          records.sort((a,b) => a.slug.localeCompare(b.slug));
          mainMatrix.records = records;
          mainMatrix.registered_tool_count = records.length;
          mainMatrix.record_count = records.length;
          const states = ['PASS','FIX','BLOCKED','NEEDS_DECISION'];
          mainMatrix.counts = Object.fromEntries(states.map(s => [s, records.filter(r => r.final_state === s).length]));
          fs.writeFileSync('audits/tool-quality-matrix.json', JSON.stringify(mainMatrix,null,2)+'\n');

          let sitemap = show('origin/main:sitemap.xml');
          const urls = [
            'https://nicheworks.app/tools/pattern-dictionary/',
            'https://nicheworks.app/tools/pattern-dictionary/en/'
          ];
          let block = '';
          for (const url of urls) {
            if (!sitemap.includes(`<loc>${url}</loc>`)) {
              block += `  <url>\n    <loc>${url}</loc>\n    <lastmod>2026-09-14</lastmod>\n  </url>\n`;
            }
          }
          if (block) sitemap = sitemap.replace('</urlset>', block + '</urlset>');
          fs.writeFileSync('sitemap.xml', sitemap);
          NODE

          git add audits/tool-quality-matrix.json sitemap.xml
          git rm .github/workflows/pattern-dictionary-final-sync.yml
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m "chore: final sync Pattern Dictionary branch with main $MAIN_HEAD"
          git push origin HEAD:feat/pattern-dictionary-vertical-slice-20260914
