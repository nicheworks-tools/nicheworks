name: Reconcile production smoke temp

on:
  push:
    branches:
      - feat/reconcile-publication-20260912
    paths:
      - .github/workflows/reconcile-production-smoke-temp.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reconcile-publication-20260912
          fetch-depth: 0

      - name: Public Reconcile page contract
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L --fail-with-body -sS -o /tmp/reconcile.html -w '%{http_code}' 'https://nicheworks.app/tools/reconcile/')
          echo "reconcile_http_status=$code"
          test "$code" = '200'
          test "$(grep -Foc '<link rel="canonical" href="https://nicheworks.app/tools/reconcile/">' /tmp/reconcile.html)" = '1'
          ! grep -Eqi 'noindex' /tmp/reconcile.html
          ! grep -Eqi 'development banner|development only' /tmp/reconcile.html
          grep -Fq '/assets/nw-pro-entitlement.js' /tmp/reconcile.html
          grep -Fq 'index,follow' /tmp/reconcile.html
          grep -Fq './usage.html' /tmp/reconcile.html
          grep -Fq './refund.html' /tmp/reconcile.html

      - name: Public supporting routes
        shell: bash
        run: |
          set -euo pipefail
          for path in '/tools/reconcile/usage.html' '/tools/reconcile/refund.html' '/sitemap.xml'; do
            code=$(curl -L --fail-with-body -sS -o /tmp/out -w '%{http_code}' "https://nicheworks.app${path}")
            echo "${path}_final_status=$code"
            test "$code" = '200'
            if [ "$path" = '/sitemap.xml' ]; then
              grep -Fq 'https://nicheworks.app/tools/reconcile/' /tmp/out
            fi
          done

      - name: Pinned local SheetJS bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail-with-body -sS 'https://nicheworks.app/tools/reconcile/vendor/xlsx.mini.min.js' -o /tmp/xlsx.mini.min.js
          size=$(wc -c < /tmp/xlsx.mini.min.js | tr -d ' ')
          sha=$(sha256sum /tmp/xlsx.mini.min.js | awk '{print $1}')
          echo "xlsx_size=$size"
          echo "xlsx_sha256=$sha"
          test "$size" = '279523'
          test "$sha" = '0cb353f830d7288385492c83d277b058ddeac664ca51cf1393aa1fd3e2b70939'

      - name: Production checkout gate
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/checkout.json -w '%{http_code}' \
            -X POST 'https://nicheworks.app/api/billing/create-checkout-session' \
            -H 'content-type: application/json' \
            --data '{"productId":"reconcile.pro_v1","returnPath":"/tools/reconcile/"}')
          echo "checkout_http_status=$status"
          STATUS="$status" node <<'NODE'
          const fs = require('fs');
          const status = Number(process.env.STATUS);
          let data;
          try { data = JSON.parse(fs.readFileSync('/tmp/checkout.json', 'utf8')); }
          catch { throw new Error('checkout response is not JSON'); }
          if (status === 200) {
            if (!data?.ok || data.productId !== 'reconcile.pro_v1' || typeof data.url !== 'string') throw new Error('invalid successful checkout response');
            const u = new URL(data.url);
            if (u.protocol !== 'https:' || u.hostname !== 'checkout.stripe.com') throw new Error('invalid Stripe checkout URL');
            console.log(`checkout_result=ready mode=${data.mode || 'unknown'} productId=${data.productId} host=${u.hostname}`);
          } else {
            const allowedStatus = new Set([403, 503]);
            const allowedError = new Set(['missing_stripe_price_id','stripe_secret_key_missing','stripe_secret_key_invalid','test_checkout_not_enabled','live_checkout_not_enabled']);
            console.log(`checkout_result=fail_closed status=${status} error=${data?.error || 'unknown'}`);
            if (!allowedStatus.has(status) || !allowedError.has(data?.error)) throw new Error(`unexpected checkout failure: ${status} ${data?.error}`);
          }
          NODE

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reconcile-production-smoke-temp.yml
          git commit -m 'Remove temporary Reconcile production smoke workflow'
          git push origin HEAD:feat/reconcile-publication-20260912
