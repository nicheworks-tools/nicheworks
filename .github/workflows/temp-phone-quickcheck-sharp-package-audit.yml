name: Temp Phone QuickCheck SHARP package audit

on:
  pull_request:
    paths:
      - '.github/workflows/temp-phone-quickcheck-sharp-package-audit.yml'
      - 'tools/phone-quickcheck/data/phones.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print SHARP package unknown records
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('tools/phone-quickcheck/data/phones.json','utf8'));
          const rows = data.phones.filter(p =>
            String(p.manufacturer || '').toLowerCase().includes('sharp') &&
            (p.included?.adapter === 'unknown' || p.included?.cable === 'unknown')
          ).map(p => ({
            id: p.id,
            manufacturer: p.manufacturer,
            model: p.model,
            market: p.market ?? null,
            included: p.included,
            specificationsUrl: p.sources?.specificationsUrl ?? null,
            manualUrl: p.sources?.manualUrl ?? null,
            releaseUrl: p.sources?.releaseUrl ?? null,
            chargingUrl: p.sources?.chargingUrl ?? null
          }));
          console.log('SHARP_COUNT=' + rows.length);
          console.log(JSON.stringify(rows, null, 2));
          NODE
