name: TrashNavi Wave24 readiness temp
on:
  push:
    branches:
      - feat/trashnavi-batch-wave24-readiness-20260915
permissions:
  contents: write
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add and verify Wave24 official links
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/trashnavi/data/direct-waste-links-supply-wave24.json <<'JSON'
          [
            {
