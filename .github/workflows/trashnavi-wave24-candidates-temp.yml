              "lgcode": "302015",
              "last_checked": "2026-09-15",
              "status": "active",
              "language": "ja"
            },
            {
              "pref": "和歌山県",
              "city": "和歌山市",
              "name": "和歌山市 青岸ストックヤードの受入基準について",
              "type": "持込施設",
              "link_type": "dropoff_facility",
              "url": "https://www.city.wakayama.wakayama.jp/kurashi/gomi_kankyo/1001113/1019036/1019037.html",
              "lgcode": "302015",
              "last_checked": "2026-09-15",
              "status": "active",
              "language": "ja"
            }
          ]
          JSON

          python3 <<'PY'
          from pathlib import Path
          p=Path('tools/trashnavi/app.js')
          s=p.read_text()
          old='"data/direct-waste-links-supply-wave23.json"]'
          new='"data/direct-waste-links-supply-wave23.json","data/direct-waste-links-supply-wave24.json"]'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY

          node tools/trashnavi/scripts/generate-municipality-pages.mjs

          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const targets=['011002','141003','192015','231002','302015'];
          const dir='tools/trashnavi/data';
          const files=fs.readdirSync(dir).filter(f=>/^direct-waste-links.*\.json$/.test(f));
          const canonical=t=>({
            'ごみ分別ページ':'waste_sorting','収集カレンダー':'collection_calendar','粗大ごみ':'bulky_waste','粗大ごみ申込み':'bulky_application','検索ページ':'waste_search','持込施設':'dropoff_facility','ごみ分別アプリ':'waste_app'
          }[t]||null);
          for(const lg of targets){
            const rows=[];
            for(const f of files) for(const r of JSON.parse(fs.readFileSync(path.join(dir,f),'utf8'))) if(r.lgcode===lg) rows.push(r);
            const types=new Set(rows.map(r=>r.link_type||canonical(r.type)).filter(Boolean).filter(t=>t!=='municipal_home'));
            console.log(lg,[...types]);
            if(types.size!==3) throw new Error(`${lg}: expected exactly 3 canonical waste types, got ${types.size}`);
          }
          NODE

          node tools/trashnavi/scripts/audit-coverage.mjs --strict
          node scripts/check-trashnavi-direct-links.mjs --inventory
          node tools/trashnavi/scripts/generate-municipality-pages.mjs --check
          node tools/trashnavi/scripts/check-affiliate-contract.mjs
          node tools/trashnavi/scripts/check-runtime-contract.mjs
          git diff --check

          python3 <<'PY'
          import subprocess
          allowed={
            '.github/workflows/trashnavi-wave24-candidates-temp.yml',
            'tools/trashnavi/data/direct-waste-links-supply-wave24.json',
            'tools/trashnavi/app.js',
            'sitemap-trashnavi.xml',
          }
          lines=subprocess.check_output(['git','status','--short'],text=True).splitlines()
          changed={line[3:] for line in lines}
          extra=changed-allowed
          if extra: raise SystemExit(f'unexpected readiness changes: {sorted(extra)}')
          print('readiness changed files:',sorted(changed))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/trashnavi/data/direct-waste-links-supply-wave24.json tools/trashnavi/app.js sitemap-trashnavi.xml
          git diff --cached --check
          git commit -m 'Add five TrashNavi Wave24 municipality source sets'
          git push origin HEAD:feat/trashnavi-batch-wave24-readiness-20260915

          git rm .github/workflows/trashnavi-wave24-candidates-temp.yml
          git commit -m 'Remove TrashNavi Wave24 readiness workflow'
          git push origin HEAD:feat/trashnavi-batch-wave24-readiness-20260915
