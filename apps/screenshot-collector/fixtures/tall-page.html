<!doctype html><html><head><meta charset="utf-8"><title>Collector tall fixture</title><style>body{margin:0;font:20px system-ui}.banner{background:#174f87;color:#fff;padding:24px}.sticky{position:sticky;top:0;background:#ffdf83;padding:8px}.section{height:650px;padding:20px;border-bottom:4px solid #222}.lazy{background:#c4e9cc}</style></head><body><header class="banner">Screenshot Collector fixture: TOP</header><div class="sticky">STICKY HEADER — look for duplicates</div><main><section class="section">Section A</section><section class="section">Section B</section><section class="section">Section C</section><section class="section">Section D</section><section class="section">Section E</section><section class="section lazy" id="lazy">Lazy section: PENDING</section><footer class="banner">BOTTOM MARKER</footer></main><script>const node=document.querySelector("#lazy");new IntersectionObserver((entries,observer)=>{if(entries.some(x=>x.isIntersecting)){node.textContent="Lazy section: LOADED";observer.disconnect();}}).observe(node);</script></body></html>
