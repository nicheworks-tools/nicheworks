<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NicheWorks Billing - Checkout Canceled</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f7f7f8; color: #111; }
    main { max-width: 760px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 12px; border: 1px solid #e5e7eb; }
    h1 { margin-top: 0; }
    .btn { display: inline-block; margin-top: 12px; border: 1px solid #111827; border-radius: 999px; padding: 9px 14px; text-decoration: none; background: #111827; color: #fff; }
  </style>
  <meta name="description" content="NicheWorks checkout was canceled. No paid entitlement was granted.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://nicheworks.app/billing/cancel.html">
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/favicon.ico">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-57QT78M3JB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-57QT78M3JB');
  </script>
</head>
<body>
  <main>
    <h1>Checkout canceled</h1>
    <p>Checkout was canceled or not completed.</p>
    <p>No paid entitlement was granted or stored by this page.</p>
    <a class="btn" id="returnLink" href="/">Return to NicheWorks</a>
  </main>
  <script>
    (function () {
      const value = new URLSearchParams(location.search).get('return_path') || '/';
      const safe = value.startsWith('/') && !value.startsWith('//') && !value.includes('://') && value.length <= 512;
      if (safe) document.getElementById('returnLink').href = value;
    })();
  </script>
</body>
</html>
